[project]
name = "skill-based-front"
version = "0.1.0"
description = "Skill-Based Front: competitive 1v1 browser strategy game (workspace root)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gow-sim",
    "gow-protocol",
    "gow-server",
    "gow-bots",
    "gow-maps",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/sim",
    "packages/protocol",
    "apps/server",
    "apps/bots",
    "tools/maps",
]

[tool.uv.sources]
gow-sim = { workspace = true }
gow-protocol = { workspace = true }
gow-server = { workspace = true }
gow-bots = { workspace = true }
gow-maps = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
# docs/mvp/*.py is plan tooling copied from the plan kit, not project code.
extend-exclude = ["docs/mvp"]
# Python only: ruff 0.16 also formats Python code blocks in Markdown by default, and the
# snippets in AGENTS.md and docs/ are illustrations with hand-aligned comments.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
src = [
    "packages/sim/src",
    "packages/protocol/src",
    "apps/server/src",
    "apps/bots/src",
    "tools/maps/src",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "TID", # flake8-tidy-imports (TID251 banned-api is configured in packages/sim/ruff.toml)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Strict type checking for packages/, apps/, tools/, scripts/, deploy/*.py and the root test
# infrastructure.
# docs/mvp/*.py (plan tooling, needs PyYAML outside the workspace) is deliberately not included.
[tool.pyright]
include = ["packages", "apps", "tools", "tests", "scripts", "deploy", "conftest.py"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
norecursedirs = [".*", "node_modules", "dist", "build"]
# importlib mode: test files with the same name in different packages do not collide.
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "perf: timing-sensitive tests (benchmarks, tick lag); run serially, never under xdist (-n)",
    "slow: long statistical full-match tests (bot win rates); CI job py-slow, deselect with -m 'not slow'",
]

# Package boundaries (AGENTS.md, section 2). Checked by `uv run lint-imports`.
#
# Third-party packages: import-linter can only forbid, not allow, an external package, and the
# workspace venv holds the dependencies of every package, so an import resolves wherever it is
# written. Each contract below therefore forbids the packages of the venv that the package may not
# use (the table in AGENTS.md, section 2). A new dependency of the workspace must be added to the
# lists of the packages that may not import it (the PR that adds it, AGENTS.md section 0, item 5).
# The lists are written out because TOML has no shared values; a package missing from a list is
# a hole, so keep the four lists in step. The packages themselves declare their dependencies in
# their own pyproject.toml; for gow_sim that list is empty.
[tool.importlinter]
root_packages = ["gow_sim", "gow_protocol", "gow_server", "gow_bots", "gow_maps"]
include_external_packages = true

# ---- gow_sim: no project packages, standard library only.

[[tool.importlinter.contracts]]
name = "gow_sim does not import other project packages"
type = "forbidden"
source_modules = ["gow_sim"]
forbidden_modules = ["gow_protocol", "gow_server", "gow_bots", "gow_maps"]

[[tool.importlinter.contracts]]
name = "gow_sim uses the standard library only"
type = "forbidden"
source_modules = ["gow_sim"]
forbidden_modules = [
    "alembic",
    "annotated_types",
    "anyio",
    "click",
    "dateutil",
    "dotenv",
    "fastapi",
    "fontTools",
    "h11",
    "httpcore2",
    "httpx2",
    "hypothesis",
    "idna",
    "kiwisolver",
    "mako",
    "markupsafe",
    "matplotlib",
    "mpl_toolkits",
    "networkx",
    "numpy",
    "packaging",
    "PIL",
    "platformdirs",
    "pydantic",
    "pydantic_core",
    "pydantic_settings",
    "pygments",
    "pyparsing",
    "pytest",
    "rich",
    "six",
    "sortedcontainers",
    "sqlalchemy",
    "starlette",
    "typing_extensions",
    "uvicorn",
    "websockets",
    "yaml",
]

# ---- gow_protocol: gow_sim and pydantic only.

[[tool.importlinter.contracts]]
name = "gow_protocol does not import gow_server, gow_bots or gow_maps"
type = "forbidden"
source_modules = ["gow_protocol"]
forbidden_modules = ["gow_server", "gow_bots", "gow_maps"]

[[tool.importlinter.contracts]]
# pydantic_core is pydantic's own engine (schema.py uses core_schema), not a separate choice.
name = "gow_protocol uses the standard library, gow_sim and pydantic only"
type = "forbidden"
source_modules = ["gow_protocol"]
forbidden_modules = [
    "alembic",
    "annotated_types",
    "anyio",
    "click",
    "dateutil",
    "dotenv",
    "fastapi",
    "fontTools",
    "h11",
    "httpcore2",
    "httpx2",
    "hypothesis",
    "idna",
    "kiwisolver",
    "mako",
    "markupsafe",
    "matplotlib",
    "mpl_toolkits",
    "networkx",
    "numpy",
    "packaging",
    "PIL",
    "platformdirs",
    "pydantic_settings",
    "pygments",
    "pyparsing",
    "pytest",
    "rich",
    "six",
    "sortedcontainers",
    "sqlalchemy",
    "starlette",
    "typing_extensions",
    "uvicorn",
    "websockets",
    "yaml",
]

# ---- gow_bots.bots: an allow-list of gow_sim modules, no third-party packages.
# Bots see only PlayerView: forbid all of gow_sim and ignore the four modules they may import
# (gow_sim.view, commands, maps, ruleset). Indirect imports are allowed because gow_sim.view and
# gow_sim.commands themselves use gow_sim.state. A new gow_sim module is forbidden to bots until
# it is added here. `from gow_sim.view import GameState` is closed in
# apps/bots/src/gow_bots/bots/ruff.toml (TID251).

[[tool.importlinter.contracts]]
name = "gow_bots.bots imports only the allowed gow_sim modules"
type = "forbidden"
source_modules = ["gow_bots.bots"]
forbidden_modules = ["gow_sim"]
allow_indirect_imports = true
ignore_imports = [
    "gow_bots.bots.** -> gow_sim.view",
    "gow_bots.bots.** -> gow_sim.commands",
    "gow_bots.bots.** -> gow_sim.maps",
    "gow_bots.bots.** -> gow_sim.ruleset",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "gow_bots.bots uses no third-party packages"
type = "forbidden"
source_modules = ["gow_bots.bots"]
forbidden_modules = [
    "alembic",
    "annotated_types",
    "anyio",
    "click",
    "dateutil",
    "dotenv",
    "fastapi",
    "fontTools",
    "h11",
    "httpcore2",
    "httpx2",
    "hypothesis",
    "idna",
    "kiwisolver",
    "mako",
    "markupsafe",
    "matplotlib",
    "mpl_toolkits",
    "networkx",
    "numpy",
    "packaging",
    "PIL",
    "platformdirs",
    "pydantic",
    "pydantic_core",
    "pydantic_settings",
    "pygments",
    "pyparsing",
    "pytest",
    "rich",
    "six",
    "sortedcontainers",
    "sqlalchemy",
    "starlette",
    "typing_extensions",
    "uvicorn",
    "websockets",
    "yaml",
]

# ---- gow_bots (harness): all of gow_sim, matplotlib (reports) only.

[[tool.importlinter.contracts]]
name = "gow_bots does not import gow_server, gow_protocol or gow_maps"
type = "forbidden"
source_modules = ["gow_bots"]
forbidden_modules = ["gow_server", "gow_protocol", "gow_maps"]

[[tool.importlinter.contracts]]
name = "gow_bots uses the standard library, gow_sim and matplotlib only"
type = "forbidden"
source_modules = ["gow_bots"]
forbidden_modules = [
    "alembic",
    "annotated_types",
    "anyio",
    "click",
    "dateutil",
    "dotenv",
    "fastapi",
    "fontTools",
    "h11",
    "httpcore2",
    "httpx2",
    "hypothesis",
    "idna",
    "kiwisolver",
    "mako",
    "markupsafe",
    "mpl_toolkits",
    "networkx",
    "numpy",
    "packaging",
    "PIL",
    "platformdirs",
    "pydantic",
    "pydantic_core",
    "pydantic_settings",
    "pygments",
    "pyparsing",
    "pytest",
    "rich",
    "six",
    "sortedcontainers",
    "sqlalchemy",
    "starlette",
    "typing_extensions",
    "uvicorn",
    "websockets",
    "yaml",
]

# ---- gow_maps: gow_sim.maps and gow_sim.ruleset only, map-tool packages.

[[tool.importlinter.contracts]]
name = "gow_maps imports only gow_sim.maps and gow_sim.ruleset of the project"
type = "forbidden"
source_modules = ["gow_maps"]
forbidden_modules = ["gow_server", "gow_protocol", "gow_bots", "gow_sim"]
allow_indirect_imports = true
ignore_imports = [
    "gow_maps.** -> gow_sim.maps",
    "gow_maps.** -> gow_sim.ruleset",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "gow_maps uses the standard library, gow_sim, networkx, matplotlib, numpy and Pillow only"
type = "forbidden"
source_modules = ["gow_maps"]
forbidden_modules = [
    "alembic",
    "annotated_types",
    "anyio",
    "click",
    "dateutil",
    "dotenv",
    "fastapi",
    "fontTools",
    "h11",
    "httpcore2",
