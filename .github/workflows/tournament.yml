name: Tournament

# Bot tournaments on GitHub runners instead of a laptop (#582). Manual only: it never runs on push
# or on a PR, so it is not part of the required checks (py, web, docker). Run it with
# `mise run tournament:gh` (AGENTS.md section 3, docs/balance/README.md).
#
# The (map, seed) cells are split into shards balanced by the expected cost of a map
# (scripts/tournament_shards.py plan, #786). A shard is a list of pieces (maps and a seed range);
# every piece runs the same `mise run tournament` task as a local run with --maps/--seed-base/--seeds,
# and the last job merges the pieces into one JSONL identical, byte for byte, to a single run with
# the same arguments, then runs `gow-bots report` on it.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (it must contain this workflow and its scripts)"
        default: develop
      ruleset:
        description: "Ruleset file"
        default: rulesets/mvp-7.toml
      bots:
        description: "Bot names separated by spaces, or all"
        default: all
      maps:
        description: "Map files or a glob (default: the pool, not the fixtures)"
        default: maps/*.json
      seeds:
        description: "Seeds per map and pair (total over all shards)"
        default: "100"
      shards:
        description: "Parallel jobs (at most 20, never more than maps x seeds)"
        default: "10"
      label:
        description: "Name for the run and the artifact (letters, digits, . _ -)"
        default: ""

run-name: Tournament ${{ inputs.label }}

permissions:
  contents: read

env:
  # The version of mise itself; the versions of node, pnpm and uv are in mise.toml.
  MISE_VERSION: 2026.10.20
  MISE_TASK_OUTPUT: interleave

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.plan.outputs.artifact }}
      map_count: ${{ steps.plan.outputs.map_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: plan
        env:
          SEEDS: ${{ inputs.seeds }}
          SHARDS: ${{ inputs.shards }}
          LABEL: ${{ inputs.label }}
          RULESET: ${{ inputs.ruleset }}
          BOTS: ${{ inputs.bots }}
          MAPS: ${{ inputs.maps }}
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          case "$SEEDS" in ''|*[!0-9]*) echo "::error::seeds must be a positive integer"; exit 1;; esac
          case "$SHARDS" in ''|*[!0-9]*) echo "::error::shards must be a positive integer"; exit 1;; esac
          [ "$SEEDS" -ge 1 ] && [ "$SHARDS" -ge 1 ] || { echo "::error::seeds and shards must be at least 1"; exit 1; }
          [ "$SHARDS" -le 20 ] || SHARDS=20
          case "$LABEL" in *[!A-Za-z0-9._-]*) echo "::error::label may contain only letters, digits, . _ -"; exit 1;; esac
          # The inputs below go to a shell later: refuse anything but plain path and name characters.
          for v in "$RULESET" "$BOTS" "$MAPS"; do
            case "$v" in *[!A-Za-z0-9._/@*\ -]*) echo "::error::unexpected character in an input"; exit 1;; esac
          done
          # MAPS is split into words and globbed by the shell on purpose (several maps, a glob).
          # shellcheck disable=SC2086
          matrix="$(python3 scripts/tournament_shards.py plan --maps $MAPS --seeds "$SEEDS" --shards "$SHARDS")"
          map_count="$(python3 -c 'import json,sys; print(len({m for s in json.loads(sys.argv[1]) for p in s["pieces"] for m in p["maps"]}))' "$matrix")"
          artifact="tournament-${LABEL:-run}-${GITHUB_RUN_ID}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "map_count=$map_count" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          {
            echo "## Tournament run"
            echo
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| ref | \`$REF\` ($(git rev-parse --short HEAD)) |"
            echo "| ruleset | \`$RULESET\` |"
            echo "| bots | \`$BOTS\` |"
            echo "| maps | \`$MAPS\` |"
            echo "| seeds | $SEEDS |"
            echo "| map files | $map_count |"
            echo "| shards | $(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$matrix") |"
            echo "| shard costs (nodes x seeds) | $(python3 -c 'import json,sys; print(" ".join(str(s["cost"]) for s in json.loads(sys.argv[1])))' "$matrix") |"
            echo "| artifact | \`$artifact\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  shard:
    needs: plan
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run setup:py
      # Determinism can depend on the interpreter: uv fetches the version of .python-version.
      - name: Check the Python version
        run: |
          want="$(cat .python-version)"
          got="$(mise exec -- uv run python -c 'import platform; print(platform.python_version())')"
          echo "Python $got on $(nproc) CPUs (.python-version: $want)"
          case "$got" in "$want"|"$want".*) ;; *) echo "::error::Python $got differs from .python-version $want"; exit 1;; esac
          echo "shard ${{ matrix.shard }}: ${{ matrix.cells }} cells, cost ${{ matrix.cost }}, Python $got, $(nproc) CPUs" >> "$GITHUB_STEP_SUMMARY"
      # Cores or SMT threads (#785)? On 2026-11-07 every runner had 4 CPUs = 2 cores x 2 threads
      # (AMD EPYC 7763, 9V74, 9V45, Intel Xeon 8370C, #786); `--jobs` below is the CPU count.
      - name: Runner CPU
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          lscpu
          cpu="$(lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket):' | sed -E 's/: +/: /' | paste -sd ';' -)"
          echo "shard $SHARD CPU: $cpu" >> "$GITHUB_STEP_SUMMARY"
      - name: Play the shard
        env:
          RULESET: ${{ inputs.ruleset }}
          BOTS: ${{ inputs.bots }}
          PIECES: ${{ toJSON(matrix.pieces) }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          # One line per piece: seed_base, seeds, the map files.
          python3 -c 'import json,sys; [print(p["seed_base"], p["seeds"], *p["maps"]) for p in json.loads(sys.argv[1])]' \
            "$PIECES" > "$RUNNER_TEMP/pieces.txt"
          cat "$RUNNER_TEMP/pieces.txt"
          i=0
          while read -r base n maps <&3; do
            # Same task as a local run; the later options override the task's defaults.
            # BOTS and maps are split into words on purpose (several bots and maps).
            # shellcheck disable=SC2086
            mise run tournament -- --maps $maps --bots $BOTS \
              --seeds "$n" --seed-base "$base" \
              --jobs "$(nproc)" --ruleset "$RULESET" --out "shard-$SHARD-$i.jsonl"
            i=$((i + 1))
          done 3< "$RUNNER_TEMP/pieces.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}-*.jsonl
          retention-days: 1
      - run: mise exec -- uv cache prune --ci

  merge:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run setup:py
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - name: Merge and report
        env:
          SEEDS: ${{ inputs.seeds }}
          MAP_COUNT: ${{ needs.plan.outputs.map_count }}
        run: |
          mkdir -p result
          python3 scripts/tournament_shards.py merge --out result/tournament.jsonl \
            --seeds "$SEEDS" --map-count "$MAP_COUNT" shards/shard-*.jsonl
          mise exec -- uv run gow-bots report result/tournament.jsonl --out-dir result --name report
          {
            echo
            echo "Merged $(wc -l < result/tournament.jsonl) matches. Artifact: \`${{ needs.plan.outputs.artifact }}\` (tournament.jsonl and report.md)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: result
