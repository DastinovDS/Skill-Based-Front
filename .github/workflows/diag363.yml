# TEMPORARY (#363) v4 bounded buffers: loops the slow client test under CPU load; validation of the test fix.
name: diag363
on:
  push:
    branches: ['fix/363-**']
    paths: ['.github/workflows/diag363.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        mode: [alone, loaded, loaded2, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: loop
        env:
          MODE: ${{ matrix.mode }}
        run: |
          T="apps/server/tests/test_ws.py::test_slow_client_does_not_slow_the_tick_and_loses_no_ack"
          T2="apps/server/tests/test_ws.py::test_client_that_does_not_read_is_disconnected"
          if [ "$MODE" = loaded ]; then for b in 1 2 3 4; do (while :; do :; done) & done; fi
          if [ "$MODE" = loaded2 ]; then for b in 1 2 3 4 5 6 7 8; do (while :; do :; done) & done; fi
          if [ "$MODE" = suite ]; then
            (uv run pytest -n 4 -q -p no:cacheprovider -m "not perf and not slow" --deselect "$T" packages apps/bots > /tmp/bg.log 2>&1 &) 
          fi
          for i in $(seq 1 20); do
            s=$(date +%s)
            if uv run pytest -q -s -p no:cacheprovider "$T" "$T2" > /tmp/out.$i 2>&1; then r=ok; else r=FAIL; fi
            echo "run $i $r $(( $(date +%s) - s ))s"
            grep -A40 DIAG363 /tmp/out.$i || true
            if [ $r = FAIL ]; then tail -80 /tmp/out.$i | cut -c1-220; fi
          done
