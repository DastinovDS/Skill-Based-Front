name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version of mise itself; the versions of node, pnpm and uv are in mise.toml.
  MISE_VERSION: 2026.10.20
  # Print the command of each task step, so a red log shows which one failed (mise.toml says quiet).
  MISE_TASK_OUTPUT: interleave

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the required jobs (py, web) have work to do.
  # Pushes and manual runs always check everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      py: ${{ github.event_name != 'pull_request' || steps.filter.outputs.py == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            py:
              - 'packages/**'
              - 'apps/server/**'
              - 'apps/bots/**'
              - 'tools/**'
              - 'tests/**'
              - 'scripts/**'
              - 'deploy/*.py'
              - 'rulesets/**'
              - 'maps/**'
              - '*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/client/**'
              # The client bundles these map files (apps/client/src/map/bundledMaps.ts).
              - 'maps/**'
              - 'packages/sim/tests/maps/**'
              # Protocol drift (PRO-02, #45): the schema comes from gow_protocol, which takes
              # enums and limits from gow_sim; the pydantic version in uv.lock shapes it too.
              # HTTP API types (api.gen.ts, CLI-09 #65) come from the FastAPI app of the server.
              - 'apps/server/**'
              - 'packages/protocol/**'
              - 'packages/sim/src/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            docker:
              - 'deploy/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'packages/**'
              - 'apps/**'
              - 'tools/**'
              - 'maps/**'
              - 'rulesets/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            e2e:
              - 'deploy/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'packages/**'
              - 'apps/**'
              - 'tools/**'
              - 'maps/**'
              - 'rulesets/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - 'e2e/**'

  # Required check. A job skipped by `if` reports "Success", so a PR without relevant
  # changes is not blocked. If `changes` itself fails, the checks run anyway (fail-closed).
  py:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.py == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # HEAD^1 (the base branch of a PR merge commit) for check_golden_frozen.py.
          fetch-depth: 2
      # node (pyright from PyPI runs on it), pnpm and uv at the versions of mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run setup:py
      - run: mise run check:py
      # pytest-xdist: the tests are independent (own tmp_path, in-memory servers, ManualClock),
      # a runner has 2 cores. Timing tests (mark `perf`: benchmarks, tick lag) and the long
      # full-match tests (mark `slow`, job `py-slow`) are not run here.
      - run: mise run test:py -- --durations=25
        env:
          HYPOTHESIS_PROFILE: ci
      # Performance budgets (AGENTS.md, section 12): serial, alone on the runner. pytest-benchmark
      # switches itself off under xdist, so these never go through `-n`.
      - run: mise run test:perf
        env:
          HYPOTHESIS_PROFILE: ci
      # Golden replays (SIM-16): the current version re-simulates (also in pytest), and
      # the files of earlier commits stay frozen against the base branch.
      - run: mise run golden:check HEAD^1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replay-divergence
          path: replay-divergence
          if-no-files-found: ignore
      # Keep only what this run used before the cache is saved (what setup-uv did).
      - run: mise exec -- uv cache prune --ci

  # Long full-match tests (mark `slow`: win rates of the bots against random_legal over many
  # seeds, seed variability, the tournament harness over all bots). Not a required check, so it
  # does not delay the merge; it runs in parallel with `py` on every PR and push to develop and
  # must be green before a release. Same skip rules as `py`.
  py-slow:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.py == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run setup:py
      - run: mise run test:slow -- --durations=25
        env:
          HYPOTHESIS_PROFILE: ci
      - run: mise exec -- uv cache prune --ci

  # Required check, same skip rules as `py`.
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/client/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise run setup:client
      # The drift checks run the Python generators, so the Python workspace is needed too.
      - run: mise run setup:py
      # protocol-drift (PRO-02, #45): regenerate the schema and the TypeScript types and fail if
      # the committed files differ, e.g. a Pydantic model changed without regeneration.
      - name: protocol-drift
        run: |
          mise run regen:protocol
          set -- packages/protocol/protocol.schema.json packages/protocol/vectors/event_fields.json apps/client/src/protocol.gen.ts
          if [ -n "$(git status --porcelain -- "$@")" ]; then
            git status --short -- "$@"
            git --no-pager diff -- "$@"
            echo "::error::Generated protocol files are out of date. Run: mise run regen:protocol"
            exit 1
          fi
      # api-drift (CLI-09, #65): the OpenAPI document of the server and the client types from it.
      - name: api-drift
        run: |
          mise run regen:api
          set -- apps/server/openapi.json apps/client/src/api.gen.ts
          if [ -n "$(git status --porcelain -- "$@")" ]; then
            git status --short -- "$@"
            git --no-pager diff -- "$@"
            echo "::error::Generated API files are out of date. Run: mise run regen:api"
            exit 1
          fi
      - run: mise run check:client
      - run: mise run test:client
      - run: mise run build
      - run: mise exec -- uv cache prune --ci

  # Screenshot tests of the map scenes (CLI-04, #60): Playwright against the dev server, the
  # references are apps/client/visual/**-snapshots. Not a required check: software WebGL and fonts
  # of the runner may differ from the machine that recorded the references; refresh them with
  # `mise run test:visual` (Linux ones: see apps/client/visual/README.md).
  visual:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/client/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise run setup:client
      # The system libraries of Chromium (apt); the task `visual:browser` then only finds the browser.
      - run: mise exec -- pnpm -C apps/client exec playwright install --with-deps chromium
      - run: mise run test:visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: apps/client/node_modules/.playwright
          if-no-files-found: ignore

  # Docker images and the compose stack (OPS-01, #80): hadolint, then deploy/smoke.sh builds both
  # images, starts the stack and checks it through Caddy. Same skip rules as `py`.
  docker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          for f in deploy/*.Dockerfile; do
            echo "$f"
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "$f"
          done
      # deploy/check-caddy.sh (run by smoke.sh) reads the CSP from apps/client/csp.ts with Node.
      # The job calls the scripts directly, not the task `smoke`: that one is the agents' isolated
      # project sbf-agent, and deploy-test.sh below needs the default project anyway.
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
      - run: deploy/smoke.sh
      # OPS-03 (#82): deploy, rollback of a broken release, backup and restore into a fresh volume.
      - run: deploy/deploy-test.sh
      - if: always()
        run: docker compose down --volumes

  # End-to-end test (QA-02, #84): two browser contexts play a private match by invite on the
  # `test-short` ruleset against the real stack (Caddy with the built client + the game server,
  # compose.yaml with e2e/compose.e2e.yaml). Not a required check, like `visual`: it builds both
  # images (a second time next to `docker`), renders WebGL in software and plays real 60-second
  # matches, so it is the slowest and the most environment-sensitive job; its red result must be
  # looked at before a release. Same skip rules as `docker`, plus changes of e2e/.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: mise run setup:e2e
      - run: mise run check:e2e
      - run: mise exec -- pnpm -C e2e exec playwright install --with-deps chromium
      # The task `e2e` (stack up, test, stack down) removes the stack before its logs can be read
      # on a failure, so the job runs its three parts as separate steps. Project sbf-e2e, port 18082.
      - name: start the stack
        run: mise run e2e:up
      - name: e2e test
        run: mise exec -- pnpm -C e2e test
        env:
          E2E_BASE_URL: http://localhost:18082
      - if: failure()
        run: docker compose -p sbf-e2e logs --tail 200 app caddy
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results
          if-no-files-found: ignore
      - if: always()
        run: mise run e2e:down
