name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the required jobs (py, web) have work to do.
  # Pushes and manual runs always check everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      py: ${{ github.event_name != 'pull_request' || steps.filter.outputs.py == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            py:
              - 'packages/**'
              - 'apps/server/**'
              - 'apps/bots/**'
              - 'tools/**'
              - 'tests/**'
              - 'scripts/**'
              - 'deploy/*.py'
              - 'rulesets/**'
              - 'maps/**'
              - '*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/client/**'
              # The client bundles these map files (apps/client/src/map/bundledMaps.ts).
              - 'maps/**'
              - 'packages/sim/tests/maps/**'
              # Protocol drift (PRO-02, #45): the schema comes from gow_protocol, which takes
              # enums and limits from gow_sim; the pydantic version in uv.lock shapes it too.
              # HTTP API types (api.gen.ts, CLI-09 #65) come from the FastAPI app of the server.
              - 'apps/server/**'
              - 'packages/protocol/**'
              - 'packages/sim/src/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            docker:
              - 'deploy/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'packages/**'
              - 'apps/**'
              - 'tools/**'
              - 'maps/**'
              - 'rulesets/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'deploy/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'packages/**'
              - 'apps/**'
              - 'tools/**'
              - 'maps/**'
              - 'rulesets/**'
              - '.github/workflows/ci.yml'
              - 'e2e/**'

  # Required check. A job skipped by `if` reports "Success", so a PR without relevant
  # changes is not blocked. If `changes` itself fails, the checks run anyway (fail-closed).
  py:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.py == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # HEAD^1 (the base branch of a PR merge commit) for check_golden_frozen.py.
          fetch-depth: 2
      # setup-uv publishes no moving major tags, only exact versions.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # pyright (PyPI) runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/client/package.json
          package-manager-cache: false
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run gow-maps validate --ruleset rulesets/mvp-1.toml maps/*.json
      # pytest-xdist: the tests are independent (own tmp_path, in-memory servers, ManualClock),
      # a runner has 2 cores. Timing tests (mark `perf`: benchmarks, tick lag) and the long
      # full-match tests (mark `slow`, job `py-slow`) are not run here.
      - run: uv run pytest -n auto -m "not perf and not slow" --durations=25
        env:
          HYPOTHESIS_PROFILE: ci
      # Performance budgets (AGENTS.md, section 12): serial, alone on the runner. pytest-benchmark
      # switches itself off under xdist, so these never go through `-n`.
      - run: uv run pytest -m perf
        env:
          HYPOTHESIS_PROFILE: ci
      # Golden replays (SIM-16): the current version re-simulates (also in pytest), and
      # the files of earlier commits stay frozen.
      - run: uv run python -m gow_sim.replay check packages/sim/tests/golden/v*/**
      - run: uv run python scripts/check_golden_frozen.py HEAD^1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replay-divergence
          path: replay-divergence
          if-no-files-found: ignore

  # Long full-match tests (mark `slow`: win rates of the bots against random_legal over many
  # seeds, seed variability, the tournament harness over all bots). Not a required check, so it
  # does not delay the merge; it runs in parallel with `py` on every PR and push to develop and
  # must be green before a release. Same skip rules as `py`.
  py-slow:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.py == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -n auto -m slow --durations=25
        env:
          HYPOTHESIS_PROFILE: ci

  # Required check, same skip rules as `py`.
  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Version from the "packageManager" field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/client/package.json
      # Version from the "engines.node" field.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/client/package.json
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - run: pnpm -C apps/client install --frozen-lockfile
      # protocol-drift (PRO-02, #45): regenerate the schema and the TypeScript types and fail if
      # the committed files differ, e.g. a Pydantic model changed without regeneration.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev --package gow-server
      - name: protocol-drift
        run: |
          uv run --no-sync python scripts/export_schema.py
          pnpm -C apps/client gen:protocol
          set -- packages/protocol/protocol.schema.json apps/client/src/protocol.gen.ts
          if [ -n "$(git status --porcelain -- "$@")" ]; then
            git status --short -- "$@"
            git --no-pager diff -- "$@"
            echo "::error::Generated protocol files are out of date. Run: uv run python scripts/export_schema.py && pnpm -C apps/client gen:protocol"
            exit 1
          fi
      # api-drift (CLI-09, #65): the OpenAPI document of the server and the client types from it.
      - name: api-drift
        run: |
          uv run --no-sync python scripts/export_openapi.py
          pnpm -C apps/client gen:api
          set -- apps/server/openapi.json apps/client/src/api.gen.ts
          if [ -n "$(git status --porcelain -- "$@")" ]; then
            git status --short -- "$@"
            git --no-pager diff -- "$@"
            echo "::error::Generated API files are out of date. Run: uv run python scripts/export_openapi.py && pnpm -C apps/client gen:api"
            exit 1
          fi
      - run: pnpm -C apps/client lint
      - run: pnpm -C apps/client check
      - run: pnpm -C apps/client test
      - run: pnpm -C apps/client build

  # Screenshot tests of the map scenes (CLI-04, #60): Playwright against the dev server, the
  # references are apps/client/visual/**-snapshots. Not a required check: software WebGL and fonts
  # of the runner may differ from the machine that recorded the references; refresh them with
  # `pnpm -C apps/client test:visual:update` (Linux ones: see apps/client/visual/README.md).
  visual:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/client/package.json
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - run: pnpm -C apps/client install --frozen-lockfile
      - run: pnpm -C apps/client exec playwright install --with-deps chromium
      - run: pnpm -C apps/client test:visual
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: apps/client/node_modules/.playwright
          if-no-files-found: ignore

  # Docker images and the compose stack (OPS-01, #80): hadolint, then deploy/smoke.sh builds both
  # images, starts the stack and checks it through Caddy. Same skip rules as `py`.
  docker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          for f in deploy/*.Dockerfile; do
            echo "$f"
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "$f"
          done
      # deploy/check-caddy.sh (run by smoke.sh) reads the CSP from apps/client/csp.ts with Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/client/package.json
          package-manager-cache: false
      - run: deploy/smoke.sh
      # OPS-03 (#82): deploy, rollback of a broken release, backup and restore into a fresh volume.
      - run: deploy/deploy-test.sh
      - if: always()
        run: docker compose down --volumes

  # End-to-end test (QA-02, #84): two browser contexts play a private match by invite on the
  # `test-short` ruleset against the real stack (Caddy with the built client + the game server,
  # compose.yaml with e2e/compose.e2e.yaml). Not a required check, like `visual`: it builds both
  # images (a second time next to `docker`), renders WebGL in software and plays real 60-second
  # matches, so it is the slowest and the most environment-sensitive job; its red result must be
  # looked at before a release. Same skip rules as `docker`, plus changes of e2e/.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/package.json
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm -C e2e install --frozen-lockfile
      - run: pnpm -C e2e lint
      - run: pnpm -C e2e check
      - run: pnpm -C e2e exec playwright install --with-deps chromium
      - name: start the stack
        run: docker compose -f compose.yaml -f e2e/compose.e2e.yaml up --build --detach --wait --wait-timeout 300
      - run: pnpm -C e2e test
      - if: failure()
        run: docker compose logs --tail 200 app caddy
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f compose.yaml -f e2e/compose.e2e.yaml down --volumes
