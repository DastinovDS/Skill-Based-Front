# Skill-Based Front: production stack (OPS-01, #80). Usage and variables: README.md, section "Docker".
#
#   cp .env.example .env        # optional: the defaults run the game on http://localhost
#   docker compose up --build -d
#
# caddy: the only public service (80/443), serves the client and proxies /api/* and /ws/* to app
#        (TLS, headers, caching: deploy/Caddyfile).
# app:   the game server, reachable only from the internal network, data on the `gow-data` volume.

name: skill-based-front

services:
  app:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    image: skill-based-front/app:local
    restart: unless-stopped
    # Only variables listed here reach the server (Settings forbids unknown GOW_* fields). Every
    # operator-tunable Settings field is listed, with the Settings default; the container paths
    # (GOW_HOST, GOW_PORT, GOW_DATABASE_URL, GOW_MAPS_DIR, GOW_REPLAYS_DIR, GOW_RULESETS_*) are
    # fixed by the image (deploy/app.Dockerfile). apps/server/tests/test_compose.py keeps this list and Settings in step.
    environment:
      GOW_ENV: ${GOW_ENV:-prod}
      GOW_LOG_LEVEL: ${GOW_LOG_LEVEL:-INFO}
      # The ruleset of every match (rulesets/ is in the image, WORKDIR /app).
      GOW_RULESET_PATH: ${GOW_RULESET_PATH:-rulesets/mvp-1.toml}
      GOW_GUEST_RATE_LIMIT: ${GOW_GUEST_RATE_LIMIT:-10}
      GOW_GUEST_RATE_WINDOW_S: ${GOW_GUEST_RATE_WINDOW_S:-3600}
      GOW_MATCH_CREATE_RATE_LIMIT: ${GOW_MATCH_CREATE_RATE_LIMIT:-10}
      GOW_MATCH_CREATE_RATE_WINDOW_S: ${GOW_MATCH_CREATE_RATE_WINDOW_S:-600}
      GOW_QUEUE_RATE_LIMIT: ${GOW_QUEUE_RATE_LIMIT:-20}
      GOW_QUEUE_RATE_WINDOW_S: ${GOW_QUEUE_RATE_WINDOW_S:-60}
      GOW_NICK_CHANGE_RATE_LIMIT: ${GOW_NICK_CHANGE_RATE_LIMIT:-3}
      GOW_NICK_CHANGE_RATE_WINDOW_S: ${GOW_NICK_CHANGE_RATE_WINDOW_S:-86400}
      # Extra forbidden nick words, one per line; on the volume: /data/nick-blocklist.txt
      GOW_NICK_BLOCKLIST_FILE: ${GOW_NICK_BLOCKLIST_FILE:-}
      GOW_INVITE_TTL_S: ${GOW_INVITE_TTL_S:-1800}
      GOW_RECONNECT_WINDOW_S: ${GOW_RECONNECT_WINDOW_S:-60}
      GOW_PAUSE_MAX_S: ${GOW_PAUSE_MAX_S:-60}
      GOW_READY_TIMEOUT_S: ${GOW_READY_TIMEOUT_S:-120}
      # Caps on running matches (#412): all matches, those against a bot, and how long a bot match
      # may wait for its player's WebSocket before it is dropped as never started.
      GOW_MAX_MATCHES: ${GOW_MAX_MATCHES:-30}
      GOW_MAX_BOT_MATCHES: ${GOW_MAX_BOT_MATCHES:-10}
      GOW_BOT_CONNECT_TIMEOUT_S: ${GOW_BOT_CONNECT_TIMEOUT_S:-15}
      GOW_MONITOR_INTERVAL_S: ${GOW_MONITOR_INTERVAL_S:-30}
      GOW_MAX_REQUEST_BODY_BYTES: ${GOW_MAX_REQUEST_BODY_BYTES:-32768}
      # Logins and passwords (#374): attempts per window, per client IP, per nick from one IP, per nick overall; password changes.
      GOW_LOGIN_IP_RATE_LIMIT: ${GOW_LOGIN_IP_RATE_LIMIT:-20}
      GOW_LOGIN_IP_RATE_WINDOW_S: ${GOW_LOGIN_IP_RATE_WINDOW_S:-600}
      GOW_LOGIN_NICK_RATE_LIMIT: ${GOW_LOGIN_NICK_RATE_LIMIT:-10}
      GOW_LOGIN_NICK_RATE_WINDOW_S: ${GOW_LOGIN_NICK_RATE_WINDOW_S:-600}
      GOW_LOGIN_NICK_TOTAL_RATE_LIMIT: ${GOW_LOGIN_NICK_TOTAL_RATE_LIMIT:-200}
      GOW_PASSWORD_RATE_LIMIT: ${GOW_PASSWORD_RATE_LIMIT:-5}
      GOW_PASSWORD_RATE_WINDOW_S: ${GOW_PASSWORD_RATE_WINDOW_S:-3600}
      # scrypt of new password hashes; docs/ops/deploy.md says to tune N on the VPS (target 50..100 ms).
      GOW_SCRYPT_N: ${GOW_SCRYPT_N:-32768}
      GOW_SCRYPT_R: ${GOW_SCRYPT_R:-8}
      GOW_SCRYPT_P: ${GOW_SCRYPT_P:-1}
      GOW_SCRYPT_MAXMEM: ${GOW_SCRYPT_MAXMEM:-67108864}
      # scrypt runs at once (about 32 MiB each); a login over it gets 503 at once (#413).
      GOW_SCRYPT_CONCURRENCY: ${GOW_SCRYPT_CONCURRENCY:-3}
      # The match WebSocket: extra allowed Origins (a JSON list), hello and send timeouts, the
      # token bucket of one connection's messages.
      GOW_WS_ALLOWED_ORIGINS: ${GOW_WS_ALLOWED_ORIGINS:-[]}
      GOW_WS_HELLO_TIMEOUT_S: ${GOW_WS_HELLO_TIMEOUT_S:-5}
      GOW_WS_SEND_TIMEOUT_S: ${GOW_WS_SEND_TIMEOUT_S:-5}
      GOW_WS_MSG_RATE: ${GOW_WS_MSG_RATE:-20}
      GOW_WS_MSG_BURST: ${GOW_WS_MSG_BURST:-60}
      # Invites and the public lobby.
      GOW_LOBBY_STALE_S: ${GOW_LOBBY_STALE_S:-15}
      GOW_INVITE_RATE_LIMIT: ${GOW_INVITE_RATE_LIMIT:-10}
      GOW_INVITE_RATE_WINDOW_S: ${GOW_INVITE_RATE_WINDOW_S:-60}
      # Matchmaking queue (MM-01): the rating window, the pass period, confirmation, bot offer.
      GOW_QUEUE_WINDOW_BASE: ${GOW_QUEUE_WINDOW_BASE:-100}
      GOW_QUEUE_WINDOW_PER_S: ${GOW_QUEUE_WINDOW_PER_S:-5}
      GOW_QUEUE_WINDOW_MAX: ${GOW_QUEUE_WINDOW_MAX:-400}
      GOW_QUEUE_PASS_S: ${GOW_QUEUE_PASS_S:-1}
      GOW_QUEUE_CONFIRM_S: ${GOW_QUEUE_CONFIRM_S:-15}
      GOW_QUEUE_BOT_OFFER_S: ${GOW_QUEUE_BOT_OFFER_S:-60}
      GOW_QUEUE_STALE_S: ${GOW_QUEUE_STALE_S:-15}
      GOW_BOT_BUDGET_S: ${GOW_BOT_BUDGET_S:-0.001}
      # Rating-farming protection (DEC-34, #414, mechanics.md section 19): calibration, the
      # early-resign threshold, the queue ban of repeated resigns, the per-opponent limit.
      GOW_CALIBRATION_MATCHES: ${GOW_CALIBRATION_MATCHES:-5}
      GOW_EARLY_RESIGN_S: ${GOW_EARLY_RESIGN_S:-180}
      GOW_RESIGN_WINDOW_S: ${GOW_RESIGN_WINDOW_S:-86400}
      GOW_RESIGN_BAN_SECOND_S: ${GOW_RESIGN_BAN_SECOND_S:-300}
      GOW_RESIGN_BAN_THIRD_S: ${GOW_RESIGN_BAN_THIRD_S:-1800}
      GOW_RESIGN_BAN_LATER_S: ${GOW_RESIGN_BAN_LATER_S:-7200}
      GOW_OPPONENT_LIMIT: ${GOW_OPPONENT_LIMIT:-3}
      GOW_OPPONENT_LIMIT_WINDOW_S: ${GOW_OPPONENT_LIMIT_WINDOW_S:-86400}
      # app is reachable only through the internal network, i.e. only from Caddy, and Caddy
      # replaces a client's X-Forwarded-For with the real client address.
      GOW_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - gow-data:/data
    networks:
      - internal
    # Log retention (LEG-01, docs/ops/legal.md): rotation by size, removed with the container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No `ports:`: the server is not published on the host.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # A cap on the one process that runs every match (SRV-01, #411): a memory leak or a flood is
    # killed and restarted inside the container instead of taking the VPS (2 GB) down.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    # Graceful shutdown: uvicorn finishes open requests. Matches are drained before a deploy by
    # deploy/deploy.sh (docs/ops/deploy.md); a plain `docker compose down` cuts running matches.
    stop_grace_period: 30s

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    image: skill-based-front/caddy:local
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
      - edge
    depends_on:
      app:
        condition: service_healthy
    # Log retention (LEG-01, docs/ops/legal.md): rotation by size, removed with the container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Caddy runs as a non-root user and binds 80/443 without CAP_NET_BIND_SERVICE.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  # No route to the outside world: app talks only to Caddy.
  internal:
    internal: true
  edge: {}

volumes:
  # SQLite database and replays. Backups: deploy/backup.sh, docs/ops/deploy.md.
  gow-data:
  # Caddy TLS certificates and ACME account: keep it, or Let's Encrypt rate limits hit on redeploy.
  caddy-data:
  caddy-config:
