# Рулсет mvp-0: стартовые числа и флаги правил MVP.
#
# Источник правил: docs/design/mechanics.md (решения DEC, раздел 21).
# Значения и имена ключей: SIM-01 (#17), таблица «Значения и примечания».
# SIM-01 добавит dataclass Ruleset и загрузчик и дополнит файл недостающими секциями.
#
# Единицы (AGENTS.md, §4.1):
# - все длительности: целое число тиков, 10 тиков = 1 секунда;
# - CP: в сотых долях (100 = 1 CP);
# - только целые числа, никаких float.
#
# Числа меняются только через этот файл и балансировку (BAL-02, #40), а не в коде систем.

# Часы и длина партии (DEC-03, #9; mechanics.md, разделы 1 и 11).
tick_hz = 10 # тиков в секунду
match_ticks = 7200 # партия 12 минут

[cp]
# Командные очки (DEC-02, #8; mechanics.md, разделы 6 и 14). Плоский реген, не растёт от территории.
start = 300 # стартовый запас: 3 CP (SIM-01, #17)
cap = 500 # потолок: 5 CP; на потолке излишек CP сгорает (DEC-02)
per_period = 100 # квант регена: 1 CP ...
period_ticks = 50 # ... раз в 50 тиков (5 с); квант делится по стойке (DEC-02)

[economy]
# Модель экономики и стойка CP (DEC-02, #8; mechanics.md, разделы 6 и 7).
# Плоская экономика: снабжение производит только столица.
# Раз в cp.period_ticks квант cp.per_period делится по стойке: доля в заряды
# (value * pct // 100, округление вниз) копится в аккумуляторе в сотых долях заряда
# по курсу charges_per_cp и превращается в целые заряды; остальное идёт в CP.
# Доля стойки в заряды начисляется всегда, даже на потолке CP.
charges_per_cp = 2 # курс: 1 CP -> 2 заряда
passive_period_ticks = 50 # пассивное производство столицы: раз в 50 тиков ...
passive_amount = 1 # ... 1 заряд

[economy.stance_to_charges_pct]
# Доля кванта регена CP, уходящая в заряды, в процентах (mechanics.md, раздел 6).
economy = 75 # «Экономия»
balance = 50 # «Баланс»
war = 25 # «Война»

[orders]
stance_cooldown_ticks = 100 # смена стойки не чаще раза в 100 тиков (DEC-02)

[orders.cost]
# Стоимость команд в сотых CP. Остальные команды добавят DEC-08 и SIM-01.
recruit = 100 # Recruit(node): 1 CP (DEC-01, #7; mechanics.md, раздел 3)
stance = 0 # смена стойки бесплатна (DEC-02, #8)

[recruit]
# Появление новых юнитов (DEC-01, #7; mechanics.md, раздел 3).
# Recruit(node) создаёт одного разряженного юнита новой группой в своём городе
# со свободной ёмкостью. Размер рекрута (один юнит) и то, что он разряжен,
# задано правилом DEC-01, а не числом рулсета.
cooldown_ticks = 20 # не чаще одного юнита на город за 20 тиков, иначе отказ RECRUIT_COOLDOWN
location = "any_city" # any_city | capital: где разрешён рекрут

[victory]
# Условие победы (DEC-03, #9; mechanics.md, раздел 11).
# VP начисляются раз в vp_period_ticks за каждый свой город: значение `vp` из карты,
# для столицы умноженное на capital_multiplier.
# Правила без чисел (заданы DEC-03, флагов нет): захват вражеской столицы — мгновенная победа;
# по таймеру побеждает тот, у кого больше VP; при равенстве — больше городов; иначе ничья.
vp_period_ticks = 50
capital_multiplier = 3
