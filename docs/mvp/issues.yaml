meta:
  title: "Skill-Based Front — план MVP"
  repo: "DastinovDS/Skill-Based-Front"
  mvp_definition: >-
    Два игрока находят друг друга через публичное лобби, очередь матчмейкинга или
    инвайт-ссылку и играют полную партию 1v1 в браузере по сети. Рейтинговые матчи
    меняют рейтинг Glicko-2, есть лидерборд, игра против бота и реплей с полным раскрытием.
    Балансом управляет набор правил (рулсет), проверенный турниром ботов и внутренним плейтестом.
  sizes:
    XS: "≤ 2 часа"
    S: "≤ 1 день"
    M: "2–3 дня"
    L: "4–5 дней"
  size_days: {XS: 0.25, S: 1, M: 2.5, L: 4.5}
  tracks:
    A: "Python: симуляция, боты, сервер"
    B: "TypeScript и инструменты: клиент, карты, инфраструктура"
    any: "кто свободен"

milestones:
  - id: M0
    title: "M0 — Фундамент"
    goal: "Репозиторий, инструменты, CI и документы готовы; открытые вопросы дизайна получили значения по умолчанию."
    exit:
      - "CI зелёный на пустых пакетах Python и клиента."
      - "docs/design/mechanics.md и AGENTS.md лежат в репозитории."
      - "Значения по умолчанию всех DEC записаны в mechanics.md; DEC-01…DEC-04, DEC-07, DEC-08 подтверждены."
  - id: M1
    title: "M1 — Ядро симуляции"
    goal: "Все правила MVP реализованы в чистой детерминированной симуляции без графики и сети."
    exit:
      - "Полная партия прогоняется headless с простыми контроллерами."
      - "Хэши состояния совпадают в разных процессах с разными PYTHONHASHSEED."
      - "Зеркальный старт с зеркальными командами даёт зеркальное состояние (нет преимущества стороны в коде)."
      - "Каждый разобранный пример из DEC-07 — отдельный проходящий тест."
  - id: M2
    title: "M2 — Боты и баланс-гейт"
    goal: "Турнир ботов показывает, что механика не схлопывается в одну стратегию."
    exit:
      - "Турнир на 1000 матчей воспроизводим и укладывается в 20 минут на 8 ядрах."
      - "BAL-02 закрыт: критерии гейта пройдены, итоговый рулсет зафиксирован."
  - id: M3
    title: "M3 — Сервер матча"
    goal: "Авторитарный сервер проводит матч между двумя WebSocket-клиентами с туманом войны."
    exit:
      - "Два скриптовых клиента играют матч по инвайту от начала до конца; итог совпадает с headless-прогоном."
      - "Переподключение восстанавливает вид игрока; реплей записывается и воспроизводится."
  - id: M4
    title: "M4 — Веб-клиент и внутренний плейтест"
    goal: "Два человека играют полную партию в браузерах; есть игра против бота и просмотр реплея; внутренний плейтест дал «go»."
    exit:
      - "Ручной чек-лист QA-01 пройден на двух разных компьютерах."
      - "PT-01 закрыт с решением «go»."
  - id: M5
    title: "M5 — Метаигра"
    goal: "Публичное лобби, очередь матчмейкинга, рейтинг Glicko-2 и лидерборд."
    exit:
      - "Рейтинговый матч из очереди меняет рейтинг обоих игроков и появляется в лидерборде и профилях."
  - id: M6
    title: "M6 — Релиз MVP"
    goal: "Игра развёрнута по https, проходит e2e и аудит, проведён закрытый плейтест."
    exit:
      - "REL-01 закрыт с достигнутыми критериями успеха."

