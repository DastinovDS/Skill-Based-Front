meta:
  title: "Skill-Based Front MVP plan"
  repo: "DastinovDS/Skill-Based-Front"
  mvp_definition: >-
    Two players find each other through a public lobby, a matchmaking queue, or an
    invite link and play a full 1v1 match in the browser over the network. Ranked matches
    change the Glicko-2 rating, there is a leaderboard, play against a bot, and a replay with full reveal.
    Balance is driven by a set of rules (a ruleset) verified by a bot tournament and an internal playtest.
  sizes:
    XS: "≤ 2 hours"
    S: "≤ 1 day"
    M: "2-3 days"
    L: "4-5 days"
  size_days: {XS: 0.25, S: 1, M: 2.5, L: 4.5}
  tracks:
    A: "Python: simulation, bots, server"
    B: "TypeScript and tooling: client, maps, infrastructure"
    any: "whoever is free"

milestones:
  - id: M0
    title: "M0: Foundation"
    goal: "The repository, tooling, CI and documents are ready; the open design questions have default values."
    exit:
      - "CI is green on empty Python and client packages."
      - "docs/design/mechanics.md and AGENTS.md are in the repository."
      - "The default values of all DECs are recorded in mechanics.md; DEC-01…DEC-04, DEC-07, DEC-08 are confirmed."
  - id: M1
    title: "M1: Simulation core"
    goal: "All MVP rules are implemented in a pure deterministic simulation with no graphics and no network."
    exit:
      - "A full match runs headless with simple controllers."
      - "State hashes match across different processes with different PYTHONHASHSEED values."
      - "A mirrored start with mirrored commands gives a mirrored state (no side advantage in the code)."
      - "Every worked example from DEC-07 is a separate passing test."
  - id: M2
    title: "M2: Bots and balance gate"
    goal: "The bot tournament shows that the mechanics do not collapse into a single strategy."
    exit:
      - "A 1000-match tournament is reproducible and fits into 20 minutes on 8 cores."
      - "BAL-02 is closed: the gate criteria are passed, the final ruleset is fixed."
  - id: M3
    title: "M3: Match server"
    goal: "An authoritative server runs a match between two WebSocket clients with fog of war."
    exit:
      - "Two scripted clients play a match via an invite from start to finish; the result matches the headless run."
      - "Reconnecting restores the player's view; a replay is recorded and played back."
  - id: M4
    title: "M4: Web client and internal playtest"
    goal: "Two people play a full match in browsers; there is play against a bot and replay viewing; the internal playtest gave a \"go\"."
    exit:
      - "The manual QA-01 checklist is passed on two different computers."
      - "PT-01 is closed with a \"go\" decision."
  - id: M5
    title: "M5: Meta game"
    goal: "Public lobby, matchmaking queue, Glicko-2 rating and leaderboard."
    exit:
      - "A ranked match from the queue changes the rating of both players and appears in the leaderboard and in profiles."
  - id: M6
    title: "M6: MVP release"
    goal: "The game is deployed over https, passes e2e and an audit, a closed playtest has been held."
    exit:
      - "REL-01 is closed with the success criteria met."

