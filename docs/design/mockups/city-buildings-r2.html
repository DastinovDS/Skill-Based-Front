<title>City buildings, round 2</title>
<!-- City buildings, round 2 (#954): the owner's answer to topic T of round 1 (2026-11-11): none of the new shapes; the
     map uses the SAME barracks and factory as the city radial menu (apps/client/src/theme/cutIcons.ts, CUT_ICONS and
     CUT_SOLIDS, drawn as CutIcon.svelte draws them: the solid ruled every 2.6 by 1.15, a dark casing 4.2 at 0.9, the
     ink line 2.1 with square ends, on a 26-unit box), and the work is only WHERE they stand at the city. Ten placements
     P1..P10 and two references (R0 the client today, R1 round 1's T1). The build and its payment (#872) are shown on
     the icon itself: the owed charges as lozenges by the icon (the menu's price row), the payment flying in, then the
     build time as a rising fill, a hatch engraved line by line, or a run under the lozenges. The terrain chevrons are
     C2 (decided). Rules on the page: barracks 3 charges, factory 4 (rulesets/mvp-7.toml, DEC-41 item 7), paid from the
     warehouse, then from the group standing there; one build at a time in a city; the capital has both from the start
     (DEC-41 item 2, DEC-26 item 1); an enemy city next to an own node shows only what is built (DEC-31). The build time
     is compressed to 2.9 s here so one loop shows it all (10 s in mvp-7). Self-contained: EB Garamond (SIL OFL) and the
     ground crops are in assets/city-buildings/ (shared with round 1). State in the address. -->

};
const CROWN = { lift: 8, step: 11, minSpan: 1, lozenge: 0.9, width: 2.4, casing: 2.2, serif: 3.6 };
const PAY = { flightMs: 450, lift: 12, popMs: 220, pop: 0.3, runMs: 350, runStagger: 60, shrink: 0.6, doneMs: 600 };

const NODE = {

  medium: { cap: 6, r: 17, wh: 3, stock: 2, vp: 1 },
  large: { cap: 8, r: 20, wh: 3, stock: 2, vp: 2 },

const NAMES = ['Firwood', 'Watchhouse', 'Forkway', 'Stonegate', 'Pinebrook', 'Wood Hollow'];
const ALL_KINDS = ['small', 'medium', 'large', 'capital', 'medium', 'large'];
// Roads per city (degrees, 0 east, 90 south): six arrangements per count, chosen to hit the seats of
// today (left, upper left), the VP (upper right), the top and the warehouse side. The first road of a
// set is the rear one (internal, towards the own side), the others alternate internal and buffer.
const ROAD_SETS = {
  2: [[180, 20], [225, 90], [340, 160], [270, 135], [200, 330], [45, 250]],
  3: [[180, 300, 60], [225, 0, 110], [150, 250, 20], [270, 170, 40], [200, 90, 330], [120, 240, 0]],
  4: [[180, 270, 0, 90], [225, 315, 45, 140], [160, 230, 330, 70], [200, 280, 10, 100], [130, 210, 300, 30], [250, 170, 90, 340]],
  5: [[180, 240, 310, 30, 110], [225, 280, 350, 60, 150], [160, 220, 290, 0, 80], [200, 260, 330, 40, 120], [140, 190, 260, 330, 50], [170, 230, 300, 20, 100]],
  6: [[180, 240, 300, 0, 60, 120], [195, 255, 315, 15, 75, 135], [170, 215, 270, 330, 30, 100], [210, 260, 320, 10, 80, 140], [150, 200, 250, 320, 20, 90], [185, 235, 290, 350, 50, 115]],
};

// =============================================================================================
// Helmet geometry (a port of units/helmet.ts).
// =============================================================================================
function samplePath(d, steps = 10) {
  const t = d.match(/[MLCQZ]|-?\d*\.?\d+/g) || [];
  const pts = []; let i = 0, cmd = '', at = { x: 0, y: 0 };
  const num = () => Number(t[i++]);
  while (i < t.length) {
    const tok = t[i];
    if (/[MLCQZ]/.test(tok)) { cmd = tok; i++; if (cmd === 'Z') continue; }
    if (cmd === 'M' || cmd === 'L') { at = { x: num(), y: num() }; pts.push(at); }
    else if (cmd === 'C') { const c1 = { x: num(), y: num() }, c2 = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*u*at.x + 3*u*u*s*c1.x + 3*u*s*s*c2.x + s*s*s*e.x, y: u*u*u*at.y + 3*u*u*s*c1.y + 3*u*s*s*c2.y + s*s*s*e.y }); } at = e; }
    else if (cmd === 'Q') { const c = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*at.x + 2*u*s*c.x + s*s*e.x, y: u*u*at.y + 2*u*s*c.y + s*s*e.y }); } at = e; }
    else i++;
  }
  return pts;
}
function boundsOf(ps) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const p of ps) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); } return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 }; }
function centroid(ps) { let a = 0, cx = 0, cy = 0; ps.forEach((p, i) => { const q = ps[(i + 1) % ps.length]; const cr = p.x*q.y - q.x*p.y; a += cr; cx += (p.x + q.x)*cr; cy += (p.y + q.y)*cr; }); return { x: cx / (3*a), y: cy / (3*a) }; }
const RAW = {};
for (const k of ['own', 'enemy']) { const P = HELMET_PATHS[k]; RAW[k] = { dome: samplePath(P.dome), band: P.band ? samplePath(P.band) : null, strap: samplePath(P.strap) }; const b = boundsOf([...RAW[k].dome, ...(RAW[k].band || []), ...RAW[k].strap]); RAW[k].c = { x: b.x + b.width / 2, y: b.y + b.height / 2 }; }
const HELMETS = new Map();
function helmet(kind, width) {
  const key = kind + ':' + width; if (HELMETS.has(key)) return HELMETS.get(key);
  const R = RAW[kind], s = width / 100, place = (p) => ({ x: (p.x - R.c.x) * s, y: (p.y - R.c.y) * s });
  const dome = R.dome.map(place), band = R.band ? R.band.map(place) : null, strap = R.strap.map(place);
  const db = boundsOf(dome), mid = centroid(dome);
  const h = { kind, width, dome, band, strap, bounds: boundsOf([...dome, ...(band || []), ...strap]), domeTop: db.y, domeBottom: db.y + db.height, domeBounds: db, middle: { x: mid.x, y: mid.y + width * 0.02 } };
  HELMETS.set(key, h); return h;
}
function helmetLines(width) { const s = width / 100; return { strap: Math.max(6.4*s, 2.1), band: Math.max(5.6*s, 2.2), casing: 6.4 }; }
function helmetExtent(h) { const L = helmetLines(h.width), pad = Math.max(L.casing, L.strap + L.casing) / 2; return { top: h.bounds.y - pad, bottom: h.bounds.y + h.bounds.height + pad, left: h.bounds.x - pad, right: h.bounds.x + h.bounds.width + pad }; }
function helmetWidth(side, inside) { return Math.round(side * HELMET_SCALE * (inside ? HELMET_INSIDE : 1) * 100) / 100; }
function helmetFit(kind, width, reach) {
  let w = width;
  for (let step = 0; step < 6 && w > 4; step++) { const e = helmetExtent(helmet(kind, w)), span = Math.max(e.right, -e.left, e.bottom, -e.top); if (span <= reach) break; w = Math.min(w - 0.25, Math.floor(((w * reach) / span) * 4) / 4); }
  return w;
}
function unitSide(units) { return units <= 3 ? UNIT_SIDES[0] : units <= 7 ? UNIT_SIDES[1] : units <= 15 ? UNIT_SIDES[2] : UNIT_SIDES[3]; }

// =============================================================================================
// Drawing helpers (world units; the canvas transform carries the zoom). A hairline never falls
// under 1.3 device px (#865).
// =============================================================================================
let GA = 1, PXW = 1, LS = 1;
const hair = (w) => Math.max(w, 1.3 / (PXW * LS));
function poly(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); }
function polyA(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (closed) ctx.closePath(); }
function stroke(ctx, w, color, alpha = 1, cap = 'round', join = 'round') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(); ctx.globalAlpha = GA; }
function fill(ctx, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(); ctx.globalAlpha = GA; }
function strokeP(ctx, p, w, color, alpha = 1, cap = 'square', join = 'miter') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(p); ctx.globalAlpha = GA; }
function fillP(ctx, p, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(p); ctx.globalAlpha = GA; }
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI*2); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hatchLines(ctx, b, angle, pitch) {
  const cx = b.x + b.width/2, cy = b.y + b.height/2, R = Math.hypot(b.width, b.height)/2 + pitch;
  const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
  ctx.beginPath(); for (let d = -R; d <= R; d += pitch) { ctx.moveTo(cx + nx*d - ux*R, cy + ny*d - uy*R); ctx.lineTo(cx + nx*d + ux*R, cy + ny*d + uy*R); }
}
const polar = (a, d) => ({ x: d*Math.cos(a), y: d*Math.sin(a) });
const clamp01 = (t) => Math.max(0, Math.min(1, t));

/** One charge (57u): the casing, then the colour (in stock, paid) or hollow (room, owed). */
function drawLozenge(ctx, x, y, on, color, k = 1, alpha = 1) {
  lozPath(ctx, x, y, LOZ.casing*k); fill(ctx, C.casing, alpha);
  if (on) { lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, color, alpha); return; }
  lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, C.plate, alpha);
  lozPath(ctx, x, y, LOZ.hollow*k); stroke(ctx, hair(LOZ.line), C.ink, LOZ.lineA*alpha, 'butt', 'miter');
}
function frame(ctx, x, y, rot, s, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s); const ls = LS; LS = ls*s; fn(); LS = ls; ctx.restore(); }

function growScale(z, base) { return base * Math.max(1, (TOWER.screen / TOWER.minScale) / Math.max(1e-3, z)) ** 0.5; }
/** The size of a menu icon on the map (world units, its 26-unit box): 16 near zoom 1, never under 13 css px (the menu draws it at 24 to 28). */
function iconSize(z) { return (S.isz / 100) * Math.max(16, 13 / z); }

// =============================================================================================
// The menu icon on the map. Looks: built (the ruled solid in the owner's colour: own level, the
// enemy's at 45 degrees), plan (owes charges: a dotted outline), rising (the build time: fill,
// hatch, or nothing inside while the lozenges carry it). Same art and order as CutIcon.svelte.
// =============================================================================================
