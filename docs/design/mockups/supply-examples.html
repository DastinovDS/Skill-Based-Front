<!doctype html>
<!--
  Supply examples: the 15 supply variants (V0..V14) of issue #693 as tiny storyboards, so each variant reads in seconds.
  Rules and numbers: docs/design/supply-methods.md. The detailed comparison (simulation, counters, board): supply-methods.html.
  Self-contained: no network, no external fonts or scripts. Open in a browser as a file.
  Every example is a map of 5 to 6 nodes and 3 to 4 numbered steps. The animation is scripted by hand from the written rules
  (it is an illustration, not the toy simulation of supply-methods.html and not client code). Numbers are toy numbers.
  Address state: #v=V3 (one variant) or #m=grid&s=front (one scenario, all variants); s is basic, front or cut.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supply examples</title>
    <style>
      :root {
        --bg: #0a0d12;
        --surface: #161b22;
        --surface-2: #21262d;
        --border: #30363d;
        --text: #e6edf3;
        --text-dim: #9da7b3;
        --you: #5b9bff;
        --enemy: #ff5b61;
        --warn: #ffb020;
        --good: #3fb950;
        --radius: 8px;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0 16px 40px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 var(--font);
      }
      .wrap {
        max-width: 1500px;
        margin: 0 auto;
      }
      button {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #8b949e;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--you);
        outline-offset: 1px;
      }
      button[aria-pressed='true'] {
        background: #1f3a66;
        border-color: var(--you);
        color: #fff;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      a {
        color: var(--you);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 10px 0;
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      h1 {
        font-size: 19px;
        margin: 0 6px 0 0;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        border-right: 1px solid var(--border);
      }
      .seg button:last-child {
        border-right: 0;
      }
      .bar label {
        color: var(--text-dim);
        display: inline-flex;
        gap: 5px;
        align-items: center;
        cursor: pointer;
      }
      .bar .sp {
        flex: 1 1 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        padding: 8px 0;
        color: var(--text-dim);
        font-size: 12.5px;
        align-items: center;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend svg {
        width: 34px;
        height: 18px;
        flex: none;
      }
      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .layout.nolist {
        grid-template-columns: minmax(0, 1fr);
      }
      .layout.nolist #list {
        display: none;
      }
      #list {
        position: sticky;
        top: 58px;
        max-height: calc(100vh - 70px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-right: 4px;
      }
      #list button {
        text-align: left;
        padding: 7px 10px;
        display: block;
        width: 100%;
      }
      #list .nm {
        font-weight: 700;
        font-size: 14px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #list .rl {
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.3;
        margin-top: 2px;
      }
      #list button[aria-pressed='true'] .rl {
        color: #c9d8f2;
      }
      .id {
        color: var(--text-dim);
        font-weight: 600;
        min-width: 26px;
      }
      .badge {
        background: var(--warn);
        color: #1b1300;
        font-size: 10.5px;
        font-weight: 800;
        border-radius: 4px;
        padding: 1px 5px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .vhead h2 {
        margin: 0;
        font-size: 21px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .vhead .ruleline {
        margin: 4px 0 0;
        font-size: 16px;
        color: #cfe0ff;
      }
      .scens {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 8px 10px;
        min-width: 0;
      }
      .panel h3 {
        margin: 0 0 4px;
        font-size: 14px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .panel h3 .n {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex: none;
      }
      .panel.extra h3 .n {
        background: var(--warn);
        color: #1b1300;
        border-color: var(--warn);
      }
      .board svg {
        display: block;
        width: 100%;
        height: auto;
        background: #0f141b;
        border-radius: 6px;
      }
      .cap {
        margin: 6px 2px 4px;
        font-size: 15.5px;
        line-height: 1.3;
        min-height: 41px;
        font-weight: 600;
      }
      .cap .sn {
        color: var(--warn);
        margin-right: 4px;
      }
      .ctl {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ctl button {
        padding: 4px 7px;
        min-width: 28px;
        font-size: 13px;
      }
      .ctl .sb[aria-pressed='true'] {
        background: var(--warn);
        color: #1b1300;
        border-color: var(--warn);
        font-weight: 700;
      }
      .vfoot {
        margin-top: 12px;
        color: var(--text-dim);
        font-size: 13px;
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      .vfoot b {
        color: var(--text);
      }
      .gridbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        padding: 8px 0 4px;
      }
      .gridbar .ctl {
        margin-left: auto;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 10px;
        margin-top: 6px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 6px 8px;
        min-width: 0;
      }
      .card header {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .card header:hover .vn {
        text-decoration: underline;
      }
      .card .vn {
        font-weight: 700;
        font-size: 14px;
        flex: 1;
        min-width: 0;
      }
      .card .mini {
        color: var(--text-dim);
        font-size: 11.5px;
        white-space: nowrap;
      }
      .card .cap {
        font-size: 13.5px;
        min-height: 36px;
        margin-top: 4px;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
        #list {
          position: static;
          max-height: none;
          flex-direction: row;
          overflow-x: auto;
          padding: 0 0 6px;
        }
        #list button {
          width: auto;
          flex: none;
          min-width: 96px;
        }
        #list .rl {
          display: none;
        }
        .bar {
          position: static;
        }
      }
      @media (max-width: 520px) {
        body {
          padding: 0 10px 30px;
        }
        .cards {
          grid-template-columns: minmax(0, 1fr);
        }
        .scens {
          grid-template-columns: minmax(0, 1fr);
        }
        h1 {
          font-size: 17px;
        }
        .ctl button,
        .gridbar button,
        .bar button {
          min-height: 36px;
          min-width: 34px;
        }
      }

      /* SVG animation */
      svg .fresh {
        animation: fadein 0.45s ease-out;
      }
      svg .popin {
        animation: popin 0.4s ease-out;
        transform-box: fill-box;
        transform-origin: center;
      }
      svg .draw {
        stroke-dasharray: 1;
        animation: draw 0.8s linear forwards;
      }
      svg .rip {
        fill: none;
        stroke: #fff;
        stroke-width: 3;
        transform-box: fill-box;
        transform-origin: center;
        animation: rip 0.9s ease-out forwards;
      }
      svg .rip.r2 {
        animation-delay: 0.22s;
        opacity: 0;
        animation-fill-mode: both;
      }
      svg .fade {
        animation: fadeout 1.5s ease-in 0.2s forwards;
      }
      svg .pop {
        animation: pop 1.25s ease-out forwards;
        font-weight: 800;
        font-size: 13px;
        paint-order: stroke;
        stroke: #0f141b;
        stroke-width: 3px;
      }
      svg .flashring {
        fill: none;
        stroke-width: 4;
        transform-box: fill-box;
        transform-origin: center;
        animation: flashring 0.8s ease-out forwards;
      }
      svg .slotflash {
        animation: slotflash 0.5s ease-out;
        transform-box: fill-box;
        transform-origin: center;
      }
      svg .dash {
        animation: dash 0.7s linear infinite;
      }
      svg .rd {
        transition: transform 1.2s ease-in-out;
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeout {
        to {
          opacity: 0;
        }
      }
      @keyframes popin {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes rip {
        from {
          transform: scale(0.3);
          opacity: 0.95;
        }
        to {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          transform: translateY(0);
          opacity: 1;
        }
        to {
          transform: translateY(-20px);
          opacity: 0;
        }
      }
      @keyframes flashring {
        from {
          transform: scale(0.6);
          opacity: 1;
        }
        to {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      @keyframes slotflash {
        0% {
          transform: scale(1.9);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -20;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        svg .dash {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar">
        <h1>Supply examples</h1>
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-m="one" aria-pressed="true">One variant, 3 scenarios</button>
          <button type="button" data-m="grid" aria-pressed="false">One scenario, all variants</button>
        </div>
        <label><input type="checkbox" id="slow" /> Slow motion</label>
        <button type="button" id="replayAll">Replay all</button>
        <span class="sp"></span>
        <a href="supply-methods.html">Detailed comparison (numbers, simulation)</a>
      </div>
      <div class="legend" aria-label="Legend">
        <span
          ><svg viewBox="0 0 34 18" aria-hidden="true">
            <path d="M3 9 H31" stroke="#3d4858" stroke-width="8" stroke-linecap="round" />
            <circle cx="14" cy="9" r="5.5" fill="#ffd23f" stroke="#3a2e00" stroke-width="2" />
            <polygon points="26,9 20,5 20,13" fill="#fff" stroke="#000" stroke-width="1" /></svg
          >charge, moving</span
        >
        <span
          ><svg viewBox="0 0 34 18" aria-hidden="true">
            <rect x="2" y="5" width="8" height="8" fill="#ffd23f" stroke="#7a5a00" stroke-width="1.5" />
            <rect x="12" y="5" width="8" height="8" fill="#ffd23f" stroke="#7a5a00" stroke-width="1.5" />
            <rect x="22" y="5" width="8" height="8" fill="#10151c" stroke="#5b6676" stroke-width="1.5" /></svg
          >city stock (filled = charge)</span
        >
        <span
          ><svg viewBox="0 0 34 18" aria-hidden="true">
            <circle cx="10" cy="9" r="7" fill="none" stroke="#fff" stroke-width="2" />
            <path d="M16 5 L16 18 L19 15 L22 20 L24 19 L21 14 L26 14 Z" fill="#fff" stroke="#000" stroke-width="1" /></svg
          >the player clicks</span
        >
        <span
          ><svg viewBox="0 0 34 18" aria-hidden="true">
            <circle cx="17" cy="9" r="7" fill="none" stroke="#ff5b61" stroke-width="3" /></svg
          >red flash: lost or burned</span
        >
        <span
          ><svg viewBox="0 0 34 18" aria-hidden="true">
            <circle cx="17" cy="9" r="8" fill="#1d4f9e" stroke="#8cb8ff" stroke-width="2.5" /></svg
          >yours</span
        >
        <span
          ><svg viewBox="0 0 34 18" aria-hidden="true">
            <circle cx="17" cy="9" r="8" fill="#5a1f24" stroke="#ff7b80" stroke-width="2.5" stroke-dasharray="3 2.5" /></svg
          >enemy (dashed, red ▲)</span
        >
        <span>F factory · A, B rear cities · C front city with your army ▲ · E enemy · D detour · P province</span>
      </div>
      <div class="layout" id="layout">
        <nav id="list" aria-label="Variants"></nav>
        <main id="main"></main>
      </div>
    </div>

    <script>
      (() => {
        'use strict';
        const NS = 'http://www.w3.org/2000/svg';
        const svg = (tag, attrs, parent, text) => {
          const e = document.createElementNS(NS, tag);
          if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (text != null) e.textContent = text;
          if (parent) parent.appendChild(e);
          return e;
        };
        const h = (tag, attrs, parent, text) => {
          const e = document.createElement(tag);
          if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (text != null) e.textContent = text;
          if (parent) parent.appendChild(e);
          return e;
        };
        const COL = {
          amber: '#ffa726',
          amber2: '#ff7043',
          cyan: '#29d0e0',
          purple: '#b388ff',
          green: '#3fd17a',
          pink: '#ff6fb5',
          red: '#ff5b61',
          blue: '#5b9bff',
          grey: '#8b97a6',
          gold: '#ffd23f',
        };
        const col = (c) => COL[c] || c || COL.grey;

        /* ---------------------------------------------------------------- maps */
        const LINE = {
          F: [42, 70, 'f', 'factory'],
          A: [117, 70, 'c', 'rear'],
          B: [192, 70, 'c', 'rear'],
          C: [267, 70, 'c', 'front'],
          E: [342, 70, 'c', 'enemy'],
        };
        const MAPS = {
          line: { n: LINE, e: ['FA', 'AB', 'BC', 'CE'], enemy: ['E'] },
          cut: {
            n: { ...LINE, D: [229.5, 142, 'c', 'detour'] },
            e: ['FA', 'AB', 'BC', 'CE', 'BD', 'DC'],
            enemy: ['E'],
          },
          prov: {
            n: { F: LINE.F, A: LINE.A, P: [192, 70, 'p', 'province'], C: LINE.C, E: LINE.E },
            e: ['FA', 'AP', 'PC', 'CE'],
            enemy: ['E'],
          },
          prov2: {
            n: { F: LINE.F, A: LINE.A, B: LINE.B, C: LINE.C, P: [342, 70, 'p', 'enemy'] },
            e: ['FA', 'AB', 'BC', 'CP'],
            enemy: ['P'],
          },
        };
        const TY = 44; // height of the chips above a node
        const CAPS = { c: 4, p: 3, f: 6 };
        const SPEED = 130; // px per second of a charge on a road
        let SPD = 1; // slow motion factor

        /* ------------------------------------------------------- event builders */
        const D = (path, o = {}) => ({ k: 'dot', t: 0, path, ...o });
        const many = (path, n, o = {}) =>
          Array.from({ length: n }, (_, i) => D(path, { ...o, t: (o.t || 0) + i * (o.gap ?? 0.4) }));
        const OV = (id, spec, t = 0) => ({ k: 'ov', t, id, spec });
        const RM = (id, t = 0) => ({ k: 'ov', t, id, spec: null });
        const DV = (id, d = -1, t = 0) => ({ k: 'ovdv', t, id, d });
        const CLK = (target, t = 0, label) => ({ k: 'click', t, target, label });
        const SHOT = (n, t = 0) => ({ k: 'shot', t, n });
        const STK = (n, v, t = 0) => ({ k: 'stock', t, n, v });
        const OWN = (n, who, t = 0) => ({ k: 'own', t, n, who });
        const ARMY = (n, t = 0) => ({ k: 'army', t, n });
        const CUT = (e, t = 0) => ({ k: 'cut', t, e });
        const POP = (n, text, c, t = 0) => ({ k: 'pop', t, n, text, c });
        const JUMP = (from, to, o = {}) => ({ k: 'jump', t: 0, from, to, ...o });
        const AIR = (n, o = {}) => ({ k: 'air', t: 0, n, ...o });
        /* a point d px from node n toward node `to` (wagons wait on the road, not on top of a city) */
        const TW = (n, to, d = 44) => ({ tw: [n, to, d] });
        const WSP = (at, load, t = 0) => ({ k: 'wsp', t, at, load });
        const WLOAD = (v, t = 0) => ({ k: 'wload', t, v });
        const WMOVE = (path, dur, t = 0) => ({ k: 'wmove', t, path, dur });
        const WUNL = (n, cnt, t = 0) => ({ k: 'wunl', t, n, cnt });
        const WDIE = (t = 0) => ({ k: 'wdie', t });
        const S = (cap, ...ev) => ({ cap, ev: ev.flat(Infinity) });

        /* overlay specs */
        const LN = (path, o = {}) => ({ k: 'line', path, ...o });
        const TG = (n, text, c) => ({ k: 'tag', n, text, c });
        const ST = (n, s) => ({ k: 'status', n, s });
        const FL = (a, b) => ({ k: 'flow', a, b });
        const HZ = (nodes, text, c) => ({ k: 'halo', nodes, text, c });
        const PIPS = (n, v) => ({ k: 'pips', n, v });
        const TK = (n, v) => ({ k: 'ticket', n, v });
        const DP = (n) => ({ k: 'depot', n });

        /* the standard "enemy cuts road B-C" beat, shared by all variants (a charge dies on the road) */
        const cutBC = (extra = []) => [D('ABC', { fate: 'lost', p: 0.82, ...extra[0] }), CUT('BC', 0.7)];

        /* ------------------------------------------------------------ variants */
        const SC = [
          { id: 'basic', title: 'Basic: factory to front' },
          { id: 'front', title: 'Front advances: city captured' },
          { id: 'cut', title: 'Road cut' },
        ];
        const V = [];

        /* V0 */
        V.push({
          id: 'V0',
          name: 'Factory lines (now)',
          rule: 'A line from the factory to a city. Only the target city fills.',
          clicks: 12,
          cost: 'none',
          parts: 'already built',
          basic: {
            map: 'line',
            steps: [
              S('Player draws a line from F to C', CLK('F'), CLK('C', 0.8), OV('l1', LN('FABC'), 1.0)),
              S('Charges ride the line and stop only in C', many('FABC', 3, { drop: 'C', gap: 0.45 })),
              S(
                'A and B get nothing: the rear stays empty',
                OV('eA', TG('A', 'empty', 'red')),
                OV('eB', TG('B', 'empty', 'red')),
                SHOT('C', 0.3),
                D('FABC', { drop: 'C', t: 0.6 }),
              ),
              S(
                'To fill A: another line F to A, 2 more clicks',
                CLK('F'),
                CLK('A', 0.8),
                OV('l2', LN('FA', { off: 8, c: 'amber2' }), 1.0),
                RM('eA', 1.0),
                many('FA', 2, { drop: 'A', t: 1.3, gap: 0.4 }),
              ),
            ],
          },
          front: {
            map: 'line',
            init: { ov: { l1: LN('FABC') }, stock: { C: 3 } },
            steps: [
              S('The line F to C feeds the front', SHOT('C'), D('FABC', { drop: 'C', t: 0.4 })),
              S('City E captured', OWN('E', 'you'), ARMY('E')),
              S(
                'Auto lines adds a copy F to E on top of the old line',
                OV('l2', LN('FABCE', { off: 8, c: 'amber2' }), 0.2),
                OV('t1', TG('B', 'copy on top', 'amber2'), 0.9),
              ),
              S(
                'The old line keeps filling C: the army left it',
                D('FABC', { drop: 'C' }),
                D('FABCE', { drop: 'E', t: 0.4 }),
                OV('t2', TG('C', 'idle', 'red'), 1.3),
              ),
            ],
          },
          cut: {
            map: 'cut',
            init: { ov: { l1: LN('FABC') }, stock: { C: 1 } },
            steps: [
              S('The line F to C feeds the front', D('FABC', { drop: 'C' })),
              S('Enemy cuts road B-C: a charge on it is lost', cutBC()),
              S('The line reroutes through D by itself', OV('l1', LN('FABDC'), 0.1)),
              S('C is fed again', many('FABDC', 2, { drop: 'C', gap: 0.3 })),
            ],
          },
          extra: {
            title: 'Line into a province',
            map: 'prov',

        /* ---------------------------------------------------------------- engine */
        const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        function chip(parent, x, y, text, color, o = {}) {
          const w = o.w || Math.max(28, text.length * 6.9 + 12);
          const hh = o.h || 17;
          const cx = o.left ? x + w / 2 : o.noclamp ? x : clamp(x, w / 2 + 3, 377 - w / 2);
          const g = svg('g', { transform: `translate(${cx},${y})` }, parent);
          svg(
            'rect',
            {
              x: -w / 2,
              y: -hh / 2,
              width: w,
              height: hh,
              rx: 5,
              fill: o.bg || '#0d1117',
              stroke: color,
              'stroke-width': 1.8,
              'stroke-dasharray': o.dash || 'none',
            },
            g,
          );
          if (text) svg('text', { x: 0, y: 4.2, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: o.fg || '#f0f6fc' }, g, text);
          return g;
        }
        function arrowHead(parent, x, y, ang, size, fill) {
          return svg(
            'polygon',
            {
              points: `${size},0 ${-size * 0.6},${-size * 0.75} ${-size * 0.6},${size * 0.75}`,
              fill,
              stroke: '#0d1117',
              'stroke-width': 1.5,
              transform: `translate(${x},${y}) rotate(${ang})`,
            },
            parent,
          );
        }

        class Board {
          constructor(host, scen, key) {
            this.scen = scen;
            this.key = key;
            this.map = MAPS[scen.map];
            this.steps = scen.steps;
            this.last = this.steps.length - 1;
            this.live = false;
            this.manual = false;
            this.i = 0;
            this.anims = [];
            this.queue = [];
            this.el = 0;
            this.t0 = null;
            this.warns = [];
            this.ctl = null;
            this.capEl = null;
            this.build(host);
            this.restore(0);
            this.setCaption(0);
          }
          P(n) {
            const q = this.map.n[n];
            return [q[0], q[1]];
          }
          ptsOf(path) {
            const arr = typeof path === 'string' ? path.split('') : path;
            return arr.map((p) => {
              if (typeof p === 'string') return this.P(p);
              if (p.tw) {
                const a = this.P(p.tw[0]);
                const b = this.P(p.tw[1]);
                const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
                return [a[0] + ((b[0] - a[0]) * p.tw[2]) / l, a[1] + ((b[1] - a[1]) * p.tw[2]) / l];
              }
              return p;
            });
          }
          mid(e) {
            const a = this.P(e[0]);
            const b = this.P(e[1]);
            return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          }
          warn(msg) {
            this.warns.push(msg);
            if (window.__verbose) console.warn(`[${this.key}] step ${this.i + 1}: ${msg}`);
          }
          build(host) {
            this.vh = this.map.n.D ? 196 : 130;
            const s = svg('svg', { viewBox: `0 -16 380 ${this.vh + 16}`, role: 'img', 'aria-label': 'Supply example map' }, host);
            this.svg = s;
            this.L = {};
            for (const n of ['roads', 'under', 'nodes', 'over', 'wg', 'dots', 'slots', 'fx']) this.L[n] = svg('g', { 'data-l': n }, s);
            // roads
            for (const e of this.map.e) {
              const a = this.P(e[0]);
              const b = this.P(e[1]);
              svg('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: '#1b222c', 'stroke-width': 12, 'stroke-linecap': 'round' }, this.L.roads);
              svg('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: '#3d4858', 'stroke-width': 8, 'stroke-linecap': 'round' }, this.L.roads);
            }
            // nodes
            this.nodeEl = {};
            for (const id in this.map.n) {
              const [x, y, kind, role] = this.map.n[id];
              const g = svg('g', { transform: `translate(${x},${y})` }, this.L.nodes);
              const shape = kind === 'f' ? svg('rect', { x: -24, y: -19, width: 48, height: 38, rx: 8, 'stroke-width': 3 }, g) : kind === 'p' ? svg('rect', { x: -16, y: -16, width: 32, height: 32, rx: 4, transform: 'rotate(45)', 'stroke-width': 3 }, g) : svg('circle', { r: 21, 'stroke-width': 3 }, g);
              svg('text', { x: 0, y: 7.5, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 800, fill: '#fff' }, g, id);
              const roleEl = svg('text', { x: 0, y: 49, 'text-anchor': 'middle', 'font-size': 11, fill: '#8b97a6' }, g, role);
              const slots = [];
              const cap = CAPS[kind];
              const showSlots = kind !== 'f' || this.scen.init?.stock?.F != null;
              if (showSlots) {
                const w = cap * 10 + (cap - 1) * 3;
                const sg = svg('g', { transform: `translate(${x - w / 2},${y + (kind === 'f' ? 23 : 27)})` }, this.L.slots);
                svg('rect', { x: -3, y: -3, width: w + 6, height: 16, rx: 4, fill: '#0f141b', opacity: 0.85 }, sg);
                for (let k = 0; k < cap; k++) slots.push(svg('rect', { x: k * 13, y: 0, width: 10, height: 10, 'stroke-width': 1.6 }, sg));
                
              }
              this.nodeEl[id] = { g, shape, slots, kind, roleEl, role, x, y };
            }
          }
          /* ------------------------------------------------ state rendering */
          initState() {
            const sc = this.scen;
            const own = {};
            for (const id in this.map.n) own[id] = this.map.enemy.includes(id) ? 'enemy' : 'you';
            this.st = {
              stock: {},
              own,
              cut: {},
              ov: clone(sc.init?.ov) || {},
              army: 'C',
              wagon: sc.init?.wagon ? this.wagonAt(sc.init.wagon.at, sc.init.wagon.load) : null,
            };
            if (this.map.n.P && this.map.enemy.includes('P')) this.st.army = 'C';
            for (const id in this.map.n) this.st.stock[id] = 0;
            Object.assign(this.st.stock, sc.init?.stock || {});
          }
          wagonAt(at, load) {
            const p = this.ptsOf([at])[0];
            return { x: p[0], y: p[1], load };
          }
          renderAll() {
            for (const n of ['under', 'over', 'wg', 'dots', 'fx']) this.L[n].replaceChildren();
            this.ovEls = {};
            this.cutEls = {};
            this.armyG = svg('g', {}, this.L.over);
            for (const id in this.map.n) {
              this.renderStock(id, false);
              this.renderOwner(id);
            }
            this.renderArmies();
            for (const e in this.st.cut) this.renderCut(e, false);
            for (const id in this.st.ov) this.renderOv(id, this.st.ov[id], false);
            this.renderWagon();
          }
          renderOwner(id) {
            const ne = this.nodeEl[id];
            const o = this.st.own[id];
            const sh = ne.shape;
            if (o === 'you') {
              sh.setAttribute('fill', '#1d4f9e');
              sh.setAttribute('stroke', '#8cb8ff');
              sh.removeAttribute('stroke-dasharray');
            } else {
              sh.setAttribute('fill', '#5a1f24');
              sh.setAttribute('stroke', '#ff7b80');
              sh.setAttribute('stroke-dasharray', '4 3');
            }
            ne.roleEl.textContent = ne.role === 'enemy' && o === 'you' ? 'captured' : ne.role;
          }
          renderStock(id, flash) {
            const ne = this.nodeEl[id];
            const v = this.st.stock[id] || 0;
            ne.slots.forEach((r, k) => {
              const filled = k < v;
              r.setAttribute('fill', filled ? '#ffd23f' : '#10151c');
              r.setAttribute('stroke', filled ? '#7a5a00' : '#5b6676');
              r.classList.remove('slotflash');
            });
            if (flash && ne.slots[v - 1]) {
              const r = ne.slots[v - 1];
              void r.getBoundingClientRect();

            const path = svg('path', { d: 'M' + pts.map((p) => p.join(' ')).join(' L'), fill: 'none', stroke: COL.green, 'stroke-width': 4, 'stroke-dasharray': '5 6', opacity: 0.95, class: 'fade' }, this.L.fx);
            const g = this.makeDot(false);
            this.tweenPath(pts, 0.8, (x, y) => g.setAttribute('transform', `translate(${x},${y})`), 1, () => {
              g.remove();
              this.addStock(e.to, 1, true);
            });
            void path;
          }
          spawnAir(e) {
            const [x, y] = this.P(e.n);
            svg('line', { x1: x, y1: -14, x2: x, y2: y - 26, stroke: COL.blue, 'stroke-width': 3, 'stroke-dasharray': '3 5', class: 'fade' }, this.L.fx);
            const g = this.makeDot(false);
            this.tweenPath([[x, -12], [x, y - 22]], e.dur || 1.2, (px, py) => g.setAttribute('transform', `translate(${px},${py})`), 1, () => {
              g.remove();
              this.addStock(e.n, 1, true);
            });
          }
          /* -------------------------------------------------- navigation */
          restore(i) {
            this.cancel();
            this.initState();
            for (let j = 0; j < i; j++) for (const e of this.steps[j].ev) this.apply(e, false);
            this.renderAll();
            this.i = i;
          }
          cancel() {
            this.anims = [];
            this.queue = [];
            this.live = false;
          }
          play(i) {
            this.restore(i);
            this.live = true;
            this.t0 = null;
            this.queue = this.steps[i].ev.map((e, k) => [e, k]).sort((a, b) => a[0].t - b[0].t || a[1] - b[1]).map((x) => x[0]);
            this.end = this.stepDur(i);
            this.el = 0;
            this.setCaption(i);
          }
          showFinal(i) {
            this.restore(i + 1);
            this.i = i;
            this.setCaption(i);
          }
          setCaption(i) {
            if (this.capEl) {
              this.capEl.replaceChildren();
              h('span', { class: 'sn' }, this.capEl, `${i + 1}.`);
              this.capEl.append(this.steps[i].cap);
            }
            if (this.ctl) {
              this.ctl.btns.forEach((b, k) => {
                b.setAttribute('aria-pressed', k === i ? 'true' : 'false');
              });
              this.ctl.prev.disabled = i === 0;
              this.ctl.next.disabled = i === this.last;
            }
          }
          tick(now) {
            if (!this.live) return;
            if (this.t0 == null) this.t0 = now;
            this.el = ((now - this.t0) / 1000) * SPD;
            while (this.queue.length && this.queue[0].t <= this.el) this.apply(this.queue.shift(), true);
            for (let k = this.anims.length - 1; k >= 0; k--) {
              const a = this.anims[k];
              const p = clamp((this.el - a.t0) / a.dur, 0, 1);
              if (this.el < a.t0) continue;
              a.fn(p);
              if (p >= 1) {
                this.anims.splice(k, 1);
                a.end && a.end();
              }
            }
            if (!this.queue.length && !this.anims.length && this.el >= this.end) this.live = false;
          }
          /* run all steps headless: warnings and durations */
          check() {
            this.warns = [];
            this.initState();
            const out = [];
            for (let j = 0; j <= this.last; j++) {
              this.i = j;
              for (const e of this.steps[j].ev) this.apply(e, false);
              out.push({ dur: +this.stepDur(j).toFixed(2), stock: { ...this.st.stock } });
            }
            return { warns: [...this.warns], steps: out, total: out.reduce((s, x) => s + x.dur, 0) };
          }
        }

        /* ------------------------------------------------------------- groups */
        const HOLD = 0.75; // seconds to hold a finished step before the next one starts by itself
        class Group {
          constructor() {
            this.boards = [];
            this.auto = false;
            this.step = 0;
            this.holdUntil = null;
            this.onStep = null;
          }
          add(b) {
            this.boards.push(b);
          }
          /* force: a restart or a group control (all boards follow); without it boards the user stepped by hand are left alone */
          playAll(step, force = true) {
            this.step = step;
            this.holdUntil = null;
            for (const b of this.boards) {
              if (force) b.manual = false;
              else if (b.manual) continue;
              if (step <= b.last) b.play(step);
              else b.showFinal(b.last);
            }
            this.onStep && this.onStep(step);
          }
          tick(now) {
            for (const b of this.boards) b.tick(now);
            if (!this.auto) return;
            if (this.boards.some((b) => !b.manual && b.live)) return;
            if (this.holdUntil == null) this.holdUntil = now + (HOLD * 1000) / SPD;
            else if (now >= this.holdUntil) {
              const max = Math.max(...this.boards.map((b) => b.last));
              if (this.step < max) this.playAll(this.step + 1, false);
              else this.auto = false;
            }
          }
          maxStep() {
            return Math.max(...this.boards.map((b) => b.last));
          }
        }
        const groups = new Set();
        function frame(now) {
          for (const g of groups) g.tick(now);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        /* ---------------------------------------------------------------- page */
        const $list = document.getElementById('list');
        const $main = document.getElementById('main');
        const $layout = document.getElementById('layout');
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const state = { m: 'one', v: 'V3', s: 'basic' };
        let group = null;

        function readHash() {
          const p = new URLSearchParams(location.hash.slice(1));
          if (p.get('v') && V.find((x) => x.id === p.get('v'))) state.v = p.get('v');
          if (p.get('m') === 'grid') state.m = 'grid';
          if (SC.find((x) => x.id === p.get('s'))) state.s = p.get('s');
        }
        function writeHash() {
          const p = new URLSearchParams();
          if (state.m === 'grid') {
            p.set('m', 'grid');
            p.set('s', state.s);
          } else p.set('v', state.v);
          history.replaceState(null, '', '#' + p.toString());
        }
        const vOf = (id) => V.find((x) => x.id === id);

        function buildList() {
          $list.replaceChildren();
          for (const v of V) {
            const b = h('button', { type: 'button', 'data-v': v.id, 'aria-pressed': 'false' }, $list);
            const nm = h('div', { class: 'nm' }, b);
            h('span', { class: 'id' }, nm, v.id);
            h('span', {}, nm, v.name);
            if (v.top) h('span', { class: 'badge', title: 'In the top 3 of issue #693' }, nm, 'TOP 3');
            h('div', { class: 'rl' }, b, v.rule);
            b.addEventListener('click', () => {
              state.v = v.id;
              state.m = 'one';
              render();
            });
          }
        }
        function mkPanel(parent, v, scen, num, title, extra) {
          const p = h('article', { class: 'panel' + (extra ? ' extra' : '') }, parent);
          const hd = h('h3', {}, p);
          h('span', { class: 'n' }, hd, extra ? '+' : String(num));
          h('span', {}, hd, title);
          const host = h('div', { class: 'board' }, p);
          const board = new Board(host, scen, `${v.id}/${title}`);
          board.capEl = h('p', { class: 'cap', 'aria-live': 'polite' }, p);
          const ctl = h('div', { class: 'ctl' }, p);
          const prev = h('button', { type: 'button', 'aria-label': 'Previous step' }, ctl, '◀ Prev');
          const btns = board.steps.map((_, k) => h('button', { type: 'button', class: 'sb', 'aria-label': `Step ${k + 1}`, 'aria-pressed': 'false' }, ctl, String(k + 1)));
          const next = h('button', { type: 'button', 'aria-label': 'Next step' }, ctl, 'Next ▶');
          const rep = h('button', { type: 'button', 'aria-label': 'Replay from step 1' }, ctl, '↻ Replay');
          board.ctl = { prev, next, btns };
          const go = (i) => {
            board.manual = true;
            board.play(clamp(i, 0, board.last));
          };
          prev.addEventListener('click', () => go(board.i - 1));
          next.addEventListener('click', () => go(board.i + 1));
          btns.forEach((b, k) => b.addEventListener('click', () => go(k)));
          rep.addEventListener('click', () => {
            board.manual = true;
            board.play(0);
            group.auto = false;
          });
          board.setCaption(0);
          return board;
        }
        function renderOne() {
          const v = vOf(state.v);
          $layout.classList.remove('nolist');
          $list.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v.id ? 'true' : 'false'));
          const cur = $list.querySelector('[aria-pressed="true"]');
          if (cur && $list.scrollWidth > $list.clientWidth) $list.scrollLeft = cur.offsetLeft - ($list.clientWidth - cur.offsetWidth) / 2;
          const head = h('section', { class: 'vhead' }, $main);
          const h2 = h('h2', {}, head);
          h('span', { class: 'id' }, h2, v.id);
          h('span', {}, h2, v.name);
          if (v.top) h('span', { class: 'badge' }, h2, 'TOP 3 of #693');
          h('p', { class: 'ruleline' }, head, v.rule);
          const wrap = h('div', { class: 'scens' }, $main);
          group = new Group();
          groups.add(group);
          SC.forEach((sc, k) => group.add(mkPanel(wrap, v, v[sc.id], k + 1, sc.title, false)));
          if (v.extra) group.add(mkPanel(wrap, v, v.extra, 4, 'Extra: ' + v.extra.title, true));
          const perMin = v.clicks / 3;
          const foot = h('p', { class: 'vfoot' }, $main);
          h('b', {}, foot, 'Clicks: ');
          foot.append(`${v.clicks} per 3 min (about ${perMin % 1 ? perMin.toFixed(1) : perMin} per min, busy player)`);
          foot.append('  ·  ');
          h('b', {}, foot, 'Cost: ');
          foot.append(`${v.cost} (${v.parts})`);
          foot.append('  ·  numbers from supply-methods.md');
        }
        function renderGrid() {
          $layout.classList.add('nolist');
          group = new Group();
          groups.add(group);
          const bar = h('div', { class: 'gridbar' }, $main);
          const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Scenario' }, bar);
          SC.forEach((sc, k) => {
            const b = h('button', { type: 'button', 'aria-pressed': sc.id === state.s ? 'true' : 'false' }, seg, `${k + 1} ${sc.title}`);
            b.addEventListener('click', () => {
              state.s = sc.id;
              render();
            });
          });
          const ctl = h('div', { class: 'ctl' }, bar);
          const prev = h('button', { type: 'button' }, ctl, '◀ Prev');
          const btns = [0, 1, 2, 3].map((k) => h('button', { type: 'button', class: 'sb', 'aria-pressed': 'false' }, ctl, String(k + 1)));
          const next = h('button', { type: 'button' }, ctl, 'Next ▶');
          const rep = h('button', { type: 'button' }, ctl, '↻ Replay');
          const cards = h('div', { class: 'cards' }, $main);
          for (const v of V) {
            const c = h('article', { class: 'card' }, cards);
            const hd = h('header', { title: 'Open this variant' }, c);
            h('span', { class: 'id' }, hd, v.id);
            h('span', { class: 'vn' }, hd, v.name);
            if (v.top) h('span', { class: 'badge' }, hd, 'TOP 3');
            h('span', { class: 'mini' }, hd, `${v.clicks} clk · ${v.cost}`);
            hd.addEventListener('click', () => {
              state.v = v.id;
              state.m = 'one';
              render();
            });
            const host = h('div', { class: 'board' }, c);
            const b = new Board(host, v[state.s], `${v.id}/${state.s}`);
            b.capEl = h('p', { class: 'cap' }, c);
            b.setCaption(0);
            group.add(b);
          }
          const sync = (k) => {
            btns.forEach((x, j) => x.setAttribute('aria-pressed', j === k ? 'true' : 'false'));
            prev.disabled = k === 0;
            next.disabled = k >= group.maxStep();
          };
          group.onStep = sync;
          prev.addEventListener('click', () => {
            group.auto = false;
            group.playAll(Math.max(0, group.step - 1));
          });
          next.addEventListener('click', () => {
            group.auto = false;
            group.playAll(Math.min(group.maxStep(), group.step + 1));
          });
          btns.forEach((x, k) =>
            x.addEventListener('click', () => {
              group.auto = false;
              group.playAll(k);
            }),
          );
          rep.addEventListener('click', () => {
            group.auto = true;
            group.playAll(0);
          });
        }
        function render() {
          if (group) groups.delete(group);
          $main.replaceChildren();
          document.querySelectorAll('[data-m]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === state.m ? 'true' : 'false'));
          if (state.m === 'grid') renderGrid();
          else renderOne();
          writeHash();
          start();
          window.scrollTo({ top: 0 });
        }
        function start() {
          if (reduce) {
            group.boards.forEach((b) => b.showFinal(0));
            group.onStep && group.onStep(0);
            return;
          }
          group.auto = true;
          group.playAll(0);
        }

        document.querySelectorAll('[data-m]').forEach((b) =>
          b.addEventListener('click', () => {
            state.m = b.dataset.m;
            render();
          }),
        );
        document.getElementById('slow').addEventListener('change', (e) => {
          SPD = e.target.checked ? 0.55 : 1;
        });
        document.getElementById('replayAll').addEventListener('click', () => {
          start();
        });
        window.addEventListener('hashchange', () => {
          const before = JSON.stringify(state);
          readHash();
          if (JSON.stringify(state) !== before) render();
        });

        /* headless check for authors: open the page with #check, read the console */
        window.__check = () => {
          const host = document.createElement('div');
          const res = [];
          for (const v of V)
            for (const sc of [...SC.map((s) => s.id), 'extra']) {
              if (!v[sc]) continue;
              const b = new Board(host, v[sc], `${v.id}/${sc}`);
              const r = b.check();
              res.push({ id: v.id, sc, steps: r.steps.length, total: +r.total.toFixed(1), warns: r.warns, stocks: r.steps.map((s) => Object.entries(s.stock).filter(([, x]) => x).map(([k, x]) => k + x).join(' ')) });
            }
          return res;
        };

        /* test hook: jump every board of the open view to the end state of step j, no animation */
        window.__show = (j) => {
          group.auto = false;
          group.boards.forEach((b) => {
            b.manual = true;
            b.showFinal(Math.min(j, b.last));
          });
        };
        readHash();
        buildList();
        render();
      })();
    </script>
  </body>
</html>
