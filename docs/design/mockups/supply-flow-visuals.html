<!doctype html>
<!--
  Supply flow visualization: variants (#699, design exploration for #697). Not client code, not the simulation.
  Self-contained: no network. Open as a file.
  The model is the toy, integer version of the accepted "flow towards the leaves" rule of
  docs/design/supply-auto-flow.md with every recommended option (leaf = own node next to any non-own node;
  one charge per road per dispatch downhill, emptiest neighbour first; level roads even out by 2; no rear minimum;
  a tired army pulls; one global leaf shift k, stock ahead of the level stays; pockets follow the same rule).
  Toy numbers: one beat = one dispatch, a road takes one beat (a slow road two), the capital makes 1 charge per
  2 beats, a factory 1 per 3; warehouses: capital 6, city and factory 3, province 1.
  Address state: #v=1&c=4&cmp=1&mode=supply&map=tree&step=2&free=0&gray=0&rm=0. window.__sfv exposes the model.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supply flow visuals</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #21262d;
        --border: #30363d;
        --text: #e6edf3;
        --text-dim: #9da7b3;
        --paper: #f0f6fc;
        --you: #5b9bff;
        --enemy: #e5484d;
        --warn: #ffb020;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        margin: 0;
        padding: 0 16px 32px;
        color: var(--text);
        font: 14px/1.4 var(--font);
      }
      .wrap {
        max-width: 1500px;
        margin: 0 auto;
      }
      button,
      select {
        background: var(--surface-2);
        color: var(--text);

        border-radius: 6px;

      }

      }

        color: var(--text-dim);

  <body>
    <div class="wrap">
      <div class="bar">
        <h1>Supply flow visuals</h1>
        <div class="seg" id="modeSeg" role="group" aria-label="Map mode">
          <button data-m="supply">Supply mode</button><button data-m="battle">Battle mode</button><button data-m="both">Both</button>
        </div>
        <label><input type="checkbox" id="cmp" /> Compare 2</label>
        <span class="sp"></span>
        <label><input type="checkbox" id="gray" /> Grayscale</label>
        <label><input type="checkbox" id="rm" /> Less motion</label>
      </div>
      <nav class="chips" id="chips" aria-label="Variants"></nav>
      <div class="stage" id="stage"></div>
      <div class="cost" id="cost"></div>
      <div class="ctl">
        <div class="seg" id="mapSeg" role="group" aria-label="Map"></div>
        <div class="seg" id="playSeg" role="group" aria-label="Play mode">
          <button data-p="story">Story</button><button data-p="free">Free</button>
        </div>
      </div>
      <div class="ctl" id="storyCtl">
        <button id="prev" aria-label="Previous step">◀ Prev</button>
        <button id="next" aria-label="Next step">Next ▶</button>
        <button id="replay" aria-label="Replay step">↺ Replay</button>
        <button id="all" aria-pressed="false">▶ Play all</button>
        <div class="steps" id="steps"></div>
      </div>
      <div class="ctl hidden" id="freeCtl">
        <div class="seg" id="toolSeg" role="group" aria-label="Click on the map">
          <button data-t="spend">Spend at army</button><button data-t="capture">Capture</button><button data-t="cut">Cut / mend road</button>
        </div>
        <button id="lvlBack">Level −</button>
        <button id="lvlFwd">Level +</button>
        <button id="reset">Reset</button>
        <span class="free-hint" id="freeHint">click the map</span>
      </div>
      <div class="cap" id="caption" aria-live="polite"></div>
    </div>
    <script>
      (() => {
        'use strict';
        /* ================================================================ model */
        const INF = 99;
        const CAP = { cap: 6, fac: 3, city: 3, prov: 1 };
        const W = 640;
        const H = 380;
        // node: [id, name, x, y, kind, owner, extra]; owner: me, en, ne; extra: s stock, a [units, charged], edge, vp
        const MAPS = {
          tree: {
            label: 'Two fronts',
            n: [
              ['R', 'Oldmill', 52, 196, 'city', 'me', { s: 0 }],
              ['K', 'Stonegate', 145, 196, 'cap', 'me', { s: 6, vp: 3 }],
              ['P', 'Ford', 256, 112, 'prov', 'me', { s: 1 }],
              ['B', 'Highmoor', 262, 282, 'city', 'me', { s: 1 }],
              ['A1', 'Firwood', 378, 58, 'city', 'me', { s: 1, a: [3, 3] }],
              ['A2', 'Bluff', 372, 170, 'prov', 'me', { s: 0 }],
              ['B1', 'Watchpost', 388, 290, 'city', 'me', { s: 1, a: [3, 3] }],
              ['E1', 'Crest', 500, 58, 'city', 'en', { edge: 1 }],
              ['E2', 'Pine', 494, 178, 'prov', 'en', {}],
              ['E3', 'Archway', 508, 298, 'city', 'en', { edge: 1 }],
              ['E4', 'Heart', 598, 180, 'cap', 'en', { edge: 1, vp: 3 }],
            ],
            e: ['R-K', 'K-P', 'K-B:2', 'P-A1', 'P-A2', 'B-B1', 'A1-E1', 'A2-E2', 'B1-E3', 'E1-E2', 'E2-E3', 'E2-E4', 'E3-E4'],
            story: [
              ['Steady flow: charges roll downhill to the front', [], 8],
              ['Firwood fires 3: the refill runs back up the chain', [['shots', 'A1', 3]], 7],
              ['Capture Archway: it becomes a leaf', [['capture', 'E3', 'B1']], 7],
              ['Leaf level −1: the line moves back', [['shift', 1]], 6],
              ['Leaf level back to the front', [['shift', -1]], 6],
              ['Road Stonegate–Highmoor cut: a pocket', [['cut', 'K-B'], ['shots', 'E3', 2]], 7],
            ],
          },
          fac: {
            label: 'Capital + factory',
            n: [
              ['K', 'Stonegate', 64, 196, 'cap', 'me', { s: 5, vp: 3 }],
              ['M', 'Midway', 176, 196, 'city', 'me', { s: 1 }],
              ['F', 'Forge', 292, 104, 'fac', 'me', { s: 2 }],
              ['S', 'Southgate', 292, 284, 'city', 'me', { s: 0 }],
              ['N1', 'Northcliff', 412, 54, 'city', 'me', { s: 1, a: [3, 3] }],
              ['N2', 'Knoll', 408, 160, 'prov', 'me', { s: 0 }],
              ['S1', 'Lowfield', 420, 292, 'city', 'me', { s: 1, a: [3, 3] }],
              ['E1', 'Crest', 540, 54, 'city', 'en', { edge: 1 }],
              ['E2', 'Pine', 534, 168, 'prov', 'en', { edge: 1 }],
              ['E3', 'Archway', 548, 298, 'city', 'en', { edge: 1 }],
            ],
            e: ['K-M', 'M-F', 'M-S', 'F-N1', 'F-N2', 'S-S1:2', 'N1-E1', 'N2-E2', 'S1-E3', 'E1-E2', 'E2-E3'],
            story: [
              ['Two sources: each rolls its charges to the nearest front', [], 8],
              ['Lowfield fires 3: only the capital refills the south', [['shots', 'S1', 3]], 8],
              ['Capture Crest: a new leaf in the north', [['capture', 'E1', 'N1']], 7],
              ['Leaf level −1: Forge and Southgate keep the stock', [['shift', 1]], 6],
              ['Leaf level back to the front', [['shift', -1]], 6],
              ['Road Midway–Southgate cut: the south is a pocket', [['cut', 'M-S'], ['shots', 'S1', 2]], 7],
            ],
          },
          pocket: {
            label: 'Pocket',
            n: [
              ['K', 'Stonegate', 52, 196, 'cap', 'me', { s: 4, vp: 3 }],
              ['A', 'Elm', 152, 196, 'city', 'me', { s: 2 }],
              ['B', 'Narrows', 252, 196, 'prov', 'me', { s: 1 }],
              ['Hb', 'Hub', 352, 196, 'city', 'me', { s: 3 }],
              ['C', 'Northcliff', 462, 100, 'city', 'me', { s: 2, a: [3, 3] }],
              ['D', 'Lowfield', 462, 290, 'city', 'me', { s: 3, a: [3, 3] }],
              ['E1', 'Crest', 584, 100, 'city', 'en', { edge: 1 }],
              ['E2', 'Archway', 590, 290, 'city', 'en', { edge: 1 }],
            ],
            e: ['K-A', 'A-B:2', 'B-Hb', 'Hb-C', 'Hb-D', 'C-E1', 'D-E2', 'E1-E2'],
            story: [
              ['Mid-game: stock sits along the chain to the front', [], 6],
              ['Northcliff fires 3: the chain refills it', [['shots', 'C', 3]], 7],
              ['Capture Archway: a new leaf', [['capture', 'E2', 'D']], 7],
              ['Leaf level −1: Hub keeps the stock', [['shift', 1]], 6],
              ['Leaf level back to the front', [['shift', -1]], 6],
              ['Road Elm–Narrows cut: the front is a pocket', [['cut', 'A-B'], ['shots', 'C', 3]], 8],
            ],
          },
        };
        const STEP_LABELS = ['Flow', 'Spend', 'Capture', 'Level −1', 'Level 0', 'Cut'];

        function initState(mapId) {
          const M = MAPS[mapId];
          const st = {
            map: mapId,
            beat: 0,
            nodes: {},
            order: [],
            edges: [],
            packets: [],
            d: {},
            d0: {},
            pocket: {},
            shift: 0,
            k: 0,
            pid: 1,
            flow: {},
            chain: {},
            hop: {},
            ripples: [],
            fx: [],
            sends: [],
            focus: null,
          };
          M.n.forEach(([id, name, x, y, kind, own, o], i) => {
            st.nodes[id] = {
              id,
              name,
              x,
              y,
              kind,
              own,
              cap: CAP[kind],
              stock: o.s || 0,
              army: o.a ? { u: o.a[0], c: o.a[1] } : null,
              edge: !!o.edge,
              vp: kind === 'prov' ? 0 : o.vp || 1,
              key: i,
            };
            st.order.push(id);
          });
          for (const s of M.e) {
            const [ab, len] = s.split(':');
            const [a, b] = ab.split('-');
            st.edges.push({ id: ab, a, b, len: +(len || 1), cut: false });
          }
          return st;
        }
        const clone = (o) => JSON.parse(JSON.stringify(o));
        const mine = (st, n) => st.nodes[n].own === 'me';
        const nb = (st, n) => {
          const r = [];
          for (const e of st.edges) {
            if (e.a === n) r.push([e.b, e]);
            else if (e.b === n) r.push([e.a, e]);
          }
          return r;
        };
        const road = (st, e) => !e.cut && mine(st, e.a) && mine(st, e.b);
        const byKey = (st) => (a, b) => st.nodes[a].key - st.nodes[b].key;
        const isSrc = (N) => N.kind === 'cap' || N.kind === 'fac';
        const incoming = (st, n) => st.packets.filter((p) => p.b === n).length;
        const edgeOf = (st, id) => st.edges.find((x) => x.id === id);

        function computeField(st) {
          const ids = st.order.filter((n) => mine(st, n));
          const d = {};
          for (const n of ids) {
            let b = st.nodes[n].edge;
            for (const [m, e] of nb(st, n)) if (e.cut || !mine(st, m)) b = true;
            d[n] = b ? 0 : INF;
          }
          const spread = () => {
            for (let lv = 0; lv < 64; lv++) {
              for (const n of ids) if (d[n] === lv) for (const [m, e] of nb(st, n)) if (road(st, e) && d[m] > lv + 1) d[m] = lv + 1;
              if (!ids.some((n) => d[n] > lv && d[n] < INF)) break;
            }
          };
          spread();
          const kc = ids.find((n) => st.nodes[n].kind === 'cap');
          const fin = ids.map((n) => d[n]).filter((x) => x < INF);
          st.kmax = kc && d[kc] < INF ? d[kc] : fin.length ? Math.max(...fin) : 0;
          st.k = Math.min(st.shift, st.kmax);
          st.d0 = { ...d };
          st.pulled = {};
          let any = false;
          for (const n of ids) {
            const A = st.nodes[n].army;
            if (A && A.c < A.u && d[n] > st.k && d[n] < INF) {
              d[n] = st.k;
              st.pulled[n] = true;
              any = true;
            }
          }
          if (any) spread();
          const comp = {};
          const pocket = {};
          st.comps = [];
          for (const n of ids) {
            if (comp[n] != null) continue;
            const c = [n];
            comp[n] = n;
            for (let i = 0; i < c.length; i++)
              for (const [m, e] of nb(st, c[i]))
                if (road(st, e) && comp[m] == null) {
                  comp[m] = n;
                  c.push(m);
                }
            const src = c.some((x) => isSrc(st.nodes[x]));
            for (const x of c) pocket[x] = !src;
            st.comps.push(c);
          }
          st.d = d;
          st.pocket = pocket;
          st.comp = comp;
        }
        const roomOf = (st, n) => st.nodes[n].cap - st.nodes[n].stock - incoming(st, n);
        const fillPct = (st, n, room) => Math.floor(((st.nodes[n].cap - room) * 100) / st.nodes[n].cap);

        function send(st, a, b, e, kind) {
          st.nodes[a].stock -= 1;
          st.packets.push({ id: st.pid++, a, b, e: e.id, t0: st.beat, len: e.len, kind });
          st.sends.push({ a, b, e: e.id, kind });
        }
        function orderCands(st, cands, room) {
          const key = (m) => st.nodes[m[0]].key;
          return cands
            .slice()
            .sort((x, y) => fillPct(st, x[0], room[x[0]]) - fillPct(st, y[0], room[y[0]]) || key(x) - key(y));
        }

        function beat(st) {
          st.beat += 1;
          const fx = [];
          st.sends = [];
          // 1. arrivals
          for (const p of st.packets.slice()) {
            if (st.beat - p.t0 < p.len) continue;
            st.packets.splice(st.packets.indexOf(p), 1);
            const e = edgeOf(st, p.e);
            const N = st.nodes[p.b];
            if (e.cut || !mine(st, p.b)) fx.push({ k: 'lost', n: p.b });
            else if (N.stock >= N.cap) fx.push({ k: 'burn', n: p.b });
            else N.stock += 1;
          }
          computeField(st);
          // 2. production; a full source spills one road back, not ahead of the level
          for (const n of st.order) {
            const N = st.nodes[n];
            if (!mine(st, n) || !isSrc(N)) continue;
            if (st.beat % (N.kind === 'cap' ? 2 : 3)) continue;
            if (N.stock < N.cap) {
              N.stock += 1;
              fx.push({ k: 'prod', n });
              continue;
            }
            const c = nb(st, n)
              .filter(([m, e]) => road(st, e) && roomOf(st, m) > 0 && (st.d[m] ?? INF) >= st.k)
              .sort((x, y) => st.d[x[0]] - st.d[y[0]] || st.nodes[x[0]].key - st.nodes[y[0]].key);
            if (c.length) {
              N.stock += 1;
              send(st, n, c[0][0], c[0][1], 'spill');
            } else fx.push({ k: 'burn', n });
          }
          // 3. armies recharge from their node
          for (const n of st.order) {
            const N = st.nodes[n];
            if (!mine(st, n) || !N.army) continue;
            const t = Math.min(N.army.u - N.army.c, N.stock);
            if (t > 0) {
              N.army.c += t;
              N.stock -= t;
              fx.push({ k: 'recharge', n, v: t });
            }
          }
          // 4. dispatch on a snapshot of the room
          computeField(st);
          const d = st.d;
          const k = st.k;
          const ids = Object.keys(d).sort((a, b) => d[a] - d[b] || st.nodes[a].key - st.nodes[b].key);
          const room = {};
          for (const n of ids) room[n] = roomOf(st, n);
          for (const n of ids) {
            const N = st.nodes[n];
            if (d[n] >= INF || d[n] <= k) continue;
            let spare = N.stock;
            if (spare <= 0) continue;
            const roads = nb(st, n).filter(([m, e]) => road(st, e) && d[m] >= k);
            for (const [m, e] of orderCands(st, roads.filter(([m]) => d[m] < d[n] && room[m] > 0), room)) {
              if (spare <= 0) break;
              send(st, n, m, e, 'down');
              room[m] -= 1;
              spare -= 1;
            }
            for (const [m, e] of orderCands(st, roads.filter(([m]) => d[m] === d[n] && room[m] > 0), room)) {
              if (spare <= 0) break;
              if (st.nodes[m].cap - room[m] + 2 > N.stock) continue;
              send(st, n, m, e, 'level');
              room[m] -= 1;
              spare -= 1;
            }
          }
          // throughput per road (decays), and the request chain (who asked whom)
          for (const id in st.flow) {
            st.flow[id].v *= 0.5;
            if (st.flow[id].v < 0.06) delete st.flow[id];
          }
          for (const s of st.sends) {
            const f = st.flow[s.e] || (st.flow[s.e] = { v: 0, from: s.a });
            f.v += 1;
            f.from = s.a;
          }
          for (const n in st.chain) if (--st.chain[n] <= 0) delete st.chain[n];
          st.ripples = [];
          for (const s of st.sends) {
            if (st.chain[s.b] == null) continue;
            const hop = (st.hop[s.b] || 0) + 1;
            st.ripples.push({ req: s.b, giv: s.a, e: s.e, hop });
            if (st.chain[s.a] == null && !isSrc(st.nodes[s.a])) {
              st.chain[s.a] = 3;
              st.hop[s.a] = hop;
            } else if (isSrc(st.nodes[s.a])) st.hop[s.a] = hop;
          }
          st.fx = fx;
          return fx;
        }

        function applyEvent(st, ev) {
          const [k, a, b] = ev;
          const fx = [];
          if (k === 'shots') {
            const N = st.nodes[a];
            if (!N.army || N.own !== 'me') return fx;

        /* ============================================================ geometry */
        // Voronoi cells by half-plane clipping; every vertex carries the tag of the edge that starts at it
        // (-1 the frame, otherwise the index of the neighbouring node).
        function clipHalf(poly, pi, pj, j) {
          const nx = pj.x - pi.x;
          const ny = pj.y - pi.y;
          const mx = (pi.x + pj.x) / 2;
          const my = (pi.y + pj.y) / 2;
          const f = (v) => (v.x - mx) * nx + (v.y - my) * ny;
          const out = [];
          for (let i = 0; i < poly.length; i++) {
            const A = poly[i];
            const B = poly[(i + 1) % poly.length];
            const fa = f(A);
            const fb = f(B);
            if (fa <= 0) out.push({ x: A.x, y: A.y, t: A.t });
            if (fa <= 0 !== fb <= 0) {
              const s = fa / (fa - fb);
              out.push({ x: A.x + (B.x - A.x) * s, y: A.y + (B.y - A.y) * s, t: fa <= 0 ? j : A.t });
            }

        const CELLS = {};
        function cellsOf(mapId) {
          if (CELLS[mapId]) return CELLS[mapId];
          const real = MAPS[mapId].n.map(([id, , x, y]) => ({ id, x, y }));
          const pts = real.slice();
          const r = rng(mapId.length * 31 + 7);
          for (let gy = 18; gy < H + 30; gy += 52)
            for (let gx = 18; gx < W + 30; gx += 52) {
              const x = gx + (r() - 0.5) * 40;
              const y = gy + (r() - 0.5) * 40;
              let best = real[0];
              let bd = 1e9;
              for (const q of real) {
                const d = Math.hypot(q.x - x, q.y - y);
                if (d < bd) {
                  bd = d;
                  best = q;
                }

              if (bd > 34) pts.push({ id: best.id, x, y });

            { x: 0, y: 0, t: -1 },
            { x: W, y: 0, t: -1 },
            { x: W, y: H, t: -1 },
            { x: 0, y: H, t: -1 },
          ];
          const cells = pts.map((p, i) => {
            let poly = frame.map((v) => ({ ...v }));
            pts.forEach((q, j) => {
              if (j !== i) poly = clipHalf(poly, p, q, j);

            return { id: p.id, poly, pts };

        // terrain of the battle map: baked once per map (value noise, stipple), like the baked map background
        const TERRAIN = {};
        function rng(seed) {
          return () => {
            seed |= 0;

          if (TERRAIN[mapId]) return TERRAIN[mapId];

          const c = document.createElement('canvas');
          c.width = W * S;
          c.height = H * S;
          const g = c.getContext('2d');
          const r = rng(mapId.length * 977 + 13);
          const waves = Array.from({ length: 9 }, () => ({ fx: 0.008 + r() * 0.022, fy: 0.008 + r() * 0.022, p: r() * 6.28, q: r() * 6.28 }));
          const img = g.createImageData(c.width, c.height);
          const cols = { plains: [118, 138, 86], forest: [34, 82, 62], mount: [104, 106, 112] };
          for (let y = 0; y < c.height; y++)
            for (let x = 0; x < c.width; x++) {
              const X = x / S;
              const Y = y / S;
              let v = 0;
              let u = 0;
              for (const w of waves) {
                v += Math.sin(X * w.fx + w.p) * Math.cos(Y * w.fy + w.q);
                u += Math.cos(X * w.fy * 1.3 + w.q) * Math.sin(Y * w.fx * 1.1 + w.p);

              const t = v > 1.1 ? 'forest' : u > 1.5 ? 'mount' : 'plains';
              const cc = cols[t];

              img.data[i + 1] = cc[1] + n;
              img.data[i + 2] = cc[2] + n;

          g.fillRect(0, 0, c.width, c.height);

        const C = {

            if (F.ledgerStarve && starving(st, N.id)) this.ledgerStock(N);
            if (F.pools && lvl) this.poolsAt(N);
            if (F.stopbar && lvl) this.stopBar(N);
            if (F.ticks && lvl) this.stopBar(N, true);
            if (F.ledger) this.ledgerTag(N, lvl);
            if (F.compass) this.compass(N, F.compass === 'small');
            if (F.ahead && ahead(st, N.id)) {
              // ahead of the level: no new supply (hatched disc)
              g.save();
              g.beginPath();
              g.arc(N.x, N.y, R + 2, 0, 6.29);
              g.clip();
              g.globalAlpha = 1;
              hatch(g, N.x - R - 2, N.y - R - 2, N.x + R + 2, N.y + R + 2, 4, 'rgba(13,17,23,0.85)', 1.6);
              g.restore();
            }
          }
          poolsAt(N) {
            const g = this.g;
            const R = nodeR(N);
            for (let i = 0; i < 2; i++) {
              g.beginPath();
              g.arc(N.x, N.y, R + 7 + i * 5, 0, 6.29);
              g.strokeStyle = `rgba(160,200,255,${0.9 - i * 0.45})`;
              g.lineWidth = 2;
              g.stroke();
            }
          }
          stopBar(N, small) {
            const g = this.g;
            const R = nodeR(N);
            const ang = this.frontAngle(N);
            g.save();
            g.translate(N.x + Math.cos(ang) * (R + 7), N.y + Math.sin(ang) * (R + 7));
            g.rotate(ang);
            g.fillStyle = C.paper;
            g.strokeStyle = C.bg;
            g.lineWidth = 1.4;
            g.beginPath();
            const h = small ? 8 : 12;
            g.rect(-2, -h, 4, h * 2);
            g.fill();
            g.stroke();
            g.restore();
          }
          ledgerTag(N, lvl) {
            // the field number: roads to the front; the level is inverted (dark on paper)
            const g = this.g;
            const st = this.st;
            const R = nodeR(N);
            const d = st.d0[N.id];
            const s = this.tb;
            g.save();
            g.translate(N.x - R - 4, N.y - R - 5);
            g.scale(s, s);
            g.beginPath();
            g.arc(0, 0, 8.5, 0, 6.29);
            g.fillStyle = lvl ? C.paper : C.bg;
            g.fill();
            g.strokeStyle = lvl ? C.bg : 'rgba(240,246,252,0.6)';
            g.lineWidth = 1.5;
            g.stroke();
            text(g, d >= INF ? '–' : String(d), 0, 0.5, 10.5, lvl ? C.bg : C.paper, { halo: false });
            g.restore();
            if (st.pulled[N.id]) {
              g.save();
              g.translate(N.x - R - 9, N.y - R + 20);
              g.scale(s, s);
              text(g, `→${st.k}`, 0, 0, 9.5, C.paper, {});
              g.restore();
            }
          }
          compass(N, small) {
            // a wedge on the rim towards each neighbour this city gives to; filled = carrying now
            const g = this.g;
            const st = this.st;
            const R = nodeR(N);
            const lvl = st.d0[N.id] === st.k && !ahead(st, N.id);
            if (lvl) {
              g.beginPath();
              g.arc(N.x, N.y, R + 7, 0, 6.29);
              g.strokeStyle = C.paper;
              g.lineWidth = small ? 1.4 : 2.2;
              g.stroke();
              return;
            }
            for (const [m, e] of nb(st, N.id)) {
              const dir = roadDir(st, e);
              if (!dir) continue;
              const from = dir > 0 ? e.a : e.b;
              if (from !== N.id) continue;
              const M = st.nodes[m];
              const ang = Math.atan2(M.y - N.y, M.x - N.x);
              const v = flowV(st, e, dir);
              const sc = small ? 0.7 : 1;
              g.save();
              g.translate(N.x + Math.cos(ang) * (R + 4), N.y + Math.sin(ang) * (R + 4));
              g.rotate(ang);
              g.scale(sc, sc);
              g.beginPath();
              g.moveTo(0, -7);
              g.lineTo(11, 0);
              g.lineTo(0, 7);
              g.closePath();
              g.fillStyle = v > 0.2 ? C.paper : C.bg;
              g.fill();
              g.strokeStyle = v > 0.2 ? C.bg : C.paper;
              g.lineWidth = 1.6;
              if (st.pocket[N.id]) g.setLineDash([2, 2]);
              g.stroke();
              g.restore();
            }
          }
          effects() {
            const g = this.g;
            const st = this.st;
            const fr = this.frac;
            if (fr > 0.9) return;
            const a = 1 - fr / 0.9;
            for (const f of st.fx) {
              const N = f.n ? st.nodes[f.n] : null;
              if (f.k === 'shots') {
                g.save();
                g.globalAlpha = a;
                g.beginPath();
                g.arc(N.x, N.y, nodeR(N) + 6 + fr * 14, 0, 6.29);
                g.strokeStyle = C.enemy;
                g.lineWidth = 3;
                g.stroke();
                text(g, `−${f.v}`, N.x + 22, N.y - 24 - fr * 6, 13, '#ff9a9d');
                g.restore();
              } else if (f.k === 'capture') {
                g.save();
                g.globalAlpha = a;
                g.beginPath();
                g.arc(N.x, N.y, nodeR(N) + 6 + fr * 16, 0, 6.29);
                g.strokeStyle = C.paper;
                g.lineWidth = 3;
                g.stroke();
                g.restore();
              } else if (f.k === 'prod') {
                g.save();
                g.globalAlpha = a * 0.9;
                text(g, '+1', N.x, N.y - nodeR(N) - 10 - fr * 8, 10.5, '#bcd6ff');
                g.restore();
              } else if (f.k === 'burn') {
                g.save();
                g.globalAlpha = a;
                text(g, 'burned', N.x, N.y - nodeR(N) - 12 - fr * 6, 10, '#ffb3b5');
                g.restore();
              }
            }
          }
          hud() {
            // the Supply mode pill (S3 Stepper, ui-style 40) with the leaf level instead of the rear minimum
            const g = this.g;
            const st = this.st;
            const s = Math.min(this.tb, 1.3);
            g.save();
            g.translate(8, 8);
            g.scale(s, s);
            const lbl = st.k === 0 ? 'front' : `−${st.k}`;
            plate(g, 0, 0, 150, 24, 'rgba(22,27,34,0.94)', '#30363d');
            text(g, 'Supply', 30, 12.5, 11.5, C.paper, { halo: false });
            text(g, '−', 70, 12, 14, st.k < st.kmax ? C.paper : '#59636e', { halo: false });
            plate(g, 82, 4, 42, 16, st.k ? C.warn : '#21262d');
            text(g, lbl, 103, 12.5, 10.5, st.k ? C.bg : C.paper, { halo: false });
            text(g, '+', 137, 12, 14, st.k > 0 ? C.paper : '#59636e', { halo: false });
            g.restore();
          }
          levelChip() {
            const g = this.g;
            const s = Math.min(this.tb, 1.3);
            g.save();
            g.translate(8, 8);
            g.scale(s, s);
            plate(g, 0, 0, 84, 20, 'rgba(22,27,34,0.94)', C.warn);
            text(g, `level −${this.st.k}`, 42, 10.5, 10.5, C.warn, { halo: false });
            g.restore();
          }
          hit(ev) {
            const r = this.cv.getBoundingClientRect();
            const x = ((ev.clientX - r.left) / r.width) * W;
            const y = ((ev.clientY - r.top) / r.height) * H;
            return { x, y };
          }
        }

        /* ============================================================ page */
        const $ = (id) => document.getElementById(id);
        const ui = {
          v: 1,
          c: 4,
          cmp: false,
          mode: 'supply',
          map: 'tree',
          play: 'story',
          step: 0,
          gray: false,
          rm: matchMedia('(prefers-reduced-motion: reduce)').matches,
          active: 0,
          tool: 'spend',
          auto: false,
        };
        const BEAT = 720;
        let st = null;
        let snaps = [];
        let beatsLeft = 0;
        let beatAt = 0;
        let holdUntil = 0;
        let panels = [];

        function buildSnaps() {
          const M = MAPS[ui.map];
          snaps = [];
          let s = initState(ui.map);
          computeField(s);
          for (const [, evs, beats] of M.story) {
            snaps.push(clone(s));
            for (const ev of evs) applyEvent(s, ev);
            for (let i = 0; i < beats; i++) beat(s);
          }
          snaps.push(clone(s));
        }
        function startStep(i) {
          ui.step = clamp(i, 0, MAPS[ui.map].story.length - 1);
          st = clone(snaps[ui.step]);
          st.fx = [];
          st.ripples = [];
          const [cap, evs, beats] = MAPS[ui.map].story[ui.step];
          for (const ev of evs) st.fx.push(...applyEvent(st, ev));
          beatsLeft = beats;
          beatAt = performance.now() + (evs.length ? 650 : 250);
          holdUntil = 0;
          $('caption').textContent = `${ui.step + 1}. ${cap}`;
          renderSteps();
          writeHash();
        }
        function startFree() {
          st = initState(ui.map);
          computeField(st);
          beatAt = performance.now() + 300;
          $('caption').textContent = '';
          writeHash();
        }
        let pending = [];
        function tick(now) {
          if (!st) return;
          if (ui.play === 'free') {
            if (now >= beatAt + BEAT) {
              const fx = [];
              for (const ev of pending) fx.push(...applyEvent(st, ev));
              pending = [];
              beat(st);
              st.fx.push(...fx);
              beatAt = now;
            }
            return;
          }
          if (beatsLeft > 0 && now >= beatAt) {
            if (now >= beatAt + (st.beat === snaps[ui.step].beat ? 0 : BEAT)) {
              beat(st);
              beatsLeft -= 1;
              beatAt = now;
            }
          } else if (beatsLeft === 0 && !holdUntil && now >= beatAt + BEAT) {
            holdUntil = now + 1400;
          } else if (holdUntil && now >= holdUntil && ui.auto) {
            if (ui.step < MAPS[ui.map].story.length - 1) startStep(ui.step + 1);
            else {
              ui.auto = false;
              $('all').setAttribute('aria-pressed', 'false');
            }
          }
        }
        function fracNow(now) {
          if (ui.play === 'story' && beatsLeft === 0 && now >= beatAt + BEAT) return 1;
          if (now < beatAt) return 0;
          return clamp((now - beatAt) / BEAT, 0, 1);
        }

        function buildPanels() {
          const stage = $('stage');
          stage.replaceChildren();
          panels = [];
          const two = ui.cmp || ui.mode === 'both';
          stage.classList.toggle('two', two);
          stage.classList.toggle('one', !two);
          const n = two ? 2 : 1;
          for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.className = 'panel';
            el.innerHTML =
              '<div class="ph"><button class="pv" aria-label="Previous variant">‹</button><button class="nx" aria-label="Next variant">›</button>' +
              '<span class="nm"></span><span class="tag"></span><span class="md"></span></div><canvas role="img"></canvas>';
            stage.appendChild(el);
            const cv = el.querySelector('canvas');
            const P = new Painter(cv);
            const panel = { el, P, i };
            panels.push(panel);
            el.querySelector('.pv').onclick = () => {
              setActive(i);
              cycle(-1);
            };
            el.querySelector('.nx').onclick = () => {
              setActive(i);
              cycle(1);
            };
            el.addEventListener('pointerdown', () => setActive(i));
            cv.addEventListener('pointermove', (ev) => {
              const p = P.hit(ev);
              P.hover = nearest(p, 26);
              cv.style.cursor = ui.play === 'free' && (P.hover || nearestRoad(p)) ? 'pointer' : 'default';
            });
            cv.addEventListener('pointerleave', () => (P.hover = null));
            cv.addEventListener('click', (ev) => freeClick(P.hit(ev)));
          }
          updatePanels();
        }
        function panelVariant(i) {
          if (ui.mode === 'both') return ui.v;
          return i === 0 ? ui.v : ui.c;
        }
        function panelMode(i) {
          if (ui.mode === 'both') return i === 0 ? 'supply' : 'battle';
          return ui.mode;
        }
        function updatePanels() {
          panels.forEach((p) => {
            const V = VARS[panelVariant(p.i)];
            p.el.querySelector('.nm').textContent = `${panelVariant(p.i)}. ${V.n}`;
            p.el.querySelector('.tag').textContent = V.tag;
            p.el.querySelector('.md').textContent = panelMode(p.i) === 'battle' ? 'battle' : 'supply';
            p.el.querySelector('canvas').setAttribute('aria-label', `Map, variant ${panelVariant(p.i)} ${V.n}, ${panelMode(p.i)} mode`);
            p.el.classList.toggle('active', panels.length > 1 && ui.mode !== 'both' && p.i === ui.active);
            p.el.querySelector('.pv').disabled = ui.mode === 'both' && p.i === 1;
            p.el.querySelector('.nx').disabled = ui.mode === 'both' && p.i === 1;
          });
          [...$('chips').children].forEach((b, i) => {
            b.setAttribute('aria-pressed', String(i === (ui.active === 1 && ui.cmp && ui.mode !== 'both' ? ui.c : ui.v)));
            b.classList.toggle('second', ui.cmp && ui.mode !== 'both' && i === (ui.active === 1 ? ui.v : ui.c));
          });
          const vs = [...new Set(panels.map((p) => panelVariant(p.i)))];
          $('cost').innerHTML = vs.map((v) => `<b>${v}. PixiJS:</b> ${VARS[v].cost}`).join('<br>');
          document.body.classList.toggle('gray', ui.gray);
          writeHash();
        }
        function setActive(i) {
          if (ui.active === i) return;
          ui.active = i;
          updatePanels();
        }
        function cycle(dir) {
          const k = ui.cmp && ui.mode !== 'both' && ui.active === 1 ? 'c' : 'v';
          ui[k] = (ui[k] + dir + VARS.length) % VARS.length;
          updatePanels();
        }
        function nearest(p, rad) {
          if (!st) return null;
          let best = null;
          let bd = rad;
          for (const id of st.order) {
            const N = st.nodes[id];
            const d = Math.hypot(N.x - p.x, N.y - p.y);
            if (d < bd) {
              bd = d;
              best = id;
            }
          }
          return best;
        }
        function nearestRoad(p) {
          let best = null;
          let bd = 10;
          for (const e of st.edges) {
            const A = st.nodes[e.a];
            const B = st.nodes[e.b];
            const dx = B.x - A.x;
            const dy = B.y - A.y;
            const t = clamp(((p.x - A.x) * dx + (p.y - A.y) * dy) / (dx * dx + dy * dy), 0.15, 0.85);
            const d = Math.hypot(A.x + dx * t - p.x, A.y + dy * t - p.y);
            if (d < bd) {
              bd = d;
              best = e;
            }
          }
          return best;
        }
        function freeClick(p) {
          if (ui.play !== 'free' || !st) return;
          const n = nearest(p, 24);
          if (ui.tool === 'cut') {
            const e = n ? null : nearestRoad(p);
            if (e) pending.push([e.cut ? 'mend' : 'cut', e.id]);
            return;
          }
          if (!n) return;
          const N = st.nodes[n];
          if (ui.tool === 'spend' && N.own === 'me' && N.army) pending.push(['shots', n, 3]);
          if (ui.tool === 'capture' && N.own !== 'me') {
            const adj = nb(st, n).filter(([m]) => mine(st, m));
            if (!adj.length) return;
            const withArmy = adj.find(([m]) => st.nodes[m].army);
            pending.push(['capture', n, withArmy ? withArmy[0] : null]);
          }
        }

        function renderSteps() {
          const box = $('steps');
          box.replaceChildren();
          MAPS[ui.map].story.forEach((s, i) => {
            const b = document.createElement('button');
            b.textContent = `${i + 1} ${STEP_LABELS[i]}`;
            b.setAttribute('aria-pressed', String(i === ui.step));
            b.onclick = () => {
              ui.auto = false;
              $('all').setAttribute('aria-pressed', 'false');
              startStep(i);
            };
            box.appendChild(b);
          });
          $('prev').disabled = ui.step === 0;
          $('next').disabled = ui.step === MAPS[ui.map].story.length - 1;
        }
        function setSeg(id, attr, val) {
          [...$(id).children].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === val)));
        }
        function setMap(m) {
          ui.map = m;
          setSeg('mapSeg', 'map', m);
          buildSnaps();
          if (ui.play === 'story') startStep(Math.min(ui.step, MAPS[m].story.length - 1));
          else startFree();
        }
        function setPlay(p) {
          ui.play = p;
          setSeg('playSeg', 'p', p);
          $('storyCtl').classList.toggle('hidden', p !== 'story');
          $('freeCtl').classList.toggle('hidden', p !== 'free');
          ui.auto = false;
          $('all').setAttribute('aria-pressed', 'false');
          if (p === 'story') startStep(ui.step);
          else startFree();
        }
        function writeHash() {
          const h = new URLSearchParams({
            v: ui.v,
            c: ui.c,
            cmp: +ui.cmp,
            mode: ui.mode,
            map: ui.map,
            step: ui.step,
            free: +(ui.play === 'free'),
            gray: +ui.gray,
            rm: +ui.rm,
          });
          history.replaceState(null, '', '#' + h.toString());
        }
        function readHash() {
          const h = new URLSearchParams(location.hash.slice(1));
          const num = (k, d, max) => {
            const v = parseInt(h.get(k), 10);
            return Number.isFinite(v) ? clamp(v, 0, max) : d;
          };
          ui.v = num('v', ui.v, VARS.length - 1);
          ui.c = num('c', ui.c, VARS.length - 1);
          ui.cmp = h.get('cmp') === '1';
          if (['supply', 'battle', 'both'].includes(h.get('mode'))) ui.mode = h.get('mode');
          if (MAPS[h.get('map')]) ui.map = h.get('map');
          ui.step = num('step', 0, 5);
          if (h.get('free') === '1') ui.play = 'free';
          ui.gray = h.get('gray') === '1';
          if (h.has('rm')) ui.rm = h.get('rm') === '1';
        }

        function init() {
          readHash();
          const chips = $('chips');
          VARS.forEach((V, i) => {
            const b = document.createElement('button');
            b.innerHTML = `<b>${i}</b>`;
            b.appendChild(document.createTextNode(V.n.split(':')[0]));
            b.title = V.n;
            b.onclick = () => {
              if (ui.cmp && ui.mode !== 'both' && ui.active === 1) ui.c = i;
              else ui.v = i;
              updatePanels();
            };
            chips.appendChild(b);
          });
          const mapSeg = $('mapSeg');
          for (const id in MAPS) {
            const b = document.createElement('button');
            b.dataset.map = id;
            b.textContent = MAPS[id].label;
            b.onclick = () => setMap(id);
            mapSeg.appendChild(b);
          }
          [...$('modeSeg').children].forEach(
            (b) =>
              (b.onclick = () => {
                ui.mode = b.dataset.m;
                setSeg('modeSeg', 'm', ui.mode);
                buildPanels();
              }),
          );
          [...$('playSeg').children].forEach((b) => (b.onclick = () => setPlay(b.dataset.p)));
          [...$('toolSeg').children].forEach(
            (b) =>
              (b.onclick = () => {
                ui.tool = b.dataset.t;
                setSeg('toolSeg', 't', ui.tool);
                $('freeHint').textContent =
                  ui.tool === 'spend' ? 'click a city with your army' : ui.tool === 'capture' ? 'click a red city next to yours' : 'click a road';
              }),
          );
          setSeg('toolSeg', 't', ui.tool);
          $('freeHint').textContent = 'click a city with your army';
          $('cmp').checked = ui.cmp;
          $('cmp').onchange = (e) => {
            ui.cmp = e.target.checked;
            if (ui.cmp && ui.mode === 'both') {
              ui.mode = 'supply';
              setSeg('modeSeg', 'm', ui.mode);
            }
            ui.active = 0;
            buildPanels();
          };
          $('gray').checked = ui.gray;
          $('gray').onchange = (e) => {
            ui.gray = e.target.checked;
            updatePanels();
          };
          $('rm').checked = ui.rm;
          $('rm').onchange = (e) => {
            ui.rm = e.target.checked;
            writeHash();
          };
          $('prev').onclick = () => startStep(ui.step - 1);
          $('next').onclick = () => startStep(ui.step + 1);
          $('replay').onclick = () => startStep(ui.step);
          $('all').onclick = () => {
            ui.auto = !ui.auto;
            $('all').setAttribute('aria-pressed', String(ui.auto));
            if (ui.auto) startStep(ui.step === MAPS[ui.map].story.length - 1 ? 0 : ui.step);
          };
          $('lvlBack').onclick = () => pending.push(['shift', 1]);
          $('lvlFwd').onclick = () => pending.push(['shift', -1]);
          $('reset').onclick = () => startFree();
          document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') cycle(1);
            else if (e.key === 'ArrowLeft') cycle(-1);
            else if (e.key === ' ' && ui.play === 'story') {
              e.preventDefault();
              startStep(ui.step + 1);
            }
          });
          setSeg('modeSeg', 'm', ui.mode);
          setSeg('mapSeg', 'map', ui.map);
          setSeg('playSeg', 'p', ui.play);
          $('storyCtl').classList.toggle('hidden', ui.play !== 'story');
          $('freeCtl').classList.toggle('hidden', ui.play !== 'free');
          buildSnaps();
          buildPanels();
          if (ui.play === 'story') startStep(ui.step);
          else startFree();
          const loop = (now) => {
            tick(now);
            const fr = fracNow(now);
            for (const p of panels) p.P.draw(st, VARS[panelVariant(p.i)], panelMode(p.i), now / 1000, fr, ui.rm);
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        }
        window.__sfv = {
          get state() {
            return st;
          },
          VARS,
          MAPS,
          ui,
          initState,
          computeField,
          beat,
          applyEvent,
          // jump to the end of the current step (for frame captures)
          settle(n = 99) {
            while (beatsLeft > 0 && n-- > 0) {
              beat(st);
              beatsLeft -= 1;
            }
            beatAt = performance.now() - BEAT * 0.5;
          },
          freeze(frac) {
            beatAt = performance.now() - BEAT * frac;
          },
        };
        init();
      })();
    </script>
  </body>
</html>
