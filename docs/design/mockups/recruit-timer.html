<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiting and the clock, round 1</title>
<!-- Recruiting and the match clock, round 1 (broad, #1005; owner feedback of 2026-11-12). Two elements, one large view each:
     RECRUITING: how the recruit queue of an own city reads on the map (DEC-25, DEC-48 item H). Everything is drawn from what
     the view already carries: NodeView.recruit_queue, recruit_progress, recruit_waiting, rally_point and has_barracks, plus
     ruleset_public.recruit (mvp-7: unit_ticks 30 = 3 s a unit, queue_max 3, rally_cost 0.5 CP). The loop is real time: a unit
     every 3 s; a made unit appears discharged and merges with the city's group, or walks to the rally point. "R0 Today" is
     a port of render/cityView.ts drawRecruits (55k Pips beyond the barracks, #954) and groupOrderView.ts (the E3 muster).
     THE CLOCK: the timer of the top bar (hud/TopBar.svelte): 15 minutes (match_ticks 9000), a VP award every 30 s, the last
     minute (LAST_MINUTE_S), the pause of a private match (DEC-05, PausedMsg.ends_in_s). "T0 Today" is a port of the bar.
     The map pieces are the client's (render/style.ts, units/helmet.ts, theme/cutIcons.ts, theme/cpMark.ts), shared with
     build-animation.html. Self-contained: EB Garamond and Cinzel (SIL OFL) and the ground crop come from
     assets/in-match-cp-vp/ and assets/city-buildings/. State in the address (#el=clock&c=T4&cs=last ...). -->
<style>
@font-face{font-family:'EB Garamond';src:url(assets/in-match-cp-vp/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:'Cinzel';src:url(assets/in-match-cp-vp/fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
:root{--stone:#16130f;--panel:#1d1a15;--ink:#ece4d1;--ink-soft:#cfc4ab;--ink-dim:#ada38f;--rule:#7d7363;--line:#3d372d;
  --plate:#0e0c09;--casing:#060504;--warn:#e6ab42;--vp:#cfab62;--own:#86a6ea;--foe:#e5785e;--map-ink:#ccc0a6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--stone);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--stone);padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font:600 20px/1 'EB Garamond',Georgia,serif;letter-spacing:.04em;margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:9px}
.bar:first-child{margin-top:0}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lab{font:600 12px/1 'EB Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-right:3px}
button.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 10px;font:500 13px/1 system-ui,sans-serif;cursor:pointer;border-radius:0}
button.chip:hover{border-color:var(--rule);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#16130f;border-color:var(--ink);font-weight:650}
button.chip .k{opacity:.7;margin-right:5px;font-weight:700}
button.chip.var{padding:7px 10px;font-size:14px}
button.chip.ref{border-style:dashed}
button.chip.el{font:600 15px/1 'EB Garamond',Georgia,serif;letter-spacing:.06em;padding:7px 14px}
button.chip:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#more{margin-left:auto}
.moreBar{display:none;padding-top:9px;margin-top:9px;border-top:1px solid var(--line)}
.moreBar.open{display:flex}
[hidden]{display:none!important}
input[type=range]{accent-color:#ece4d1;width:220px;vertical-align:middle}
main{padding:10px 16px 24px}
#cap{margin:0 0 8px;font:500 16px/1.35 'EB Garamond',Georgia,serif;color:var(--ink-soft);min-height:2.7em}
#cap b{color:var(--ink);font-weight:650;margin-right:8px}
#cap .tag{display:inline-block;margin-left:10px;padding:1px 7px;border:1px solid var(--line);font:600 11px/1.5 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);vertical-align:2px}
#cap .rm{display:block;color:var(--ink-dim);font-size:15px}
.wrap{position:relative;background:#0e0c09;border:1px solid var(--line);overflow:hidden}
canvas{display:block;width:100%}
#view{cursor:pointer}
.gray .wrap{filter:grayscale(1)}

/* ---- The top bar (hud/TopBar.svelte, #860): a dark strip 52 px high under a double rule. ---- */
#tbHost{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.tb{position:absolute;left:0;top:0;width:100%;height:52px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid rgb(236 228 209 / 55%);background:rgb(14 12 9 / 96%);box-shadow:0 3px 0 rgb(14 12 9 / 96%),0 4px 0 rgb(236 228 209 / 22%);
  color:var(--ink);font:18px/1 'EB Garamond',Georgia,serif;font-variant-numeric:lining-nums tabular-nums}
.tb svg{display:block;flex:none;overflow:visible}
.tb-l,.tb-m,.tb-r{display:flex;align-items:center;gap:10px;min-width:0}
.tb-r{justify-content:flex-end;gap:8px}
.tb .n23{font-size:23px}.tb .n27{font-size:27px}.tb .n20{font-size:20px}
.tb .gain{font-size:15px;align-self:flex-start;margin-top:8px}
.tb .own{color:var(--own)}.tb .foe{color:var(--foe)}
.tb .ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgb(236 228 209 / 55%);box-shadow:inset 0 0 0 2px rgb(14 12 9),inset 0 0 0 3px rgb(236 228 209 / 22%);color:var(--ink)}
.tb .chipq{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;border:1px solid rgb(236 228 209 / 40%)}
.tb .key{font:600 10px/1 'Cinzel',serif;letter-spacing:.08em;border:1px solid rgb(236 228 209 / 45%);padding:3px 4px}
/* The clock slot: every variant draws into it. */
.clk{position:relative;display:flex;align-items:center;gap:7px;height:52px;margin-right:8px}
.num{font:400 27px/1 'EB Garamond',Georgia,serif;font-variant-numeric:lining-nums tabular-nums;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:baseline}
.num.last{color:var(--warn);font-size:31px;font-weight:700}
.num .roll{position:relative;display:inline-block;overflow:hidden;height:1.08em;vertical-align:top}
.num .roll>span{display:block}
.num .roll>span+span{position:absolute;left:0;top:0}
.num .col{display:inline-block;padding:0 1px}
.small{font-size:19px}
.hang{position:absolute;right:0;top:56px;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 10px;background:rgb(14 12 9 / 95%);
  border:1px solid rgb(236 228 209 / 55%);box-shadow:inset 0 0 0 2px rgb(14 12 9),inset 0 0 0 3px rgb(236 228 209 / 20%),0 2px 0 rgb(6 5 4 / 80%)}
.hang::before{content:"";position:absolute;right:42px;top:-5px;width:1px;height:4px;background:rgb(236 228 209 / 55%)}
.slab{position:relative;display:flex;align-items:center;justify-content:center;height:40px;padding:0 14px 0 14px;
  background:linear-gradient(180deg,#221e18 0%,#16130f 55%,#100e0b 100%);box-shadow:inset 0 1px 0 rgb(236 228 209 / 18%),inset 0 -1px 0 rgb(0 0 0 / 70%),0 0 0 1px #060504,0 0 0 2px rgb(236 228 209 / 16%)}
.slab .num{color:#d9cfb8;text-shadow:0 -1px 0 #000,0 1px 0 rgb(236 228 209 / 22%)}
.slab .num.last{color:var(--warn);text-shadow:0 -1px 0 #000,0 1px 0 rgb(255 220 150 / 25%)}
.slab.paused::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgb(236 228 209 / 9%) 0 1px,transparent 1px 4px)}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>Recruiting and the clock · round 1</h1>
    <div class="group" role="group" aria-label="Element"><button class="chip el" data-el="recruit">Recruiting</button><button class="chip el" data-el="clock">The clock</button></div>
  </div>
  <div class="bar"><div class="group" id="vars" role="group" aria-label="Variant"></div></div>
  <div class="bar" id="rBar">
    <div class="group" role="group" aria-label="City"><span class="lab">City</span><button class="chip" data-city="small">Small</button><button class="chip" data-city="capital">Capital</button></div>
    <div class="group" role="group" aria-label="Queue"><span class="lab">Queue</span><button class="chip" data-n="1">1</button><button class="chip" data-n="2">2</button><button class="chip" data-n="3">3</button></div>
    <div class="group" role="group" aria-label="Rally point"><span class="lab">Rally point</span><button class="chip" data-rally="0">Off</button><button class="chip" data-rally="1">On</button></div>
    <div class="group" role="group" aria-label="Zoom"><span class="lab">Zoom</span><button class="chip" data-z="near">Near</button><button class="chip" data-z="normal">Normal</button><button class="chip" data-z="far">Far</button></div>
    <button class="chip" id="replay">Replay</button>
    <button class="chip" id="more" aria-expanded="false">More</button>
  </div>
  <div class="bar" id="cBar">
    <div class="group" role="group" aria-label="State"><span class="lab">State</span><button class="chip" data-cs="normal">Normal</button><button class="chip" data-cs="last">Last minute</button><button class="chip" data-cs="paused">Paused</button></div>
    <div class="group" role="group" aria-label="View"><span class="lab">View</span><button class="chip" data-cz="0">Bar</button><button class="chip" data-cz="1">Close-up</button></div>
    <button class="chip" id="more2" aria-expanded="false">More</button>
  </div>
  <div class="bar moreBar" id="moreBar">
    <div class="group" id="rMore"><button class="chip" id="sel">City selected (free slots)</button><button class="chip" id="room">No room</button></div>
    <div class="group"><button class="chip" id="still">Reduced motion</button><button class="chip" id="gray">Grey</button></div>
    <div class="group"><button class="chip" id="play">Pause</button><input id="scrub" aria-label="Time in the loop" type="range" min="0" max="10000" step="10"></div>
  </div>
</header>
<main>
  <p id="cap"></p>
  <div class="wrap" id="rWrap"><canvas id="view" role="img"></canvas></div>
  <div class="wrap" id="cWrap"><canvas id="bg" aria-hidden="true"></canvas><div id="tbHost"><div class="tb" id="tb" role="img"></div></div></div>
</main>
<script>
'use strict';
// =============================================================================================
// The client's numbers (render/style.ts, theme/tokens.ts, units/helmet.ts, theme/cutIcons.ts),
// shared with city-buildings-r2.html.
// =============================================================================================
const C = {
  casing: '#060504', plate: '#0e0c09', cut: '#050403', ink: '#ccc0a6', ivory: '#ece4d1',
  vp: '#cfab62', up: '#8cc79a', down: '#ec6654', road: '#e6edf3', clash: '#e6ab42',
};
// The city menu's icons, exactly (cutIcons.ts): the outline and the ruled solid, a 26-unit box centred on 0.
const CUT_D = {
  barracks: 'M-9 9 V-1 L0 -8.5 L9 -1 V9 Z M-3 9 V3 H3 V9 M0 -8.5 V-12.5 L4.5 -11 L0 -9.5',
  factory: 'M-10 9 V-1.5 L-5 -5 V-1.5 L0 -5 V-1.5 L5 -5 V-10 H8.5 V9 Z M-6.5 4 H-3 M0 4 H3.5',
};
const CUT_SOLID_D = { barracks: 'M-9 9 V-1 L0 -8.5 L9 -1 V9 Z', factory: 'M-10 9 V-1.5 L-5 -5 V-1.5 L0 -5 V-1.5 L5 -5 V-10 H8.5 V9 Z' };
const CUT = { barracks: new Path2D(CUT_D.barracks), factory: new Path2D(CUT_D.factory) };
const CUT_SOLID = { barracks: new Path2D(CUT_SOLID_D.barracks), factory: new Path2D(CUT_SOLID_D.factory) };
const CUT_BOX = { barracks: [-9, -12.5, 9, 9], factory: [-10, -10, 8.5, 9] };
const CUT_STYLE = { box: 26, rule: 2.6, ruleW: 1.15, casing: 4.2, casingA: 0.9, ink: 2.1 };
const ICON_HALF = 0.44; // half the drawn extent of an icon (casing included), a share of its box

const HELMET_PATHS = {
  own: { dome: 'M9 70 C5 36 22 12 49 12 C70 12 85 26 88 42 C89 47 91 50 95 53 C82 54 72 56 66 60 C60 64 56 70 46 70 Z', band: 'M7 77 C20 79 34 80 46 79 C56 78 62 71 67 67 C72 63 82 61 96 60', strap: 'M46 80 L54 96' },
  enemy: { dome: 'M8 54 C8 30 28 13 52 13 C74 13 90 30 92 46 L98 54 Q99 58 95 58 L74 58 C65 58 60 64 57 73 C56 77 52 78 46 77 C32 74 18 69 12 64 Q8 61 8 54 Z', band: null, strap: 'M38 75 L58 91 L64 68' },
};
const HELMET_SCALE = 1.34, HELMET_INSIDE = 0.92, UNIT_SIDES = [24, 30, 36, 42];
const HE = { casing: 6, inside: 1.6, gear: 0.55, edge: 1.25, hatchW: 0.9, font: 12.5 };
const CITY_E = { cutGrow: 3.2, cutAlpha: 0.85, rimGrow: 1.6, rimW: 1.1, innerInset: 1.2, innerW: 0.8, innerA: 0.6, enemyInsets: [4.4, 6.4], enemyW: 0.9, star: [0.6, 0.27, 1.2] };
const RING = { gap: 7, cut: 6, cutAlpha: 0.8, filled: 3.4, roomW: 0.9, roomOff: 1.6, wash: 0.3, segGap: 0.16 };
const LOZ = { casing: 8.2, fill: 5.8, hollow: 4.7, line: 0.9, lineA: 0.92, pitch: 8.8, groupGap: 3.5, drop: 8.5 };
const VPL = { side: 18.5, outer: 17.2, inner: 12.4, w: 1.1, font: 14.5, lift: 4.5 };
const BADGE = { size: 11, stroke: 0.3, outline: 2.6, minPx: 8 };
const TICKS = { gap: 2, arm: 6.2, casing: 4.4, ink: 1.7 }; // CORNER_TICKS after #952

// =============================================================================================
// Helmet geometry (a port of units/helmet.ts).
// =============================================================================================
function samplePath(d, steps = 10) {
  const t = d.match(/[MLCQZ]|-?\d*\.?\d+/g) || [];
  const pts = []; let i = 0, cmd = '', at = { x: 0, y: 0 };
  const num = () => Number(t[i++]);
  while (i < t.length) {
    const tok = t[i];
    if (/[MLCQZ]/.test(tok)) { cmd = tok; i++; if (cmd === 'Z') continue; }
    if (cmd === 'M' || cmd === 'L') { at = { x: num(), y: num() }; pts.push(at); }
    else if (cmd === 'C') { const c1 = { x: num(), y: num() }, c2 = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*u*at.x + 3*u*u*s*c1.x + 3*u*s*s*c2.x + s*s*s*e.x, y: u*u*u*at.y + 3*u*u*s*c1.y + 3*u*s*s*c2.y + s*s*s*e.y }); } at = e; }
    else if (cmd === 'Q') { const c = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*at.x + 2*u*s*c.x + s*s*e.x, y: u*u*at.y + 2*u*s*c.y + s*s*e.y }); } at = e; }
    else i++;
  }
  return pts;
}
function boundsOf(ps) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const p of ps) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); } return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 }; }
function centroid(ps) { let a = 0, cx = 0, cy = 0; ps.forEach((p, i) => { const q = ps[(i + 1) % ps.length]; const cr = p.x*q.y - q.x*p.y; a += cr; cx += (p.x + q.x)*cr; cy += (p.y + q.y)*cr; }); return { x: cx / (3*a), y: cy / (3*a) }; }
const RAW = {};
for (const k of ['own', 'enemy']) { const P = HELMET_PATHS[k]; RAW[k] = { dome: samplePath(P.dome), band: P.band ? samplePath(P.band) : null, strap: samplePath(P.strap) }; const b = boundsOf([...RAW[k].dome, ...(RAW[k].band || []), ...RAW[k].strap]); RAW[k].c = { x: b.x + b.width / 2, y: b.y + b.height / 2 }; }
const HELMETS = new Map();
function helmet(kind, width) {
  const key = kind + ':' + width; if (HELMETS.has(key)) return HELMETS.get(key);
  const R = RAW[kind], s = width / 100, place = (p) => ({ x: (p.x - R.c.x) * s, y: (p.y - R.c.y) * s });
  const dome = R.dome.map(place), band = R.band ? R.band.map(place) : null, strap = R.strap.map(place);
  const db = boundsOf(dome), mid = centroid(dome);
  const h = { kind, width, dome, band, strap, bounds: boundsOf([...dome, ...(band || []), ...strap]), domeTop: db.y, domeBottom: db.y + db.height, domeBounds: db, middle: { x: mid.x, y: mid.y + width * 0.02 } };
  HELMETS.set(key, h); return h;
}
function helmetLines(width) { const s = width / 100; return { strap: Math.max(6.4*s, 2.1), band: Math.max(5.6*s, 2.2), casing: 6.4 }; }
function helmetExtent(h) { const L = helmetLines(h.width), pad = Math.max(L.casing, L.strap + L.casing) / 2; return { top: h.bounds.y - pad, bottom: h.bounds.y + h.bounds.height + pad, left: h.bounds.x - pad, right: h.bounds.x + h.bounds.width + pad }; }
function helmetWidth(side, inside) { return Math.round(side * HELMET_SCALE * (inside ? HELMET_INSIDE : 1) * 100) / 100; }
function helmetFit(kind, width, reach) {
  let w = width;
  for (let step = 0; step < 6 && w > 4; step++) { const e = helmetExtent(helmet(kind, w)), span = Math.max(e.right, -e.left, e.bottom, -e.top); if (span <= reach) break; w = Math.min(w - 0.25, Math.floor(((w * reach) / span) * 4) / 4); }
  return w;
}
function unitSide(units) { return units <= 3 ? UNIT_SIDES[0] : units <= 7 ? UNIT_SIDES[1] : units <= 15 ? UNIT_SIDES[2] : UNIT_SIDES[3]; }

// =============================================================================================
// Drawing helpers (world units; the canvas transform carries the zoom). A hairline never falls
// under 1.3 device px (#865).
// =============================================================================================
let GA = 1, PXW = 1, LS = 1;
const hair = (w) => Math.max(w, 1.3 / (PXW * LS));
function poly(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); }
function polyA(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (closed) ctx.closePath(); }
function stroke(ctx, w, color, alpha = 1, cap = 'round', join = 'round') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(); ctx.globalAlpha = GA; }
function fill(ctx, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(); ctx.globalAlpha = GA; }
function strokeP(ctx, p, w, color, alpha = 1, cap = 'square', join = 'miter') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(p); ctx.globalAlpha = GA; }
function fillP(ctx, p, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(p); ctx.globalAlpha = GA; }
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI*2); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hatchLines(ctx, b, angle, pitch) {
  const cx = b.x + b.width/2, cy = b.y + b.height/2, R = Math.hypot(b.width, b.height)/2 + pitch;
  const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
  ctx.beginPath(); for (let d = -R; d <= R; d += pitch) { ctx.moveTo(cx + nx*d - ux*R, cy + ny*d - uy*R); ctx.lineTo(cx + nx*d + ux*R, cy + ny*d + uy*R); }
}
const polar = (a, d) => ({ x: d*Math.cos(a), y: d*Math.sin(a) });
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const ease = { engrave: (t) => 0.5 - 0.5*Math.cos(Math.PI*clamp01(t)), settle: (t) => 1 - Math.pow(1 - clamp01(t), 3), travel: (t) => { t = clamp01(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; } };
function lozPath(ctx, x, y, side) { const h = side*Math.SQRT2/2; ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + h, y); ctx.lineTo(x, y + h); ctx.lineTo(x - h, y); ctx.closePath(); }
/** One charge (57u): the casing, then the colour (in stock, paid) or hollow (room, owed). */
function drawLozenge(ctx, x, y, on, color, k = 1, alpha = 1) {
  lozPath(ctx, x, y, LOZ.casing*k); fill(ctx, C.casing, alpha);
  if (on) { lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, color, alpha); return; }
  lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, C.plate, alpha);
  lozPath(ctx, x, y, LOZ.hollow*k); stroke(ctx, hair(LOZ.line), C.ink, LOZ.lineA*alpha, 'butt', 'miter');
}
function frame(ctx, x, y, rot, s, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s); const ls = LS; LS = ls*s; fn(); LS = ls; ctx.restore(); }

function drawBody(ctx, G, owner, color, occupied, star) {
  const r = G.r;
  circle(ctx, 0, 0, r + CITY_E.cutGrow); fill(ctx, C.cut, CITY_E.cutAlpha);
  circle(ctx, 0, 0, r); fill(ctx, occupied ? C.plate : color);
  circle(ctx, 0, 0, r + CITY_E.rimGrow); stroke(ctx, CITY_E.rimW, C.ink);
  circle(ctx, 0, 0, r - CITY_E.innerInset); stroke(ctx, CITY_E.innerW, C.cut, CITY_E.innerA);

    const r = clk.getBoundingClientRect(), host = tbHost.getBoundingClientRect();
    const xc = (CL.xc === undefined || !CL.zoomed) ? r.left - host.left + r.width / 2 : CL.xc; CL.xc = xc; CL.zoomed = true;
    tbHost.style.transformOrigin = `${xc}px 26px`; tbHost.style.transform = `translate(${f2(CL.W * 0.5 - xc)}px, ${f2(CL.H * 0.3 - 26)}px) scale(2.6)`;
  } else { tbHost.style.transform = ''; CL.zoomed = false; CL.xc = undefined; }
}

// =============================================================================================
// Controls and state (also in the address).
// =============================================================================================
const CLOCK_LOOPS = { normal: 12000, last: 19500, paused: 12000 };
const loopLen = () => (S.el === 'recruit' ? story().loop : CLOCK_LOOPS[S.cs]);
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (['recruit', 'clock'].includes(q.get('el'))) S.el = q.get('el');
  if (RV_BY[q.get('v')]) S.rv = q.get('v');
  if (CV_BY[q.get('c')]) S.cv = q.get('c');
  if (['small', 'capital'].includes(q.get('city'))) S.city = q.get('city');
  if (['1', '2', '3'].includes(q.get('n'))) S.n = Number(q.get('n'));
  if (ZOOMS[q.get('z')]) S.zoom = q.get('z');
  if (['normal', 'last', 'paused'].includes(q.get('cs'))) S.cs = q.get('cs');
  for (const [k, key] of [['rally', 'rally'], ['sel', 'sel'], ['room', 'room'], ['cz', 'cz'], ['rm', 'still'], ['gr', 'gray'], ['more', 'more']]) if (q.has(k)) S[key] = q.get(k) === '1';
  const tm = Number(q.get('tm')); if (q.has('tm') && tm >= 0) { S.time = tm; S.playing = false; }
}
function writeHash() {
  const b = (x) => (x ? 1 : 0);
  const h = `el=${S.el}&v=${S.rv}&c=${S.cv}&city=${S.city}&n=${S.n}&rally=${b(S.rally)}&z=${S.zoom}&sel=${b(S.sel)}&room=${b(S.room)}&cs=${S.cs}&cz=${b(S.cz)}&rm=${b(S.still)}&gr=${b(S.gray)}&more=${b(S.more)}` + (S.playing ? '' : `&tm=${Math.round(S.time)}`);
  history.replaceState(null, '', '#' + h);
}
let playFrom = 0, playAt = 0;
function replay() { S.time = 0; S.playing = true; playFrom = 0; playAt = performance.now(); CL.zoomed = false; refresh(); }
const varsEl = document.getElementById('vars');
function chip(parent, key, label, onClick, cls) {
  const b = document.createElement('button'); b.className = 'chip' + (cls ? ' ' + cls : ''); b.dataset.v = key;
  const k = document.createElement('span'); k.className = 'k'; k.textContent = key; b.append(k, document.createTextNode(label));
  b.addEventListener('click', onClick); parent.append(b); return b;
}
let varChips = [];
function buildVarChips() {
  varsEl.textContent = '';
  const list = S.el === 'recruit' ? RVARS : CVARS;
  varChips = list.map((v) => chip(varsEl, v.id, v.name, () => { if (S.el === 'recruit') S.rv = v.id; else S.cv = v.id; replay(); }, 'var' + (v.ref ? ' ref' : '')));
}
const on = (sel, fn) => document.querySelectorAll(sel).forEach((b) => b.addEventListener('click', () => fn(b)));
on('[data-el]', (b) => { S.el = b.dataset.el; buildVarChips(); layoutView(); replay(); });
on('[data-city]', (b) => { S.city = b.dataset.city; replay(); });
on('[data-n]', (b) => { S.n = Number(b.dataset.n); replay(); });
on('[data-rally]', (b) => { S.rally = b.dataset.rally === '1'; replay(); });
on('[data-z]', (b) => { S.zoom = b.dataset.z; refresh(); });
on('[data-cs]', (b) => { S.cs = b.dataset.cs; replay(); });
on('[data-cz]', (b) => { S.cz = b.dataset.cz === '1'; CL.zoomed = false; refresh(); });
for (const [id, key] of [['sel', 'sel'], ['room', 'room'], ['still', 'still'], ['gray', 'gray']]) document.getElementById(id).addEventListener('click', () => { S[key] = !S[key]; if (key === 'room') replay(); else refresh(); });
const moreBtns = [document.getElementById('more'), document.getElementById('more2')], playBtn = document.getElementById('play'), scrub = document.getElementById('scrub');
moreBtns.forEach((m) => m.addEventListener('click', () => { S.more = !S.more; refresh(); }));
document.getElementById('replay').addEventListener('click', replay);
view.addEventListener('click', replay);
playBtn.addEventListener('click', () => { if (S.playing) S.playing = false; else { S.playing = true; playFrom = S.time; playAt = performance.now(); } refresh(); });
scrub.addEventListener('input', () => { S.playing = false; S.time = Number(scrub.value); refresh(); });
function refresh() {
  const press = (els, f) => els.forEach((e) => e.setAttribute('aria-pressed', String(f(e))));
  const rec = S.el === 'recruit';
  press([...document.querySelectorAll('[data-el]')], (e) => e.dataset.el === S.el);
  press(varChips, (e) => e.dataset.v === (rec ? S.rv : S.cv));
  press([...document.querySelectorAll('[data-city]')], (e) => e.dataset.city === S.city);
  press([...document.querySelectorAll('[data-n]')], (e) => Number(e.dataset.n) === S.n);
  press([...document.querySelectorAll('[data-rally]')], (e) => (e.dataset.rally === '1') === S.rally);
  press([...document.querySelectorAll('[data-z]')], (e) => e.dataset.z === S.zoom);
  press([...document.querySelectorAll('[data-cs]')], (e) => e.dataset.cs === S.cs);
  press([...document.querySelectorAll('[data-cz]')], (e) => (e.dataset.cz === '1') === S.cz);
  for (const [id, key] of [['sel', 'sel'], ['room', 'room'], ['still', 'still'], ['gray', 'gray']]) press([document.getElementById(id)], () => S[key]);
  document.getElementById('rBar').hidden = !rec; document.getElementById('cBar').hidden = rec; document.getElementById('rMore').hidden = !rec;
  rWrap.hidden = !rec; cWrap.hidden = rec;
  document.getElementById('moreBar').classList.toggle('open', S.more); moreBtns.forEach((m) => m.setAttribute('aria-expanded', String(S.more)));
  playBtn.textContent = S.playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(!S.playing));
  scrub.max = loopLen(); scrub.value = S.time;
  document.body.classList.toggle('gray', S.gray);
  const v = rec ? RV_BY[S.rv] : CV_BY[S.cv], cap = document.getElementById('cap'); cap.textContent = '';
  const b = document.createElement('b'); b.textContent = `${v.id} ${v.name}`;
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = v.ref ? 'today' : 'client only · no protocol or sim change';
  cap.append(b, document.createTextNode(v.line), tag);
  if (S.still) { const r = document.createElement('span'); r.className = 'rm'; r.textContent = 'Reduced motion: ' + v.rm; cap.append(r); }
  view.setAttribute('aria-label', `${v.id} ${v.name}: ${S.city === 'small' ? 'a small city' : 'the capital'} recruits ${S.room ? 'with no room' : S.n + (S.n > 1 ? ' units' : ' unit')}${S.rally ? ' to a rally point' : ''}, ${S.zoom} zoom. Click to replay.`);
  writeHash();
}
function tick(now) {
  if (S.playing) { S.time = playFrom + (now - playAt); const L = loopLen(); if (S.time >= L) { S.time = 0; playFrom = 0; playAt = now; } scrub.value = S.time; }
  if (S.el === 'recruit') renderRecruit(); else renderClock();
  requestAnimationFrame(tick);
}
window.addEventListener('resize', () => { layoutView(); });
try { if (!location.hash && window.matchMedia('(prefers-reduced-motion: reduce)').matches) S.still = true; } catch (e) { /* no media queries */ }
readHash();
if (S.playing) { playFrom = S.time; playAt = performance.now(); }
buildVarChips(); refresh(); layoutView();
(async () => {
  try { groundTile = mirrorTile(await loadImg('assets/city-buildings/ground-plains.webp')); CL.bgDirty = true; } catch (e) { /* the flat ground stays */ }
  try { await Promise.all([document.fonts.load("600 12px 'EB Garamond'"), document.fonts.load("600 12px 'Cinzel'")]); } catch (e) { /* the serif fallback */ }
  document.body.dataset.ready = '1';
  requestAnimationFrame(tick);
})();
</script>
</body>
