<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City buildings, round 1</title>
<!-- City buildings, round 1 (broad): the owner's feedback of 2026-11-11, the factory and the barracks at a city do not fit
     the style. Topic T: twelve directions for the two buildings (built, paid for, rising, just built, captured, an
     enemy's under DEC-31), T0 the client today. Topic C: where the terrain chevrons of a group standing in a node go,
     C0 the client today (#943). The two combine: every cell is one T with one C.
     Drawn with the client's numbers: TOWER, CROWN, LOZENGE, VP_LOZENGE, RING_ENGRAVED, CITY_ENGRAVED, PROVINCE (A6),
     HELMET_ENGRAVED, BADGE, the corner ticks of #949 (render/style.ts, cornerTicks.ts, pieceLayout.ts, pieceShapes.ts,
     buildPay.ts, badgeLayout.ts, units/helmet.ts), towerScale and the payment motion of #872. The rules on the page:
     barracks 3 charges, factory 4 (rulesets/mvp-7.toml), paid from the warehouse then the group standing there
     (DEC-41, item 7), 10 s after the full payment; the capital has both from the start; a capture hands both over and
     empties the warehouse; an enemy city next to an own node shows only what is built (DEC-31). Self-contained, no
     network: EB Garamond (SIL OFL) and the ground crops are in assets/city-buildings/. State in the address. -->
<style>
@font-face{font-family:'EB Garamond';src:url(assets/city-buildings/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
:root{
  --stone:#16130f;--panel:#1d1a15;--raised:#221e18;--ink:#ece4d1;--ink-soft:#cfc4ab;--ink-dim:#ada38f;
  --rule:#7d7363;--line:#3d372d;--cut:#050403;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--stone);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--stone) 90%,rgba(22,19,15,0));padding:10px 16px 12px}
h1{font:600 20px/1 'EB Garamond',Georgia,serif;letter-spacing:.04em;margin:0 14px 0 0;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px}
.bar:first-child{margin-top:0}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lab{font:600 12px/1 'EB Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-right:4px}
button.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:5px 9px;font:500 13px/1 system-ui,sans-serif;cursor:pointer;position:relative;border-radius:0}
button.chip:hover{border-color:var(--rule);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#16130f;border-color:var(--ink);font-weight:650}
button.chip[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;margin-left:-3px;background:var(--ink);transform:rotate(45deg);border:1px solid var(--stone)}
button.chip .k{opacity:.7;margin-right:5px;font-weight:700}
button.chip:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.chip.sw{width:22px;height:22px;padding:0}
button.chip.sw i{position:absolute;inset:4px;transform:rotate(45deg) scale(.78);border:1px solid #060504}
.sep{width:1px;height:22px;background:var(--line)}
input[type=range]{accent-color:#ece4d1;width:110px;vertical-align:middle}
.val{font:600 13px/1 'EB Garamond',Georgia,serif;color:var(--ink);min-width:2.4em;display:inline-block}
.topic{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.topic .name{font:600 15px/1 'EB Garamond',Georgia,serif;color:var(--ink);margin-right:8px;min-width:120px}
main{padding:4px 16px 24px}
#cells{display:grid;gap:14px;grid-template-columns:1fr}
#cells.n2,#cells.n3,#cells.n4{grid-template-columns:1fr 1fr}
.cell{background:#0e0c09;border:1px solid var(--line);position:relative}
.cell::before{content:"";position:absolute;inset:3px;border:1px solid rgba(236,228,209,.08);pointer-events:none}
.cell h2{margin:0;padding:8px 12px 6px;font:600 15px/1.1 'EB Garamond',Georgia,serif;letter-spacing:.03em;display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line)}
.cell h2 .b{color:var(--ink-dim);font-weight:500}
.cell canvas{display:block;width:100%}
.gray canvas{filter:grayscale(1)}
#time{display:flex;align-items:center;gap:8px}
#time input{width:220px}
@media (prefers-reduced-motion: reduce){button.chip{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>City buildings</h1>

  </div>
  <div class="bar">
    <div class="group"><span class="lab">Node</span>
      <button class="chip" data-node="mixed">Mixed</button><button class="chip" data-node="province">Province</button><button class="chip" data-node="small">Small</button><button class="chip" data-node="medium">Medium</button><button class="chip" data-node="large">Large</button><button class="chip" data-node="capital">Capital</button>
    </div>

      <button class="chip" data-mark="0">None</button><button class="chip" data-mark="1" aria-label="One bonus chevron">+1</button><button class="chip" data-mark="2" aria-label="Two bonus chevrons">+2</button><button class="chip" data-mark="-1" aria-label="One penalty chevron">&minus;1</button><button class="chip" data-mark="-2" aria-label="Two penalty chevrons">&minus;2</button>
    </div>

      <button class="chip" id="sel">Selected</button><button class="chip" id="queue">Queue</button><button class="chip" id="cb">Buildings in C</button>

  <div class="bar">
    <div class="group"><span class="lab">Zoom</span>

      <input id="zoom" aria-label="Zoom" type="range" min="40" max="320" step="5"><span class="val" id="zoomV"></span>
    </div>
    <div class="group"><button class="chip" id="gray">Grey</button><button class="chip" id="still">Reduced motion</button></div>
    <div id="time"><button class="chip" id="play">Play</button><input id="scrub" aria-label="Time" type="range" min="0" max="6000" step="10"></div>

  <div class="bar"><div class="topic" id="topicC"><span class="name">C · chevrons</span></div></div>
</header>
<main><div id="cells"></div></main>
<script>
'use strict';
// =============================================================================================
// The client's numbers (apps/client/src/render/style.ts, theme/tokens.ts, units/helmet.ts).
// =============================================================================================
const C = {
  casing: '#060504', plate: '#0e0c09', cut: '#050403', ink: '#ccc0a6', ivory: '#ece4d1',
  neutral: '#b3a88f', vp: '#cfab62', warn: '#e6ab42', up: '#8cc79a', down: '#ec6654', road: '#e6edf3',
};
const COLOURS = { lapis: '#86a6ea', minium: '#e5785e', glacier: '#a6e0e8', shell: '#f4b4a4', violet: '#966fd6', madder: '#c8587e' };
const HELMET_PATHS = {
  own: {
    dome: 'M9 70 C5 36 22 12 49 12 C70 12 85 26 88 42 C89 47 91 50 95 53 C82 54 72 56 66 60 C60 64 56 70 46 70 Z',
    band: 'M7 77 C20 79 34 80 46 79 C56 78 62 71 67 67 C72 63 82 61 96 60',
    strap: 'M46 80 L54 96',
  },
  enemy: {
    dome: 'M8 54 C8 30 28 13 52 13 C74 13 90 30 92 46 L98 54 Q99 58 95 58 L74 58 C65 58 60 64 57 73 C56 77 52 78 46 77 C32 74 18 69 12 64 Q8 61 8 54 Z',
    band: null,
    strap: 'M38 75 L58 91 L64 68',
  },
};
const HELMET_SCALE = 1.34, HELMET_INSIDE = 0.92;
const UNIT_SIDES = [24, 30, 36, 42];
const HE = { casing: 6, inside: 1.6, gear: 0.55, edge: 1.25, hatchW: 0.9, font: 12.5 };
const CITY_E = { cutGrow: 3.2, cutAlpha: 0.85, rimGrow: 1.6, rimW: 1.1, innerInset: 1.2, innerW: 0.8, innerA: 0.6, enemyInsets: [4.4, 6.4], enemyW: 0.9, star: [0.6, 0.27, 1.2] };
const PROV_E = { plate: 8, dot: 6.4, rimR: 7.6, rimW: 0.9, enemyR: 10, enemyW: 0.8 };
const RING = { gap: 7, cut: 6, cutAlpha: 0.8, filled: 3.4, roomW: 0.9, roomOff: 1.6, wash: 0.3, segGap: 0.16 };
const LOZ = { casing: 8.2, fill: 5.8, hollow: 4.7, line: 0.9, lineA: 0.92, pitch: 8.8, groupGap: 3.5, drop: 8.5 };
const VPL = { side: 18.5, outer: 17.2, inner: 12.4, w: 1.1, font: 14.5, lift: 4.5 };
const BADGE = { size: 11, stroke: 0.3, outline: 2.6, minPx: 8 };
const BADGE_GAP = 13, BADGE_DROP = 3;
const TOWER = {
  barracksAngle: Math.PI * 1.25, factoryAngle: Math.PI * 0.95, out: 4, minScale: 1.35, screen: 1.7, keep: 0.5, halfHeight: 5.2,
  barracks: [[-4.6, -5.2], [4.6, -5.2], [4.6, 4], [-4.6, 4]],
  factory: [[-5.4, 4], [-5.4, -1.6], [-1.6, -5.2], [-1.6, -1.6], [2.2, -5.2], [2.2, -1.6], [5.4, -1.6], [5.4, 4]],
};
const CROWN = { lift: 8, step: 11, minSpan: 1, lozenge: 0.9, width: 2.4, casing: 2.2, serif: 3.6 };
const PAY = { flightMs: 450, lift: 12, popMs: 220, pop: 0.3, runMs: 350, runStagger: 60, shrink: 0.6, doneMs: 600 };
const RECRUIT = { width: 9, step: 0.27 };
const COST = { barracks: 3, factory: 4 };
// Capacity and warehouse by kind (rulesets/mvp-7.toml, DEC-22, DEC-43 item C), the body radius
// (cityLayout.cityRadius; a province 13 since #949, A6).
const NODE = {
  province: { cap: 3, r: 13, wh: 1, stock: 1, vp: 0, name: 'Fork' },
  small: { cap: 4, r: 14, wh: 3, stock: 2, vp: 1, name: 'Ford' },
  medium: { cap: 6, r: 17, wh: 3, stock: 2, vp: 1, name: 'Watchhouse' },
  large: { cap: 8, r: 20, wh: 3, stock: 2, vp: 2, name: 'Forkway' },
  capital: { cap: 10, r: 20, wh: 6, stock: 4, vp: 3, name: 'Stonegate' },
};
const NAMES = ['Firwood', 'Watchpost', 'Forkway', 'Wood Hollow', 'Archway', 'Bluff', 'Ford', 'Pinebrook', 'Heart', 'Crest'];

// =============================================================================================
// Helmet geometry: a port of units/helmet.ts (sampling, centring, extent, helmetFit).
// =============================================================================================
function samplePath(d, steps = 10) {
  const t = d.match(/[MLCQZ]|-?\d*\.?\d+/g) || [];
  const pts = []; let i = 0, cmd = '', at = { x: 0, y: 0 };
  const num = () => Number(t[i++]);
  while (i < t.length) {
    const tok = t[i];
    if (/[MLCQZ]/.test(tok)) { cmd = tok; i++; if (cmd === 'Z') continue; }
    if (cmd === 'M' || cmd === 'L') { at = { x: num(), y: num() }; pts.push(at); }
    else if (cmd === 'C') {
      const c1 = { x: num(), y: num() }, c2 = { x: num(), y: num() }, e = { x: num(), y: num() };
      for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*u*at.x + 3*u*u*s*c1.x + 3*u*s*s*c2.x + s*s*s*e.x, y: u*u*u*at.y + 3*u*u*s*c1.y + 3*u*s*s*c2.y + s*s*s*e.y }); }
      at = e;
    } else if (cmd === 'Q') {
      const c = { x: num(), y: num() }, e = { x: num(), y: num() };
      for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*at.x + 2*u*s*c.x + s*s*e.x, y: u*u*at.y + 2*u*s*c.y + s*s*e.y }); }
      at = e;
    } else i++;
  }
  return pts;
}
function boundsOf(ps) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of ps) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
}
function centroid(ps) {
  let a = 0, cx = 0, cy = 0;
  ps.forEach((p, i) => { const q = ps[(i + 1) % ps.length]; const cr = p.x*q.y - q.x*p.y; a += cr; cx += (p.x + q.x)*cr; cy += (p.y + q.y)*cr; });
  return { x: cx / (3*a), y: cy / (3*a) };
}
const RAW = {};
for (const k of ['own', 'enemy']) {
  const P = HELMET_PATHS[k];
  RAW[k] = { dome: samplePath(P.dome), band: P.band ? samplePath(P.band) : null, strap: samplePath(P.strap) };
  const b = boundsOf([...RAW[k].dome, ...(RAW[k].band || []), ...RAW[k].strap]);
  RAW[k].c = { x: b.x + b.width / 2, y: b.y + b.height / 2 };
}
const HELMETS = new Map();
function helmet(kind, width) {
  const key = kind + ':' + width;
  if (HELMETS.has(key)) return HELMETS.get(key);
  const R = RAW[kind], s = width / 100;
  const place = (p) => ({ x: (p.x - R.c.x) * s, y: (p.y - R.c.y) * s });
  const dome = R.dome.map(place), band = R.band ? R.band.map(place) : null, strap = R.strap.map(place);
  const db = boundsOf(dome), mid = centroid(dome);
  const h = { kind, width, dome, band, strap, bounds: boundsOf([...dome, ...(band || []), ...strap]), domeTop: db.y, domeBottom: db.y + db.height, domeBounds: db, middle: { x: mid.x, y: mid.y + width * 0.02 } };
  HELMETS.set(key, h);
  return h;
}
function helmetLines(width) { const s = width / 100; return { strap: Math.max(6.4*s, 2.1), band: Math.max(5.6*s, 2.2), casing: 6.4, edge: 2.1 }; }
function helmetExtent(h) {
  const L = helmetLines(h.width); const pad = Math.max(L.casing, L.strap + L.casing) / 2;
  return { top: h.bounds.y - pad, bottom: h.bounds.y + h.bounds.height + pad, left: h.bounds.x - pad, right: h.bounds.x + h.bounds.width + pad };
}
function helmetWidth(side, inside) { return Math.round(side * HELMET_SCALE * (inside ? HELMET_INSIDE : 1) * 100) / 100; }
function helmetFit(kind, width, reach) {
  let w = width;
  for (let step = 0; step < 6 && w > 4; step++) {
    const e = helmetExtent(helmet(kind, w));
    const span = Math.max(e.right, -e.left, e.bottom, -e.top);
    if (span <= reach) break;
    w = Math.min(w - 0.25, Math.floor(((w * reach) / span) * 4) / 4);
  }
  return w;
}
function unitSide(units) { return units <= 3 ? UNIT_SIDES[0] : units <= 7 ? UNIT_SIDES[1] : units <= 15 ? UNIT_SIDES[2] : UNIT_SIDES[3]; }

// =============================================================================================
// Drawing helpers (world units; the canvas transform carries the zoom). `PXW`: device px per world
// unit, `LS`: the scale of the local frame, so a hairline never falls under 1.3 device px (#865).
// =============================================================================================
let GA = 1, PXW = 1, LS = 1;
const hair = (w) => Math.max(w, 1.3 / (PXW * LS));
function poly(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); }
function polyA(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (closed) ctx.closePath(); }
function stroke(ctx, w, color, alpha = 1, cap = 'round', join = 'round') {
  ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(); ctx.globalAlpha = GA;
}
function fill(ctx, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(); ctx.globalAlpha = GA; }
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI*2); }
function hexOf(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function rgb(a) { return '#' + a.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, k) { const p = hexOf(a), q = hexOf(b); return rgb(p.map((v, i) => v + (q[i] - v)*k)); }
function hatchLines(ctx, b, angle, pitch) {
  const cx = b.x + b.width/2, cy = b.y + b.height/2, R = Math.hypot(b.width, b.height)/2 + pitch;
  const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
  ctx.beginPath();
  for (let d = -R; d <= R; d += pitch) { ctx.moveTo(cx + nx*d - ux*R, cy + ny*d - uy*R); ctx.lineTo(cx + nx*d + ux*R, cy + ny*d + uy*R); }
}
const polar = (a, d) => ({ x: d*Math.cos(a), y: d*Math.sin(a) });
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const ease = {
  engrave: (t) => 0.5 - 0.5*Math.cos(Math.PI*clamp01(t)),
  settle: (t) => 1 - Math.pow(1 - clamp01(t), 3),
  travel: (t) => { t = clamp01(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; },
};
function lozPath(ctx, x, y, side) { const h = side*Math.SQRT2/2; ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + h, y); ctx.lineTo(x, y + h); ctx.lineTo(x - h, y); ctx.closePath(); }
/** One charge (57u): the casing, then the colour (in stock, paid) or hollow (room, owed). */
function drawLozenge(ctx, x, y, on, color, k = 1, alpha = 1) {
  lozPath(ctx, x, y, LOZ.casing*k); fill(ctx, C.casing, alpha);
  if (on) { lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, color, alpha); return; }
  lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, C.plate, alpha);
  lozPath(ctx, x, y, LOZ.hollow*k); stroke(ctx, hair(LOZ.line), C.ink, LOZ.lineA*alpha, 'butt', 'miter');
}
/** A local frame: translate, rotate, scale; hairlines keep their device width. */
function frame(ctx, x, y, rot, s, fn) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s);
  const ls = LS; LS = ls*s; fn(); LS = ls; ctx.restore();
}
/** The client's towerScale (#869): at least 1.35, 1.7 css px per unit near zoom 1, a quarter octave. */
function towerScale(z) {
  const out = TOWER.screen / TOWER.minScale / Math.max(1e-3, z);
  const exact = TOWER.minScale * Math.max(1, out) ** TOWER.keep;
  return 2 ** (Math.ceil(Math.log2(exact) * 4) / 4);
}
/** The same rule for a variant whose buildings keep a size on screen: `base` near zoom 1, grows by the root of the zoom. */
function growScale(z, base) { return base * Math.max(1, (TOWER.screen / TOWER.minScale) / Math.max(1e-3, z)) ** 0.5; }

// =============================================================================================
// The material of a building (Engraved: casing, dark plate, the owner's hatch, an ink line). A
// shape is { path(ctx), box: [x0, y0, x1, y1], details?(ctx, o), shade?(ctx, o), solid? } in its
// own frame (its top is -y). Looks: built, plan (still owes charges), rising (the build time).
// The enemy's: hatch at 45 degrees and a double ink contour (the enemy city's two inner rings).
// =============================================================================================
function material(ctx, sh, o) {
  const [x0, y0, x1, y1] = sh.box;
  const box = { x: x0 - 1, y: y0 - 1, width: x1 - x0 + 2, height: y1 - y0 + 2 };
  if (o.look === 'plan') {
    sh.path(ctx); stroke(ctx, 3.2, C.casing, .55, 'round', 'miter'); fill(ctx, C.plate, .55);
    sh.path(ctx); ctx.setLineDash([1.3, 1.5]); stroke(ctx, hair(1), C.ink, .8, 'butt'); ctx.setLineDash([]);
    return;
  }
  if (o.look === 'socket') { // T10: an empty socket, only where it can be built
    sh.path(ctx); fill(ctx, C.cut, .55);
    sh.path(ctx); ctx.setLineDash([1, 1.6]); stroke(ctx, hair(.8), C.ink, .55, 'butt'); ctx.setLineDash([]);
    return;
  }
  sh.path(ctx); stroke(ctx, 3.2, C.casing, 1, 'round', 'miter'); fill(ctx, C.plate);
  ctx.save(); sh.path(ctx); ctx.clip();
  if (o.look === 'built') {
    if (sh.sparse) { hatchLines(ctx, box, o.enemy ? -Math.PI/4 : 0, 2.6); stroke(ctx, hair(.7), o.color, .8, 'butt'); }
    else if (sh.solid) {
      sh.path(ctx); fill(ctx, o.color);
      if (o.enemy) { hatchLines(ctx, box, -Math.PI/4, 2.1); stroke(ctx, hair(.75), C.casing, .9, 'butt'); }
    } else {
      hatchLines(ctx, box, o.enemy ? -Math.PI/4 : 0, o.enemy ? 1.9 : 1.7); stroke(ctx, hair(.8), o.color, 1, 'butt');

    shape(kind) {

units.addEventListener('input', () => { S.units = Number(units.value); S.charged = Math.min(S.charged, S.units); refresh(false); });
charged.addEventListener('input', () => { S.charged = Math.min(Number(charged.value), S.units); refresh(false); });
zoom.addEventListener('input', () => { S.zoom = Number(zoom.value); refresh(false); });
for (const [id, key] of [['gray', 'gray'], ['still', 'still'], ['sel', 'sel'], ['queue', 'queue'], ['cb', 'cb']]) document.getElementById(id).addEventListener('click', () => { S[key] = !S[key]; refresh(false); });
const playBtn = document.getElementById('play');
let playFrom = 0, playAt = 0;
playBtn.addEventListener('click', () => { if (S.playing) S.playing = false; else { S.playing = true; playFrom = S.time >= TL ? 0 : S.time; playAt = performance.now(); } refresh(false); });
scrub.addEventListener('input', () => { S.playing = false; S.time = Number(scrub.value); refresh(false); });
function refresh(rebuild) {
  const press = (els, on) => els.forEach((e) => e.setAttribute('aria-pressed', String(on(e))));
  press(tChips, (e) => S.t.includes(e.dataset.v)); press(cChips, (e) => S.c.includes(e.dataset.v));
  press(sChips, (e, i) => false); sChips.forEach((e, i) => e.setAttribute('aria-pressed', String(STATES[i].id === S.state)));
  press(colChips, (e) => e.dataset.col === S.col);
  press([...document.querySelectorAll('[data-cmp]')], (e) => e.dataset.cmp === S.cmp);
  press([...document.querySelectorAll('[data-ground]')], (e) => e.dataset.ground === S.ground);
  press([...document.querySelectorAll('[data-node]')], (e) => e.dataset.node === S.node);
  press([...document.querySelectorAll('[data-mark]')], (e) => Number(e.dataset.mark) === S.mark);
  press([...document.querySelectorAll('[data-z]')], (e) => Number(e.dataset.z) === S.zoom);
  for (const id of ['gray', 'still', 'sel', 'queue', 'cb']) press([document.getElementById(id)], () => S[id]);
  document.getElementById('states').style.opacity = S.cmp === 't' ? 1 : .45;
  playBtn.textContent = S.playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(S.playing));
  units.value = S.units; charged.max = S.units; charged.value = S.charged; zoom.value = S.zoom; scrub.value = S.time; scrub.max = TL;
  document.getElementById('unitsV').textContent = String(S.units);
  document.getElementById('chargedV').textContent = String(S.charged);
  document.getElementById('zoomV').textContent = S.zoom + '%';
  document.body.classList.toggle('gray', S.gray);
  writeHash();
  if (rebuild) buildCells();
}
function tick(now) {
  if (S.playing) {
    S.time = playFrom + (now - playAt);
    if (S.time >= TL) { S.time = 0; playFrom = 0; playAt = now; }
    scrub.value = S.time;
  }
  render();
  requestAnimationFrame(tick);
}
window.addEventListener('resize', () => sizeCells());
try { if (!location.hash && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { S.still = true; S.playing = false; } } catch (e) { /* no media queries */ }
readHash();
if (S.playing) { playFrom = S.time; playAt = performance.now(); }
refresh(true);
(async () => {
  await Promise.all(Object.entries(GROUND_FILES).map(async ([k, f]) => {
    try { const img = await loadImg(f); tiles[k] = mirrorTile(img, false); if (k === 'plains') tiles.fog = mirrorTile(img, true); } catch (e) { /* the flat ground stays */ }
  }));
  try { await document.fonts.load("600 12px 'EB Garamond'"); } catch (e) { /* the serif fallback */ }
  requestAnimationFrame(tick);
})();
</script>
