<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruit arc, round 2</title>
<!-- The recruit queue at a city, round 2 (deep, #1005): the owner chose R2 "Outer arc" of round 1 (recruit-timer.html) and
     asked for a visual rework. Its two problems in round 1: the arc floated beyond the barracks and read as a broken road,
     and it crowded the barracks. Every variation here keeps the idea (a short arc of cells at the barracks: the cell under
     way fills along its arc, queued cells dotted, a made unit drops into the capacity ring) and ties the arc to the city
     piece. Everything comes from what the view already carries: NodeView.recruit_queue, recruit_progress, recruit_waiting,
     rally_point, has_barracks and ruleset_public.recruit (mvp-7: unit_ticks 30 = 3 s a unit, queue_max 3, rally_cost 0.5 CP).
     The map pieces are the client's (render/style.ts, units/helmet.ts, theme/cutIcons.ts, theme/cpMark.ts,
     render/buildingLayout.ts, render/cornerTicks.ts, render/fightFx.ts), shared with recruit-timer.html. Self-contained:
     EB Garamond and Cinzel (SIL OFL) and the ground crop come from assets/in-match-cp-vp/ and assets/city-buildings/.
     State in the address (#v=B&city=capital&n=2&rally=1&z=far ...). -->
<style>
     The map pieces are the client's (render/style.ts, units/helmet.ts, theme/cutIcons.ts, theme/cpMark.ts), shared with
     build-animation.html. Self-contained: EB Garamond and Cinzel (SIL OFL) and the ground crop come from
     assets/in-match-cp-vp/ and assets/city-buildings/. State in the address (#el=clock&c=T4&cs=last ...). -->

<script>
'use strict';
// =============================================================================================
// The client's numbers (render/style.ts, theme/tokens.ts, units/helmet.ts, theme/cutIcons.ts),
// shared with city-buildings-r2.html.
// =============================================================================================
const C = {
  casing: '#060504', plate: '#0e0c09', cut: '#050403', ink: '#ccc0a6', ivory: '#ece4d1',
  vp: '#cfab62', up: '#8cc79a', down: '#ec6654', road: '#e6edf3', clash: '#e6ab42',
};
// The city menu's icons, exactly (cutIcons.ts): the outline and the ruled solid, a 26-unit box centred on 0.
const CUT_D = {
  barracks: 'M-9 9 V-1 L0 -8.5 L9 -1 V9 Z M-3 9 V3 H3 V9 M0 -8.5 V-12.5 L4.5 -11 L0 -9.5',
  factory: 'M-10 9 V-1.5 L-5 -5 V-1.5 L0 -5 V-1.5 L5 -5 V-10 H8.5 V9 Z M-6.5 4 H-3 M0 4 H3.5',
};
const CUT_SOLID_D = { barracks: 'M-9 9 V-1 L0 -8.5 L9 -1 V9 Z', factory: 'M-10 9 V-1.5 L-5 -5 V-1.5 L0 -5 V-1.5 L5 -5 V-10 H8.5 V9 Z' };
const CUT = { barracks: new Path2D(CUT_D.barracks), factory: new Path2D(CUT_D.factory) };
const CUT_SOLID = { barracks: new Path2D(CUT_SOLID_D.barracks), factory: new Path2D(CUT_SOLID_D.factory) };
const CUT_BOX = { barracks: [-9, -12.5, 9, 9], factory: [-10, -10, 8.5, 9] };
const CUT_STYLE = { box: 26, rule: 2.6, ruleW: 1.15, casing: 4.2, casingA: 0.9, ink: 2.1 };
const ICON_HALF = 0.44; // half the drawn extent of an icon (casing included), a share of its box

const HELMET_PATHS = {
  own: { dome: 'M9 70 C5 36 22 12 49 12 C70 12 85 26 88 42 C89 47 91 50 95 53 C82 54 72 56 66 60 C60 64 56 70 46 70 Z', band: 'M7 77 C20 79 34 80 46 79 C56 78 62 71 67 67 C72 63 82 61 96 60', strap: 'M46 80 L54 96' },
  enemy: { dome: 'M8 54 C8 30 28 13 52 13 C74 13 90 30 92 46 L98 54 Q99 58 95 58 L74 58 C65 58 60 64 57 73 C56 77 52 78 46 77 C32 74 18 69 12 64 Q8 61 8 54 Z', band: null, strap: 'M38 75 L58 91 L64 68' },
};
const HELMET_SCALE = 1.34, HELMET_INSIDE = 0.92, UNIT_SIDES = [24, 30, 36, 42];
const HE = { casing: 6, inside: 1.6, gear: 0.55, edge: 1.25, hatchW: 0.9, font: 12.5 };
const CITY_E = { cutGrow: 3.2, cutAlpha: 0.85, rimGrow: 1.6, rimW: 1.1, innerInset: 1.2, innerW: 0.8, innerA: 0.6, enemyInsets: [4.4, 6.4], enemyW: 0.9, star: [0.6, 0.27, 1.2] };
const RING = { gap: 7, cut: 6, cutAlpha: 0.8, filled: 3.4, roomW: 0.9, roomOff: 1.6, wash: 0.3, segGap: 0.16 };
const LOZ = { casing: 8.2, fill: 5.8, hollow: 4.7, line: 0.9, lineA: 0.92, pitch: 8.8, groupGap: 3.5, drop: 8.5 };
const VPL = { side: 18.5, outer: 17.2, inner: 12.4, w: 1.1, font: 14.5, lift: 4.5 };
const BADGE = { size: 11, stroke: 0.3, outline: 2.6, minPx: 8 };
const TICKS = { gap: 2, arm: 6.2, casing: 4.4, ink: 1.7 }; // CORNER_TICKS after #952

// =============================================================================================
// Helmet geometry (a port of units/helmet.ts).
// =============================================================================================
function samplePath(d, steps = 10) {
  const t = d.match(/[MLCQZ]|-?\d*\.?\d+/g) || [];
  const pts = []; let i = 0, cmd = '', at = { x: 0, y: 0 };
  const num = () => Number(t[i++]);
  while (i < t.length) {
    const tok = t[i];
    if (/[MLCQZ]/.test(tok)) { cmd = tok; i++; if (cmd === 'Z') continue; }
    if (cmd === 'M' || cmd === 'L') { at = { x: num(), y: num() }; pts.push(at); }
    else if (cmd === 'C') { const c1 = { x: num(), y: num() }, c2 = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*u*at.x + 3*u*u*s*c1.x + 3*u*s*s*c2.x + s*s*s*e.x, y: u*u*u*at.y + 3*u*u*s*c1.y + 3*u*s*s*c2.y + s*s*s*e.y }); } at = e; }
    else if (cmd === 'Q') { const c = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*at.x + 2*u*s*c.x + s*s*e.x, y: u*u*at.y + 2*u*s*c.y + s*s*e.y }); } at = e; }
    else i++;
  }
  return pts;
}
function boundsOf(ps) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const p of ps) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); } return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 }; }
function centroid(ps) { let a = 0, cx = 0, cy = 0; ps.forEach((p, i) => { const q = ps[(i + 1) % ps.length]; const cr = p.x*q.y - q.x*p.y; a += cr; cx += (p.x + q.x)*cr; cy += (p.y + q.y)*cr; }); return { x: cx / (3*a), y: cy / (3*a) }; }
const RAW = {};
for (const k of ['own', 'enemy']) { const P = HELMET_PATHS[k]; RAW[k] = { dome: samplePath(P.dome), band: P.band ? samplePath(P.band) : null, strap: samplePath(P.strap) }; const b = boundsOf([...RAW[k].dome, ...(RAW[k].band || []), ...RAW[k].strap]); RAW[k].c = { x: b.x + b.width / 2, y: b.y + b.height / 2 }; }
const HELMETS = new Map();
function helmet(kind, width) {
  const key = kind + ':' + width; if (HELMETS.has(key)) return HELMETS.get(key);
  const R = RAW[kind], s = width / 100, place = (p) => ({ x: (p.x - R.c.x) * s, y: (p.y - R.c.y) * s });
  const dome = R.dome.map(place), band = R.band ? R.band.map(place) : null, strap = R.strap.map(place);
  const db = boundsOf(dome), mid = centroid(dome);
  const h = { kind, width, dome, band, strap, bounds: boundsOf([...dome, ...(band || []), ...strap]), domeTop: db.y, domeBottom: db.y + db.height, domeBounds: db, middle: { x: mid.x, y: mid.y + width * 0.02 } };
  HELMETS.set(key, h); return h;
}
function helmetLines(width) { const s = width / 100; return { strap: Math.max(6.4*s, 2.1), band: Math.max(5.6*s, 2.2), casing: 6.4 }; }
function helmetExtent(h) { const L = helmetLines(h.width), pad = Math.max(L.casing, L.strap + L.casing) / 2; return { top: h.bounds.y - pad, bottom: h.bounds.y + h.bounds.height + pad, left: h.bounds.x - pad, right: h.bounds.x + h.bounds.width + pad }; }
function helmetWidth(side, inside) { return Math.round(side * HELMET_SCALE * (inside ? HELMET_INSIDE : 1) * 100) / 100; }
function helmetFit(kind, width, reach) {
  let w = width;
  for (let step = 0; step < 6 && w > 4; step++) { const e = helmetExtent(helmet(kind, w)), span = Math.max(e.right, -e.left, e.bottom, -e.top); if (span <= reach) break; w = Math.min(w - 0.25, Math.floor(((w * reach) / span) * 4) / 4); }
  return w;
}
function unitSide(units) { return units <= 3 ? UNIT_SIDES[0] : units <= 7 ? UNIT_SIDES[1] : units <= 15 ? UNIT_SIDES[2] : UNIT_SIDES[3]; }

// =============================================================================================
// Drawing helpers (world units; the canvas transform carries the zoom). A hairline never falls
// under 1.3 device px (#865).
// =============================================================================================
let GA = 1, PXW = 1, LS = 1;
const hair = (w) => Math.max(w, 1.3 / (PXW * LS));
function poly(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); }
function polyA(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (closed) ctx.closePath(); }
function stroke(ctx, w, color, alpha = 1, cap = 'round', join = 'round') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(); ctx.globalAlpha = GA; }
function fill(ctx, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(); ctx.globalAlpha = GA; }
function strokeP(ctx, p, w, color, alpha = 1, cap = 'square', join = 'miter') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(p); ctx.globalAlpha = GA; }
function fillP(ctx, p, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(p); ctx.globalAlpha = GA; }
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI*2); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hatchLines(ctx, b, angle, pitch) {
  const cx = b.x + b.width/2, cy = b.y + b.height/2, R = Math.hypot(b.width, b.height)/2 + pitch;
  const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
  ctx.beginPath(); for (let d = -R; d <= R; d += pitch) { ctx.moveTo(cx + nx*d - ux*R, cy + ny*d - uy*R); ctx.lineTo(cx + nx*d + ux*R, cy + ny*d + uy*R); }
}
const polar = (a, d) => ({ x: d*Math.cos(a), y: d*Math.sin(a) });
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const ease = { engrave: (t) => 0.5 - 0.5*Math.cos(Math.PI*clamp01(t)), settle: (t) => 1 - Math.pow(1 - clamp01(t), 3), travel: (t) => { t = clamp01(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; } };
function lozPath(ctx, x, y, side) { const h = side*Math.SQRT2/2; ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + h, y); ctx.lineTo(x, y + h); ctx.lineTo(x - h, y); ctx.closePath(); }
/** One charge (57u): the casing, then the colour (in stock, paid) or hollow (room, owed). */
function drawLozenge(ctx, x, y, on, color, k = 1, alpha = 1) {
  lozPath(ctx, x, y, LOZ.casing*k); fill(ctx, C.casing, alpha);
  if (on) { lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, color, alpha); return; }
  lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, C.plate, alpha);
  lozPath(ctx, x, y, LOZ.hollow*k); stroke(ctx, hair(LOZ.line), C.ink, LOZ.lineA*alpha, 'butt', 'miter');
}
function frame(ctx, x, y, rot, s, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s); const ls = LS; LS = ls*s; fn(); LS = ls; ctx.restore(); }

function drawBody(ctx, G, owner, color, occupied, star) {
  const r = G.r;
  circle(ctx, 0, 0, r + CITY_E.cutGrow); fill(ctx, C.cut, CITY_E.cutAlpha);
  circle(ctx, 0, 0, r); fill(ctx, occupied ? C.plate : color);
  circle(ctx, 0, 0, r + CITY_E.rimGrow); stroke(ctx, CITY_E.rimW, C.ink);
  circle(ctx, 0, 0, r - CITY_E.innerInset); stroke(ctx, CITY_E.innerW, C.cut, CITY_E.innerA);
  if (owner === 'enemy') for (const ins of CITY_E.enemyInsets) { circle(ctx, 0, 0, r - ins); stroke(ctx, CITY_E.enemyW, C.ink); }
  if (G.kind === 'capital' && !occupied && star) {
    ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, r2 = i % 2 ? r*CITY_E.star[1] : r*CITY_E.star[0]; ctx.lineTo(r2*Math.cos(a), r2*Math.sin(a)); }
    ctx.closePath(); fill(ctx, C.plate); stroke(ctx, CITY_E.star[2], C.ink, 1, 'butt', 'miter');
  }
}
const TAU = Math.PI*2, START = -Math.PI/2;
function ringCells(cap, filled) {
  const gap = RING.segGap, arcs = [];
  for (let j = 0; j < cap; j++) { const f0 = TAU*j/cap, f1 = TAU*(j + 1)/cap; arcs.push({ from: START + f0 + gap/2, to: START + f1 - gap/2, filled: j < filled }); }
  return arcs;
}
function strokeArcs(ctx, r, arcs, w, color, alpha = 1) { ctx.beginPath(); for (const a of arcs) { ctx.moveTo(r*Math.cos(a.from), r*Math.sin(a.from)); ctx.arc(0, 0, r, a.from, a.to); } stroke(ctx, w, color, alpha, 'butt'); }
function drawRing(ctx, r, arcs) {
  const o = RING.roomOff;
  strokeArcs(ctx, r, arcs, RING.cut, C.cut, RING.cutAlpha);
  strokeArcs(ctx, r, arcs.filter((a) => a.filled), RING.filled, C.ink);
  const room = arcs.filter((a) => !a.filled);
  strokeArcs(ctx, r, room, 2*o, C.ink, RING.wash);
  for (const s of [-1, 1]) strokeArcs(ctx, r + s*o, room, hair(RING.roomW), C.ink);
  ctx.beginPath(); for (const a of room) for (const ang of [a.from, a.to]) { const c = Math.cos(ang), s = Math.sin(ang); ctx.moveTo((r - o)*c, (r - o)*s); ctx.lineTo((r + o)*c, (r + o)*s); }
  if (room.length) stroke(ctx, hair(RING.roomW), C.ink, 1, 'butt');
}
function rowXs(n) { const xs = [], gap = n > 4 ? LOZ.groupGap : 0; for (let i = 0; i < n; i++) xs.push(i*LOZ.pitch + Math.floor(i/3)*gap); const mid = n ? (xs[0] + xs[n - 1]) / 2 : 0; return xs.map((x) => x - mid); }
function drawVp(ctx, at, n) {
  lozPath(ctx, at.x, at.y, VPL.side); fill(ctx, C.plate);
  lozPath(ctx, at.x, at.y, VPL.outer); stroke(ctx, hair(VPL.w), C.vp, 1, 'butt', 'miter');
  lozPath(ctx, at.x, at.y, VPL.inner); stroke(ctx, hair(VPL.w), C.vp, 1, 'butt', 'miter');
  ctx.font = `600 ${VPL.font}px 'EB Garamond', Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.vp; ctx.fillText(String(n), at.x, at.y + 1);
}
function drawHelmet(ctx, g) {
  const h = helmet(g.kind, g.width), L = helmetLines(g.width), facing = g.kind === 'own' ? 1 : -1, casing = g.pip ? 3.2 : HE.casing + HE.inside;
  ctx.save(); ctx.translate(g.x, g.y); ctx.scale(facing, 1);
  const gear = h.band ? [h.strap, h.band] : [h.strap], gw = (line) => (line === h.strap ? L.strap : L.band) * HE.gear;
  for (const line of gear) { poly(ctx, line, false); stroke(ctx, gw(line) + casing*0.8, C.casing); }
  poly(ctx, h.dome); stroke(ctx, casing*0.9, C.casing); poly(ctx, h.dome); fill(ctx, C.plate);
  const pitch = Math.min(3, Math.max(1.4, g.width*0.075)), top = h.domeBottom - g.level*(h.domeBottom - h.domeTop);
  ctx.save(); poly(ctx, h.dome); ctx.clip();
  hatchLines(ctx, h.domeBounds, -Math.PI/4, pitch); stroke(ctx, hair(HE.hatchW*(g.pip ? .7 : 1)), g.color, 1, 'butt');
  if (g.level > 0) { ctx.beginPath(); ctx.rect(h.domeBounds.x - 2, top, h.domeBounds.width + 4, h.domeBottom - top + 2); fill(ctx, g.color); }
  ctx.restore();
  for (const line of gear) { poly(ctx, line, false); stroke(ctx, gw(line), C.ink); }
  poly(ctx, h.dome); stroke(ctx, hair(g.pip ? .8 : HE.edge), C.ink);
  ctx.restore();

function madeUnits(ctx, P, v) {

  if (!P.rally) {
    if (P.still || P.since >= P.fms) return;
    if (v.finish) { ctx.save(); ctx.translate(sub.x, sub.y); v.finish(ctx, P); ctx.restore(); GA = 1; ctx.globalAlpha = 1; return; }
    const from = v.emit(P), q = ease.travel(P.since / P.fms), gw = garrisonWidth(P);
    helm(ctx, { x: sub.x + lerp(from.x, 0, q), y: sub.y + lerp(from.y, 0, q), w: lerp(12 * P.k1, gw * 0.85, q), alpha: 1 - smooth(0.7, 1, q) });
    return;
  }
  const rn = P.rallyNode, a = P.rallyA, ux = Math.cos(a), uy = Math.sin(a), dist = Math.hypot(rn.x - sub.x, rn.y - sub.y);
  P.sc.done.forEach((d) => {
    const age = P.t - d; if (age < 0 || age >= WALK_MS) return;
    const from = v.emit(P), pts = [{ x: sub.x + from.x, y: sub.y + from.y }, { x: sub.x + ux * (sub.R + 9), y: sub.y + uy * (sub.R + 9) }, { x: sub.x + ux * (dist - rn.R - 9), y: sub.y + uy * (dist - rn.R - 9) }];
    const segs = [Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y), Math.hypot(pts[2].x - pts[1].x, pts[2].y - pts[1].y)], total = segs[0] + segs[1];
    let s = (P.still ? (age < WALK_MS * 0.5 ? 0.02 : 0.6) : ease.travel(age / WALK_MS)) * total, p;
    if (s <= segs[0]) p = { x: lerp(pts[0].x, pts[1].x, s / segs[0]), y: lerp(pts[0].y, pts[1].y, s / segs[0]) }; else { s -= segs[0]; p = { x: lerp(pts[1].x, pts[2].x, s / segs[1]), y: lerp(pts[1].y, pts[2].y, s / segs[1]) }; }
    const w = helmetWidth(unitSide(1), false) * 0.82, grow = P.still ? 1 : smooth(0, 0.12, age / WALK_MS);
    helm(ctx, { x: p.x, y: p.y, w: lerp(w * 0.45, w, grow), level: 0, alpha: 1 - smooth(0.88, 1, age / WALK_MS) * 0.9 });
    txt(ctx, '1', p.x + 1.5, p.y + 1, 11, C.ink, { alpha: grow * (1 - smooth(0.88, 1, age / WALK_MS)) });
  });
}

// =============================================================================================
// A fight on the road nearest the barracks (the arena of fightFx.ts: a 192 x 72 px plate that keeps
// its screen size, floating ARENA_GAP_EDGE px over the meeting point, with a tether).
// =============================================================================================
function fightRoad(P) { let best = P.sub.roads[0]; for (const a of P.sub.roads) if (Math.abs(norm(a - P.barA)) < Math.abs(norm(best - P.barA))) best = a; return best; }
function fightSpot(P) { const a = fightRoad(P), d = P.sub.R + 50; return { a, x: P.sub.x + d * Math.cos(a), y: P.sub.y + d * Math.sin(a) }; }
function fightGroups(ctx, P) {
  const f = fightSpot(P), ux = Math.cos(f.a), uy = Math.sin(f.a), w = helmetWidth(unitSide(2), false);
  helm(ctx, { kind: 'own', x: f.x - ux * 16, y: f.y - uy * 16, w, level: 0.5, color: OWN });
  helm(ctx, { kind: 'enemy', x: f.x + ux * 16, y: f.y + uy * 16, w, level: 1, color: FOE });
  for (const [x, y, n] of [[f.x - ux * 16, f.y - uy * 16, '2'], [f.x + ux * 16, f.y + uy * 16, '2']]) txt(ctx, n, x, y + 1, 12, C.ink, { cas: 2.6 });
}
function arena(ctx, P) {
  const f = fightSpot(P), z = P.z, gap = 36 + 36 + 18, cy = f.y - gap / z;
  // the tether: a dotted ink line from the plate down to the meeting point
  ctx.setLineDash([2.2 / z, 2.6 / z]); line(ctx, f.x, cy + 36 / z, f.x, f.y - 14, hair(1 / z), C.ink, 0.7, 'butt'); ctx.setLineDash([]);
  frame(ctx, f.x, cy, 0, 1 / z, () => {
    plate(ctx, -96, -36, 192, 72, 1);
    [[-72, 1], [-50, 1], [-28, 0]].forEach(([x, lv]) => helm(ctx, { kind: 'own', x, y: -6, w: 19, level: lv, color: OWN, cas: 2.8 }));
    [[28, 1], [50, 1]].forEach(([x, lv]) => helm(ctx, { kind: 'enemy', x, y: -6, w: 19, level: lv, color: FOE, cas: 2.8 }));
    helm(ctx, { kind: 'enemy', x: 72, y: -6, w: 19, dashed: true });
    line(ctx, 0, -24, 0, 12, hair(0.9), C.ink, 0.55, 'butt'); lozPath(ctx, 0, -6, 6.4); fill(ctx, C.casing); lozPath(ctx, 0, -6, 4); fill(ctx, C.ink);
    const bx = -84, bw = 168, by = 26, q = ((P.t % 2400) / 2400);
    line(ctx, bx, by, bx + bw, by, hair(0.8), C.ink, 0.5, 'butt');
    ctx.beginPath(); ctx.rect(bx, by - 1.5, bw * q, 3); fill(ctx, C.ink);
    lozPath(ctx, bx + bw * q, by, 6); fill(ctx, C.casing); lozPath(ctx, bx + bw * q, by, 3.8); fill(ctx, C.ivory);
  });
}

// =============================================================================================
// The view.
// =============================================================================================
const view = document.getElementById('view'), rWrap = document.getElementById('rWrap');
const VIEW = { W: 1200, H: 600, dpr: 1 };
function layoutView() {
  const W = rWrap.clientWidth || 1200, room = window.innerHeight - rWrap.getBoundingClientRect().top - 20;
  const H = Math.round(Math.max(380, Math.min(W * 0.56, room))), dpr = window.devicePixelRatio || 1;
  view.style.height = H + 'px'; view.width = Math.round(W * dpr); view.height = Math.round(H * dpr);
  Object.assign(VIEW, { W, H, dpr });
}
function drawMap(ctx, W, H, dpr, z, cx, cy, P, v) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W * dpr, H * dpr);
  PXW = dpr * z; LS = 1; GA = 1;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - cx * z), dpr * (H / 2 - cy * z));
  const box = { x: cx - W / 2 / z - 4, y: cy - H / 2 / z - 4, w: W / z + 8, h: H / z + 8 };
  if (groundTile) { ctx.fillStyle = ctx.createPattern(groundTile, 'repeat'); ctx.fillRect(box.x, box.y, box.w, box.h); } else { ctx.fillStyle = '#3a4630'; ctx.fillRect(box.x, box.y, box.w, box.h); }
  ctx.fillStyle = 'rgba(11,10,8,0.12)'; ctx.fillRect(box.x, box.y, box.w, box.h);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(territory(), BOUNDS.x, BOUNDS.y, BOUNDS.w, BOUNDS.h);
  for (const [a, b] of EDGES) drawRoad(ctx, CITIES[a], CITIES[b]);
  packets(ctx, P);
  const at = (c, fn) => { ctx.save(); ctx.translate(c.x, c.y); fn(); ctx.restore(); GA = 1; ctx.globalAlpha = 1; };
  if (v.under) at(P.sub, () => v.under(ctx, P));
  for (const c of CITIES) at(c, () => drawCity(ctx, c, P, z));
  if (P.rally) { at(P.rallyNode, () => muster(ctx, P.rallyNode, P)); at(P.sub, () => rallyChevron(ctx, P)); }
  if (v.node) at(P.sub, () => v.node(ctx, P));
  for (const c of CITIES) at(c, () => drawGroup(ctx, c, P));
  if (S.fight) fightGroups(ctx, P);
  if (P.sel && P.units > 0) at(P.sub, () => drawTicks(ctx, { kind: 'own', width: garrisonWidth(P), x: 0, y: 0 }));
  madeUnits(ctx, P, v);
  if (S.fight) arena(ctx, P);
}
function renderRecruit() {
  const P = frameState(S.time), v = RV_BY[S.rv], z = P.z, ctx = view.getContext('2d'), { W, H, dpr } = VIEW;
  const near = S.zoom === 'near', far = S.zoom === 'far';
  const cx = P.sub.x + (near ? P.out.x * 22 : far ? 60 : 30), cy = P.sub.y + (near ? P.out.y * 10 - (S.fight ? 18 : 0) : S.rally && !far ? -70 : 10);
  drawMap(ctx, W, H, dpr, z, cx, cy, P, v);
}

// =============================================================================================
// Controls and state (also in the address).
// =============================================================================================
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (RV_BY[q.get('v')]) S.rv = q.get('v');
  if (['small', 'capital'].includes(q.get('city'))) S.city = q.get('city');
  if (['1', '2', '3'].includes(q.get('n'))) S.n = Number(q.get('n'));
  if (ZOOMS[q.get('z')]) S.zoom = q.get('z');
  for (const [k, key] of [['rally', 'rally'], ['sel', 'sel'], ['room', 'room'], ['fight', 'fight'], ['fin', 'fin'], ['rm', 'still'], ['gr', 'gray'], ['more', 'more']]) if (q.has(k)) S[key] = q.get(k) === '1';
  const tm = Number(q.get('tm')); if (q.has('tm') && tm >= 0) { S.time = tm; S.playing = false; }
}
function writeHash() {
  const b = (x) => (x ? 1 : 0);
  const h = `v=${encodeURIComponent(S.rv)}&city=${S.city}&n=${S.n}&rally=${b(S.rally)}&z=${S.zoom}&fin=${b(S.fin)}&sel=${b(S.sel)}&room=${b(S.room)}&fight=${b(S.fight)}&rm=${b(S.still)}&gr=${b(S.gray)}&more=${b(S.more)}` + (S.playing ? '' : `&tm=${Math.round(S.time)}`);
  history.replaceState(null, '', '#' + h);
}
const range = () => (S.fin ? finWindow() : [0, story().loop]);
let playFrom = 0, playAt = 0;
function replay() { S.time = range()[0]; S.playing = true; playFrom = S.time; playAt = performance.now(); refresh(); }
const varsEl = document.getElementById('vars');
let varChips = [];
function buildVarChips() {
  varsEl.textContent = '';
  varChips = RVARS.map((v) => {
    const b = document.createElement('button'); b.className = 'chip var' + (v.ref ? ' ref' : ''); b.dataset.v = v.id;
    const k = document.createElement('span'); k.className = 'k'; k.textContent = v.ref ? (v.id === 'R0' ? 'R0' : 'R2') : v.id; b.append(k, document.createTextNode(v.name));
    b.addEventListener('click', () => { S.rv = v.id; replay(); }); varsEl.append(b); return b;
  });
}
const on = (sel, fn) => document.querySelectorAll(sel).forEach((b) => b.addEventListener('click', () => fn(b)));
on('[data-city]', (b) => { S.city = b.dataset.city; replay(); });
on('[data-n]', (b) => { S.n = Number(b.dataset.n); replay(); });
on('[data-rally]', (b) => { S.rally = b.dataset.rally === '1'; replay(); });
on('[data-z]', (b) => { S.zoom = b.dataset.z; refresh(); });
for (const id of ['sel', 'room', 'fight', 'still', 'gray', 'fin']) {
  const key = id === 'still' ? 'still' : id;
  document.getElementById(id).addEventListener('click', () => { S[key] = !S[key]; if (id === 'room' || id === 'fin') replay(); else refresh(); });
}
const moreBtn = document.getElementById('more'), playBtn = document.getElementById('play'), scrub = document.getElementById('scrub');
moreBtn.addEventListener('click', () => { S.more = !S.more; refresh(); });
document.getElementById('replay').addEventListener('click', replay);
view.addEventListener('click', replay);
playBtn.addEventListener('click', () => { if (S.playing) S.playing = false; else { S.playing = true; playFrom = S.time; playAt = performance.now(); } refresh(); });
scrub.addEventListener('input', () => { S.playing = false; S.time = Number(scrub.value); refresh(); });
function refresh() {
  const press = (els, f) => els.forEach((e) => e.setAttribute('aria-pressed', String(f(e))));
  press(varChips, (e) => e.dataset.v === S.rv);
  press([...document.querySelectorAll('[data-city]')], (e) => e.dataset.city === S.city);
  press([...document.querySelectorAll('[data-n]')], (e) => Number(e.dataset.n) === S.n);
  press([...document.querySelectorAll('[data-rally]')], (e) => (e.dataset.rally === '1') === S.rally);
  press([...document.querySelectorAll('[data-z]')], (e) => e.dataset.z === S.zoom);
  for (const id of ['sel', 'room', 'fight', 'still', 'gray', 'fin']) press([document.getElementById(id)], () => S[id]);
  document.getElementById('moreBar').classList.toggle('open', S.more); moreBtn.setAttribute('aria-expanded', String(S.more));
  playBtn.textContent = S.playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(!S.playing));
  const [r0, r1] = range(); scrub.min = r0; scrub.max = r1; scrub.value = S.time;
  document.body.classList.toggle('gray', S.gray);
  const v = RV_BY[S.rv], cap = document.getElementById('cap'); cap.textContent = '';
  const b = document.createElement('b'); b.textContent = v.ref ? v.name : `${v.id} ${v.name}`;
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = v.ref ? 'reference' : 'client only';
  cap.append(b, document.createTextNode(v.line), tag);
  view.setAttribute('aria-label', `${v.name}: ${S.city === 'small' ? 'a small city' : 'the capital'} recruits ${S.room ? 'with no room' : S.n + (S.n > 1 ? ' units' : ' unit')}${S.rally ? ' to a rally point' : ''}, ${S.zoom} zoom. Click to replay.`);
  writeHash();
}
function tick(now) {
  if (S.playing) {
    const [r0, r1] = range(), speed = S.fin ? FIN_SPEED : 1;
    S.time = playFrom + (now - playAt) * speed;
    if (S.time >= r1 || S.time < r0) { S.time = r0; playFrom = r0; playAt = now; }
    scrub.value = S.time;
  }
  renderRecruit();
  requestAnimationFrame(tick);
}
window.addEventListener('resize', () => { layoutView(); });
try { if (!location.hash && window.matchMedia('(prefers-reduced-motion: reduce)').matches) S.still = true; } catch (e) { /* no media queries */ }
readHash();
if (S.playing) { if (S.fin) S.time = finWindow()[0]; playFrom = S.time; playAt = performance.now(); }
buildVarChips(); refresh(); layoutView();
(async () => {
  try { groundTile = mirrorTile(await loadImg('assets/city-buildings/ground-plains.webp')); } catch (e) { /* the flat ground stays */ }
  try { await Promise.all([document.fonts.load("600 12px 'EB Garamond'"), document.fonts.load("600 12px 'Cinzel'")]); } catch (e) { /* the serif fallback */ }
  document.body.dataset.ready = '1';
  requestAnimationFrame(tick);
})();
</script>
