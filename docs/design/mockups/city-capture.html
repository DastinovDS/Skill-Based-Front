<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City capture animation</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--dim:#9da7b3;--you:#5b9bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
header{position:sticky;top:0;z-index:5;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.row+.row{margin-top:6px}
h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
h1 a{color:var(--you);text-decoration:none;font-weight:400}
fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center}
legend{float:left;color:var(--dim);font-size:12px;min-width:50px;padding-right:6px;line-height:32px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg label{position:relative;cursor:pointer;background:var(--surface2);border-right:1px solid var(--border)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;padding:6px 10px;min-height:32px;font-size:13px;white-space:nowrap}
.seg input:checked+span{background:var(--you);color:#0d1117;font-weight:600}
.seg input:focus-visible+span{outline:2px solid #f0f6fc;outline-offset:-2px}
.tog{display:inline-flex;gap:6px;align-items:center;min-height:32px;padding:0 4px;font-size:13px;cursor:pointer}
.tog input{width:16px;height:16px;margin:0;accent-color:var(--you)}
button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;min-height:32px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer}
button:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:2px solid #f0f6fc}
input[type=range]{width:min(360px,60vw);accent-color:var(--you)}
#clock{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);min-width:64px}
main{padding:10px 12px 28px}
#panes{display:grid;gap:10px;justify-content:center}
#panes.n1{grid-template-columns:minmax(0,1100px)}
#panes.n2,#panes.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
#panes.all{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pane{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cap{display:flex;gap:8px;align-items:center;padding:4px 8px;min-height:36px;font-size:13px}
.cap b{font-weight:600}
.cap .d{color:var(--dim);margin-left:auto;font-size:12px}
.cap select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit;min-height:28px}
canvas{display:block;width:100%;height:auto;aspect-ratio:800/520;background:#0d1117}
.all .pane{cursor:pointer}
.gray canvas{filter:grayscale(1)}
.rg canvas{filter:url(#deutan)}
.gray.rg canvas{filter:grayscale(1)}
@media (max-width:760px){#panes.n2,#panes.n4{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="deutan"><feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/></filter></svg>
<header>
  <div class="row">
    <h1>City capture <a href="https://github.com/DastinovDS/Skill-Based-Front/issues/819">#819</a></h1>
    <fieldset><legend>Case</legend><div class="seg" id="case"></div></fieldset>
    <fieldset><legend>Zoom</legend><div class="seg" id="zoom"></div></fieldset>
    <fieldset><legend>Panes</legend><div class="seg" id="num"></div></fieldset>
  </div>
  <div class="row">
    <fieldset><legend>Variant</legend><div class="seg" id="var"></div></fieldset>
  </div>
  <div class="row">
    <button id="play" aria-pressed="true">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time">
    <span id="clock">0.00 s</span>
    <div class="seg" id="spd"></div>
    <label class="tog"><input type="checkbox" id="gray">Grayscale</label>
    <label class="tog"><input type="checkbox" id="rg">Red-green</label>
    <label class="tog"><input type="checkbox" id="rm">Reduced motion</label>
  </div>
</header>
<main><div id="panes" class="n2"></div></main>

const CURRENT = {
  id: 'current', name: 'Current', dur: 1600,

// 4. Border trace: two lit heads draw the new border from the side of the attack and meet behind; the fill follows.
function walk(cell, start, L) {
  const n = cell.length, out = { fwd: [cell[start]], bwd: [cell[start]] };

  }

    }
    glow(c, f.x, f.y, f.r * 3, PAPER, 0.32 * Math.exp(-Math.pow(front - fe * 0.4, 2) / Math.pow(30 * k, 2)));
  }
});

// 8. Close in: a lit ring tightens on the city (the wind-up of a shot), the colour closes in behind it; a flash.
variant('close', 'Close in', 900, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  const p = ph(t, 0, 540), e = p * p;
  const hit = ph(t, 540, 880);
  P.split((mc) => {
    mc.fillRect(0, 0, W, H);
    mc.globalCompositeOperation = 'destination-out';
    for (const f of fl(P)) { const R = lerp(f.creach * 1.05, f.r * 1.2, e); if (p < 1) radialMask(f.x, f.y, R, 22 * k)(mc); }
  }, sm(ph(t, 500, 620)));
  for (const f of fl(P)) {
    const col = colOf(f.to);
    if (p < 1) {
      const R = lerp(f.creach * 1.0, f.r * 1.2, e);
      c.save(); clipPoly(c, f.cell); softStroke(c, circlePath(f.x, f.y, R), 3.2 * k, col, 0.55 + 0.4 * p, PAPER, 0.45 + 0.5 * p); c.restore();
    }
    if (hit > 0 && hit < 1) {
      glow(c, f.x, f.y, f.r * 3.6, PAPER, 0.95 * Math.pow(1 - hit, 2));
      softStroke(c, circlePath(f.x, f.y, f.r * (1.2 + 1.5 * eo(hit))), 2.2 * k, col, 0.75 * (1 - hit), PAPER, 0.8 * (1 - hit));
    }
  }
});

// 9. Outline flare: the new border flares bright and wide, then settles to the normal line.
variant('flare', 'Outline flare', 1400, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  P.split(sm(ph(t, 0, 450)), sm(ph(t, 0, 280)));
  const p = ph(t, 80, 1400), rise = sm(ph(t, 0, 120));
  for (const f of fl(P)) {
    const col = colOf(f.to);
    c.save(); clipPoly(c, f.cell); c.globalCompositeOperation = "lighter"; c.fillStyle = rgba(col, 0.13 * (1 - p) * rise); c.fillRect(0, 0, W, H); c.globalCompositeOperation = "source-over";
    softStroke(c, polyPath(f.cell), (3 + 7 * (1 - eo(p))) * k, col, 0.9 * Math.pow(1 - p, 1.2) * rise, PAPER, 0.85 * Math.pow(1 - p, 2) * rise);
    c.restore();
  }
});

// 10. Wash: the whole area lights up in the new colour at once and the light ebbs to the normal tint.
variant('wash', 'Wash', 1100, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  P.split(sm(ph(t, 0, 260)), sm(ph(t, 0, 200)));
  const p = eo(ph(t, 120, 1100)), rise = sm(ph(t, 0, 140));
  for (const f of fl(P)) {
    const col = colOf(f.to), a = (1 - p) * rise;
    if (a <= 0) continue;
    // light poured into the area: additive, so the painted ground shows through; brightest at the rim like the territory glow
    c.save(); clipPoly(c, f.cell); c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(f.x, f.y, f.r * 1.2, f.x, f.y, f.creach);
    g.addColorStop(0, rgba(col, 0.24 * a)); g.addColorStop(0.65, rgba(col, 0.12 * a)); g.addColorStop(1, rgba(col, 0.2 * a));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.filter = P.feather(9 * k); c.lineJoin = 'round';
    c.strokeStyle = rgba(col, 0.55 * a); c.lineWidth = 20 * k; polyPath(f.cell)(c); c.stroke();
    c.restore();
    glow(c, f.x, f.y, f.r * 3.2, col, 0.5 * a);
    glow(c, f.x, f.y, f.r * 1.9, PAPER, 0.35 * a);
  }
});

// 11. Roads first: the colour runs out along the roads of the city, then fills the area between them.
variant('roads', 'Roads first', 1150, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  const q = eo(ph(t, 60, 600));
  P.split((mc) => {
    mc.filter = P.feather(6 * k); mc.lineCap = 'round'; mc.lineWidth = 24 * k;
    for (const f of fl(P)) for (const [nx, ny] of f.nbrs) { mc.beginPath(); mc.moveTo(f.x, f.y); mc.lineTo(lerp(f.x, nx, q), lerp(f.y, ny, q)); mc.stroke(); }
    mc.filter = 'none';
    for (const f of fl(P)) radialMask(f.x, f.y, f.creach * 1.06 * eo(ph(t, 380, 1050)), f.creach * 0.3)(mc); mc.globalAlpha = sm(ph(t, 900, 1150)); mc.fillRect(0, 0, W, H); mc.globalAlpha = 1;
  }, sm(ph(t, 0, 180)));
  for (const f of fl(P)) {
    const col = colOf(f.to);
    glow(c, f.x, f.y, f.r * 3, PAPER, 0.45 * Math.pow(1 - ph(t, 0, 300), 2));
    const fade = 1 - ph(t, 560, 760);
    if (q > 0 && fade > 0) for (const [nx, ny] of f.nbrs) {
      const hx = lerp(f.x, nx, q), hy = lerp(f.y, ny, q);
      const tx = lerp(f.x, nx, Math.max(0, q - 0.35)), ty = lerp(f.y, ny, Math.max(0, q - 0.35));
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      const g = c.createLinearGradient(tx, ty, hx, hy); g.addColorStop(0, rgba(col, 0)); g.addColorStop(1, rgba(col, 0.75 * fade));
      c.strokeStyle = g; c.lineWidth = 6 * k; c.beginPath(); c.moveTo(tx, ty); c.lineTo(hx, hy); c.stroke(); c.restore();
      glow(c, hx, hy, 15 * k, col, 0.85 * fade); glow(c, hx, hy, 6 * k, PAPER, fade);
    }
  }
});

// 12. Sheen: a band of light passes over the area from the upper left (the light of the rims); the colour turns under it.
variant('sheen', 'Sheen', 950, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  const q = eio(ph(t, 0, 900)), fe = 30 * k;
  P.through((mc) => { for (const f of fl(P)) linearMask(f.x, f.y, 0.7071, 0.7071, lerp(f.t0 - fe, f.t1 + fe, q), fe)(mc); });
  for (const f of fl(P)) {
    const front = lerp(f.t0 - fe, f.t1 + fe, q), col = colOf(f.to);
    if (q > 0 && q < 1) {
      c.save(); clipPoly(c, f.cell); c.globalCompositeOperation = 'lighter';
      const d = 0.7071, ax = f.x + d * (front - 70 * k), ay = f.y + d * (front - 70 * k), bx = f.x + d * (front + 26 * k), by = f.y + d * (front + 26 * k);
      const g = c.createLinearGradient(ax, ay, bx, by);
      g.addColorStop(0, rgba(col, 0)); g.addColorStop(0.55, rgba(col, 0.16)); g.addColorStop(0.78, rgba(PAPER, 0.34)); g.addColorStop(0.86, rgba(PAPER, 0.12)); g.addColorStop(1, rgba(PAPER, 0));
      c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
    }
    const near = Math.exp(-Math.pow(front - fe * 0.3, 2) / Math.pow(26 * k, 2));
    if (near > 0.01) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      c.strokeStyle = rgba(PAPER, 0.85 * near); c.lineWidth = 2.4 * k; c.beginPath(); c.arc(f.x, f.y, f.r + 1.5 * k, Math.PI * 1.05, Math.PI * 1.55); c.stroke(); c.restore();
      glow(c, f.x - f.r * 0.5, f.y - f.r * 0.5, f.r * 1.6, PAPER, 0.5 * near);
    }
  }
});

// 13. Echo: three rings leave the city; each one deepens the colour by a third.
variant('echo', 'Echo', 1350, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  let a = 0; for (let i = 0; i < 3; i++) a += sm(ph(t, i * 260 + 140, i * 260 + 400)) / 3;
  P.split(a, sm(ph(t, 0, 240)));
  for (const f of fl(P)) {
    const col = colOf(f.to);
    for (let i = 0; i < 3; i++) {
      const p = ph(t, i * 260, i * 260 + 720);
      if (p <= 0 || p >= 1) continue;
      c.save(); clipPoly(c, f.cell);
      softStroke(c, circlePath(f.x, f.y, f.r * 1.3 + (f.creach - f.r * 1.3) * eo(p)), (3.4 - 0.6 * i) * k, col, 0.85 * (1 - p), PAPER, 0.4 * (1 - p));
      c.restore();
    }
    glow(c, f.x, f.y, f.r * 2.6, col, 0.4 * Math.sin(Math.PI * ph(t, 0, 600)));
  }
});

// 14. Seal: a large ring of the side (own: one ring; opponent: a double ring) sets on the city, holds, dissolves.
variant('seal', 'Seal', 1200, (P, t) => {
  P.img(P.F.before); if (t < 0) return;
  const c = P.c, k = P.k * P.se;
  P.split(sm(ph(t, 160, 760)), sm(ph(t, 120, 340)));
  for (const f of fl(P)) {
    const col = colOf(f.to);
    const inP = eo(ph(t, 0, 280)), outP = ph(t, 680, 1150);
    const s = lerp(0.72, 1, inP) * (1 + 0.28 * eo(outP)), a = inP * (1 - outP);
    if (a <= 0) continue;
    const R = (f.r + 21 * k) * s;
    annulus(c, f.x, f.y, R - 9 * k, R + 14 * k, col, 0.45 * a);
    c.save(); c.globalAlpha = a; c.lineCap = 'round';
    c.strokeStyle = rgba(BG, 0.8); c.lineWidth = 7.4 * k; c.beginPath(); c.arc(f.x, f.y, R, 0, TAU); c.stroke();
    const g = c.createLinearGradient(f.x, f.y - R, f.x, f.y + R);
    g.addColorStop(0, mix(col, '#ffffff', 0.2)); g.addColorStop(1, mix(col, '#000000', 0.18));
    c.strokeStyle = g; c.lineWidth = 4.6 * k; c.beginPath(); c.arc(f.x, f.y, R, 0, TAU); c.stroke();
    c.strokeStyle = rgba(PAPER, 0.9); c.lineWidth = 1.3 * k; c.beginPath(); c.arc(f.x, f.y, R + 2.3 * k, Math.PI * 0.95, Math.PI * 1.75); c.stroke();
    if (f.to !== P.meta.me) { c.strokeStyle = rgba(PAPER, 0.95); c.lineWidth = 1.3 * k; c.beginPath(); c.arc(f.x, f.y, R - 5.6 * k, 0, TAU); c.stroke(); }
    c.restore();
  }
});

/* ---------- reduced motion: no travel, no pulse; a short cross-fade (ui-style 20, item 6) ---------- */
function reducedDraw(P, t, v) {
  if (v.id === 'current') return CURRENT.draw(P, t);
  P.img(P.F.before); if (t < 0) return;
  P.img(P.F.after, sm(ph(t, 0, 200)));
  if (v.id === 'banner') for (const f of fl(P)) banner(P.c, f, P, f.to, 1, 1 - ph(t, 2300, 2700), 0);
}

/* ---------- UI ---------- */
const CASES = [['own', 'You capture'], ['enemy', 'Enemy captures'], ['neutral', 'Neutral city'], ['province', 'Province'], ['capital', 'Capital'], ['two', 'Two at once']];
const ZOOMS = [['near', 'In'], ['far', 'Out']];
const NUMS = [['1', '1'], ['2', '2'], ['4', '4'], ['all', 'All']];
const SPEEDS = [['1', '1×'], ['0.25', '0.25×'], ['0.1', '0.1×']];
const st = { c: 'own', z: 'near', n: '2', v: ['current', 'flood', 'shock', 'banner'], s: '1', gray: false, rg: false, rm: false };
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('c')) st.c = h.get('c'); if (h.get('z')) st.z = h.get('z'); if (h.get('n')) st.n = h.get('n'); if (h.get('s')) st.s = h.get('s');
  if (h.get('v')) { const v = h.get('v').split(',').filter((x) => V.some((y) => y.id === x)); while (v.length < 4) v.push(st.v[v.length]); st.v = v; }
  for (const k of ['gray', 'rg', 'rm']) st[k] = h.get(k) === '1';
})();
function writeHash() {
  const h = new URLSearchParams({ c: st.c, z: st.z, n: st.n, v: st.v.join(','), s: st.s });
  for (const k of ['gray', 'rg', 'rm']) if (st[k]) h.set(k, '1');
  history.replaceState(null, '', '#' + h.toString());
}
function seg(id, items, get, set) {
  const el = document.getElementById(id); el.innerHTML = '';
  for (const [val, label] of items) {
    const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'radio'; i.name = id; i.value = val; i.checked = get() === val;
    i.onchange = () => { set(val); writeHash(); build(); };
    const s = document.createElement('span'); s.textContent = label; l.append(i, s); el.append(l);
  }
}
const durLabel = (v) => (v.id === 'banner' ? '1.0 s, banner 2.7 s' : v.id === 'current' ? '0.45 s, flag 1.6 s' : `${(v.dur / 1000).toFixed(2)} s`);
let panes = [];
function build() {
  seg('case', CASES, () => st.c, (v) => { st.c = v; });
  seg('zoom', ZOOMS, () => st.z, (v) => { st.z = v; });
  seg('num', NUMS, () => st.n, (v) => { st.n = v; });
  seg('var', V.map((v) => [v.id, v.name]), () => st.v[0], (v) => { st.v[0] = v; });
  seg('spd', SPEEDS, () => st.s, (v) => { st.s = v; });
  document.getElementById('gray').checked = st.gray; document.getElementById('rg').checked = st.rg; document.getElementById('rm').checked = st.rm;
  const host = document.getElementById('panes'); host.innerHTML = '';
  host.className = st.n === 'all' ? 'all' : 'n' + st.n;
  host.classList.toggle('gray', st.gray); host.classList.toggle('rg', st.rg);
  const ids = st.n === 'all' ? V.map((v) => v.id) : st.v.slice(0, Number(st.n));
  panes = ids.map((id, i) => {
    const d = document.createElement('div'); d.className = 'pane';
    const cap = document.createElement('div'); cap.className = 'cap';
    const v = V.find((x) => x.id === id);
    if (st.n === 'all' || i === 0) { const b = document.createElement('b'); b.textContent = v.name; cap.append(b); }
    else {
      const sel = document.createElement('select'); sel.setAttribute('aria-label', `Variant of pane ${i + 1}`);
      for (const x of V) { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; o.selected = x.id === id; sel.append(o); }
      sel.onchange = () => { st.v[i] = sel.value; writeHash(); build(); }; cap.append(sel);
    }
    const dd = document.createElement('span'); dd.className = 'd'; dd.textContent = durLabel(v); cap.append(dd);
    const cv = document.createElement('canvas'); cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', `${v.name}: ${CASES.find((c) => c[0] === st.c)[1]}`);
    d.append(cap, cv); host.append(d);
    if (st.n === 'all') d.onclick = () => { st.n = '1'; st.v[0] = id; writeHash(); build(); };
    const p = { id, cv }; p.P = new Ctx(p); return p;
  });
  dirty = true;
}
for (const k of ['gray', 'rg', 'rm']) document.getElementById(k).onchange = (e) => { st[k] = e.target.checked; writeHash(); build(); };

let T = 0, playing = true, last = performance.now(), dirty = true;
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(playing)); };
scrub.oninput = () => { T = (scrub.value / 1000) * LOOP; dirty = true; };
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });

function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  if (playing) { T = (T + dt * Number(st.s)) % LOOP; dirty = true; scrub.value = String(Math.round((T / LOOP) * 1000)); }
  if (dirty) {
    dirty = false;
    const key = `${st.c}-${st.z}`, F = frames(key), meta = META[key];
    const t = T - PRE;
    clock.textContent = `${(t / 1000).toFixed(2)} s`;
    if (ready(F.before) && ready(F.mid) && ready(F.after)) {
      for (const p of panes) {
        const P = p.P, w = p.cv.clientWidth || 400;
        P.size(Math.min(1600, w * Math.min(2, devicePixelRatio || 1)));
        P.begin(F, meta); P.reduced = st.rm;
        const v = V.find((x) => x.id === p.id);
        if (st.rm) reducedDraw(P, t, v); else v.draw(P, t);
      }
    } else dirty = true;
  }
  requestAnimationFrame(frame);
}
window.__seek = (ms) => { playing = false; T = ms + PRE; dirty = true; };
build(); writeHash(); requestAnimationFrame(frame);
</script>
</body>
