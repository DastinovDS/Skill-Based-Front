<title>Next supply by the stance, round 1</title>
<!-- The next supply indicator by the stance, design round 1 (#1067, after #1055). The owner (2026-11-15): the
     indicator beside the stance in the top bar is the main sign of when the next supply (the next charge) is ready,
     and it must be far more visible and readable; it is not a mark on the factories. Every variant here is a whole
     piece of the top bar: the stance, the countdown to the capital's next charge (DEC-44: `me.capital_ticks` over
     `ruleset_public.stances.capital_period_ticks[stance]`; under DEC-47 every other factory makes one charge per the
     same period on its own counter) and the moment a charge is made.
     The ground is the real client: frames of the dev scenes `economy` (the artery front: a fight at Forkway, a planned
     order, the alert strip) and `fights` (the siege), 1280 and 960 px wide, device pixel ratio 2, with the top bar
     hidden; the bar drawn here is the client's own markup and CSS (TopBar.svelte, CpGauge.svelte, MatchClock.svelte,
     the cut icons), taken from the running dev server, with only the stance chip replaced per variant.
     The model is the rule, in ticks (10 a second): each counter grows by 1 a tick and fires at the period of the
     stance in force (Economy 100, Balance 200, War 400 ticks for the capital and every factory; CP 100, 50, 40 ticks
     a 0.5 CP quantum, #900), a stance change carries each counter as `counter * new // old` (DEC-44, item 4).
     Watchpost's built factory runs on its own counter (DEC-47). Self-contained: EB Garamond and Cinzel (SIL OFL)
     from assets/in-match-cp-vp/fonts/, the frames from assets/next-supply-hud/. State in the address
     (#v=A&g=front&w=1280&t=12.0&s=0b470w860e). -->

    <rect class="g-flash" x="-9" y="0" width="18" height="18" fill="var(--ink)" opacity="0"/></g>
  <path class="g-rim" d="${loz(0, -c, GR)}${loz(0, c, GR)}" fill="none" stroke="var(--ink)" stroke-width="1" stroke-opacity=".92"/>
  ${cap(-cy)}${cap(cy)}
  </g></svg>`;
}
VARIANTS.push({
  id: 'E', name: 'Hourglass',
  build(slot, s, e) {
    slot.innerHTML = factories() + chipOpen('glass').replace('{S}', NAMES[s.stance]) + cutIcon(s.stance, 20) + glassSVG() + (e.narrow ? '' : KBD) + '</button>';
  },
  paint(slot, s, e) {
    const svg = slot.querySelector('.chip svg.pc');
    if (!svg) return;
    const q = (c) => svg.querySelector(c);
    let share = s.share, rot = 0, flash = 0;
    if (s.ev !== null) {
      if (e.rm) { if (s.ev < 1) share = 1; }
      else if (s.ev < 0.54) {
        share = 1;
        flash = s.ev < 0.06 ? (s.ev / 0.06) * 0.8 : 0.8 * (1 - easeOut((s.ev - 0.06) / 0.3));
        rot = s.ev < 0.12 ? 0 : 180 * easeEngrave((s.ev - 0.12) / 0.42);
      }
    }
    const c = GR + 0.25, neck = -c + GR - 0.4, foot = c + GR - 0.4;
    const top = lozHeight(1 - share, GR - 0.4);
    set(q('.g-top'), { y: neck - top, height: top });
    const b = lozHeight(share, GR - 0.4), yb = foot - b;
    set(q('.g-bot'), { y: yb, height: b });
    const run = share > 0.004 && share < 0.996;
    set(q('.g-head'), { y: yb - 0.55, opacity: run ? 1 : 0 });
    set(q('.g-glow'), { cy: yb, opacity: run && !e.rm ? (s.ready ? 1 : 0.6) : 0 });
    set(q('.g-stream'), { y1: 0.2, y2: yb, opacity: run && !e.rm ? 0.95 : 0 });
    set(q('.g-flash'), { opacity: clamp01(flash) });
    set(q('.g-rim'), { 'stroke-width': s.ready ? 1.25 : 0.95, 'stroke-opacity': s.ready ? 1 : 0.92 });
    set(q('.g-pil'), { 'stroke-opacity': s.ready ? 1 : 0.7 });
    set(q('.g-all'), { transform: rot ? `rotate(${rot.toFixed(2)})` : '' });
  },

/**
 * F "Cartouche": the stance chip drawn as the match clock's cartouche (T3, #1005): an outer rule and a faint inner
 * one, the plate, the L brackets, a lozenge serif each side. Inside, the stance icon and the seconds to the next
 * charge in the clock's figures. The right serif is the charge: a burin runs along the base rule toward it, and
 * when it arrives the serif sets solid, flashes and swells by a ring (the clock's beat); the figures roll.
 * Narrow: no key, the figures a size down.
 */
function cartFrame(W) {
  const H = 36, m = H / 2, id = uid('ct');
  const br = (x, y, sx, sy) => `M${x} ${y + sy * 7}V${y}H${x + sx * 7}`;
  return `<svg class="frame" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
  <defs><radialGradient id="${id}g"><stop offset="0" stop-color="#ece4d1" stop-opacity=".55"/><stop offset="1" stop-color="#ece4d1" stop-opacity="0"/></radialGradient></defs>
  <rect x="3" y="3" width="${W - 6}" height="${H - 6}" fill="var(--casing)" opacity=".55"/>
  <rect class="fo" x=".5" y=".5" width="${W - 1}" height="${H - 1}" fill="none" stroke="var(--ink)" stroke-opacity=".6"/>
  <rect x="3.5" y="3.5" width="${W - 7}" height="${H - 7}" fill="none" stroke="var(--ink)" stroke-opacity=".22"/>
  <path d="M6 ${H - 0.5}H${W - 9}" stroke="var(--casing)" stroke-width="4"/>
  <path d="M6 ${H - 0.5}H${W - 9}" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1"/>
  <path class="c-prog" d="M6 ${H - 0.5}H${W - 9}" pathLength="1" stroke="var(--own)" stroke-width="2.2" stroke-dasharray="0 2"/>
  <circle class="c-head" cy="${H - 0.5}" r="1.6" fill="var(--ink)" stroke="var(--casing)" stroke-width=".9" opacity="0"/>
  <path d="${br(-0.5, -0.5, 1, 1)}${br(W + 0.5, -0.5, -1, 1)}${br(-0.5, H + 0.5, 1, -1)}${br(W + 0.5, H + 0.5, -1, -1)}" fill="none" stroke="var(--casing)" stroke-width="4" stroke-linecap="square"/>
  <path d="${br(-0.5, -0.5, 1, 1)}${br(W + 0.5, -0.5, -1, 1)}${br(-0.5, H + 0.5, 1, -1)}${br(W + 0.5, H + 0.5, -1, -1)}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="square"/>
  <path d="${loz(0, m, 4.4)}" fill="var(--casing)"/><path d="${loz(0, m, 2.6)}" fill="var(--ink)"/>
  <circle class="c-glow" cx="${W}" cy="${m}" r="10" fill="url(#${id}g)" opacity="0"/>
  <path class="c-st" d="${loz(W, m, 7)}" fill="none" stroke="var(--casing)" stroke-width="3" opacity="0"/>
  <path class="c-sti" d="${loz(W, m, 7)}" fill="none" stroke="var(--ink)" stroke-width="1.1" opacity="0"/>
  <path d="${loz(W, m, 7)}" fill="var(--casing)"/>
  <path d="${loz(W, m, 5.2)}" fill="var(--plate)"/>
  <path class="c-made" d="${loz(W, m, 5.2)}" fill="var(--own)" opacity="0"/>
  <path class="c-flash" d="${loz(W, m, 5.2)}" fill="var(--ink)" opacity="0"/>
  <path class="c-rim" d="${loz(W, m, 5.2)}" fill="none" stroke="var(--ink)" stroke-width="1" stroke-opacity=".92"/>
</svg>`;
}
VARIANTS.push({
  id: 'F', name: 'Cartouche',
  build(slot, s, e) {
    slot.innerHTML = factories() + `<button type="button" class="chip cart svelte-1q6et7t" data-tip aria-label="Stance: ${NAMES[s.stance]} [Q]">` +
      cutIcon(s.stance, 20) + figsHTML() + (e.narrow ? '' : KBD) + '</button>';
    slot.querySelector('.cart').style.marginRight = '6px';
  },
  paint(slot, s, e) {
    const b = slot.querySelector('.cart');
    if (!b) return;
    const W = b.offsetWidth;
    let fr = b.querySelector('svg.frame');
    if (!fr || Number(fr.getAttribute('width')) !== W) { if (fr) fr.remove(); b.insertAdjacentHTML('afterbegin', cartFrame(W)); fr = b.querySelector('svg.frame'); }
    const q = (c) => fr.querySelector(c);
    set(q('.c-prog'), { 'stroke-dasharray': `${s.share.toFixed(4)} 2` });
    const run = s.share > 0.004 && s.share < 0.996;
    set(q('.c-head'), { cx: 6 + (W - 15) * s.share, opacity: run ? 1 : 0 });
    let made = 0, flash = 0, stamp = 0, sr = 0;
    if (s.ev !== null) {
      if (e.rm) made = s.ev < 1 ? 1 : 0;
      else {
        made = s.ev < 0.3 ? 1 : 1 - easeEngrave((s.ev - 0.3) / 0.5);
        flash = s.ev < 0.07 ? (s.ev / 0.07) * 0.85 : 0.85 * (1 - easeOut((s.ev - 0.07) / 0.35));
        if (s.ev < 0.42) { stamp = 0.95 * Math.sin((Math.PI * s.ev) / 0.42); sr = 5; } // the clock's swell: a larger ring inks in and out
      }
    }
    set(q('.c-made'), { opacity: clamp01(made) });
    set(q('.c-flash'), { opacity: clamp01(flash) });
    for (const c of ['.c-st', '.c-sti']) set(q(c), { d: loz(W, 18, 7 + sr), opacity: clamp01(stamp) });
    set(q('.c-rim'), { 'stroke-width': s.ready ? 1.35 : 1, 'stroke-opacity': s.ready ? 1 : 0.92 });
    set(q('.c-glow'), { opacity: s.ready && !e.rm ? 0.9 : 0 });
    paintFigs(b.querySelector('.figs'), s, s.ev, e.rm);
  },
});


// ---------------------------------------------------------------- the frame loop
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), viewport = $('#viewport'), slot = $('#slot'), hud = $('#hud'), fx = $('#fx');
let built = null;
function env() { return { narrow: P.w === 960, rm: P.rm }; }
function snapshot(t) {
  const tick = Math.min(T_END, Math.floor(t * HZ + 1e-6));
  const S = simulate(tick);
  const per = CAP_P[S.st], frac = P.rm ? 0 : t * HZ - tick;
  const shareTick = S.c / per;
  let share = Math.min(0.999, (S.c + frac) / per);
  if (P.rm) share = Math.floor(shareTick * (per / HZ) + 1e-6) / (per / HZ); // steps once a second
  const secs = Math.ceil((per - S.c) / HZ);
  const lastCap = S.capEv.length ? S.capEv[S.capEv.length - 1] : null;
  const lastFac = S.facEv.length ? S.facEv[S.facEv.length - 1] : null;
  const ev = lastCap === null ? null : t - lastCap / HZ;
  const fev = lastFac === null ? null : t - lastFac / HZ;
  return {
    t, tick, stance: S.st, per, c: S.c, share, shareTick, secs, ready: secs <= 3,
    ev: ev !== null && ev < 1.8 ? ev : null, fev: fev !== null && fev < 1.2 ? fev : null,
    cp: S.v, cpShare: Math.min(1, (S.q + frac) / CP_P[S.st]), cpSecs: Math.ceil((CP_P[S.st] - S.q) / HZ),
  };
}
function tipText(s) {
  if (P.v === 'T0') return `Next 0.5 CP in ${s.cpSecs} s, next charge of the capital in ${s.secs} s. Your other factories run at the same pace on their own progress. A change of stance keeps the progress of all`;
  // The copy proposed with this round (design:ux-copy): the charge first, the one fact about the other factories.
  return `${NAMES[s.stance]} [Q]. Next charge of the capital in ${s.secs} s, next 0.5 CP in ${s.cpSecs} s. Your other factories make theirs at the same pace`;
}
function build(s) {
  slot.innerHTML = '';
  hud.querySelectorAll('.extra').forEach((e) => e.remove());
  const V = VARIANTS.find((x) => x.id === P.v);
  V.build(slot, s, env());
  built = { v: P.v, stance: s.stance, w: P.w };
}
function paintCp(s) {
  const unit = 30, X = 6, cp = s.cp / 100;
  const end = s.cp >= CP_CAP ? null : Math.min(5, cp + s.cpShare * 0.5);
  const g = $('.cp');
  set(g.querySelector('rect.bar'), { width: unit * cp });
  set(g.querySelector('rect.quantum'), { x: X + unit * cp, width: end === null ? 0 : unit * (end - cp) });
  const notch = g.querySelector('path.notch');
  set(notch, { visibility: end === null ? 'hidden' : 'visible', transform: `translate(${end === null ? 0 : X + unit * end} 0)` });
  set(g.querySelector('path.needle'), { transform: `translate(${X + unit * cp} 0)` });
  g.querySelector('.digits').textContent = fmtCp(s.cp);
  g.setAttribute('aria-label', `CP: ${fmtCp(s.cp)} of 5`);
  const left = 660 - Math.floor(s.t);
  $('text.figures').textContent = mmss(left);
  const vp = ((s.tick % 300) + (P.rm ? 0 : s.t * HZ - s.tick)) / 300;
  const fill = $('.rail-fill');
  if (fill) fill.style.width = `${(P.rm ? Math.floor(vp * 30) / 30 : vp) * 100}%`;
}
function paint() {
  const s = snapshot(P.t);
  if (!built || built.v !== P.v || built.stance !== s.stance || built.w !== P.w) build(s);
  paintCp(s);
  const V = VARIANTS.find((x) => x.id === P.v);
  const e = env();
  V.paint(slot, s, e);
  const chip = slot.querySelector('[data-tip]');
  if (chip) chip.title = tipText(s);
  // the flight from the piece to the capital's store (variants that send one)
  const src = V.flight ? slot.parentElement.closest('.hud').querySelector('[data-fly]') : null;
  let from = null;
  if (src) {
    const sr = stage.getBoundingClientRect(), b = src.getBoundingClientRect(), k = sr.width / stage.offsetWidth;
    from = [(b.left + b.width / 2 - sr.left) / k, (b.top + b.height / 2 - sr.top) / k];
  }
  paintFlight(fx, from, CAPITAL[`${P.g}-${P.w}`], s.ev, P.rm);
  $('#tout').textContent = mmss(Math.floor(P.t));
  $('#scrub').value = String(P.t);
}
function layout() {
  const [w, h] = SIZE[P.w];
  stage.style.width = `${w}px`; stage.style.height = `${h}px`;
  fx.setAttribute('width', w); fx.setAttribute('height', h);
  stage.classList.toggle('narrow', P.w === 960);
  stage.classList.toggle('stage-tug', P.w === 1280);
  stage.classList.toggle('grey', P.gr);
  document.documentElement.dataset.motion = P.rm ? 'reduced' : '';
  const img = $('#ground'), src = `assets/next-supply-hud/${GROUNDS[P.g]}-${P.w}.webp`;
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  img.style.width = `${w}px`; img.style.height = `${h}px`;
  const avail = Math.min(document.documentElement.clientWidth - 32, 1600);
  let k, vw, vh;
  if (P.cu) { // the close-up: the left of the bar and the map under it, twice as large
    const cw = P.w === 960 ? 480 : 640, ch = 150;
    k = Math.min(avail / cw, 3); vw = cw * k; vh = ch * k;
  } else { k = Math.min(avail / w, 1); vw = w * k; vh = h * k; }
  stage.style.transform = `scale(${k})`;
  viewport.style.width = `${vw}px`; viewport.style.height = `${vh}px`;
  built = null;
}
function writeHash() {
  const sc = script.map(([t, s]) => `${t}${s[0]}`).join('');
  const h = `#v=${P.v}&g=${P.g}&w=${P.w}&t=${P.t.toFixed(1)}&s=${sc}${P.cu ? '&cu=1' : ''}${P.rm ? '&rm=1' : ''}${P.gr ? '&gr=1' : ''}${P.play ? '' : '&p=0'}`;
  history.replaceState(null, '', h);
}
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('v') && VARIANTS.some((x) => x.id === q.get('v'))) P.v = q.get('v');
  if (q.get('g') in GROUNDS) P.g = q.get('g');
  if (q.get('w') === '960' || q.get('w') === '1280') P.w = Number(q.get('w'));
  if (q.get('t') !== null) P.t = Math.max(0, Math.min(T_END / HZ, Number(q.get('t')) || 0));
  const m = (q.get('s') || '').match(/(\d+)([ebw])/g);
  if (m && m.length) script = m.map((x) => [Number(x.slice(0, -1)), { e: 'economy', b: 'balance', w: 'war' }[x.slice(-1)]]);
  P.cu = q.get('cu') === '1'; P.rm = q.get('rm') === '1'; P.gr = q.get('gr') === '1';
  if (q.get('p') === '0') P.play = false;
}
function buttons(host, items, key, onpick) {
  host.innerHTML = '';
  for (const [val, label, k] of items) {
    const b = document.createElement('button');
    b.className = 'pick'; b.type = 'button';
    b.innerHTML = k ? `<span class="k">${k}</span>${label}` : label;
    b.setAttribute('aria-pressed', String(P[key] === val));
    b.onclick = () => { onpick ? onpick(val) : (P[key] = val); refresh(); };
    host.appendChild(b);
  }
}
function setStance(st) { // a SetStance applied at the next tick; later changes of the script are dropped
  const k = Math.min(T_END, Math.floor(P.t * HZ + 1e-6) + 1);
  const cur = simulate(k - 1).st;
  script = script.filter(([t]) => t < k);
  if (cur !== st) script.push([k, st]);
}
function refresh() {
  buttons($('#vbtns'), VARIANTS.map((x) => [x.id, x.name, x.id]), 'v');
  const cur = simulate(Math.floor(P.t * HZ + 1e-6)).st;
  buttons($('#sbtns'), ['economy', 'balance', 'war'].map((s) => [s, NAMES[s]]), '_s', setStance);
  $('#sbtns').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(['economy', 'balance', 'war'][i] === cur)));
  buttons($('#gbtns'), [['front', 'Front'], ['siege', 'Siege']], 'g');
  buttons($('#wbtns'), [[1280, '1280'], [960, '960']], 'w');
  buttons($('#cbtns'), [[false, 'Screen'], [true, 'Close-up']], 'cu');
  $('#play').textContent = P.play ? 'Pause' : 'Play';
  $('#play').setAttribute('aria-pressed', String(!P.play));
  $('#rmb').setAttribute('aria-pressed', String(P.rm));
  $('#grb').setAttribute('aria-pressed', String(P.gr));
  layout(); paint(); writeHash();
}
$('#play').onclick = () => { P.play = !P.play; refresh(); };
$('#scrub').oninput = (e) => { P.t = Number(e.target.value); paint(); writeHash(); refreshStance(); };
$('#jump').onclick = () => {
  const all = simulate(T_END).capEv.map((k) => k / HZ).filter((x) => x > P.t + 2.05);
  P.t = all.length ? all[0] - 2 : 0; P.play = true; refresh();
};
$('#moreb').onclick = () => { const o = $('#ctl').classList.toggle('open'); $('#moreb').setAttribute('aria-expanded', String(o)); };
$('#rmb').onclick = () => { P.rm = !P.rm; refresh(); };
$('#grb').onclick = () => { P.gr = !P.gr; refresh(); };
function refreshStance() {
  const cur = simulate(Math.floor(P.t * HZ + 1e-6)).st;
  $('#sbtns').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(['economy', 'balance', 'war'][i] === cur)));
}
window.addEventListener('resize', () => { layout(); paint(); });
document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); P.play = !P.play; refresh(); }
  const v = VARIANTS.find((x) => x.id.toLowerCase() === e.key.toLowerCase() || (e.key === '0' && x.id === 'T0'));
  if (v) { P.v = v.id; refresh(); }
});
let lastNow = null, lastStance = null, lastHashAt = 0;
function frame(now) {
  if (P.play && lastNow !== null) {
    P.t += (now - lastNow) / 1000;
    if (P.t >= T_END / HZ) P.t = 0;
    paint();
    const st = simulate(Math.floor(P.t * HZ + 1e-6)).st;
    if (st !== lastStance) { lastStance = st; refreshStance(); }
    if (now - lastHashAt > 500) { writeHash(); lastHashAt = now; }
  }
  lastNow = now;
  requestAnimationFrame(frame);
}
window.addEventListener('hashchange', () => { readHash(); refresh(); });
readHash();
document.fonts.ready.then(() => { refresh(); requestAnimationFrame(frame); });
refresh();
