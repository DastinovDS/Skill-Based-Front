<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helmets, round 2</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--dim:#9da7b3;--you:#5b9bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
header{position:sticky;top:0;z-index:5;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.row+.row{margin-top:6px}
h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
h1 a{color:var(--you);text-decoration:none;font-weight:400}
fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0;align-items:center}
legend{float:left;color:var(--dim);font-size:12px;min-width:58px;padding-right:6px;line-height:32px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg label{position:relative;cursor:pointer;background:var(--surface2);border-right:1px solid var(--border)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:block;padding:6px 10px;min-height:32px;font-size:13px;white-space:nowrap}
.seg input:checked+span{background:var(--you);color:#0d1117;font-weight:600}
.seg input:focus-visible+span{outline:2px solid #f0f6fc;outline-offset:-2px}
.tog{display:inline-flex;gap:6px;align-items:center;min-height:32px;padding:0 4px;color:var(--text);font-size:13px;cursor:pointer}
.tog input{width:16px;height:16px;margin:0;accent-color:var(--you)}
main{padding:10px 12px 28px}
#panes{display:grid;gap:10px;justify-content:center}
#panes.n1{grid-template-columns:minmax(0,1320px)}
#panes.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
#panes.n3,#panes.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
#panes.all{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.pane{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cap{display:flex;gap:8px;align-items:center;padding:4px 8px;min-height:36px;font-size:13px}
.cap b{font-weight:600}
.cap small{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
.cap select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit;min-height:28px}
.cap select:focus-visible{outline:2px solid #f0f6fc}
.frame{display:block;width:100%;background:#000}
.frame img{display:block;width:100%;height:auto}
.all .pane{cursor:pointer}
.all .pane:focus-visible{outline:2px solid #f0f6fc}
.gray .frame img{filter:grayscale(1)}
.rg .frame img{filter:url(#deutan)}
.gray.rg .frame img{filter:grayscale(1)}
@media (max-width:760px){#panes.n2,#panes.n3,#panes.n4{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="deutan"><feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/></filter></svg>
<header>
  <div class="row">
    <h1>Helmets, round 2 <a href="https://github.com/DastinovDS/Skill-Based-Front/issues/775">#775</a></h1>
    <fieldset id="f-cmp"><legend>Show</legend><div class="seg" id="cmp"></div></fieldset>
    <label class="tog"><input type="checkbox" id="gray"> Grey</label>
    <label class="tog"><input type="checkbox" id="rg"> Red-green</label>
  </div>
  <div class="row"><fieldset><legend>Scene</legend><div class="seg" id="scene"></div></fieldset></div>
  <div class="row" id="vrow"><fieldset><legend>Variant</legend><div class="seg" id="variant"></div></fieldset></div>
</header>
<main><div id="panes" aria-live="polite"></div></main>
<script>
const SCENES = [{"id": "far", "name": "Far"}, {"id": "front", "name": "Front"}, {"id": "crowd", "name": "Close"}, {"id": "terrain", "name": "Terrain"}, {"id": "fog", "name": "Fog"}, {"id": "orders", "name": "Orders"}, {"id": "arena", "name": "Arena"}, {"id": "states", "name": "Selected"}, {"id": "replay", "name": "Replay"}, {"id": "badge", "name": "Badge"}, {"id": "sheet", "name": "Pieces"}];
const VARIANTS = [{"id": "base", "name": "Triangle", "tags": "now"}, {"id": "march", "name": "March ★", "tags": "faces where it goes"}, {"id": "rim", "name": "Rim", "tags": "own right, enemy left"}, {"id": "brim", "name": "Brim", "tags": "small brim"}, {"id": "peak", "name": "Peak", "tags": "long peak"}, {"id": "pot", "name": "Bold", "tags": "thick outline, no strap"}, {"id": "loop", "name": "Strap", "tags": "full strap"}, {"id": "bare", "name": "Bare", "tags": "no strap"}, {"id": "solid", "name": "Solid", "tags": "flat colour"}, {"id": "gauge", "name": "Full", "tags": "full or empty, chip 3/5"}, {"id": "band", "name": "Band", "tags": "one silhouette, enemy band"}, {"id": "number", "name": "Number", "tags": "count on the dome"}, {"id": "cook", "name": "Art", "tags": "SpriteCook silhouette"}];
const CMP = [['1', 'One'], ['2', 'Two'], ['4', 'Four'], ['all', 'All']];
const DEFAULTS = ["base", "march", "rim", "cook"];

const state = { scene: SCENES[0].id, cmp: '2', v: [...DEFAULTS], gray: false, rg: false };
const known = (id) => VARIANTS.some((v) => v.id === id);

function read() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (SCENES.some((s) => s.id === h.get('scene'))) state.scene = h.get('scene');
  if (CMP.some(([id]) => id === h.get('show'))) state.cmp = h.get('show');
  const v = (h.get('v') ?? '').split(',').filter(known);
  v.forEach((id, i) => { if (i < 4) state.v[i] = id; });
  state.gray = h.get('grey') === '1';
  state.rg = h.get('rg') === '1';
}
function write() {
  const h = new URLSearchParams({ scene: state.scene, show: state.cmp, v: state.v.join(',') });
  if (state.gray) h.set('grey', '1');
  if (state.rg) h.set('rg', '1');
  history.replaceState(null, '', '#' + h);
}
function seg(host, name, items, value, pick) {
  host.textContent = '';
  for (const [id, label] of items) {
    const l = document.createElement('label');
    const i = document.createElement('input');
    i.type = 'radio'; i.name = name; i.value = id; i.checked = id === value;
    i.addEventListener('change', () => pick(id));
    const s = document.createElement('span');
    s.textContent = label;
    l.append(i, s);
    host.append(l);
  }
}
const src = (variant, scene) => `assets/unit-helmets-r2/${variant}/${scene}.webp`;
const byId = (id) => VARIANTS.find((v) => v.id === id);
const sceneOf = () => SCENES.find((s) => s.id === state.scene);

function pane(variant, index, all) {
  const v = byId(variant);
  const p = document.createElement('section');
  p.className = 'pane';
  const cap = document.createElement('div');
  cap.className = 'cap';
  if (all || index === null) {
    const b = document.createElement('b');
    b.textContent = v.name;
    cap.append(b);
  } else {
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Variant of pane ' + (index + 1));
    for (const o of VARIANTS) sel.add(new Option(o.name, o.id, false, o.id === variant));
    sel.addEventListener('change', () => { state.v[index] = sel.value; render(); });
    cap.append(sel);
  }
  const t = document.createElement('small');
  t.textContent = v.tags;
  cap.append(t);
  const f = document.createElement('div');
  f.className = 'frame';
  const img = new Image();
  img.loading = all ? 'lazy' : 'eager';
  img.alt = `${v.name}: ${sceneOf().name}`;
  img.src = src(variant, state.scene);
  f.append(img);
  p.append(cap, f);
  if (all) {
    p.tabIndex = 0;
    p.setAttribute('role', 'button');
    p.setAttribute('aria-label', 'Open ' + v.name);
    const open = () => { state.cmp = '1'; state.v[0] = variant; render(); };
    p.addEventListener('click', open);
    p.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  }
  return p;
}
function render() {
  seg(document.getElementById('scene'), 'scene', SCENES.map((s) => [s.id, s.name]), state.scene, (id) => { state.scene = id; render(); });
  seg(document.getElementById('cmp'), 'cmp', CMP, state.cmp, (id) => { state.cmp = id; render(); });
  seg(document.getElementById('variant'), 'variant', VARIANTS.map((v) => [v.id, v.name]), state.v[0], (id) => { state.v[0] = id; render(); });
  document.getElementById('vrow').hidden = state.cmp !== '1';
  document.getElementById('gray').checked = state.gray;
  document.getElementById('rg').checked = state.rg;
  document.body.classList.toggle('gray', state.gray);
  document.body.classList.toggle('rg', state.rg);
  const host = document.getElementById('panes');
  host.textContent = '';
  if (state.cmp === 'all') {
    host.className = 'all';
    for (const v of VARIANTS) host.append(pane(v.id, null, true));
  } else {
    const n = Number(state.cmp);
    host.className = 'n' + n;
    for (let i = 0; i < n; i++) host.append(pane(state.v[i], n === 1 ? null : i, false));
  }
  write();
}
document.getElementById('gray').addEventListener('change', (e) => { state.gray = e.target.checked; render(); });
document.getElementById('rg').addEventListener('change', (e) => { state.rg = e.target.checked; render(); });
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.altKey || e.metaKey || e.ctrlKey) return;
  const step = (list, value, d) => list[(list.indexOf(value) + d + list.length) % list.length];
  const v = VARIANTS.map((x) => x.id);
  const s = SCENES.map((x) => x.id);
  if (e.key === '[') { state.v[0] = step(v, state.v[0], -1); render(); }
  if (e.key === ']') { state.v[0] = step(v, state.v[0], 1); render(); }
  if (e.key === ',') { state.scene = step(s, state.scene, -1); render(); }
  if (e.key === '.') { state.scene = step(s, state.scene, 1); render(); }
});
addEventListener('hashchange', () => { read(); render(); });
read();
render();
</script>
</body>
</html>
