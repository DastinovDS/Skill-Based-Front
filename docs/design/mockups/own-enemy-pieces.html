<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own and enemy pieces</title>
<!-- Own and enemy pieces beyond colour, design round 1 (#1071). The audit of 2026-11-15
     (finding 2): own and enemy helmets differ in hue but hardly in lightness, so in grey, for a
     colour-blind player and at a glance only the Rim/Cut shape tells them apart. Every variant keeps
     Rim/Cut and the facing and adds one carrier that is not the hue.
     The ground is the real client: frames of a dev scene on the pool map `crossroads` (the
     `provinces` moment with a fight at Middle Court, enemy figures on roads in every level, memories
     in the fog, own groups on roads and in cities and provinces), near 2.0, normal 1.0 and far 0.52
     css px per world unit, 1280 x 760 css px at device pixel ratio 2, in five colour pairs of DEC-49.
     Each frame was taken with the helmets, the arena chips and their chevrons hidden; every piece is
     drawn back here at the place, size and fill the client gave it (its token and chip transforms),
     with the client's own outlines (units/helmet.ts) and numbers (render/style.ts HELMET_ENGRAVED,
     bakedShapes.ts). T0 is that drawing with today's look; it matches the client's frame.
     Self-contained: EB Garamond (SIL OFL) from assets/in-match-cp-vp/fonts/, the frames from
     assets/own-enemy-pieces/. State in the address (#v=A&z=normal&p=lapis-minium&g=0); `face=right`
     turns every helmet to face right (used only for the blind check, so facing tells nothing). -->
<style>
@font-face{font-family:'EB Garamond';src:url(assets/in-match-cp-vp/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
:root{--stone:#16130f;--panel:#1d1a15;--ink:#ece4d1;--ink-soft:#cfc4ab;--ink-dim:#ada38f;--rule:#7d7363;--line:#3d372d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--stone);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--stone);padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font:600 20px/1 'EB Garamond',Georgia,serif;letter-spacing:.04em;margin:0 8px 0 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:9px}
.bar:first-child{margin-top:0}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lab{font:600 12px/1 'EB Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-right:3px}
button.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 10px;font:500 13px/1 system-ui,sans-serif;cursor:pointer;border-radius:0;min-height:30px;display:inline-flex;align-items:center;gap:6px}
button.chip:hover{border-color:var(--rule);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#16130f;border-color:var(--ink);font-weight:650}
button.chip .k{opacity:.7;font-weight:700}
button.chip.var{padding:7px 11px;font-size:14px}
button.chip.ref{border-style:dashed}
button.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sw{display:inline-block;width:11px;height:11px;border:1px solid #060504;box-shadow:0 0 0 1px #3d372d}
main{padding:10px 16px 24px}
#cap{margin:0 0 8px;font:500 16px/1.35 'EB Garamond',Georgia,serif;color:var(--ink-soft);max-width:1280px;min-height:1.4em}
#cap b{color:var(--ink);font-weight:650;margin-right:8px}
.wrap{position:relative;background:#0b0a08;border:1px solid var(--line);overflow:hidden;max-width:1280px}
canvas{display:block;width:100%}
#view:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.gray .wrap{filter:grayscale(1)}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>Own and enemy pieces</h1>
    <div class="group" id="vars" role="group" aria-label="Variant"></div>
  </div>
  <div class="bar">
    <div class="group" role="group" aria-label="Zoom"><span class="lab">Zoom</span><button class="chip" data-z="near">Near</button><button class="chip" data-z="normal">Normal</button><button class="chip" data-z="far">Far</button></div>
    <div class="group" id="pairs" role="group" aria-label="Colours: yours and the opponent's"><span class="lab">Colours</span></div>
    <div class="group"><button class="chip" id="gray" aria-pressed="false">Grey</button></div>
  </div>
</header>
<main>

  const pale = lighten(COLOURS[t.kind === 'own' ? pair[0] : pair[1]], E.pale);
  if (t.dashed) {
    // Numbers unknown, or a memory: a see-through plate, a pale strap and a beaded outline.
    const n = Math.max(12, Math.round(E.bead.count * Math.min(1, k))), rad = Math.max(0.5, E.bead.radius * Math.min(1, k * 1.2));
    fillPoly(ctx, h.dome, C.plate, E.unknownPlate);
    if (L.rules) { ctx.save(); poly(ctx, h.dome); ctx.clip(); rules(ctx, h.dome, L.rules.angle, Math.max(L.rules.pitch * 1.2, 3.4 / PPU)); ctx.lineWidth = hair(0.75); ctx.strokeStyle = pale; ctx.globalAlpha = 0.42; ctx.lineCap = 'butt'; ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1; }
    for (const ln of gearOf(h)) strokePoly(ctx, ln, hair(0.9), pale, false);
    beadRow(ctx, h.dome, n, rad, pale);
    return;
  }
  gearCasing(ctx, h, Ln, L, casing);
  strokePoly(ctx, h.dome, casing * 0.9, C.casing);
  fillPoly(ctx, h.dome, C.plate);
  emptyHatch(ctx, h, L);
  gearLines(ctx, h, Ln, L);
  level(ctx, h, t.fillShown, L);
  if (L.notch) notch(ctx, h);
  strokePoly(ctx, h.dome, hair(L.edge.w), L.edge.color);
}
function glyph(ctx, text, x, y, size) {
  ctx.font = `600 ${size}px 'EB Garamond', Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(text), base = y + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = C.cut; ctx.globalAlpha = 1; ctx.strokeText(text, x, base);
  ctx.fillStyle = C.ink; ctx.fillText(text, x, base);
}
// `face=right` in the address (the blind check only): every helmet faces right, so facing tells nothing.
const FACE_RIGHT = new URLSearchParams(location.hash.slice(1)).get('face') === 'right';
function drawToken(ctx, t, v, pair) {
  if (FACE_RIGHT && t.body[0] < 0) t = { ...t, body: [-t.body[0], t.body[1], t.body[2], t.body[3], t.body[4], t.body[5]], number: { x: -t.number.x, y: t.number.y } };
  faded(ctx, t.alpha, (c) => {
    at(c, t.body); drawTokenBody(c, t, v, pair);
    at(c, t.view);
    if (t.text !== null) glyph(c, t.text, t.number.x, t.number.y, E.font);
    else if (t.question) glyph(c, '?', t.number.x, t.number.y, E.question);
  });
}

// An arena chip (helmetChipSpec): one pitch wide (20 px), charged solid, empty hatched, killed stippled.
function drawChip(ctx, ch, v, pair) {
  const [, state, kind] = ch.key.split(':'), h = helmet(kind, 20), Ln = lines(20), L = look(v, kind, pair);
  at(ctx, ch.m);
  if (state === 'killed') {
    beadRow(ctx, h.dome, STIPPLE.count, STIPPLE.radius, C.ink); // the client fades them to 0.55
    return;
  }
  gearCasing(ctx, h, Ln, L, E.casing);
  strokePoly(ctx, h.dome, E.casing * 0.9, C.casing);
  if (state === 'charged') { fillPoly(ctx, h.dome, L.fill); if (L.rules || L.core) level(ctx, h, 1, L); }
  else { fillPoly(ctx, h.dome, C.plate); emptyHatch(ctx, h, L); }
  gearLines(ctx, h, Ln, L);
  if (L.notch) notch(ctx, h);
  strokePoly(ctx, h.dome, hair(L.edge.w), L.edge.color);
}
// A chevron badge (chevronBadgeSpec): the strokes on a dark outline 2.6 wider.
function drawBadge(ctx, b) {
  const [, dir, n, size] = b.key.split(':'), count = Math.min(3, Number(n)), s = Number(size), y = dir === 'up' ? 1 : -1;
  at(ctx, b.m);
  const strokes = [];
  for (let i = 0; i < count; i++) { const oy = (i - (count - 1) / 2) * s * 0.46; strokes.push([{ x: -s * 0.56, y: y * s * 0.26 + oy }, { x: 0, y: -y * s * 0.26 + oy }, { x: s * 0.56, y: y * s * 0.26 + oy }]); }
  for (const [tone, w] of [[C.cut, s * BADGE.stroke + BADGE.outline], [dir === 'up' ? C.up : C.down, s * BADGE.stroke]]) for (const st of strokes) strokePoly(ctx, st, w, tone, false);
}

// The selection (B6 Corner ticks): four ivory L ticks at the corners of the box round the helmet as
// drawn (2 clear of it), on a dark casing; the hover two of them, a lighter ivory.
function tickBox(t) {
  const h = helmet(t.kind, t.width), e = extent(h), enemy = t.kind === 'enemy';
  return { x0: (enemy ? -e.right : e.left) - TICKS.gap, x1: (enemy ? -e.left : e.right) + TICKS.gap, y0: e.top - TICKS.gap, y1: e.bottom + TICKS.gap };
}
function drawTicks(ctx, t, v, kindOfLook, grow) {
  const b = tickBox(t), all = [[b.x0, b.y0, 1, 1], [b.x1, b.y0, -1, 1], [b.x1, b.y1, -1, -1], [b.x0, b.y1, 1, -1]];
  const corners = kindOfLook === 'select' ? all : [all[0], all[2]];
  at(ctx, t.view);
  for (const [w, color, a] of [[TICKS.casing, C.casing, TICKS.casingA], [TICKS.ink, C.ivory, kindOfLook === 'select' ? 1 : TICKS.hover]]) {
    for (const [x, y, sx, sy] of corners) {
      const ox = -sx * grow, oy = -sy * grow;
      strokePoly(ctx, [{ x: x + ox + sx * TICKS.arm, y: y + oy }, { x: x + ox, y: y + oy }, { x: x + ox, y: y + oy + sy * TICKS.arm }], w, color, false, a, 'butt');
    }
  }
}

// =============================================================================================
// The view.
// =============================================================================================
const view = document.getElementById('view'), ctx = view.getContext('2d');
const state = { v: 'T0', z: 'normal', p: 0, g: false, sel: null, hover: null, selAt: 0 };
let PAIR = PAIRS[0];
const IMG = {};
function frame() { const key = `${PAIRS[state.p].join('-')}-${state.z}`; if (!IMG[key]) { IMG[key] = new Image(); IMG[key].onload = draw; IMG[key].src = FRAMES[key]; } return IMG[key]; }
const pieces = () => DATA[state.z];
function draw() {
  PAIR = PAIRS[state.p];
  const img = frame(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 2560, 1520);
  if (!img.complete || !img.naturalWidth) return;
  ctx.drawImage(img, 0, 0, 2560, 1520);
  const d = pieces();
  d.tokens.forEach((t) => drawToken(ctx, t, state.v, PAIR));
  for (const c of d.chips) if (c.key.startsWith('hel-chip')) faded(ctx, c.key.includes(':killed:') ? STIPPLE.alpha * c.alpha : c.alpha, (x) => drawChip(x, c, state.v, PAIR));
  for (const c of d.chips) if (c.key.startsWith('badge')) faded(ctx, c.alpha, (x) => drawBadge(x, c));
  const now = performance.now();
  const grow = (since) => TICKS.grow * (1 - easeOut(Math.min(1, (now - since) / TICKS.ms)));
  if (state.hover !== null && state.hover !== state.sel) drawTicks(ctx, d.tokens[state.hover], state.v, 'hover', grow(state.hoverAt));
  if (state.sel !== null && d.tokens[state.sel]) drawTicks(ctx, d.tokens[state.sel], state.v, 'select', grow(state.selAt));
  if (now - Math.max(state.selAt, state.hoverAt || 0) < TICKS.ms + 20) requestAnimationFrame(draw);
}
const easeOut = (t) => 1 - (1 - t) ** 3;
function hit(ev) {
  const r = view.getBoundingClientRect(), x = ((ev.clientX - r.left) / r.width) * 1280, y = ((ev.clientY - r.top) / r.height) * 760;
  let best = null, bd = Infinity;
  pieces().tokens.forEach((t, i) => {
    if (t.ghost) return;
    const s = Math.hypot(t.view[0], t.view[1]), d = Math.hypot(x - t.view[4], y - t.view[5]), reach = Math.max(14, (t.width / 2 + 3) * s);
    if (d < reach && d < bd) { bd = d; best = i; }
  });
  return best;
}
view.addEventListener('pointermove', (ev) => { const h = hit(ev); if (h !== state.hover) { state.hover = h; state.hoverAt = performance.now(); view.style.cursor = h === null ? 'default' : 'pointer'; draw(); } });
view.addEventListener('pointerleave', () => { state.hover = null; draw(); });
view.addEventListener('click', (ev) => { state.sel = hit(ev); state.selAt = performance.now(); save(); draw(); });
view.addEventListener('keydown', (ev) => {
  const own = pieces().tokens.map((t, i) => [t, i]).filter(([t]) => t.kind === 'own').map(([, i]) => i);
  if (ev.key === 'Enter') { const k = own.indexOf(state.sel); state.sel = own[(k + 1) % own.length]; state.selAt = performance.now(); draw(); ev.preventDefault(); }
  if (ev.key === 'Escape') { state.sel = null; draw(); }
});

// =============================================================================================
// Controls and the address.
// =============================================================================================
const vars = document.getElementById('vars');
for (const v of VARIANTS) {
  const b = document.createElement('button'); b.className = 'chip var' + (v.ref ? ' ref' : ''); b.dataset.v = v.id;
  b.innerHTML = `<span class="k">${v.id}</span>${v.name}`; b.onclick = () => { state.v = v.id; sync(); }; vars.appendChild(b);
}
const pairs = document.getElementById('pairs');
PAIRS.forEach((p, i) => {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.p = String(i);
  b.setAttribute('aria-label', `You ${NAMES[p[0]]}, the opponent ${NAMES[p[1]]}`);
  b.innerHTML = `<span class="sw" style="background:${COLOURS[p[0]]}"></span><span class="sw" style="background:${COLOURS[p[1]]}"></span>`;
  b.title = `You ${NAMES[p[0]]}, the opponent ${NAMES[p[1]]}`; b.onclick = () => { state.p = i; sync(); }; pairs.appendChild(b);
});
for (const b of document.querySelectorAll('[data-z]')) b.onclick = () => { state.z = b.dataset.z; state.sel = defaultSel(); sync(); };
document.getElementById('gray').onclick = () => { state.g = !state.g; sync(); };
function defaultSel() { const i = pieces().tokens.findIndex((t) => t.kind === 'own' && t.text === '2' && !t.inside); return i < 0 ? null : i; }
function save() { history.replaceState(null, '', '#' + currentHash()); }
function sync() {
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === state.v));
  for (const b of document.querySelectorAll('[data-z]')) b.setAttribute('aria-pressed', String(b.dataset.z === state.z));
  for (const b of document.querySelectorAll('[data-p]')) b.setAttribute('aria-pressed', String(Number(b.dataset.p) === state.p));
  document.getElementById('gray').setAttribute('aria-pressed', String(state.g));
  document.body.classList.toggle('gray', state.g);
  const v = VARIANTS.find((x) => x.id === state.v), p = PAIRS[state.p];
  document.getElementById('cap').innerHTML = `<b>${v.id} ${v.name}</b>${v.line}`;
  view.setAttribute('aria-label', `${v.name}, ${state.z} zoom, you ${NAMES[p[0]]} against ${NAMES[p[1]]}${state.g ? ', grey' : ''}`);
  save(); draw();
}
function load() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (VARIANTS.some((v) => v.id === q.get('v'))) state.v = q.get('v');
  if (['near', 'normal', 'far'].includes(q.get('z'))) state.z = q.get('z');
  const pi = PAIRS.findIndex((p) => p.join('-') === q.get('p')); if (pi >= 0) state.p = pi;
  state.g = q.get('g') === '1';
  state.sel = q.has('sel') ? (q.get('sel') === 'none' ? null : Number(q.get('sel'))) : defaultSel();
  state.hoverAt = 0;
  sync();
}
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== currentHash()) load(); });
const currentHash = () => `v=${state.v}&z=${state.z}&p=${PAIRS[state.p].join('-')}&g=${state.g ? 1 : 0}`;
load();
document.fonts.load("600 12px 'EB Garamond'").then(draw, draw);

</script>
</body>
</html>
