<!doctype html>
<!--
  Road fortifications, the look (#707, DEC-43 item D). Design exploration only: not client code, not the simulation.
  Self-contained: no network, no libraries. Open as a file.
  The owner's idea: "a line with rectangular protrusions across the road, near the border towards the next node".
  Six looks of that idea (F1..F6) and, as a separate switch group, six ways to show the toll (T1..T6), combinable.
  The mechanics shown are the agreed ones, not decided here: bought for CP (1.5) from the city radial menu, built in 100 ticks,
  several on one path stack, an enemy group crossing the line towards the fortified node pays 1 charge per started 3 units
  (never below 0), own groups and enemies moving away pass free, seen with the edge half, destroyed when its node is captured.
  The toy: one fixed map, the Voronoi territory of the real client, roads of the real style, groups as inverted triangles.
  Forts are drawn from a baked-sprite cache (AGENTS.md 7.2): the cache size per look is the "baked" number in each panel header.
  Marks keep a minimum size on the screen when zoomed out (like the construction plate, ui-style 9.3), geometry does not.
  Round 2 (owner feedback, #707): the default view is now the owner's sketch, a fortification as a segment of the territory border
  (B1..B3: 3, 5 and 7 blocks, block width and gap fixed, the count is what fits), on a sharp bend or a curve of the border, with the toll
  as the T5 ripple plus the combat hit of the fight (H1..H3, ui-style 9.9 and 29). Round 1 (F1..F6, T1..T6) is behind "Round 1".
  Round 4 (owner picked C7 Long run and K6 Beam): they are the default; fixes: a stacked line is a clean parallel copy of the border run, a flat line glyph in
  the radial menu, three cleaner pick previews (P1 ghosts, P2 shields, P3 roads), no caption in pick mode. Rounds 3, 2 and 1 are behind the Round switch.
  Round 3 (owner feedback, #707): the look is a flat stroke in front of the border, offset a little inside the own cell, with flat ticks of the same colour
  on its outer side and a soft dark halo (style reference: the front line of a strategy map): C1..C10, and ten tolls K1..K10 (the T5 ripple plus the
  combat hit). Rounds 2 and 1 are behind the "Round" switch.
  Address state: #round=4&pv=0&stack=2&a=1&b=2&view=1&kk=0&hit=1&toll=4&map=bend&step=7&mode=supply&zoom=1&gray=0&rm=0&cnt=0&t=1.7 (t freezes the step at that second).
  window.__fort exposes the state and a few helpers for checks.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Road fortifications</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #21262d;
        --border: #30363d;
        --text: #e6edf3;
        --text-dim: #9da7b3;
        --paper: #f0f6fc;
        --you: #5b9bff;
        --enemy: #e5484d;
        --warn: #ffb020;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        margin: 0;
        padding: 0 16px 28px;
        color: var(--text);
        font: 14px/1.4 var(--font);
      }
      .wrap {
        max-width: 1500px;
        margin: 0 auto;
      }
      button {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);

        background: #1f3a66;

      }
      .bar {

        align-items: center;
        gap: 8px 14px;
        padding: 10px 0 6px;
      }
      h1 {
        font-size: 18px;
        margin: 0 4px 0 0;
        white-space: nowrap;
      }
      .bar label {
        color: var(--text-dim);
        display: inline-flex;
        gap: 5px;

      }
      .sp {
        flex: 1 1 0;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        border-right: 1px solid var(--border);

        white-space: nowrap;
      }

      }
      .grp {

      }
      @media (max-width: 1100px) {

          grid-template-columns: repeat(3, minmax(0, 1fr));

      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;

      }
      .ph {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }

        font-size: 14px;
      }
      .ph .sub {
        color: var(--text-dim);
        margin-left: auto;
        white-space: nowrap;
      }
      .panel canvas {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        background: #0a0d12;
      }
      .panels.v6 canvas {
        aspect-ratio: 3 / 2;
      }
      .gray canvas {
        filter: grayscale(1);
      }
      .ctl {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
      }

        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .panels.v2 {

          padding: 0 16px 24px;

  <body>
    <div class="wrap">
      <div class="bar">
        <h1>Road fortifications</h1>
        <div class="seg" id="modeSeg" role="group" aria-label="Map mode">
          <button data-m="supply">Supply</button><button data-m="battle">Battle</button>
        </div>
        <div class="seg" id="zoomSeg" role="group" aria-label="Zoom">
          <button data-z="0.45">0.45</button><button data-z="1">1</button><button data-z="2">2</button>
        </div>
        <div class="seg" id="roundSeg" role="group" aria-label="Design round">
          <button data-r="4" aria-label="Round 4">Round 4</button><button data-r="3" aria-label="Round 3">3</button><button data-r="2" aria-label="Round 2">2</button><button data-r="1" aria-label="Round 1">1</button>
        </div>
        <div class="seg" id="mapSeg" role="group" aria-label="Border">
          <button data-b="bend">Sharp bend</button><button data-b="curve">Curve</button>
        </div>
        <div class="seg" id="viewSeg" role="group" aria-label="Panels">
          <button data-v="1" aria-label="One panel">1</button><button data-v="2">Compare 2</button><button data-v="6" aria-label="All looks">All</button>
        </div>
        <span class="sp"></span>
        
        <label><input type="checkbox" id="cnt" /> Counter</label>
        <label><input type="checkbox" id="gray" /> Grayscale</label>
        <label><input type="checkbox" id="rm" /> Less motion</label>
      </div>
      <div class="grp"><span class="gl" id="glA">Look</span><nav class="chips" id="gA" aria-label="Look of the fortification"></nav></div>
      <div class="grp" id="rowB"><span class="gl">Look B</span><nav class="chips" id="gB" aria-label="Look of the fortification, panel B"></nav></div>
      <div class="grp" id="rowP"><span class="gl">Pick</span><nav class="chips tog" id="gP" aria-label="How the candidate roads are shown"></nav></div>
      <div class="grp"><span class="gl" id="glT">Toll</span><nav class="chips tog" id="gT" aria-label="How the toll is shown"></nav></div>
      <div class="panels v1" id="panels"></div>
      <div class="ctl">
        <button id="prev" aria-label="Previous state">&#9664; Prev</button>
        <button id="next" aria-label="Next state">Next &#9654;</button>
        <button id="replay" aria-label="Replay the state">&#8634; Replay</button>
        <button id="pause" aria-pressed="false">Pause</button>
        <div class="seg" id="stackSeg" role="group" aria-label="Stacked lines in the Stacked state">
          <button data-k="2" aria-label="Two stacked lines">2 lines</button><button data-k="3" aria-label="Three stacked lines">3 lines</button>
        </div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="sr" id="live" aria-live="polite"></div>
    </div>
    <script>
      (() => {
        'use strict';
        /* ============================================================ constants and data */
        const W = 1000;
        const H = 620;
        const C = {
          bg: '#0d1117',
          floor: '#141a22',
          paper: '#f0f6fc',
          you: '#5b9bff',
          enemy: '#e5484d',
          warn: '#ffb020',
          nstroke: '#8b949e',
          nfill: '#2b3139',
          seg: '#59636e',
          vp: '#e3b341',
        };
        const rgba = (hex, a) => {
          const v = parseInt(hex.slice(1), 16);
          return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
        const colOf = (o) => (o === 'me' ? C.you : o === 'en' ? C.enemy : C.nstroke);

        // two borders: "bend" has a sharp bend at the tip of the city's cell, "curve" a border made of many short steps (a ring of nodes facing a ring)
        const polar = (cx, cy, r, deg) => [Math.round(cx + r * Math.cos((deg * Math.PI) / 180)), Math.round(cy + r * Math.sin((deg * Math.PI) / 180))];
        const nd = (kind, own, pos, name, gar) => ({ kind, own, x: pos[0], y: pos[1], name, gar: gar || 0 });
        const MAPDEFS = {
          bend: {
            shift: [0, 0],
            nodes: {
              K: nd('cap', 'me', [130, 300], 'Keep', 3),
              B: nd('city', 'me', [290, 190], 'Bryn', 2),
              Q: nd('prov', 'me', [280, 420], 'Quay', 1),
              A: nd('city', 'me', [440, 300], 'Alder', 1),
              E: nd('city', 'en', [590, 190], 'Eston', 2),
              P: nd('prov', 'en', [600, 420], 'Pike', 1),
              F: nd('cap', 'en', [760, 300], 'Fenn', 3),
              G: nd('city', 'en', [880, 160], 'Gale', 2),
              H: nd('city', 'en', [900, 450], 'Hale', 2),
              N1: nd('city', 'ne', [440, 540], 'Marsh'),
              N2: nd('prov', 'ne', [460, 70], 'Moor'),
              N3: nd('prov', 'ne', [120, 520], 'Dune'),
              N4: nd('prov', 'ne', [140, 100], 'Fell'),
            },
            edges: [['K', 'B', 2], ['K', 'Q', 1], ['B', 'A', 2], ['A', 'E', 1], ['A', 'P', 1], ['E', 'F', 1], ['P', 'F', 1], ['F', 'G', 1], ['F', 'H', 1], ['Q', 'N1', 1], ['N1', 'P', 1], ['B', 'N2', 1], ['N2', 'E', 1], ['B', 'N4', 1], ['K', 'N3', 1]],
          },
          curve: {
            shift: [-10, 52],
            nodes: {
              K: nd('cap', 'me', [250, 300], 'Keep', 3),
              o1: nd('prov', 'me', polar(250, 300, 190, -60), 'Fell', 1),
              B: nd('city', 'me', polar(250, 300, 190, -30), 'Bryn', 2),
              A: nd('city', 'me', polar(250, 300, 190, 0), 'Alder', 1),
              Q: nd('prov', 'me', polar(250, 300, 190, 30), 'Quay', 1),
              o2: nd('prov', 'me', polar(250, 300, 190, 60), 'Dune', 1),
              e2: nd('prov', 'en', polar(250, 300, 320, -45), 'Moor'),
              G: nd('city', 'en', polar(250, 300, 320, -30), 'Gale', 2),
              e1: nd('prov', 'en', polar(250, 300, 320, -15), 'Reed'),
              E: nd('city', 'en', polar(250, 300, 320, 0), 'Eston', 2),
              P: nd('prov', 'en', polar(250, 300, 320, 15), 'Pike', 1),
              H: nd('city', 'en', polar(250, 300, 320, 30), 'Hale', 2),
              e3: nd('prov', 'en', polar(250, 300, 320, 45), 'Marsh'),
              F: nd('cap', 'en', [740, 300], 'Fenn', 3),
            },
            edges: [['K', 'B', 2], ['K', 'Q', 1], ['B', 'A', 2], ['A', 'E', 1], ['A', 'P', 1], ['E', 'F', 1], ['P', 'F', 1], ['F', 'G', 1], ['F', 'H', 1], ['B', 'o1', 1], ['Q', 'o2', 1], ['E', 'e1', 1], ['G', 'e2', 1], ['H', 'e3', 1]],
          },
        };
        let NODES = {};
        let IDS = [];
        let EDGES = [];
        let CELLS = [];
        let CUR_MAP = 'bend';
        const nodeR = (N) => (N.kind === 'prov' ? 6.5 : N.kind === 'cap' ? 17 : 14);

        /* ============================================================ territory cells (the real client uses Voronoi) */
        function clipHalf(poly, pi, pj, j) {
          const nx = pj.x - pi.x;
          const ny = pj.y - pi.y;
          const mx = (pi.x + pj.x) / 2;
          const my = (pi.y + pj.y) / 2;
          const f = (v) => (v.x - mx) * nx + (v.y - my) * ny;
          const out = [];
          for (let i = 0; i < poly.length; i++) {
            const A = poly[i];
            const B = poly[(i + 1) % poly.length];
            const fa = f(A);
            const fb = f(B);
            if (fa <= 0) out.push({ x: A.x, y: A.y, t: A.t });
            if (fa <= 0 !== fb <= 0) {
              const s = fa / (fa - fb);
              out.push({ x: A.x + (B.x - A.x) * s, y: A.y + (B.y - A.y) * s, t: fa <= 0 ? j : A.t });
            }
          }
          return out;
        }
        function useMap(id) {
          CUR_MAP = id;
          const def = MAPDEFS[id];
          NODES = {};
          for (const k of Object.keys(def.nodes)) NODES[k] = Object.assign({ id: k }, def.nodes[k]);
          IDS = Object.keys(NODES);
          EDGES = def.edges.map(([a, b, w]) => ({ a, b, w }));
          CHAINS.clear();
          CELLS = IDS.map((id2, i) => {
            let poly = [
              { x: 0, y: 0, t: -1 },
              { x: W, y: 0, t: -1 },
              { x: W, y: H, t: -1 },
              { x: 0, y: H, t: -1 },
            ];
            IDS.forEach((o, j) => {
              if (j !== i) poly = clipHalf(poly, NODES[id2], NODES[o], j);
            });
            return { id: id2, poly };
          });
        }
        const CHAINS = new Map();

        function rng(seed) {
          return () => {
            seed |= 0;
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        // terrain of the battle mode: baked once (value noise and stipple), like the baked map background
        let TERRAIN = null;
        function terrain() {
          if (TERRAIN) return TERRAIN;
          const S = 0.5;
          const c = document.createElement('canvas');
          c.width = W * S;
          c.height = H * S;
          const g = c.getContext('2d');
          const r = rng(977);
          const waves = Array.from({ length: 9 }, () => ({ fx: 0.008 + r() * 0.022, fy: 0.008 + r() * 0.022, p: r() * 6.28, q: r() * 6.28 }));
          const img = g.createImageData(c.width, c.height);
          const cols = { plains: [118, 138, 86], forest: [34, 82, 62], mount: [104, 106, 112] };
          for (let y = 0; y < c.height; y++)
            for (let x = 0; x < c.width; x++) {
              const X = x / S;
              const Y = y / S;
              let v = 0;
              let u = 0;
              for (const w of waves) {
                v += Math.sin(X * w.fx + w.p) * Math.cos(Y * w.fy + w.q);
                u += Math.cos(X * w.fy * 1.3 + w.q) * Math.sin(Y * w.fx * 1.1 + w.p);
              }
              const cc = cols[v > 1.1 ? 'forest' : u > 1.5 ? 'mount' : 'plains'];
              const n = (r() - 0.5) * 10;
              const i = (y * c.width + x) * 4;
              img.data[i] = cc[0] + n;
              img.data[i + 1] = cc[1] + n;
              img.data[i + 2] = cc[2] + n;
              img.data[i + 3] = 255;
            }
          g.putImageData(img, 0, 0);
          g.globalAlpha = 0.22;
          g.fillStyle = '#0d1117';
          for (let i = 0; i < 900; i++) {
            g.beginPath();
            g.arc(r() * c.width, r() * c.height, 0.6 + r() * 1.2, 0, 6.29);
            g.fill();
          }
          g.globalAlpha = 0.36;
          g.fillRect(0, 0, c.width, c.height);
          return (TERRAIN = c);
        }

        /* ============================================================ the looks (local frame: x along the road, outward = towards the next node / the enemy; y across) */
        // part: {x, y, w, h, r: role}. order: the sequence in which parts are built. style.fill: 'split' (bar owner, teeth paper), 'owner', 'tint', 'paper'.
        const rect = (x, y, w, h, r) => ({ x, y, w, h, r });
        const comb = (n, x, y0, pitch, w, h) => Array.from({ length: n }, (_, i) => rect(x, y0 + i * pitch, w, h, 't'));
        const LOOKS = [
          {
            id: 'palisade',
            n: 'Palisade',
            line: 'One solid bar, five teeth facing out; owner-colour bar, white teeth',
            len: 40,
            parts: [rect(-3, -20, 5, 40, 'b'), ...comb(5, 2, -20, 8.5, 7, 6)],
            order: [0, 1, 2, 3, 4, 5],
            style: { fill: 'split', rim: null, rimW: 0 },
            progress: 'parts',
            bake: 'worst case 15 tiny textures (2 owners x 7 build steps + the grey ghost; this storyboard bakes 12); one draw call per fort',
          },
          {
            id: 'comb',
            n: 'Comb',
            line: 'Teeth both ways, outlined: a hollow shape with an owner tint',
            len: 36,
            parts: [rect(-2.5, -18, 5, 36, 'b'), ...comb(4, 2.5, -18, 9.6, 7, 7.2), ...comb(4, -9.5, -18, 9.6, 7, 7.2)],
            order: [0, 1, 5, 2, 6, 3, 7, 4, 8],
            style: { fill: 'tint', rim: 'paper', rimW: 1.5 },
            progress: 'strip',
            bake: 'worst case 21 textures (2 owners x 10 steps + ghost; 14 in this storyboard), or one per part composed at draw time; the hatch strip is a separate cell plate (as the road build ribbon)',
          },
          {
            id: 'double',
            n: 'Double wall',
            line: 'Two parallel bars joined by links; teeth on the outer one; solid owner colour',
            len: 36,
            parts: [rect(-7, -18, 3.5, 36, 'b'), rect(-4, -12, 8, 4, 'l'), rect(-4, 8, 8, 4, 'l'), rect(3.5, -18, 3.5, 36, 'b'), ...comb(3, 7, -18, 13.5, 6.5, 9)],
            order: [0, 1, 2, 3, 4, 5, 6],
            style: { fill: 'owner', rim: 'paper', rimW: 1.4 },
            progress: 'parts',
            bake: 'worst case 17 textures (2 owners x 8 steps + ghost; 12 in this storyboard)',
          },
          {
            id: 'towers',
            n: 'Bastions',

          { id: 'slam', n: 'Heavy slam', tHit: 0.22, K: 1.6, sparks: 9, tracer: 'arc', trN: 1, thick: true, ring: 2, flash: 1.3, loss: 'shards', pop: 0.5, react: 'recoil+flash', ripple: 'ringline', num: 'big', rest: 0.42, cost: 'the game strength "Stronger" (1.6): thick tracer, 14 sparks, two big rings, the ticks recoil and flash, a bigger -N; about +40% of Arc shot' },
          { id: 'stamp', n: 'Stamp', tHit: 0.12, K: 1, sparks: 5, tracer: 'none', ring: 1, flash: 0.6, loss: 'shards', pop: 0.2, react: 'flash', ripple: 'ringline', num: 'stamp', rest: 0.35, cost: 'the quietest: ripple, a small hit and the -N stamped on the line (stays there) instead of rising from the group' },

        let CUR_V = null;

        /* ============================================================ geometry helpers */
        // zoomed out, marks grow (min size on screen), so a second stacked line keeps its gap in marks, not in world units

        let CUR_SET = 'r2';

        function fortFrame(f) {

        const edgeBetween = (a, b) => EDGES.find((e) => (e.a === a && e.b === b) || (e.a === b && e.b === a));

        /* ============================================================ the storyboard */
        const STEPS = [
          { id: 'menu', n: 'Menu', dur: 3.2 },
          { id: 'pick', n: 'Pick road', dur: 3.8 },
          { id: 'build', n: 'Building', dur: 4.0 },
          { id: 'built', n: 'Built', dur: 2.6 },
          { id: 'enemy', n: 'Both sides', dur: 2.6 },

          { id: 'stack', n: 'Stacked', dur: 4.2 },
          { id: 'collect', n: 'You collect', dur: 4.0 },
          { id: 'pay', n: 'You pay', dur: 4.0 },
          { id: 'capture', n: 'Captured', dur: 4.2 },
        ];
        const SPEED = 50; // world units per second on the road (toy value)
        const S0 = 34;

        // a group walks `from` -> `to`; forts (belonging to `to`) toll it; returns the group and the toll records
        function crossing(t, o) {
          const E = edgeBetween(o.from, o.to);

          const L = R.L;
          const sOf = (tt) => S0 + SPEED * (tt - DELAY);

            .forEach((f) => {
              const sF = fortSF(f, L);

              const pay = Math.min(Math.ceil(o.u / 3), c);
              tolls.push({ tc, n: pay, c0: c, c1: c - pay, fort: f.id, mine: o.mine, owner: o.owner, u: o.u, from: o.from, to: o.to, sF });
              c -= pay;
            });
          let shown = o.c;
          for (const r of tolls) if (t >= r.tc) shown = lerp(r.c0, r.c1, easeOut((t - r.tc) / 0.32));
          const s = Math.min(sOf(t), end);
          const p = roadPoint(o.from, o.to, s);

          tolls.forEach((r) => (r.gpos = gpos));

        function scene(stepId, t) {

          const mineA = (off, mode, extra) => Object.assign({ id: 'f' + off + mode, node: 'A', to: 'E', owner: 'me', off, mode }, extra || {});
          switch (stepId) {

        /* ============================================================ toll variants */

          { id: 'pips', n: 'Pip drain', rest: 0.5, cost: 'a baked row of pips per (units, charged): at most 9 + 9 textures, swapped by step' },

        // a "stop" frame for Less motion: the moment the effect is clearest, held 1.2 s

        /* ============================================================ painter */
        class Painter {
          constructor(cv) {

          setup(S, sc) {
            const cv = this.cv;
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            const w = cv.clientWidth || 600;
            const h = cv.clientHeight || 380;
            const pw = Math.round(w * dpr);
            const ph = Math.round(h * dpr);
            if (cv.width !== pw || cv.height !== ph) {
              cv.width = pw;
              cv.height = ph;
            }

            this.vh = h;
            this.dpr = dpr;

            this.z = z;
            const hw = w / 2 / z;
            const hh = h / 2 / z;
            let [fx, fy] = sc.focus;
            fx = hw * 2 >= W ? W / 2 : clamp(fx, hw, W - hw);

          text(s, x, y, size, col, o) {

              const size = o.size || 13;
              g.font = `700 ${size}px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif`;
              const tw = g.measureText(label).width;
              const gw = o.glyph ? size * 0.95 : 0;
              const w = tw + gw + 14 + (o.glyph ? 3 : 0);
              const h = size + 8;
              g.globalAlpha *= o.alpha == null ? 1 : o.alpha;
              g.beginPath();
              g.roundRect(-w / 2, -h / 2, w, h, h / 2.6);
              g.fillStyle = 'rgba(13,17,23,0.94)';
              g.fill();
              g.lineWidth = o.frameW || 1.4;
              g.strokeStyle = o.frame || 'rgba(240,246,252,0.8)';
              if (o.dash) g.setLineDash([3.5, 2.5]);
              g.stroke();
              g.setLineDash([]);
              let cx = -w / 2 + 7;
              if (o.glyph) {

                g.strokeStyle = o.glyphCol || C.paper;

                  g.beginPath();

                  g.lineTo(gx - s, -s);

          }

          draw(S, st, t, sc) {

            this.st = st;
            const g = this.g;
            this.screenT();
            g.fillStyle = '#0a0d12';
            g.fillRect(0, 0, this.vw, this.vh);
            this.world();
            g.save();
            g.beginPath();
            g.rect(0, 0, W, H);
            g.clip();
            this.battle = S.mode === 'battle';
            if (this.battle) {
              g.imageSmoothingEnabled = true;
              g.drawImage(terrain(), 0, 0, W, H);
            } else {
              g.fillStyle = C.floor;
              g.fillRect(0, 0, W, H);
            }
            this.cells();
            if (!this.battle) this.front();
            this.roads();
            if (!this.battle) this.packets();
            this.nodes();
            if (sc.fog) this.veil();
            this.forts();
            this.groups();
            this.effects();
            g.restore();
            this.world();
            g.strokeStyle = 'rgba(139,148,158,0.55)';
            g.lineWidth = 1.5 / this.z;
            g.strokeRect(0, 0, W, H);
            this.overlay();
          }
          own(id) {
            return this.sc.owners[id] || NODES[id].own;
          }

          /* ---- territory */
          cells() {
            const g = this.g;
            const paths = (poly) => {
              g.beginPath();
              poly.forEach((v, i) => (i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)));
              g.closePath();
            };
            for (const c of CELLS) {
              const o = this.own(c.id);
              if (o === 'ne') continue;
              paths(c.poly);
              g.fillStyle = rgba(colOf(o), this.battle ? 0.2 : 0.3);
              g.fill();
            }
            const bw = this.rk;
            for (const c of CELLS) {
              const o = this.own(c.id);
              const P = c.poly;
              g.save();
              paths(P);
              g.clip();
              for (let i = 0; i < P.length; i++) {
                const a = P[i];
                const b = P[(i + 1) % P.length];
                if (a.t < 0) continue;
                const m = IDS[a.t];
                g.beginPath();
                g.moveTo(a.x, a.y);
                g.lineTo(b.x, b.y);
                const mo = this.own(m);
                if (mo === o || o === 'ne') {

                  g.lineWidth = 1 * bw;
                  g.stroke();
                } else {
                  g.strokeStyle = rgba(colOf(o), 0.16);
                  g.lineWidth = 18 * bw;
                  g.stroke();

                  g.stroke();

            }
          }
          // supply mode: the delivery-front cell is lit (T1 "bright fill" of supply-flow-visuals-r2)
          front() {
            const g = this.g;
            const c = CELLS.find((x) => x.id === 'A');
            if (this.own('A') !== 'me') return;
            g.beginPath();
            c.poly.forEach((v, i) => (i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)));
            g.closePath();
            g.fillStyle = rgba(C.you, 0.3);
            g.fill();
            g.fillStyle = 'rgba(240,246,252,0.16)';
            g.fill();
            g.save();
            g.clip();
            const P = c.poly;
            for (let i = 0; i < P.length; i++) {
              const a = P[i];

              g.moveTo(a.x, a.y);

          /* ---- roads */
          roadKind(e) {

          roads() {
            const g = this.g;
            const rk = this.rk;
            g.lineCap = 'round';

              const A = NODES[e.a];
              const B = NODES[e.b];

              const stripe = (e.w === 2 ? 5.7 : 2) * rk;

          /* ---- forts */

                alpha = born;

              g.restore();

          }
          /* ---- round 2: the border-segment fortification */
          forts2() {

            const def = tollDef(S);

            const marks = [];
            for (const f of this.sc.forts) {
              const fr = fortFrame2(f, V);
              if (!fr.ch) continue;

              if (f.mode === 'break') {

                const sec = Math.max(0, Math.ceil((1 - f.p) * 10));
                marks.push(() => this.pill(fr.x - fr.ux * 36 * k, fr.y - fr.uy * 36 * k, `0:${String(sec).padStart(2, '0')}`, { size: 12, frame: 'rgba(240,246,252,0.6)' }));
              }
              if (f.mode === 'ghost') marks.push(() => this.pill(fr.x + fr.ux * (lay.h + 26 * k), fr.y + fr.uy * (lay.h + 26 * k), `-0:${f.age}`, { size: 12, dash: true, alpha: 0.9 }));
              if (S.cnt && f.mode === 'built' && ['stack', 'collect', 'pay'].includes(this.stepId)) {
                const x = fr.x + fr.nx * (lay.used / 2 + 30 * k) - fr.ux * 6 * k;

          polyPath(pts) {

            if (pass !== 'blocks' && reach > 0.5) {

              g.strokeStyle = rgba(col, 0.24);
              g.lineWidth = 20 * rk;
              g.stroke();
              this.polyPath(line);
              g.strokeStyle = rgba(col, 0.97);
              g.lineWidth = V.lw * 2 * rk;
              g.stroke();
              if (owner === 'en') {

                g.lineWidth = 1.2 * rk;
                g.stroke();
              }
              g.restore();
            }

              if (a - lay.ww / 2 < -ch.s0 || a + lay.ww / 2 > ch.len - ch.s0) return;

              const built = !o.ghost && !o.preview && Math.abs(a) + lay.ww / 2 <= reach + 0.01;
              polys.push({ poly, built, a });
            });
            for (const b of polys) {
              this.polyPath(b.poly);
              g.closePath();
              if (!b.built) {
                g.setLineDash([3.2 * rk, 2.6 * rk]);
                g.strokeStyle = dashCol;
                g.lineWidth = 1.6 * rk;
                g.stroke();
                g.setLineDash([]);
                continue;
              }
              g.fillStyle = V.fill === 'tint' ? rgba(col, 0.5) : 'rgba(13,17,23,0.62)';
              g.fill();
              g.strokeStyle = rgba(col, 0.22);
              g.lineWidth = 6 * rk;
              g.stroke();
              g.strokeStyle = rgba(col, 0.98);
              g.lineWidth = V.rim * rk;
              g.stroke();
              // the second shape of the side: the enemy has a dark inner line, a heavy look a light one
              const cx = b.poly.reduce((s2, p) => s2 + p.x, 0) / b.poly.length;
              const cy = b.poly.reduce((s2, p) => s2 + p.y, 0) / b.poly.length;
              const shrink = (q) => ({ x: cx + (q.x - cx) * 0.62 + (0), y: cy + (q.y - cy) * 0.62 });
              if (owner === 'en') {
                this.polyPath(b.poly.map(shrink));
                g.closePath();
                g.strokeStyle = C.bg;
                g.lineWidth = 1.3 * rk;
                g.stroke();
              } else if (V.heavy) {
                this.polyPath(b.poly.map(shrink));
                g.closePath();
                g.strokeStyle = 'rgba(240,246,252,0.75)';
                g.lineWidth = 1.1 * rk;
                g.stroke();
              }
            }
            if (o.flash > 0.01) {
              g.globalCompositeOperation = 'lighter';
              g.globalAlpha = o.flash;
              g.fillStyle = '#fff';

                g.closePath();
                g.fill();
              }

            if (prog > 0 && prog < 1) {
              g.globalAlpha = 1;
              for (const sg of [-1, 1]) {
                const q = chainPt(ch, ch.s0 + sg * reach);

            g.lineWidth = 1.6;
            g.stroke();
            g.fill();
            g.restore();
          }
        }

        /* ============================================================ ui */
        const ui = { round: 4, pv: 1, stack: 2, a: 0, b: 3, view: 1, toll: 4, hit: 1, kk: 5, map: 'bend', step: 7, mode: 'supply', zoom: 1, gray: 0, rm: 0, cnt: 0, pause: 0, hold: null };
        let panels = [];
        let startT = performance.now();
        const $ = (id) => document.getElementById(id);
        const lookSet = () => (ui.round === 1 ? LOOKS : ui.round === 2 ? R2 : ui.round === 4 ? [R3[6]] : R3);
        const PVS = [
          { n: 'Ghosts', title: 'a faint ghost of the real segment on every pickable crossing, brightens on hover' },
          { n: 'Shields', title: 'a small shield marker on every pickable crossing, the ghost appears on hover' },
          { n: 'Roads', title: 'the pickable roads are highlighted, the ghost appears on hover only' },
        ];
        const tollIdx = () => (ui.round === 1 ? ui.toll : ui.round === 2 ? ui.hit : ui.round === 4 ? 0 : ui.kk);

        // flat glyphs in the style of the radial menu icons (white, simple)
        function lineGlyph(g) {
          g.fillStyle = C.paper;
          g.beginPath();
          g.roundRect(-16, 3, 32, 4, 2);
          g.fill();
          for (let i = 0; i < 5; i++) g.fillRect(-16 + i * 7.2, -7, 3.6, 10.5);
        }
        function shieldGlyph(g, s, col) {
          g.beginPath();
          g.moveTo(-s * 0.85, -s * 0.8);
          g.lineTo(s * 0.85, -s * 0.8);
          g.lineTo(s * 0.85, s * 0.1);
          g.quadraticCurveTo(s * 0.7, s * 0.75, 0, s);
          g.quadraticCurveTo(-s * 0.7, s * 0.75, -s * 0.85, s * 0.1);
          g.closePath();
          g.fillStyle = col;
          g.fill();
        }
        // a small straight picture of a border fortification: base line, outlined blocks on top, outward is up
        function miniFort(g, V, w) {
          const n = Math.min(V.count, w >= 50 ? V.count : 3);
          const gapK = V.gap / V.bw;
          const bw = w / (n + (n - 1) * gapK);
          const gap = bw * gapK;
          const h = Math.max(4, bw * (V.h / V.bw) * 1.15);
          const y0 = h / 2;
          g.save();
          g.lineJoin = 'round';
          g.beginPath();
          g.moveTo(-w / 2 - 3, y0);
          g.lineTo(w / 2 + 3, y0);
          g.strokeStyle = rgba(C.you, 0.35);
          g.lineWidth = 8;
          g.stroke();
          g.strokeStyle = rgba(C.you, 0.97);
          g.lineWidth = Math.max(2, V.lw * 0.9);
          g.stroke();
          for (let i = 0; i < n; i++) {
            const x = -w / 2 + i * (bw + gap);
            g.fillStyle = V.fill === 'tint' ? rgba(C.you, 0.5) : 'rgba(13,17,23,0.62)';
            g.fillRect(x, y0 - h - 1, bw, h);
            g.strokeStyle = rgba(C.you, 0.98);
            g.lineWidth = Math.max(1.3, V.rim * 0.7);
            g.strokeRect(x, y0 - h - 1, bw, h);
          }
          g.restore();
        }
        // round 3: a flat stroke with flat ticks, outward is up
        function miniFort3(g, V, w) {
          const n = Math.min(V.count, w >= 50 ? 12 : 5);
          const k = w / (n * V.tw + (n - 1) * V.gap);
          const tw = V.tw * k;
          const gap = V.gap * k;
          const tl = Math.max(3, V.tl * k * (V.tl > 8 ? 0.8 : 1));
          const lw = Math.max(2, V.lw * Math.min(k, 1.2));
          const col = lighten(C.you, 0.1);
          g.save();
          g.beginPath();
          g.moveTo(-w / 2 - lw / 2, 0);
          g.lineTo(w / 2 + lw / 2, 0);
          g.lineCap = V.ends === 'butt' ? 'butt' : 'round';
          g.strokeStyle = 'rgba(5,8,12,0.55)';
          g.lineWidth = lw + tl + 6;
          g.stroke();
          g.strokeStyle = col;
          g.lineWidth = lw;
          g.stroke();
          g.fillStyle = col;
          for (let i = 0; i < n; i++) {
            const x = -w / 2 + i * (tw + gap);
            const h = V.shape === 'alt' && i % 2 ? tl * 0.5 : tl;
            g.fillRect(x, -h - lw * 0.2, tw, h);
          }
          g.restore();
        }
        function thumb(li) {
          const cv = document.createElement('canvas');
          cv.width = 64;
          cv.height = 52;
          const g = cv.getContext('2d');
          if (ui.round === 1) {
            g.translate(32, 26);
            g.rotate(-Math.PI / 2);
            g.scale(0.72, 0.72);
            g.drawImage(sprite(li, 'me', fullMask(LOOKS[li]), false), -OX, -OY, SW, SH);
          } else if (ui.round === 2) {
            g.translate(32, 28);
            miniFort(g, R2[li], 52);
          } else {
            g.translate(32, 30);
            miniFort3(g, lookSet()[li], 54);
          }
          return cv;
        }
        function chipRow(host, items, getSel, pick, withThumb) {
          host.textContent = '';
          items.forEach((it, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.setAttribute('aria-pressed', String(getSel(i)));
            if (withThumb) {
              const th = thumb(i);
              th.setAttribute('aria-hidden', 'true');
              b.append(th);
            }
            const k = document.createElement('b');
            k.textContent = it.k;
            b.append(k, document.createTextNode(it.n));
            b.title = it.title || '';
            b.addEventListener('click', () => pick(i));
            host.append(b);
          });
        }
        const PREF = { 1: ['F', 'T'], 2: ['B', 'H'], 3: ['C', 'K'], 4: ['C', 'K'] };
        // panel title: in round 4 a panel is one way to pick a road (the look is always C7)
        const panelName = (li) => (ui.round === 4 ? `C7 ${R3[6].n} \u00b7 pick: ${PVS[li].n}` : lookName(li));
        function lookName(i) {
          if (ui.round === 1) return `F${i + 1} ${LOOKS[i].n}`;
          if (ui.round === 2) return `B${i + 1} ${R2[i].n} · ${R2[i].count}`;
          return `C${i + 1} ${R3[i].n} · ${R3[i].count}`;
        }
        function buildChips() {
          const r4 = ui.round === 4;
          const looks = lookSet().map((l, i) => ({ k: r4 ? 'C7' : PREF[ui.round][0] + (i + 1), n: ui.round === 1 ? l.n : `${l.n} · ${l.count}`, title: ui.round === 1 ? l.line + '. Bake: ' + l.bake : l.line }));
          const cmp = ui.view === 2 && !r4;
          $('glA').textContent = cmp ? 'Look A' : 'Look';
          $('rowB').style.display = cmp ? '' : 'none';
          chipRow($('gA'), looks, (i) => ui.a === i && ui.view !== 6, (i) => ((ui.view = ui.view === 6 ? 1 : ui.view), (ui.a = i), update()), true);
          chipRow($('gB'), looks, (i) => ui.b === i, (i) => ((ui.b = i), update()), true);
          const set = ui.round === 1 ? TOLLS : ui.round === 2 ? HITS : KS;
          const tolls = (r4 ? [KS[5]] : set).map((t, i) => ({ k: r4 ? 'K6' : PREF[ui.round][1] + (i + 1), n: t.n, title: t.cost }));
          chipRow($('gT'), tolls, (i) => tollIdx() === i, (i) => ((ui.round === 1 ? (ui.toll = i) : ui.round === 2 ? (ui.hit = i) : (ui.kk = i)), update()), false);
          $('rowP').style.display = ui.round >= 3 ? '' : 'none';
          chipRow($('gP'), PVS.map((v, i) => ({ k: 'P' + (i + 1), n: v.n, title: v.title })), (i) => ui.pv === i && !(ui.round === 4 && ui.view === 6), (i) => ((ui.pv = i), (ui.view = ui.round === 4 && ui.view === 6 ? 1 : ui.view), update()), false);
          const steps = STEPS.map((s, i) => ({ k: String(i + 1), n: s.n }));
          chipRow($('steps'), steps, (i) => ui.step === i, (i) => setStep(i), false);
          $('gB').querySelectorAll('button').forEach((b) => b.classList.add('second'));
        }
        function seg(id, attr, val) {
          $(id)
            .querySelectorAll('button')
            .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(val))));
        }
        function buildPanels() {
          const host = $('panels');
          const set = lookSet();
          host.className = 'panels v' + ui.view + (ui.view === 6 ? ' n' + (ui.round === 4 ? 3 : set.length) : '');
          host.textContent = '';
          ui.a = clamp(ui.a, 0, set.length - 1);
          ui.b = clamp(ui.b, 0, set.length - 1);
          const list = ui.round === 4 ? (ui.view === 1 ? [ui.pv] : ui.view === 2 ? [ui.pv, (ui.pv + 1) % 3] : [0, 1, 2]) : ui.view === 1 ? [ui.a] : ui.view === 2 ? [ui.a, ui.b] : set.map((_, i) => i);
          panels = list.map((li) => {
            const d = document.createElement('div');
            d.className = 'panel';
            const h = document.createElement('div');
            h.className = 'ph';
            const nm = document.createElement('b');
            const sub = document.createElement('span');
            sub.className = 'sub';
            h.append(nm, sub);
            const cv = document.createElement('canvas');
            cv.setAttribute('role', 'img');
            d.append(h, cv);
            host.append(d);
            return { li, painter: new Painter(cv), nm, sub, cv, d };
          });
          host.classList.toggle('gray', !!ui.gray);
        }
        function update() {
          if (CUR_MAP !== ui.map) useMap(ui.map);
          buildChips();
          seg('modeSeg', 'm', ui.mode);
          seg('zoomSeg', 'z', ui.zoom);
          seg('viewSeg', 'v', ui.view);
          seg('mapSeg', 'b', ui.map);
          seg('roundSeg', 'r', ui.round);
          seg('stackSeg', 'k', ui.stack);
          $('gray').checked = !!ui.gray;
          $('rm').checked = !!ui.rm;
          $('cnt').checked = !!ui.cnt;
          $('pause').setAttribute('aria-pressed', String(!!ui.pause));
          buildPanels();
          writeHash();
        }
        function setStep(i) {
          ui.step = (i + STEPS.length) % STEPS.length;
          startT = performance.now();
          buildChips();
          writeHash();
          $('live').textContent = STEPS[ui.step].n;
        }
        function writeHash() {
          const p = new URLSearchParams({ round: ui.round, pv: ui.pv, stack: ui.stack, a: ui.a, b: ui.b, view: ui.view, toll: ui.toll, hit: ui.hit, kk: ui.kk, map: ui.map, step: ui.step, mode: ui.mode, zoom: ui.zoom, gray: ui.gray, rm: ui.rm, cnt: ui.cnt });
          if (ui.hold != null) p.set('t', ui.hold);
          try {
            history.replaceState(null, '', '#' + p.toString());
          } catch (e) {
            /* file URLs may refuse; the page works without it */
          }
        }
        function readHash() {
          const p = new URLSearchParams(location.hash.slice(1));
          const n = (k, d) => (p.has(k) && !Number.isNaN(Number(p.get(k))) ? Number(p.get(k)) : d);
          ui.round = [1, 2, 3, 4].includes(n('round', 4)) ? n('round', 4) : 4;
          ui.pv = clamp(n('pv', ui.pv), 0, 2);
          ui.stack = n('stack', 2) === 3 ? 3 : 2;
          const len = lookSet().length;
          ui.a = clamp(n('a', ui.a), 0, len - 1);
          ui.b = clamp(n('b', ui.b), 0, len - 1);
          ui.view = [1, 2, 6].includes(n('view', 1)) ? n('view', 1) : 1;
          ui.toll = clamp(n('toll', ui.toll), 0, TOLLS.length - 1);
          ui.hit = clamp(n('hit', ui.hit), 0, HITS.length - 1);
          ui.kk = clamp(n('kk', ui.kk), 0, KS.length - 1);
          ui.map = p.get('map') === 'curve' ? 'curve' : 'bend';
          ui.step = clamp(n('step', ui.step), 0, STEPS.length - 1);
          ui.mode = p.get('mode') === 'battle' ? 'battle' : 'supply';
          ui.zoom = [0.45, 1, 2].includes(n('zoom', 1)) ? n('zoom', 1) : 1;
          ui.gray = n('gray', 0) ? 1 : 0;
          ui.rm = n('rm', 0) ? 1 : 0;
          ui.cnt = n('cnt', 0) ? 1 : 0;
          ui.hold = p.has('t') ? n('t', 0) : null;
        }

        let pausedAt = 0;
        function frame(now) {
          const step = STEPS[ui.step];
          let t;
          if (ui.hold != null) t = ui.hold;
          else if (ui.pause) t = pausedAt;
          else {
            t = ((now - startT) / 1000) % step.dur;
            pausedAt = t;
          }
          for (const p of panels) {
            const S = { look: ui.round === 4 ? 0 : p.li, pv: ui.round === 4 ? p.li : ui.pv, toll: tollIdx(), mode: ui.mode, zoom: ui.zoom, rm: ui.rm, cnt: ui.cnt, round: ui.round, r1: ui.round === 1 };
            CUR_SET = 'r' + (ui.round === 4 ? 3 : ui.round);
            CUR_V = ui.round === 4 ? R3[6] : ui.round === 3 ? R3[p.li] : null;
            CUR_STACK = ui.stack;
            CUR_MK = ui.zoom < 1 ? Math.pow(1 / ui.zoom, 0.6) : 1;
            const sc = scene(step.id, t);
            p.painter.stepId = step.id;
            p.painter.draw(S, ui, t, sc);
            const nm = panelName(p.li);
            if (p.nm.textContent !== nm) {
              p.nm.textContent = nm;
              p.cv.setAttribute('aria-label', `${nm}, ${step.n}`);
            }
            p.sub.textContent = ui.round === 1 ? `${step.n} · sprites baked ${SPR_BY_LOOK[p.li]}` : step.n;
          }
          requestAnimationFrame(frame);
        }
        function init() {
          readHash();
          $('modeSeg').addEventListener('click', (e) => e.target.dataset.m && ((ui.mode = e.target.dataset.m), update()));
          $('zoomSeg').addEventListener('click', (e) => e.target.dataset.z && ((ui.zoom = Number(e.target.dataset.z)), update()));
          $('mapSeg').addEventListener('click', (e) => e.target.dataset.b && ((ui.map = e.target.dataset.b), update()));
          $('stackSeg').addEventListener('click', (e) => e.target.dataset.k && ((ui.stack = Number(e.target.dataset.k)), update()));
          $('roundSeg').addEventListener('click', (e) => e.target.dataset.r && ((ui.round = Number(e.target.dataset.r)), update()));
          $('viewSeg').addEventListener('click', (e) => e.target.dataset.v && ((ui.view = Number(e.target.dataset.v)), update()));
          $('gray').addEventListener('change', (e) => ((ui.gray = e.target.checked ? 1 : 0), update()));
          $('rm').addEventListener('change', (e) => ((ui.rm = e.target.checked ? 1 : 0), update()));
          $('cnt').addEventListener('change', (e) => ((ui.cnt = e.target.checked ? 1 : 0), update()));
          $('prev').addEventListener('click', () => setStep(ui.step - 1));
          $('next').addEventListener('click', () => setStep(ui.step + 1));
          $('replay').addEventListener('click', () => {
            startT = performance.now();
            pausedAt = 0;
            ui.hold = null;
            writeHash();
          });
          $('pause').addEventListener('click', () => {
            ui.pause = ui.pause ? 0 : 1;
            $('pause').setAttribute('aria-pressed', String(!!ui.pause));
            if (!ui.pause) startT = performance.now() - pausedAt * 1000;
          });
          document.addEventListener('keydown', (e) => {
            if (e.target && /INPUT|SELECT/.test(e.target.tagName)) return;
            if (e.key === 'ArrowRight') setStep(ui.step + 1);
            else if (e.key === 'ArrowLeft') setStep(ui.step - 1);
          });
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches && !location.hash.includes('rm=')) ui.rm = 1;
          useMap(ui.map);
          update();
          window.__fort = { cells: () => ({ CELLS, NODES, IDS }), ui, LOOKS, R2, R3, KS, HITS, TOLLS, STEPS, SPR_BY_LOOK, update, setStep, scene, crossing };
          requestAnimationFrame(frame);
        }
        init();
      })();
    </script>
  </body>
</html>
