<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building animation, round 1</title>
<!-- Building animation, round 1 (broad, #972): how the build of a barracks or a factory at a city reads on the map, from the
     order to the finished building. The buildings are the city radial menu's own icons on the free side of the city
     (#954, P2 "Free side", render/buildingLayout.ts); the motion of today is #872 (render/buildPay.ts, BUILD_PAY of
     render/style.ts): "Current" below is a port of it. Thirteen directions V1..V13 redo the three parts end to end:
       1. the progressive payment (DEC-41 item 7): the charges are taken from the warehouse of the city, then from the
          own group standing there; what is missing is taken as it arrives (here: two at the order, the rest brought by
          the supply flow, one packet each);
       2. the build time after the full payment (mvp-7: 10 s for both; compressed to 4.5 s here unless "Real time");
       3. the moment the building is finished.
     Rules on the page: barracks 3 charges, factory 4 (rulesets/mvp-7.toml); one build per kind; the build events and
     the payment go only to the builder (gow_protocol.convert). The opponent's city ("Enemy's" switch, next to an own
     node) shows nothing of the payment or the time: only the built icon when its view flips (DEC-31, AGENTS.md 4.4),
     and each variant says what plays then. Self-contained: EB Garamond (SIL OFL) and the ground crop come from
     assets/city-buildings/ (shared with #954). State in the address (#v=V2&z=far&side=enemy...). -->
<style>
@font-face{font-family:'EB Garamond';src:url(assets/city-buildings/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
:root{--stone:#16130f;--panel:#1d1a15;--ink:#ece4d1;--ink-soft:#cfc4ab;--ink-dim:#ada38f;--rule:#7d7363;--line:#3d372d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--stone);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--stone);padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font:600 20px/1 'EB Garamond',Georgia,serif;letter-spacing:.04em;margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:9px}
.bar:first-child{margin-top:0}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lab{font:600 12px/1 'EB Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-right:3px}
button.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 10px;font:500 13px/1 system-ui,sans-serif;cursor:pointer;border-radius:0}
button.chip:hover{border-color:var(--rule);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#16130f;border-color:var(--ink);font-weight:650}
button.chip .k{opacity:.7;margin-right:5px;font-weight:700}
button.chip.var{padding:7px 10px;font-size:14px}
button.chip.ref{border-style:dashed}
button.chip:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#more{margin-left:auto}
#moreBar{display:none;padding-top:9px;margin-top:9px;border-top:1px solid var(--line)}
#moreBar.open{display:flex}
input[type=range]{accent-color:#ece4d1;width:220px;vertical-align:middle}
main{padding:10px 16px 24px}
#cap{margin:0 0 8px;font:500 16px/1.35 'EB Garamond',Georgia,serif;color:var(--ink-soft);min-height:2.7em}
#cap b{color:var(--ink);font-weight:650;margin-right:8px}
#cap .rm{display:block;color:var(--ink-dim);font-size:15px}
#viewWrap{background:#0e0c09;border:1px solid var(--line)}
#view{display:block;width:100%;cursor:pointer}
.gray #view{filter:grayscale(1)}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>Building animation · round 1</h1></div>
  <div class="bar"><div class="group" id="vars" role="group" aria-label="Variant"></div></div>
  <div class="bar">
    <div class="group" role="group" aria-label="Zoom"><span class="lab">Zoom</span><button class="chip" data-z="normal">Normal</button><button class="chip" data-z="far">Far</button></div>
    <div class="group" role="group" aria-label="Whose city builds"><span class="lab">City</span><button class="chip" data-side="own">Own</button><button class="chip" data-side="enemy">Opponent's</button></div>
    <button class="chip" id="replay">Replay</button>
    <button class="chip" id="more" aria-expanded="false" aria-controls="moreBar">More</button>
  </div>
  <div class="bar" id="moreBar">
    <div class="group" role="group" aria-label="Building"><span class="lab">Builds</span><button class="chip" data-kind="barracks">Barracks</button><button class="chip" data-kind="factory">Factory</button></div>
    <div class="group"><button class="chip" data-z="near">Near zoom</button><button class="chip" id="real">Real time (10 s)</button><button class="chip" id="still">Reduced motion</button><button class="chip" id="gray">Grey</button></div>
    <div class="group"><button class="chip" id="play">Pause</button><input id="scrub" aria-label="Time in the loop" type="range" min="0" max="10000" step="10"></div>
  </div>
</header>
<main>
  <p id="cap"></p>
  <div id="viewWrap"><canvas id="view" role="img"></canvas></div>
</main>
<script>
'use strict';
// =============================================================================================
// The client's numbers (render/style.ts, theme/tokens.ts, units/helmet.ts, theme/cutIcons.ts),
// shared with city-buildings-r2.html.
// =============================================================================================
const C = {
  casing: '#060504', plate: '#0e0c09', cut: '#050403', ink: '#ccc0a6', ivory: '#ece4d1',
  vp: '#cfab62', up: '#8cc79a', down: '#ec6654', road: '#e6edf3', clash: '#e6ab42',
};
// The city menu's icons, exactly (cutIcons.ts): the outline and the ruled solid, a 26-unit box centred on 0.
const CUT_D = {
  barracks: 'M-9 9 V-1 L0 -8.5 L9 -1 V9 Z M-3 9 V3 H3 V9 M0 -8.5 V-12.5 L4.5 -11 L0 -9.5',
  factory: 'M-10 9 V-1.5 L-5 -5 V-1.5 L0 -5 V-1.5 L5 -5 V-10 H8.5 V9 Z M-6.5 4 H-3 M0 4 H3.5',
};
const CUT_SOLID_D = { barracks: 'M-9 9 V-1 L0 -8.5 L9 -1 V9 Z', factory: 'M-10 9 V-1.5 L-5 -5 V-1.5 L0 -5 V-1.5 L5 -5 V-10 H8.5 V9 Z' };
const CUT = { barracks: new Path2D(CUT_D.barracks), factory: new Path2D(CUT_D.factory) };
const CUT_SOLID = { barracks: new Path2D(CUT_SOLID_D.barracks), factory: new Path2D(CUT_SOLID_D.factory) };
const CUT_BOX = { barracks: [-9, -12.5, 9, 9], factory: [-10, -10, 8.5, 9] };
const CUT_STYLE = { box: 26, rule: 2.6, ruleW: 1.15, casing: 4.2, casingA: 0.9, ink: 2.1 };
const ICON_HALF = 0.44; // half the drawn extent of an icon (casing included), a share of its box

const HELMET_PATHS = {
  own: { dome: 'M9 70 C5 36 22 12 49 12 C70 12 85 26 88 42 C89 47 91 50 95 53 C82 54 72 56 66 60 C60 64 56 70 46 70 Z', band: 'M7 77 C20 79 34 80 46 79 C56 78 62 71 67 67 C72 63 82 61 96 60', strap: 'M46 80 L54 96' },
  enemy: { dome: 'M8 54 C8 30 28 13 52 13 C74 13 90 30 92 46 L98 54 Q99 58 95 58 L74 58 C65 58 60 64 57 73 C56 77 52 78 46 77 C32 74 18 69 12 64 Q8 61 8 54 Z', band: null, strap: 'M38 75 L58 91 L64 68' },
};
const HELMET_SCALE = 1.34, HELMET_INSIDE = 0.92, UNIT_SIDES = [24, 30, 36, 42];
const HE = { casing: 6, inside: 1.6, gear: 0.55, edge: 1.25, hatchW: 0.9, font: 12.5 };
const CITY_E = { cutGrow: 3.2, cutAlpha: 0.85, rimGrow: 1.6, rimW: 1.1, innerInset: 1.2, innerW: 0.8, innerA: 0.6, enemyInsets: [4.4, 6.4], enemyW: 0.9, star: [0.6, 0.27, 1.2] };
const RING = { gap: 7, cut: 6, cutAlpha: 0.8, filled: 3.4, roomW: 0.9, roomOff: 1.6, wash: 0.3, segGap: 0.16 };
const LOZ = { casing: 8.2, fill: 5.8, hollow: 4.7, line: 0.9, lineA: 0.92, pitch: 8.8, groupGap: 3.5, drop: 8.5 };
const VPL = { side: 18.5, outer: 17.2, inner: 12.4, w: 1.1, font: 14.5, lift: 4.5 };
const BADGE = { size: 11, stroke: 0.3, outline: 2.6, minPx: 8 };
const TICKS = { gap: 2, arm: 6.2, casing: 4.4, ink: 1.7 }; // CORNER_TICKS after #952

// =============================================================================================
// Helmet geometry (a port of units/helmet.ts).
// =============================================================================================
function samplePath(d, steps = 10) {
  const t = d.match(/[MLCQZ]|-?\d*\.?\d+/g) || [];
  const pts = []; let i = 0, cmd = '', at = { x: 0, y: 0 };
  const num = () => Number(t[i++]);
  while (i < t.length) {
    const tok = t[i];
    if (/[MLCQZ]/.test(tok)) { cmd = tok; i++; if (cmd === 'Z') continue; }
    if (cmd === 'M' || cmd === 'L') { at = { x: num(), y: num() }; pts.push(at); }
    else if (cmd === 'C') { const c1 = { x: num(), y: num() }, c2 = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*u*at.x + 3*u*u*s*c1.x + 3*u*s*s*c2.x + s*s*s*e.x, y: u*u*u*at.y + 3*u*u*s*c1.y + 3*u*s*s*c2.y + s*s*s*e.y }); } at = e; }
    else if (cmd === 'Q') { const c = { x: num(), y: num() }, e = { x: num(), y: num() }; for (let k = 1; k <= steps; k++) { const s = k / steps, u = 1 - s; pts.push({ x: u*u*at.x + 2*u*s*c.x + s*s*e.x, y: u*u*at.y + 2*u*s*c.y + s*s*e.y }); } at = e; }
    else i++;
  }
  return pts;
}
function boundsOf(ps) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const p of ps) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); } return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 }; }
function centroid(ps) { let a = 0, cx = 0, cy = 0; ps.forEach((p, i) => { const q = ps[(i + 1) % ps.length]; const cr = p.x*q.y - q.x*p.y; a += cr; cx += (p.x + q.x)*cr; cy += (p.y + q.y)*cr; }); return { x: cx / (3*a), y: cy / (3*a) }; }
const RAW = {};
for (const k of ['own', 'enemy']) { const P = HELMET_PATHS[k]; RAW[k] = { dome: samplePath(P.dome), band: P.band ? samplePath(P.band) : null, strap: samplePath(P.strap) }; const b = boundsOf([...RAW[k].dome, ...(RAW[k].band || []), ...RAW[k].strap]); RAW[k].c = { x: b.x + b.width / 2, y: b.y + b.height / 2 }; }
const HELMETS = new Map();
function helmet(kind, width) {
  const key = kind + ':' + width; if (HELMETS.has(key)) return HELMETS.get(key);
  const R = RAW[kind], s = width / 100, place = (p) => ({ x: (p.x - R.c.x) * s, y: (p.y - R.c.y) * s });
  const dome = R.dome.map(place), band = R.band ? R.band.map(place) : null, strap = R.strap.map(place);
  const db = boundsOf(dome), mid = centroid(dome);
  const h = { kind, width, dome, band, strap, bounds: boundsOf([...dome, ...(band || []), ...strap]), domeTop: db.y, domeBottom: db.y + db.height, domeBounds: db, middle: { x: mid.x, y: mid.y + width * 0.02 } };
  HELMETS.set(key, h); return h;
}
function helmetLines(width) { const s = width / 100; return { strap: Math.max(6.4*s, 2.1), band: Math.max(5.6*s, 2.2), casing: 6.4 }; }
function helmetExtent(h) { const L = helmetLines(h.width), pad = Math.max(L.casing, L.strap + L.casing) / 2; return { top: h.bounds.y - pad, bottom: h.bounds.y + h.bounds.height + pad, left: h.bounds.x - pad, right: h.bounds.x + h.bounds.width + pad }; }
function helmetWidth(side, inside) { return Math.round(side * HELMET_SCALE * (inside ? HELMET_INSIDE : 1) * 100) / 100; }
function helmetFit(kind, width, reach) {
  let w = width;
  for (let step = 0; step < 6 && w > 4; step++) { const e = helmetExtent(helmet(kind, w)), span = Math.max(e.right, -e.left, e.bottom, -e.top); if (span <= reach) break; w = Math.min(w - 0.25, Math.floor(((w * reach) / span) * 4) / 4); }
  return w;
}
function unitSide(units) { return units <= 3 ? UNIT_SIDES[0] : units <= 7 ? UNIT_SIDES[1] : units <= 15 ? UNIT_SIDES[2] : UNIT_SIDES[3]; }

// =============================================================================================
// Drawing helpers (world units; the canvas transform carries the zoom). A hairline never falls
// under 1.3 device px (#865).
// =============================================================================================
let GA = 1, PXW = 1, LS = 1;
const hair = (w) => Math.max(w, 1.3 / (PXW * LS));
function poly(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); if (closed) ctx.closePath(); }
function polyA(ctx, ps, closed = true) { ctx.beginPath(); ps.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); if (closed) ctx.closePath(); }
function stroke(ctx, w, color, alpha = 1, cap = 'round', join = 'round') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(); ctx.globalAlpha = GA; }
function fill(ctx, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(); ctx.globalAlpha = GA; }
function strokeP(ctx, p, w, color, alpha = 1, cap = 'square', join = 'miter') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(p); ctx.globalAlpha = GA; }
function fillP(ctx, p, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha*GA); ctx.fill(p); ctx.globalAlpha = GA; }
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI*2); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hatchLines(ctx, b, angle, pitch) {
  const cx = b.x + b.width/2, cy = b.y + b.height/2, R = Math.hypot(b.width, b.height)/2 + pitch;
  const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
  ctx.beginPath(); for (let d = -R; d <= R; d += pitch) { ctx.moveTo(cx + nx*d - ux*R, cy + ny*d - uy*R); ctx.lineTo(cx + nx*d + ux*R, cy + ny*d + uy*R); }
}
const polar = (a, d) => ({ x: d*Math.cos(a), y: d*Math.sin(a) });
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const ease = { engrave: (t) => 0.5 - 0.5*Math.cos(Math.PI*clamp01(t)), settle: (t) => 1 - Math.pow(1 - clamp01(t), 3), travel: (t) => { t = clamp01(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; } };
function lozPath(ctx, x, y, side) { const h = side*Math.SQRT2/2; ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + h, y); ctx.lineTo(x, y + h); ctx.lineTo(x - h, y); ctx.closePath(); }
/** One charge (57u): the casing, then the colour (in stock, paid) or hollow (room, owed). */
function drawLozenge(ctx, x, y, on, color, k = 1, alpha = 1) {
  lozPath(ctx, x, y, LOZ.casing*k); fill(ctx, C.casing, alpha);
  if (on) { lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, color, alpha); return; }
  lozPath(ctx, x, y, LOZ.fill*k); fill(ctx, C.plate, alpha);
  lozPath(ctx, x, y, LOZ.hollow*k); stroke(ctx, hair(LOZ.line), C.ink, LOZ.lineA*alpha, 'butt', 'miter');
}
function frame(ctx, x, y, rot, s, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s); const ls = LS; LS = ls*s; fn(); LS = ls; ctx.restore(); }

function drawBody(ctx, G, owner, color, occupied, star) {
  const r = G.r;
  circle(ctx, 0, 0, r + CITY_E.cutGrow); fill(ctx, C.cut, CITY_E.cutAlpha);
  circle(ctx, 0, 0, r); fill(ctx, occupied ? C.plate : color);
  circle(ctx, 0, 0, r + CITY_E.rimGrow); stroke(ctx, CITY_E.rimW, C.ink);
  circle(ctx, 0, 0, r - CITY_E.innerInset); stroke(ctx, CITY_E.innerW, C.cut, CITY_E.innerA);
  if (owner === 'enemy') for (const ins of CITY_E.enemyInsets) { circle(ctx, 0, 0, r - ins); stroke(ctx, CITY_E.enemyW, C.ink); }
  if (G.kind === 'capital' && !occupied && star) {
    ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, r2 = i % 2 ? r*CITY_E.star[1] : r*CITY_E.star[0]; ctx.lineTo(r2*Math.cos(a), r2*Math.sin(a)); }
    ctx.closePath(); fill(ctx, C.plate); stroke(ctx, CITY_E.star[2], C.ink, 1, 'butt', 'miter');
  }
}
const TAU = Math.PI*2, START = -Math.PI/2;
function ringCells(cap, filled) {
  const gap = RING.segGap, arcs = [];
  for (let j = 0; j < cap; j++) { const f0 = TAU*j/cap, f1 = TAU*(j + 1)/cap; arcs.push({ from: START + f0 + gap/2, to: START + f1 - gap/2, filled: j < filled }); }
  return arcs;
}
function strokeArcs(ctx, r, arcs, w, color, alpha = 1) { ctx.beginPath(); for (const a of arcs) { ctx.moveTo(r*Math.cos(a.from), r*Math.sin(a.from)); ctx.arc(0, 0, r, a.from, a.to); } stroke(ctx, w, color, alpha, 'butt'); }
function drawRing(ctx, r, arcs) {
  const o = RING.roomOff;
  strokeArcs(ctx, r, arcs, RING.cut, C.cut, RING.cutAlpha);
  strokeArcs(ctx, r, arcs.filter((a) => a.filled), RING.filled, C.ink);
  const room = arcs.filter((a) => !a.filled);
  strokeArcs(ctx, r, room, 2*o, C.ink, RING.wash);
  for (const s of [-1, 1]) strokeArcs(ctx, r + s*o, room, hair(RING.roomW), C.ink);
  ctx.beginPath(); for (const a of room) for (const ang of [a.from, a.to]) { const c = Math.cos(ang), s = Math.sin(ang); ctx.moveTo((r - o)*c, (r - o)*s); ctx.lineTo((r + o)*c, (r + o)*s); }
  if (room.length) stroke(ctx, hair(RING.roomW), C.ink, 1, 'butt');
}
function rowXs(n) { const xs = [], gap = n > 4 ? LOZ.groupGap : 0; for (let i = 0; i < n; i++) xs.push(i*LOZ.pitch + Math.floor(i/3)*gap); const mid = n ? (xs[0] + xs[n - 1]) / 2 : 0; return xs.map((x) => x - mid); }
function drawVp(ctx, at, n) {
  lozPath(ctx, at.x, at.y, VPL.side); fill(ctx, C.plate);
  lozPath(ctx, at.x, at.y, VPL.outer); stroke(ctx, hair(VPL.w), C.vp, 1, 'butt', 'miter');
  lozPath(ctx, at.x, at.y, VPL.inner); stroke(ctx, hair(VPL.w), C.vp, 1, 'butt', 'miter');
  ctx.font = `600 ${VPL.font}px 'EB Garamond', Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.vp; ctx.fillText(String(n), at.x, at.y + 1);
}
function drawHelmet(ctx, g) {
  const h = helmet(g.kind, g.width), L = helmetLines(g.width), facing = g.kind === 'own' ? 1 : -1, casing = g.pip ? 3.2 : HE.casing + HE.inside;
  ctx.save(); ctx.translate(g.x, g.y); ctx.scale(facing, 1);
  const gear = h.band ? [h.strap, h.band] : [h.strap], gw = (line) => (line === h.strap ? L.strap : L.band) * HE.gear;
  for (const line of gear) { poly(ctx, line, false); stroke(ctx, gw(line) + casing*0.8, C.casing); }
  poly(ctx, h.dome); stroke(ctx, casing*0.9, C.casing); poly(ctx, h.dome); fill(ctx, C.plate);
  const pitch = Math.min(3, Math.max(1.4, g.width*0.075)), top = h.domeBottom - g.level*(h.domeBottom - h.domeTop);
  ctx.save(); poly(ctx, h.dome); ctx.clip();
  hatchLines(ctx, h.domeBounds, -Math.PI/4, pitch); stroke(ctx, hair(HE.hatchW*(g.pip ? .7 : 1)), g.color, 1, 'butt');
  if (g.level > 0) { ctx.beginPath(); ctx.rect(h.domeBounds.x - 2, top, h.domeBounds.width + 4, h.domeBottom - top + 2); fill(ctx, g.color); }
  ctx.restore();
  for (const line of gear) { poly(ctx, line, false); stroke(ctx, gw(line), C.ink); }
  poly(ctx, h.dome); stroke(ctx, hair(g.pip ? .8 : HE.edge), C.ink);
  ctx.restore();
  if (g.pip) return;
  const mx = g.x + h.middle.x*facing, my = g.y + h.middle.y;
  ctx.font = `600 ${HE.font}px 'EB Garamond', Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = C.cut; ctx.lineJoin = 'round'; ctx.globalAlpha = GA; ctx.strokeText(String(g.units), mx, my + 0.6); ctx.fillStyle = C.ink; ctx.fillText(String(g.units), mx, my + 0.6);
}
/** B6 (#949, #952): four ivory corner ticks round the helmet as drawn. */
function drawTicks(ctx, g) {
  const e = helmetExtent(helmet(g.kind, g.width)), gap = TICKS.gap, facing = g.kind === 'own' ? 1 : -1;
  const x0 = g.x + (facing === 1 ? e.left : -e.right) - gap, x1 = g.x + (facing === 1 ? e.right : -e.left) + gap, y0 = g.y + e.top - gap, y1 = g.y + e.bottom + gap, arm = TICKS.arm;

  if (sa === sb) { const col = sa === 'own' ? OWN : FOE; stroke(ctx, 7.4, C.casing, 0.55, 'butt'); stroke(ctx, 5.6, col, 0.46, 'butt'); stroke(ctx, 2, C.road, 0.7, 'butt'); }
  else { stroke(ctx, 5.6, C.casing, 0.4, 'butt'); ctx.setLineDash([7, 5]); stroke(ctx, 2, '#aab2bd', 0.7, 'butt'); ctx.setLineDash([]); }
}
/** A packet of the supply flow (#858): a square of the owner's colour on a casing, an ivory outline, turned along its road. */
function drawPacket(ctx, x, y, ang, color, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const r = (s) => { ctx.beginPath(); ctx.rect(-s / 2, -s / 2, s, s); };
  r(9.2); fill(ctx, C.casing, alpha); r(8); stroke(ctx, hair(0.8), C.ivory, alpha, 'butt', 'miter'); r(6); fill(ctx, color, alpha);
  ctx.restore();
}
function packets(ctx, P) {
  if (P.enemy) return;
  const a = FEEDER, b = SUBJECT, ux = b.x - a.x, uy = b.y - a.y, len = Math.hypot(ux, uy), ang = Math.atan2(uy, ux);
  const run = (q) => { const d0 = a.R + 4, d1 = len - b.R - 2, d = lerp(d0, d1, q); return { x: a.x + (ux / len) * d, y: a.y + (uy / len) * d }; };
  for (const p of P.sc.pays.slice(1)) {
    const q = (P.t - (p.at - PACKET_MS)) / PACKET_MS; if (q < 0 || q >= 1) continue;
    const at = run(q), fade = q > 0.9 ? 1 - (q - 0.9) / 0.1 : 1; drawPacket(ctx, at.x, at.y, ang, OWN, fade);
  }
  // The steady flow elsewhere: Stonegate feeds Watchpost and Brookside.
  for (const [from, to, off] of [[4, 1, 0], [4, 7, 900]]) {
    const A = CITIES[from], B = CITIES[to], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy), q = ((P.t + off) % 2600) / 2600, d = lerp(A.R + 4, L - B.R - 2, q);
    drawPacket(ctx, A.x + (dx / L) * d, A.y + (dy / L) * d, Math.atan2(dy, dx), OWN, q > 0.9 ? 1 - (q - 0.9) / 0.1 : 1);
  }
}
function cityBuildings(ctx, c, P, z) {
  const side = sideOf(c), color = side === 'own' ? OWN : FOE, enemy = side === 'foe';
  if (c === SUBJECT) { const at = P.L.items[P.other]; if (at) drawIcon(ctx, P.other, at.x, at.y, P.L.size, { look: 'built', color, enemy }); return; }
  // An opponent's city shows only what is built, and only next to an own node (DEC-31).
  if (enemy && !EDGES.some(([a, b]) => (a === c.i || b === c.i) && sideOf(CITIES[a === c.i ? b : a]) === 'own')) return;
  const kinds = c.b || []; if (!kinds.length) return;
  const L = layoutBuildings(c, kinds, z);
  for (const kd of kinds) drawIcon(ctx, kd, L.items[kd].x, L.items[kd].y, L.size, { look: 'built', color, enemy });
}
function groupOf(c, P) {
  if (c === SUBJECT) return P.enemy ? null : { units: 3, charged: P.t >= ORDER ? 0 : 1 };
  return c.units ? { units: c.units, charged: c.charged === undefined ? c.units : c.charged } : null;
}
function drawCity(ctx, c, P, z) {
  const side = sideOf(c), color = side === 'own' ? OWN : FOE, grp = groupOf(c, P), occupied = !!grp;
  drawBody(ctx, c, side === 'own' ? 'own' : 'enemy', color, occupied, true);
  drawRing(ctx, c.R, ringCells(c.cap, grp ? Math.min(grp.units, c.cap) : 0));
  cityBuildings(ctx, c, P, z);
  if (side === 'own') { const stock = c === SUBJECT ? (P.t >= ORDER ? 0 : 1) : c.stock; rowXs(c.wh).forEach((x, i) => drawLozenge(ctx, x, c.R + LOZ.drop, i < stock, OWN)); }
  if (c.vp) drawVp(ctx, polar(-Math.PI / 4, c.R + VPL.lift), c.vp);
  if (z >= 0.45) {
    ctx.save(); ctx.translate(0, c.R + 15 + (side === 'own' && c.wh ? 4 : 0)); ctx.scale(1 / z, 1 / z);
    ctx.font = '700 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(5,4,3,0.85)'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1; ctx.strokeText(c.name, 0, 0);
    ctx.fillStyle = '#e6edf3'; ctx.fillText(c.name, 0, 0); ctx.restore();
  }
}
function drawGroup(ctx, c, P) {
  const grp = groupOf(c, P); if (!grp) return;
  const side = sideOf(c), kind = side === 'own' ? 'own' : 'enemy', units = Math.min(grp.units, c.cap);
  const width = helmetFit(kind, helmetWidth(unitSide(units), true), c.R - RING.cut / 2 - 1);
  drawHelmet(ctx, { kind, width, x: 0, y: 0, level: units ? grp.charged / units : 0, color: side === 'own' ? OWN : FOE, units });
}

// =============================================================================================
// The view.
// =============================================================================================
const view = document.getElementById('view'), wrap = document.getElementById('viewWrap');
const VIEW = { W: 1200, H: 600, dpr: 1, cx: -20, cy: -10 };
function layoutView() {
  const W = wrap.clientWidth || 1200, room = window.innerHeight - wrap.getBoundingClientRect().top - 20, H = Math.round(Math.max(380, Math.min(W * 0.56, room))), dpr = window.devicePixelRatio || 1;
  view.style.height = H + 'px'; view.width = Math.round(W * dpr); view.height = Math.round(H * dpr);
  Object.assign(VIEW, { W, H, dpr });
}
function render() {
  const z = ZOOMS[S.zoom], ctx = view.getContext('2d'), { W, H, dpr } = VIEW, P = frameState(S.time), v = V_BY[S.v];
  const cx = S.zoom === 'near' ? -25 : VIEW.cx, cy = S.zoom === 'near' ? -14 : VIEW.cy;
  VIEW.toScreen = (x, y) => ({ x: W / 2 + (x - cx) * z, y: H / 2 + (y - cy) * z });
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, view.width, view.height);
  PXW = dpr * z; LS = 1; GA = 1;
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - cx * z), dpr * (H / 2 - cy * z));
  const box = { x: cx - W / 2 / z - 4, y: cy - H / 2 / z - 4, w: W / z + 8, h: H / z + 8 };
  if (groundTile) { ctx.fillStyle = ctx.createPattern(groundTile, 'repeat'); ctx.fillRect(box.x, box.y, box.w, box.h); } else { ctx.fillStyle = '#3a4630'; ctx.fillRect(box.x, box.y, box.w, box.h); }
  ctx.fillStyle = 'rgba(11,10,8,0.12)'; ctx.fillRect(box.x, box.y, box.w, box.h);
  ctx.imageSmoothingEnabled = true; ctx.drawImage(territory(S.side), BOUNDS.x, BOUNDS.y, BOUNDS.w, BOUNDS.h);
  for (const [a, b] of EDGES) drawRoad(ctx, CITIES[a], CITIES[b]);
  packets(ctx, P);
  const at = (c, fn) => { ctx.save(); ctx.translate(c.x, c.y); fn(); ctx.restore(); GA = 1; ctx.globalAlpha = 1; };
  if (v.under) at(SUBJECT, () => v.under(ctx, P));
  for (const c of CITIES) at(c, () => drawCity(ctx, c, P, z));
  at(SUBJECT, () => v.node(ctx, P));
  for (const c of CITIES) at(c, () => drawGroup(ctx, c, P));
  if (v.top) at(SUBJECT, () => v.top(ctx, P));
  if (v.hud) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); PXW = dpr; LS = 1; v.hud(ctx, P, VIEW); GA = 1; ctx.globalAlpha = 1; }
}

// =============================================================================================
// Controls and state (also in the address).
// =============================================================================================
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (V_BY[q.get('v')]) S.v = q.get('v');
  if (ZOOMS[q.get('z')]) S.zoom = q.get('z');
  if (['own', 'enemy'].includes(q.get('side'))) S.side = q.get('side');
  if (['barracks', 'factory'].includes(q.get('kind'))) S.kind = q.get('kind');
  for (const [k, key] of [['real', 'real'], ['rm', 'still'], ['gr', 'gray'], ['more', 'more']]) if (q.has(k)) S[key] = q.get(k) === '1';
  const tm = Number(q.get('tm')); if (q.has('tm') && tm >= 0) { S.time = tm; S.playing = false; }
  if (q.has('play')) S.playing = q.get('play') === '1';
}
function writeHash() {
  const h = `v=${S.v}&z=${S.zoom}&side=${S.side}&kind=${S.kind}&real=${S.real ? 1 : 0}&rm=${S.still ? 1 : 0}&gr=${S.gray ? 1 : 0}&more=${S.more ? 1 : 0}` + (S.playing ? '' : `&tm=${Math.round(S.time)}`);
  history.replaceState(null, '', '#' + h);
}
function chip(parent, key, label, onClick, cls) {
  const b = document.createElement('button'); b.className = 'chip' + (cls ? ' ' + cls : ''); b.dataset.v = key;
  const k = document.createElement('span'); k.className = 'k'; k.textContent = key; b.append(k, document.createTextNode(label));
  b.addEventListener('click', onClick); parent.append(b); return b;
}
let playFrom = 0, playAt = 0;
function replay() { S.time = 0; S.playing = true; playFrom = 0; playAt = performance.now(); refresh(); }
const varChips = VARIANTS.map((v) => chip(document.getElementById('vars'), v.id, v.name, () => { S.v = v.id; replay(); }, 'var' + (v.ref ? ' ref' : '')));
document.querySelectorAll('[data-z]').forEach((b) => b.addEventListener('click', () => { S.zoom = b.dataset.z; refresh(); }));
document.querySelectorAll('[data-side]').forEach((b) => b.addEventListener('click', () => { S.side = b.dataset.side; replay(); }));
document.querySelectorAll('[data-kind]').forEach((b) => b.addEventListener('click', () => { S.kind = b.dataset.kind; replay(); }));
for (const [id, key] of [['real', 'real'], ['still', 'still'], ['gray', 'gray']]) document.getElementById(id).addEventListener('click', () => { S[key] = !S[key]; if (key === 'real') replay(); else refresh(); });
const moreBtn = document.getElementById('more'), playBtn = document.getElementById('play'), scrub = document.getElementById('scrub');
moreBtn.addEventListener('click', () => { S.more = !S.more; refresh(); });
document.getElementById('replay').addEventListener('click', replay);
view.addEventListener('click', replay);
playBtn.addEventListener('click', () => { if (S.playing) S.playing = false; else { S.playing = true; playFrom = S.time; playAt = performance.now(); } refresh(); });
scrub.addEventListener('input', () => { S.playing = false; S.time = Number(scrub.value); refresh(); });
function refresh() {
  const press = (els, on) => els.forEach((e) => e.setAttribute('aria-pressed', String(on(e))));
  press(varChips, (e) => e.dataset.v === S.v);
  press([...document.querySelectorAll('[data-z]')], (e) => e.dataset.z === S.zoom);
  press([...document.querySelectorAll('[data-side]')], (e) => e.dataset.side === S.side);
  press([...document.querySelectorAll('[data-kind]')], (e) => e.dataset.kind === S.kind);
  for (const [id, key] of [['real', 'real'], ['still', 'still'], ['gray', 'gray']]) press([document.getElementById(id)], () => S[key]);
  document.getElementById('moreBar').classList.toggle('open', S.more); moreBtn.setAttribute('aria-expanded', String(S.more));
  playBtn.textContent = S.playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(!S.playing));
  scrub.max = schedule().loop; scrub.value = S.time;
  document.body.classList.toggle('gray', S.gray);
  const v = V_BY[S.v], cap = document.getElementById('cap'); cap.textContent = '';
  const b = document.createElement('b'); b.textContent = `${v.id} ${v.name}`; cap.append(b, document.createTextNode(S.side === 'enemy' ? v.foe || FOE_LINE : v.line));
  if (S.still) { const r = document.createElement('span'); r.className = 'rm'; r.textContent = 'Reduced motion: ' + v.rm; cap.append(r); }
  view.setAttribute('aria-label', `${v.id} ${v.name}: ${S.side === 'enemy' ? 'the opponent' : 'you'} build${S.side === 'enemy' ? 's' : ''} a ${S.kind} at Forkway, ${S.zoom} zoom. Click to replay.`);
  writeHash();
}
const FOE_LINE = 'The opponent’s city next to yours: nothing of the payment or the time shows; when its view turns the building on, the variant’s finish plays in the opponent’s colour.';
function tick(now) {
  if (S.playing) { S.time = playFrom + (now - playAt); const L = schedule().loop; if (S.time >= L) { S.time = 0; playFrom = 0; playAt = now; } scrub.value = S.time; }
  render(); requestAnimationFrame(tick);
}
window.addEventListener('resize', () => layoutView());
try { if (!location.hash && window.matchMedia('(prefers-reduced-motion: reduce)').matches) S.still = true; } catch (e) { /* no media queries */ }
readHash();
if (S.playing) { playFrom = S.time; playAt = performance.now(); }
layoutView(); refresh();
(async () => {
  try { groundTile = mirrorTile(await loadImg('assets/city-buildings/ground-plains.webp')); } catch (e) { /* the flat ground stays */ }
  try { await document.fonts.load("600 12px 'EB Garamond'"); } catch (e) { /* the serif fallback */ }
  document.body.dataset.ready = '1';
  requestAnimationFrame(tick);
})();
</script>
