<title>Node piece, round 1</title>
<!-- Node piece, round 1 (broad, #949): the owner's feedback of 2026-11-11 (#940) on the group helmet standing in a city or a
     province. Topic A: a helmet of (about) its size before #943 with the capacity cells of the ring still readable.
     Topic B: the selection told by cues inside the piece, never by an outer outline alone. A0 and B0 are the client
     today (#943 merged), A1 the look before #943. The two topics combine: every cell is one A with one B.
     Drawn with the client's own numbers: the helmet outlines of units/helmet.ts, HELMET_ENGRAVED, RING_ENGRAVED,
     CITY_ENGRAVED, PROVINCE_ENGRAVED, LOZENGE, VP_LOZENGE, TOWER, HELMET_SELECT, HELMET_FRAME, GROUP_ORDER.seal, BADGE
     and FLOW_STARVE of render/style.ts, helmetFit and the badge home of #943. The grounds are crops of the baked
     Intaglio backgrounds of maps/gen (1 pixel = 1 world unit), the fog the Ruled veil. Self-contained, no network:
     EB Garamond (SIL OFL) and the ground crops are in assets/node-piece/. State in the address (#a=...&b=...). -->

}

h1{font:600 20px/1 'EB Garamond',Georgia,serif;letter-spacing:.04em;margin:0 14px 0 0;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px}
.bar:first-child{margin-top:0}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lab{font:600 12px/1 'EB Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-right:4px}
button.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:5px 9px 5px 9px;font:500 13px/1 system-ui,sans-serif;cursor:pointer;position:relative;border-radius:0}

.gray canvas{filter:grayscale(1)}

// =============================================================================================

function samplePath(d, steps = 10) {

}
const RAW = {};

  const b = boundsOf([...RAW[k].dome, ...(RAW[k].band || []), ...RAW[k].strap]);

function helmetLines(width) { const s = width / 100; return { strap: Math.max(6.4*s, 2.1), band: Math.max(5.6*s, 2.2), casing: 6.4, edge: 2.1 }; }
function helmetExtent(h) {

  return { top: h.bounds.y - pad, bottom: h.bounds.y + h.bounds.height + pad, left: h.bounds.x - pad, right: h.bounds.x + h.bounds.width + pad };

function helmetWidth(side, inside) { return Math.round(side * HELMET_SCALE * (inside ? HELMET_INSIDE : 1) * 100) / 100; }

function unitSide(units) { return units <= 3 ? UNIT_SIDES[0] : units <= 7 ? UNIT_SIDES[1] : units <= 15 ? UNIT_SIDES[2] : UNIT_SIDES[3]; }

/** The client's selection line: `offset` outside the whole silhouette (helmetOutline). */
function helmetOutline(kind, width, offset) {

// =============================================================================================
// Drawing helpers (world units; the canvas transform carries the zoom).
// =============================================================================================

// =============================================================================================

  const gw = (line) => (line === h.strap ? L.strap : L.band) * HE.gear;
  const gearBright = (bv === 'B1' || bv === 'B8') ? sel : 0;
  const casingGrow = bv === 'B8' ? 0.5*sel : 0;
  // The back: casing, plate, hatch.
  for (const line of gear) { poly(ctx, line, false); stroke(ctx, gw(line) + casing*0.8 + casingGrow, C.casing); }
  poly(ctx, h.dome); stroke(ctx, casing*0.9 + casingGrow, C.casing);
  poly(ctx, h.dome); fill(ctx, C.plate);
  const pitch = Math.min(3, Math.max(1.4, g.width*0.075));
  const top = h.domeBottom - g.level*(h.domeBottom - h.domeTop);
  ctx.save(); poly(ctx, h.dome); ctx.clip();
  hatchLines(ctx, h.domeBounds, -Math.PI/4, pitch); stroke(ctx, HE.hatchW, g.color, 1, 'butt');
  // The charge from the bottom.
  ctx.beginPath(); ctx.rect(h.domeBounds.x - 2, top, h.domeBounds.width + 4, h.domeBottom - top + 2); fill(ctx, g.color);
  if (bv === 'B3' && on > 0) {
    hatchLines(ctx, h.domeBounds, Math.PI/4, sel > 0 ? 2.5 : 4.2); stroke(ctx, 0.75, C.ivory, 0.95*on, 'butt');
  }
  if (bv === 'B2' && on > 0) {
    const inner = domeInset(g.kind, g.width, Math.max(2.2, g.width*0.085));
    if (sel > 0) { poly(ctx, inner); stroke(ctx, 2.6, C.casing, 0.85*sel); poly(ctx, inner); stroke(ctx, 1.15, C.ivory, sel); }
    else { poly(ctx, inner); ctx.setLineDash([1.3, 1.5]); stroke(ctx, 1.1, C.ivory, 0.9*hov, 'butt'); ctx.setLineDash([]); }
  }
  if (bv === 'B5' && on > 0) {
    const c = h.middle;
    const ring = (s, a, w) => { ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s); ctx.translate(-c.x, -c.y); poly(ctx, h.dome); ctx.restore(); stroke(ctx, w, C.ivory, a); };
    if (sel > 0) {
      if (S.still) ring(0.68, 0.85*sel, 1.1);
      else for (const ph of [0, 0.5]) { const t = ((now / 1800) + ph) % 1; const e = ease.out(t); ring(1 - 0.55*e, (1 - t)*0.95*sel, 1.4 - 0.6*t); }
    }
  }
  ctx.restore();
  // The gear in ink (bright for B1 and B8 when selected).
  for (const line of gear) {
    poly(ctx, line, false);
    stroke(ctx, gw(line) * (1 + 0.25*gearBright), gearBright > 0 ? C.ivory : C.ink);
  }
  // The edge of the dome.
  if ((bv === 'B1' || bv === 'B5' || bv === 'B8') && hov > 0) {
    poly(ctx, h.dome); stroke(ctx, HE.edge, C.ink);
    poly(ctx, h.dome); ctx.setLineDash([2.2, 1.8]); stroke(ctx, HE.edge + 0.5, C.ivory, 0.95*hov, 'butt'); ctx.setLineDash([]);
  } else if (bv === 'B1' && on > 0) {
    // An ivory edge with a dark hairline just inside it: ivory between two darks reads on any fill.
    const w = HE.edge + 0.85*sel;
    ctx.save(); poly(ctx, h.dome); ctx.clip(); poly(ctx, h.dome); stroke(ctx, w + 2.2, C.casing, 0.8*sel); ctx.restore();
    poly(ctx, h.dome); stroke(ctx, w, C.ivory, 1);
  } else if (bv === 'B5' && sel > 0) {
    poly(ctx, h.dome); stroke(ctx, HE.edge + 0.5*sel, C.ivory, 1);
  } else { poly(ctx, h.dome); stroke(ctx, HE.edge, C.ink); }
  ctx.restore();
  // The number (not mirrored), on a tablet for B4.
  const mx = g.x + h.middle.x*facing*lift, my = g.y + h.middle.y*lift;
  ctx.font = `600 ${HE.font*lift}px 'EB Garamond', Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = String(g.units);
  if (bv === 'B4' && on > 0) {
    const w = 11.5 + 4*(label.length - 1), hh = 13.5, x = mx - w/2, y = my - hh/2 + 0.4;
    const notch = (inset) => { ctx.beginPath(); const n = 2; ctx.moveTo(x + n + inset, y + inset); ctx.lineTo(x + w - n - inset, y + inset); ctx.lineTo(x + w - inset, y + n + inset); ctx.lineTo(x + w - inset, y + hh - n - inset); ctx.lineTo(x + w - n - inset, y + hh - inset); ctx.lineTo(x + n + inset, y + hh - inset); ctx.lineTo(x + inset, y + hh - n - inset); ctx.lineTo(x + inset, y + n + inset); ctx.closePath(); };
    notch(-1.3); fill(ctx, C.casing);
    if (sel > 0) {
      notch(0); fill(ctx, C.ivory, sel);
      ctx.fillStyle = C.plate; ctx.globalAlpha = GA; ctx.fillText(label, mx, my + 0.6);
      return;
    }

  }

  ctx.fillStyle = C.ink; ctx.fillText(label, mx, my + 0.6);
}

/** Cues around the helmet but inside the piece (B6 ticks), and today's outline (B0). */
function drawOverlay(ctx, g, bv, cue) {
  const sel = cue.state === 'sel' ? cue.k : 0, hov = cue.state === 'hover' ? cue.k : 0;
  const facing = g.kind === 'own' ? 1 : -1;
  if (bv === 'B0' && (sel > 0 || hov > 0)) {
    // The client's frame is the outline of the helmet at its full size (helmetWidth), not the fitted one.
    const fw = helmetWidth(g.side, true);
    ctx.save(); ctx.translate(g.x, g.y); ctx.scale(facing, 1);
    if (sel > 0) {
      poly(ctx, helmetOutline(g.kind, fw, SELECT.frame)); stroke(ctx, SELECT.casing, C.casing, 0.9*sel);
      for (const o of [-SELECT.offset, SELECT.offset]) { poly(ctx, helmetOutline(g.kind, fw, SELECT.frame + o)); stroke(ctx, SELECT.ink, C.ink, sel); }
    } else {
      const H = SELECT.hover; const loop = helmetOutline(g.kind, fw, SELECT.hoverFrame);
      poly(ctx, loop); stroke(ctx, H.casing, C.casing, H.alpha*hov); poly(ctx, loop); stroke(ctx, H.ink, C.ink, H.alpha*hov);
    }
    ctx.restore();
  }
  if (bv === 'B6' && (sel > 0 || hov > 0)) {
    const e = helmetExtent(helmet(g.kind, g.width)), gap = 1.6;
    const x0 = g.x + (facing === 1 ? e.left : -e.right) - gap, x1 = g.x + (facing === 1 ? e.right : -e.left) + gap;
    const y0 = g.y + e.top - gap, y1 = g.y + e.bottom + gap, arm = 4.6;
    const corners = [[x0, y0, 1, 1], [x1, y0, -1, 1], [x1, y1, -1, -1], [x0, y1, 1, -1]];
    const which = sel > 0 ? [0, 1, 2, 3] : [0, 2];
    const k = sel > 0 ? sel : hov;
    const grow = (1 - ease.out(k)) * 3;
    for (const i of which) {
      const [cx, cy, sx, sy] = corners[i]; const ox = -sx*grow, oy = -sy*grow;
      ctx.beginPath(); ctx.moveTo(cx + ox + sx*arm, cy + oy); ctx.lineTo(cx + ox, cy + oy); ctx.lineTo(cx + ox, cy + oy + sy*arm);
      stroke(ctx, 3.2, C.casing, 0.95*k, 'square', 'miter');
      ctx.beginPath(); ctx.moveTo(cx + ox + sx*arm, cy + oy); ctx.lineTo(cx + ox, cy + oy); ctx.lineTo(cx + ox, cy + oy + sy*arm);
      stroke(ctx, 1.3, C.ivory, (sel > 0 ? 1 : 0.85)*k, 'butt', 'miter');

}
function drawSeal(ctx, g, n, k) {
  const w = helmetWidth(g.side, true);
  const x = g.x + w*SEAL.dx, y = g.y + w*SEAL.dy, h = SEAL.half*Math.SQRT2;
  const lz = (r) => { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); };
  GA = k;
  lz(h + SEAL.casing); fill(ctx, C.casing); lz(h); fill(ctx, C.plate); lz(h - 1.2); stroke(ctx, SEAL.ink, C.ink, 1, 'butt', 'miter');
  ctx.font = `600 ${SEAL.font}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.ink; ctx.fillText(String(n), x, y + 0.5);
  GA = 1; ctx.globalAlpha = 1;
}

function cueOf(slot, t) {
  const k = (at) => (S.still ? (t >= at ? 1 : 0) : ease.out(clamp01((t - at) / T.selMs)));
  if (slot.state === 'hover') return { state: 'hover', k: k(T.hover) };
  if (slot.state === 'sel') return { state: t >= T.hover && t < T.sel ? 'hover' : 'sel', k: t < T.sel ? k(T.hover) : k(T.sel) };
  if (slot.state === 'multi') { const at = slot.seal === 1 ? T.seal1 : T.seal2; return { state: 'sel', k: k(at) }; }
  return { state: 'none', k: 0 };
}

function drawPiece(ctx, slot, at, av, bv, t, now) {
  const plate = plateOf(slot), P = PLATES[plate];
  const kind = slot.side, color = colourOf(kind);
  const units = Math.min(S.units, P.cap), charged = Math.min(units, Math.round(S.charged * units / Math.max(1, S.units)));
  const enter = S.still ? (t >= T.enter ? 1 : 0) : ease.out(clamp01((t - T.enter) / T.enterMs));
  const ringK = S.still ? (t >= T.enter ? 1 : 0) : ease.inOut(clamp01((t - T.enter) / T.ringMs));
  const occupied = t >= T.enter;
  const L = layout(av, slot, P, units, occupied ? ringK : 0);
  const cue = cueOf(slot, t);
  // B8 lifts the piece; B7 lays an ivory plate under it.
  const g = { kind, color, units, side: L.side, width: L.width, level: units ? charged / units : 0, x: at.x + L.at.x, y: at.y + L.at.y };
  ctx.save(); ctx.translate(at.x, at.y);
  if (L.bezel && occupied) drawBezel(ctx, L, P.cap, kind === 'own' ? units : 0);
  else drawBody(ctx, plate, L.r, kind, color, occupied, plate === 'capital');
  if (L.cellArc && occupied && plate === 'province') { /* the dot shows: the helmet stands on the ring */ }
  const garrison = kind === 'own' && occupied ? units : 0;
  const arcs = L.cellArc ? ringArcs(P.cap, garrison, L.cellArc.from, L.cellArc.to) : ringArcs(P.cap, garrison);
  const pipsOnly = L.pips !== null && L.pips > 0;
  if (!L.bezel || !occupied) {
    if (pipsOnly) { GA = 1 - 0.8*L.pips; drawRing(ctx, L.ringR, arcs); GA = 1; ctx.globalAlpha = 1; circle(ctx, 0, 0, L.ringR); stroke(ctx, 0.8, C.ink, 0.35*L.pips); }
    else drawRing(ctx, L.ringR, arcs);
  }
  if (plate === 'capital') { for (const [kd, ang] of [['barracks', Math.PI*1.25], ['factory', Math.PI*0.95]]) drawTower(ctx, kd, { x: (L.ringR + TOWER.out)*Math.cos(ang), y: (L.ringR + TOWER.out)*Math.sin(ang) }, color, kind === 'enemy'); }
  if (S.badges.v && P.vp) { const d = L.ringR + VPL.lift; drawVp(ctx, { x: d*Math.cos(-Math.PI/4), y: d*Math.sin(-Math.PI/4) }, P.vp); }
  if (S.badges.r && kind === 'own') drawRally(ctx, L.ringR, Math.PI*0.62, color);
  drawLozenges(ctx, L.ringR + LOZ.drop + L.lozDrop, P.wh, P.stock, color);
  if (L.pips !== null) drawPips(ctx, L, P.cap, garrison);
  // B7: the ivory plate under the helmet, inside the ring.
  if (bv === 'B7' && cue.state !== 'none' && cue.k > 0 && occupied) {
    const R = (L.bezel ? L.bezel.plateR : L.ringR - RING.cut/2 - 0.6);
    const sel = cue.state === 'sel' ? cue.k : 0, hov = cue.state === 'hover' ? cue.k : 0;
    ctx.save(); ctx.translate(L.at.x, L.at.y);
    if (L.cellArc) { /* the helmet stands off the plate: the plate under the dome */ }
    circle(ctx, 0, 0, R); fill(ctx, C.ivory, sel > 0 ? 0.9*sel : 0.16*hov);
    circle(ctx, 0, 0, R - 0.6); stroke(ctx, 1, sel > 0 ? C.casing : C.ivory, sel > 0 ? 0.8*sel : 0.85*hov);
    if (hov > 0 && sel === 0) { circle(ctx, 0, 0, R - 2.2); ctx.setLineDash([1.2, 1.8]); stroke(ctx, 0.9, C.ivory, 0.8*hov, 'butt'); ctx.setLineDash([]); }
    ctx.restore();
  }
  ctx.restore();
  if (occupied) {
    ctx.save(); GA = enter; ctx.globalAlpha = GA;

    GA = 1; ctx.restore(); ctx.globalAlpha = 1;

  ctx.save(); ctx.translate(at.x, at.y);
  if (L.tab && occupied) drawTab(ctx, L, kind === 'own' ? units : 0, P.cap);
  ctx.restore();
  if (occupied) {
    drawOverlay(ctx, g, bv, cue);
    // Badges: at the helmet's corner (before #943) or outside the ring on its right (#943).
    const marks = [];
    if (S.badges.c) marks.push(S.ground === 'snow' || S.ground === 'forest' ? 'up' : 'down');
    if (marks.length) {
      let bx, by;
      if (av.badges === 'corner') {
        const e = helmetExtent(helmet(kind, L.width)); const facing = kind === 'own' ? 1 : -1;
        bx = g.x + (facing === 1 ? e.right : -e.left) - 2; by = g.y + e.top + 9;
      } else { bx = at.x + L.ringR + BADGE_GAP; by = at.y + BADGE_DROP; }
      drawChevron(ctx, { x: bx, y: by }, marks[0]);
    }
    if (S.badges.w) { const r = (L.bezel ? L.ringR - RING.gap : L.r) + STARVE.gap, a = STARVE.angle*Math.PI/180; drawStarve(ctx, { x: at.x + r*Math.cos(a) + (L.bezel ? 3 : 0), y: at.y + r*Math.sin(a) + (L.bezel ? 3 : 0) }); }
    if (slot.state === 'multi' && cue.k > 0) drawSeal(ctx, g, slot.seal, cue.k);
    if (slot.state === 'hover' || slot.state === 'sel') {
      const ck = S.still ? 1 : ease.out(clamp01((t - (T.hover - 300)) / 300));
      if (t >= T.hover - 300) {
        const e = helmetExtent(helmet(kind, L.width));
        const target = { x: g.x + 3, y: g.y + e.bottom*0.2 };
        const from = { x: target.x + 30, y: target.y + 26 };
        const show = slot.state === 'hover' || t < T.sel + 260;
        if (show) drawCursor(ctx, { x: from.x + (target.x - from.x)*ck, y: from.y + (target.y - from.y)*ck });
      }
    }
  }
}

// =============================================================================================
// Cells.
// =============================================================================================
const cellsEl = document.getElementById('cells');
let cells = [];
function buildCells() {
  cellsEl.innerHTML = '';
  const pairs = S.cmp === 'a' ? S.a.map((a) => [a, S.b[0]]) : S.b.map((b) => [S.a[0], b]);
  cellsEl.className = 'n' + pairs.length;
  cells = pairs.map(([a, b]) => {
    const div = document.createElement('div'); div.className = 'cell';
    const av = A_VARIANTS.find((v) => v.id === a), bv = B_VARIANTS.find((v) => v.id === b);
    const h2 = document.createElement('h2');
    const sa = document.createElement('span'); sa.textContent = `${av.id} ${av.name}`;
    const sb = document.createElement('span'); sb.className = 'b'; sb.textContent = `${bv.id} ${bv.name}`;
    h2.append(sa, sb);
    const cv = document.createElement('canvas');
    cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', `${av.id} ${av.name} with ${bv.id} ${bv.name}: an idle, a hovered and a selected group in the top row; two Shift-selected groups and an opponent's group in the bottom row`);
    div.append(h2, cv); cellsEl.append(div);
    return { av, bv: bv.id, cv };
  });
  sizeCells();
}
function sizeCells() {
  const dpr = window.devicePixelRatio || 1;
  for (const c of cells) {
    const w = c.cv.clientWidth || 600, h = Math.round(w * (cells.length === 1 ? 0.56 : 0.74));
    c.cv.style.height = h + 'px';
    c.cv.width = Math.round(w*dpr); c.cv.height = Math.round(h*dpr);
    c.w = w; c.h = h; c.dpr = dpr;
  }
}
function render(now) {
  const z = S.zoom / 100;
  for (const c of cells) {
    const ctx = c.cv.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.cv.width, c.cv.height);
    const sx = c.dpr*z;
    // The scene's middle at the canvas middle.
    const cx = DX, cy = DY/2;
    ctx.setTransform(sx, 0, 0, sx, c.cv.width/2 - cx*sx, c.cv.height/2 - cy*sx);
    const box = { x: cx - c.w/(2*z) - 2, y: cy - c.h/(2*z) - 2, w: c.w/z + 4, h: c.h/z + 4 };
    drawGround(ctx, S.ground, box);
    const nodes = SLOTS.map((s) => ({ x: s.col*DX, y: s.row*DY }));
    drawRoads(ctx, nodes);
    SLOTS.forEach((s, i) => drawPiece(ctx, s, nodes[i], c.av, c.bv, S.t, now));
  }
}

// =============================================================================================
// Controls.
// =============================================================================================
function chip(parent, id, label, onClick) {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.v = id;
  const k = document.createElement('span'); k.className = 'k'; k.textContent = id;
  b.append(k, document.createTextNode(label));
  b.addEventListener('click', onClick); parent.append(b); return b;
}
function pick(list, id, multi) {
  if (!multi) return [id];
  const i = list.indexOf(id);
  if (i >= 0) return list.length > 1 ? list.filter((x) => x !== id) : list;
  return list.length >= 4 ? [...list.slice(1), id] : [...list, id];
}
const aEl = document.getElementById('topicA'), bEl = document.getElementById('topicB');
const aChips = A_VARIANTS.map((v) => chip(aEl, v.id, v.name, () => { S.a = pick(S.a, v.id, S.cmp === 'a'); refresh(true); }));
const bChips = B_VARIANTS.map((v) => chip(bEl, v.id, v.name, () => { S.b = pick(S.b, v.id, S.cmp === 'b'); refresh(true); }));
document.querySelectorAll('[data-cmp]').forEach((b) => b.addEventListener('click', () => {
  S.cmp = b.dataset.cmp;
  if (S.cmp === 'a') S.b = S.b.slice(0, 1); else S.a = S.a.slice(0, 1);
  refresh(true);
}));
const bind = (sel, key) => document.querySelectorAll(sel).forEach((b) => b.addEventListener('click', () => { S[key] = b.dataset[key]; refresh(false); }));
bind('[data-ground]', 'ground'); bind('[data-plate]', 'plate'); bind('[data-col]', 'col');
document.querySelectorAll('[data-badge]').forEach((b) => b.addEventListener('click', () => { S.badges[b.dataset.badge] = !S.badges[b.dataset.badge]; refresh(false); }));
const units = document.getElementById('units'), charged = document.getElementById('charged'), zoom = document.getElementById('zoom'), scrub = document.getElementById('scrub');
units.addEventListener('input', () => { S.units = Number(units.value); S.charged = Math.min(S.charged, S.units); refresh(false); });
charged.addEventListener('input', () => { S.charged = Math.min(Number(charged.value), S.units); refresh(false); });
zoom.addEventListener('input', () => { S.zoom = Number(zoom.value); refresh(false); });
document.getElementById('gray').addEventListener('click', () => { S.gray = !S.gray; refresh(false); });
document.getElementById('still').addEventListener('click', () => { S.still = !S.still; refresh(false); });
const playBtn = document.getElementById('play');
let playFrom = 0, playAt = 0;
playBtn.addEventListener('click', () => {
  if (S.playing) { S.playing = false; }
  else { S.playing = true; if (S.t >= T.end) S.t = 0; playFrom = S.t; playAt = performance.now(); }
  refresh(false);
});
scrub.addEventListener('input', () => { S.playing = false; S.t = Number(scrub.value); refresh(false); });
scrub.addEventListener('change', () => writeHash());
function refresh(rebuild) {
  const press = (els, on) => els.forEach((e) => e.setAttribute('aria-pressed', String(on(e))));
  press(aChips, (e) => S.a.includes(e.dataset.v)); press(bChips, (e) => S.b.includes(e.dataset.v));
  press([...document.querySelectorAll('[data-cmp]')], (e) => e.dataset.cmp === S.cmp);
  press([...document.querySelectorAll('[data-ground]')], (e) => e.dataset.ground === S.ground);
  press([...document.querySelectorAll('[data-plate]')], (e) => e.dataset.plate === S.plate);
  press([...document.querySelectorAll('[data-col]')], (e) => e.dataset.col === S.col);
  press([...document.querySelectorAll('[data-badge]')], (e) => S.badges[e.dataset.badge]);
  press([document.getElementById('gray')], () => S.gray); press([document.getElementById('still')], () => S.still);
  playBtn.textContent = S.playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(S.playing));
  units.value = S.units; charged.max = S.units; charged.value = S.charged; zoom.value = S.zoom; scrub.value = S.t; scrub.max = T.end;
  document.getElementById('unitsV').textContent = String(S.units);
  document.getElementById('chargedV').textContent = String(S.charged);
  document.getElementById('zoomV').textContent = S.zoom + '%';
  document.body.classList.toggle('gray', S.gray);
  writeHash();
  if (rebuild) buildCells();
}
function frame(now) {
  if (S.playing) {
    S.t = Math.min(T.end, playFrom + (now - playAt));
    scrub.value = S.t;
    if (S.t >= T.end) { S.playing = false; refresh(false); }
  }
  render(now);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => sizeCells());
readHash();
refresh(true);
(async () => {
  await Promise.all(Object.entries(GROUND_FILES).map(async ([k, f]) => {
    try { const img = await loadImg(GROUND_URLS[k] || f); tiles[k] = mirrorTile(img, false); if (k === 'plains') tiles.fog = mirrorTile(img, true); } catch (e) { /* the flat ground stays */ }
  }));
  try { await document.fonts.load("600 12px 'EB Garamond'"); } catch (e) { /* the serif fallback */ }
  requestAnimationFrame(frame);
})();
</script>
