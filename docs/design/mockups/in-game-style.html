<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-game style, round 1</title>
<!-- In-game style, round 1 (#829): every element of a match in five complete variants on the
     Intaglio map (the owner's pick of #826, round 2), with the current pieces as variant 0.
     Self-contained, no network. Fonts (SIL OFL) and the baked Intaglio background are the round 2
     assets: assets/out-of-game-style/fonts and assets/out-of-game-style-r2. -->
<style>
@font-face{font-family:'Cinzel';src:url(assets/out-of-game-style/fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond-italic.woff2) format('woff2');font-weight:400 800;font-style:italic;font-display:block}

/* ---------------------------------------------------------------------------------------------
   The mockup's own chrome: neutral grey, out of the way of the variants.
   --------------------------------------------------------------------------------------------- */
html, body { margin: 0; height: 100%; }
body {
  background: #2a2b2c; color: #e4e4e2; font: 13px/1.4 system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 200px 1fr 300px; overflow: hidden;
}
body:not(.ready) { visibility: hidden; }
body.cmp { grid-template-columns: 200px 1fr 0; }
button, select { font: inherit; color: inherit; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-bottom: 1px solid #3b3c3e; flex-wrap: wrap; }
header.top h1 { font: 600 12px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 6px 0 0; color: #b9b9b6; }
#vars { display: flex; gap: 2px; flex-wrap: wrap; }
#vars button { background: none; border: 1px solid #47494c; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
#vars button .vn { opacity: .65; margin-right: 6px; font-variant-numeric: tabular-nums; }
#vars button[aria-pressed='true'] { background: #e4e4e2; color: #1d1e1f; border-color: #e4e4e2; }
.opts { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
select { background: #1f2021; border: 1px solid #47494c; padding: 4px 6px; }
nav.side { overflow: auto; border-right: 1px solid #3b3c3e; padding: 10px 0; }
nav.side h2, aside.notes h2 { font: 600 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8d8d8a; margin: 6px 16px 8px; }
#scenes { list-style: none; margin: 0; padding: 0; }
#scenes button { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; cursor: pointer; color: #b9b9b6; }
#scenes button[aria-current='page'] { color: #fff; background: #3a3b3d; box-shadow: inset 3px 0 0 #e4e4e2; }
#scenes .sn { font-variant-numeric: tabular-nums; opacity: .6; min-width: 16px; }
nav.side p { padding: 12px 16px 0; color: #8d8d8a; font-size: 12px; margin: 0; }
main.view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: center; align-content: center; padding: 16px; overflow: auto; }
.board { flex: none; }
.board .bl { margin: 0 0 5px; color: #9a9a97; font-size: 12px; display: flex; gap: 8px; }
.board .bl b { color: #e4e4e2; font-weight: 600; }
.board .clip { position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.35); }
body.gray .board .clip { filter: grayscale(1); }
aside.notes { border-left: 1px solid #3b3c3e; overflow: auto; padding: 10px 16px 20px; color: #c9c9c6; }
body.cmp aside.notes { display: none; }
aside.notes h3 { font: 600 15px system-ui, sans-serif; margin: 4px 0 6px; color: #fff; }
aside.notes p { margin: 0 0 10px; }
aside.notes dl { margin: 0; }
aside.notes dt { font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #8d8d8a; margin: 12px 0 3px; }
aside.notes dd { margin: 0; }
aside.notes ul { margin: 4px 0 0; padding-left: 16px; }
aside.notes li { margin: 2px 0; }
aside.notes .est { font-variant-numeric: tabular-nums; color: #fff; }
footer#transport { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 8px 20px 10px; border-top: 1px solid #3b3c3e; }
footer#transport button { background: #e4e4e2; color: #1d1e1f; border: 0; padding: 5px 14px; cursor: pointer; min-width: 80px; }
#scrub { flex: 1; accent-color: #e4e4e2; }
#clock { font-variant-numeric: tabular-nums; color: #b9b9b6; min-width: 120px; text-align: right; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#cmptable { width: 100%; border-collapse: collapse; margin: 6px 0 0; font-size: 12px; color: #c9c9c6; }
#cmptable th, #cmptable td { border-top: 1px solid #3b3c3e; padding: 5px 8px; text-align: left; vertical-align: top; }
#cmptable th { color: #8d8d8a; font-weight: 600; }
.cmpnotes { flex-basis: 100%; max-width: 1400px; }

/* ---------------------------------------------------------------------------------------------
   The artboard: a 1280 x 800 game window. The canvas draws the map (as PixiJS does); the HUD,
   menus, tooltips, alerts and toasts are HTML over it (as the Svelte HUD is).
   --------------------------------------------------------------------------------------------- */
.art { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden; transform-origin: 0 0; }
.art canvas.mcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art .ov { position: absolute; z-index: 3; }
.art svg.radial { position: absolute; overflow: visible; z-index: 4; }
.art .rl { position: absolute; z-index: 5; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; pointer-events: none; }
.art .rcap { position: absolute; z-index: 5; transform: translateX(-50%); text-align: center; white-space: nowrap; }

/* HUD skeleton, shared. */
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; z-index: 6; }
.hud .hg { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.hud .hg.mid { justify-content: center; flex: none; }
.hud .hg.end { justify-content: flex-end; }
.hud .cells { display: inline-flex; gap: 4px; }
.hud .cells i { display: block; width: 11px; height: 15px; }
.hud .tug { display: flex; position: relative; }
.hud .tug .tm { display: block; }
.hud .tug .te { display: block; flex: 1; }
.hud .mini { display: grid; gap: 3px; }
.hud .mini span { display: block; width: 34px; height: 3px; position: relative; }
.hud .mini span i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
.hud .fac { display: inline-flex; align-items: center; gap: 5px; }
.alerts { position: absolute; left: 50%; transform: translateX(-50%); z-index: 6; display: grid; justify-items: center; gap: 6px; }
.alert { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.alerts .hint { white-space: nowrap; }
.toasts { position: absolute; right: 16px; bottom: 16px; z-index: 6; display: grid; gap: 6px; justify-items: end; }
.toast { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.tip { position: absolute; z-index: 7; max-width: 290px; }
.tip .dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: 8px; }
.tip .dots i { display: block; width: 9px; height: 9px; border-radius: 50%; }
.panel { position: absolute; z-index: 6; display: flex; align-items: center; gap: 10px; }
.panel .step { display: grid; place-items: center; width: 26px; height: 26px; }
.panel .val { min-width: 54px; text-align: center; }
.edge { position: absolute; z-index: 6; display: flex; align-items: center; gap: 8px; }
.keys { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; gap: 14px; white-space: nowrap; }
.banner { position: absolute; left: 50%; transform: translateX(-50%); z-index: 6; white-space: nowrap; display: flex; gap: 12px; align-items: center; }
.helm { display: block; overflow: visible; }

/* ---- 0 Current: the client's look today (system font, graphite, the game's blue and red). ---- */
.v-current { --ink: #e6edf3; --dim: #8b949e; --own: #5b9bff; --en: #e5484d; --warn: #ffb020; --up: #3ddc72; background: #0d1117; }
.v-current .hud { height: 48px; padding: 0 12px; background: rgba(13,17,23,.97); border-bottom: 1px solid #30363d; font: 15px/1 system-ui, sans-serif; color: var(--ink); }
.v-current .hud .hl { color: var(--dim); font-size: 13px; }
.v-current .hud .cpbar { position: relative; width: 118px; height: 11px; border: 1.5px solid var(--own); border-radius: 6px; overflow: hidden; display: block; }
.v-current .hud .cpbar i { display: block; height: 100%; width: 72%; background: var(--own); background-image: repeating-linear-gradient(90deg, transparent 0 21px, #0d1117 21px 23px); }
.v-current .hud .cells { display: none; }
.v-current .hud .mini span { background: #30363d; border-radius: 2px; }
.v-current .hud .mini span i { background: var(--own); border-radius: 2px; }
.v-current .hud .chip, .v-current .hud .fac { border: 1px solid #30363d; border-radius: 6px; padding: 5px 9px; background: #161b22; display: inline-flex; gap: 6px; align-items: center; }
.v-current .hud kbd { font: 11px system-ui, sans-serif; color: var(--dim); border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; }
.v-current .hud .vpn { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.v-current .hud .vpn.own { color: var(--own); } .v-current .hud .vpn.en { color: var(--en); }
.v-current .hud .tug { width: 180px; height: 10px; border-radius: 2px; overflow: hidden; }
.v-current .hud .tug .tm { background: var(--own); width: 41%; } .v-current .hud .tug .te { background: var(--en); }
.v-current .hud .clockv { font-size: 19px; font-variant-numeric: tabular-nums; margin-right: 6px; }
.v-current .hud .tl { display: none; }
.v-current .hud .btn { white-space: nowrap; gap: 6px; display: inline-flex !important; align-items: center; justify-content: center; min-width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: var(--ink); font: 600 14px system-ui, sans-serif; padding: 0 9px; box-sizing: border-box; }
.v-current .alerts { top: 58px; }
.v-current .alert { padding: 7px 14px 7px 10px; background: #161b22; border: 1px solid #30363d; border-left: 3px solid var(--warn); border-radius: 6px; font: 15px system-ui, sans-serif; color: var(--ink); }
.v-current .alert .sg { width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: #0d1117; display: grid; place-items: center; font: 800 12px system-ui, sans-serif; }
.v-current .alerts .hint { padding: 3px 8px; background: rgba(22,27,34,.92); border: 1px solid #30363d; border-radius: 5px; font: 12px system-ui, sans-serif; color: var(--dim); }
.v-current .toast, .v-current .tip, .v-current .panel, .v-current .edge, .v-current .banner { background: rgba(22,27,34,.96); border: 1px solid #30363d; border-radius: 8px; font: 14px/1.35 system-ui, sans-serif; color: var(--ink); padding: 8px 12px; }
.v-current .tip { font-size: 13px; padding: 7px 10px; }
.v-current .tip .dots i.on { background: var(--own); } .v-current .tip .dots i { border: 1.5px solid var(--own); box-sizing: border-box; }
.v-current .tip .k { color: var(--dim); }
.v-current .panel { border-radius: 20px; padding: 6px 8px 6px 14px; font-weight: 600; }
.v-current .panel .step { border: 1px solid #30363d; border-radius: 6px; background: #0d1117; }
.v-current .panel .val { border: 1px solid var(--own); border-radius: 4px; padding: 3px 0; }
.v-current .keys { font: 12px system-ui, sans-serif; color: var(--dim); }
.v-current .keys kbd { font: 11px system-ui, sans-serif; color: var(--ink); border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; background: #161b22; margin-right: 4px; }
.v-current .rl { font: 600 14px/1.25 system-ui, sans-serif; color: var(--ink); }
.v-current .rl small { display: block; font: 500 12px system-ui, sans-serif; color: #c9d1d9; }
.v-current .rl kbd { display: inline-block; margin-top: 4px; font: 10px system-ui, sans-serif; color: var(--dim); border: 1px solid #484f58; border-radius: 3px; padding: 0 4px; }
.v-current .rl.off { opacity: .45; }
.v-current .rcap { font: 12px/1.4 system-ui, sans-serif; color: #c9d1d9; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.v-current .edge .ar { color: var(--warn); }

/* ---- I Lapidary: ivory cut into black stone; crisp cut shadows; Cinzel labels, EB Garamond numbers. ---- */
.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar { --ink: #ece4d1; --dim: #ada38f; --cut: #050403; --lip: #3d372d; --stone: #16130f; --plate: #1d1a15; --warn: #e6ab42; --up: #8cc79a; --gilt: #c9a45c; background: #100e0b; }
.v-lapidary { --own: #7d9ce2; --en: #e0735a; }
.v-cloisonne { --own: #5f86dc; --en: #d65a43; --gilt: #d2ad62; }
.v-engraved { --own: #86a6ea; --en: #e5785e; }
.v-relief { --own: #6d8fdc; --en: #d0604f; }
.v-planar { --own: #7096e0; --en: #d9674f; }

.v-lapidary .hud, .v-cloisonne .hud, .v-engraved .hud, .v-relief .hud, .v-planar .hud { height: 52px; padding: 0 20px; font: 18px/1 'EB Garamond', serif; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; gap: 0; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .hl,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .tl { font: 500 11px Cinzel, serif; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .cpbar { display: none; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .hv { font-size: 22px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .hv .of { font-size: 16px; color: var(--dim); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .chip,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .btn { font: 500 11px Cinzel, serif; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); height: 30px; display: inline-flex; align-items: center; gap: 8px; padding: 0 11px; box-sizing: border-box; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .btn { background: none; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .fac { font-size: 19px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud kbd { font: 500 10px Cinzel, serif; letter-spacing: .06em; color: var(--dim); padding: 1px 5px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .nk { font: 600 12px Cinzel, serif; letter-spacing: .16em; text-transform: uppercase; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .nk.own, :is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .vpn.own { color: var(--own); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .nk.en, :is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .vpn.en { color: var(--en); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .vpn { font-size: 27px; font-weight: 500; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .tug { width: 190px; height: 8px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .tug .tm { width: 41%; background: var(--own); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .tug::after { content: ''; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink); opacity: .55; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .clockv { font-size: 27px; margin: 0 10px 0 8px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .hud .gap { width: 16px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .alerts { top: 64px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .alert,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .toast,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .tip,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .panel,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .edge,
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .banner { font: 17px/1.3 'EB Garamond', serif; color: var(--ink); padding: 8px 16px 8px 12px; font-variant-numeric: lining-nums; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .tip { font-size: 16px; padding: 8px 12px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .tip .k { color: var(--dim); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .tip .th { font: 500 10.5px Cinzel, serif; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 3px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .alert .sg { width: 16px; height: 16px; flex: none; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .alert .sg .d { fill: var(--warn); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .alert .sg .k { fill: none; stroke: #16130f; stroke-width: 1.8; stroke-linecap: round; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .alerts .hint { font: 500 10.5px Cinzel, serif; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); padding: 3px 9px; background: rgba(22,19,15,.88); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .panel .lab { font: 600 11px Cinzel, serif; letter-spacing: .2em; text-transform: uppercase; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .panel .val { font-size: 20px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .keys { font: 500 10.5px Cinzel, serif; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .keys kbd { font: 500 10px Cinzel, serif; color: var(--ink); padding: 1px 5px; margin-right: 5px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl { font: 600 12px/1.2 Cinzel, serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl small { display: block; font: 500 16px/1.25 'EB Garamond', serif; letter-spacing: 0; text-transform: none; color: var(--ink); margin-top: 2px; font-variant-numeric: lining-nums; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl kbd { display: inline-block; margin-top: 4px; font: 500 10px Cinzel, serif; letter-spacing: .06em; color: var(--dim); padding: 0 5px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl.off { color: var(--dim); }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl.sm { font-size: 10px; letter-spacing: .1em; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl.sm small { font-size: 14px; margin-top: 0; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .rl.sm kbd { margin-top: 2px; }
.v-current .rl.sm { font-size: 13px; }
:is(.v-lapidary, .v-cloisonne, .v-engraved, .v-relief, .v-planar) .panel kbd { font: 500 10px Cinzel, serif; letter-spacing: .06em; color: var(--dim); padding: 1px 5px; }
.v-current .panel kbd { font: 11px system-ui, sans-serif; color: var(--dim); border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; }
.v-lapidary .panel kbd { border: 1px solid var(--lip); } .v-cloisonne .panel kbd { border: 1px solid rgba(210,173,98,.6); color: var(--gilt); }

/* I Lapidary: the stone strip, cut rules (a dark line over a lit lip), cut stone plates. */
.v-lapidary .hud { background: var(--tex) rgba(22,19,15,.96); border-bottom: 1px solid var(--cut); box-shadow: 0 1px 0 var(--lip), 0 3px 0 rgba(5,4,3,.45); }

.v-lapidary .hud .cells i.part { background: linear-gradient(0deg, var(--own) 0 60%, #0d0b09 60%); border-color: #c9d6f2; }
.v-lapidary .hud .chip, .v-lapidary .hud .btn, .v-lapidary .panel .step { border: 1px solid var(--cut); box-shadow: inset 0 0 0 1px var(--lip); }
.v-lapidary .hud kbd, .v-lapidary .keys kbd, .v-lapidary .rl kbd { border: 1px solid var(--lip); }
.v-lapidary .hud .tug { background: var(--cut); padding: 1px; box-shadow: 0 1px 0 var(--lip); }
.v-lapidary .hud .tug .te { background: repeating-linear-gradient(-45deg, var(--en) 0 3px, #b85a45 3px 5px); }
.v-lapidary .hud .mini span { background: var(--cut); box-shadow: 0 1px 0 var(--lip); } .v-lapidary .hud .mini span i { background: var(--ink); }
.v-lapidary .alert, .v-lapidary .toast, .v-lapidary .tip, .v-lapidary .panel, .v-lapidary .edge, .v-lapidary .banner { background: var(--tex) #1d1a15; border: 1px solid var(--cut); box-shadow: inset 0 0 0 1px var(--lip), 2px 3px 0 rgba(5,4,3,.55); }
.v-lapidary .tip .dots i { border: 1.5px solid var(--own); } .v-lapidary .tip .dots i.on { background: var(--own); border-color: #c9d6f2; }

/* II Cloisonne: the same stone, every frame and rule a fine gilt wire, the owner colours as enamel. */
.v-cloisonne .hud { background: var(--tex) rgba(19,16,13,.97); border-bottom: 1px solid var(--gilt); box-shadow: 0 1px 0 var(--cut), 0 2px 0 rgba(210,173,98,.35); }

.v-cloisonne .hud .chip, .v-cloisonne .hud .btn, .v-cloisonne .panel .step { border: 1px solid var(--gilt); box-shadow: inset 0 0 0 2px #14110d, inset 0 0 0 3px rgba(210,173,98,.4); }

.v-cloisonne .alert, .v-cloisonne .toast, .v-cloisonne .tip, .v-cloisonne .panel, .v-cloisonne .edge, .v-cloisonne .banner { background: var(--tex) #19160f; border: 1px solid var(--gilt); box-shadow: inset 0 0 0 3px #19160f, inset 0 0 0 4px rgba(210,173,98,.45), 0 2px 0 rgba(5,4,3,.6); }
.v-cloisonne .alert .sg .d { fill: var(--gilt); }

/* III Engraved: no material, only line: double hairline frames, hatched fills, open shapes. */

/* IV Relief: carved and raised: a lit top edge and a dark lower edge; on is raised, off is sunk. */
.v-relief .hud { background: var(--tex), linear-gradient(180deg, #221e18, #15120e); border-bottom: 1px solid var(--cut); box-shadow: inset 0 1px 0 rgba(236,228,209,.12), 0 2px 0 rgba(5,4,3,.5); }

// --- Fog --------------------------------------------------------------------------------------
// What each variant keeps of the hidden land (the open point of round 2):
const FOG = {
  current: { desat: 0, veil: 0.66, veilCol: '#252d38', blur: 9, tint: 0, borders: 0 },
  stone: { desat: 1, veil: 0.4, veilCol: '#0b0a08', blur: 6, tint: 0, borders: 0.6, hatch: [45, 7] },
  enamel: { desat: 0.5, veil: 0.44, veilCol: '#0b0a08', blur: 6, tint: 0.13, borders: 0.55 },
  engraved: { desat: 0.75, veil: 0.4, veilCol: '#0b0a08', blur: 5, tint: 0.7, borders: 0.7, rule: [45, 4] },
  relief: { desat: 0.6, veil: 0.46, veilCol: '#0b0a08', blur: 6, tint: 0, borders: 0.5 },
  flat: { desat: 0.35, veil: 0.42, veilCol: '#0d0b08', blur: 3, tint: 0.2, borders: 0.75 },
};
function drawFog(g, T, Wd, C, k) {
  const F = FOG[T.mat];
  const small = fogMask(Wd.visible);
  const M = () => maskLayer(k, C, small, F.blur);
  if (F.desat) blit(g, tinted(M(), '#808080'), F.desat, 'saturation');
  blit(g, tinted(M(), F.veilCol), F.veil);
  if (F.hatch || F.rule) {
    const L = canvas(W * k, H * k);
    const lg = L.getContext('2d');
    worldT(lg, C, k);
    if (F.hatch) {
      lg.fillStyle = hatch(lg, '#050403', F.hatch[0], F.hatch[1], 1, 0.55);
      lg.fillRect(0, 0, MAPW, MAPH);
      lg.fillStyle = hatch(lg, '#ece4d1', F.hatch[0], F.hatch[1], 0.6, 0.06);
      lg.translate(0.9, 0);
      lg.fillRect(0, 0, MAPW, MAPH);
    } else {
      lg.fillStyle = hatch(lg, '#050403', F.rule[0], F.rule[1], 1, 0.4);
      lg.fillRect(0, 0, MAPW, MAPH);
      lg.fillStyle = hatch(lg, '#050403', -F.rule[0], F.rule[1], 1, 0.4);
      lg.fillRect(0, 0, MAPW, MAPH);
    }
    blit(g, keepIn(L, M()), 0.9);
  }
  // owner tint and borders kept over the fog (variants that keep them)
  if (F.tint) {
    for (const o of [0, 1]) {
      const L = sideFill(T, Wd, o, C, k);
      keepIn(L, M());
      blit(g, L, T.mat === 'engraved' ? F.tint : F.tint);
    }
  }
  if (F.borders) {
    const L = canvas(W * k, H * k);
    const lg = L.getContext('2d');
    worldT(lg, C, k);
    drawBorderLines(lg, T, Wd, 0);
    drawBorderLines(lg, T, Wd, 1);
    keepIn(L, M());
    blit(g, L, F.borders);
  }
}

// The pieces: helmets, badges, orders, fights, the arena, the kill feed, effects, supply.
// =============================================================================================
const unitWidth = (n) => (n <= 2 ? 24 : n <= 5 ? 30 : n <= 9 ? 36 : 42) * 1.34;

// A helmet centred at (x, y), `w` wide (in the current units), `share` of it charged.
// o: inside (in a city), count, alpha, unknown, empty (an arena chip with no charge).
function helmet(g, T, side, x, y, w, share, o = {}) {
  const col = sideCol(T, side);

  const dome = p2d(H_.dome), strap = p2d(H_.strap), band = H_.band ? p2d(H_.band) : null;

  const sw = Math.max(6.4 * s, 2.1), bw = Math.max(5.6 * s, 2.2);

    g.save();
    g.beginPath();
    g.rect(0, fy, 100, 100);
    g.clip();
    g.fillStyle = style;
    g.fill(dome);
    g.restore();
  };
  const grad = (a, b) => {
    const gr = g.createLinearGradient(0, top, 0, bottom);
    gr.addColorStop(0, a);
    gr.addColorStop(1, b);
    return gr;
  };
  if (o.unknown) {
    unknownHelmet(g, T, side, dome, strap, band, s, col, o);
    g.restore();
    if (!o.noMark) text(g, T, '?', x, y - 13 * s + 1, T.mat === 'current' ? 15 : 15, { alpha: o.alpha ?? 1, weight: T.mat === 'current' ? 700 : 600 });
    return;
  }
  switch (T.mat) {
    case 'current': {
      g.strokeStyle = T.bg;
      lines((p, lw) => { g.lineWidth = px(lw) + px(casing); g.stroke(p); });
      g.lineWidth = px(casing);
      g.stroke(dome);
      g.strokeStyle = mixc(col, '#ffffff', 0.5);
      lines((p, lw) => { g.lineWidth = px(lw); g.stroke(p); });
      g.fillStyle = T.plate;
      g.fill(dome);
      fillLevel(grad(mixc(col, '#ffffff', 0.16), mixc(col, '#000000', 0.14)));
      g.strokeStyle = mixc(col, '#ffffff', 0.5);
      g.lineWidth = px(2.1);
      g.stroke(dome);
      break;
    }
    case 'stone': {
      g.save();
      g.translate(px(1), px(1.6));
      g.strokeStyle = CUTC + '.55)';
      g.lineWidth = px(casing);
      g.stroke(dome);
      g.fillStyle = CUTC + '.55)';
      g.fill(dome);
      g.restore();
      g.strokeStyle = '#050403';
      lines((p, lw) => { g.lineWidth = px(lw) + px(casing); g.stroke(p); });
      g.lineWidth = px(casing);
      g.stroke(dome);
      const light = mixc(col, T.ink, 0.58);
      g.strokeStyle = light;
      lines((p, lw) => { g.lineWidth = px(lw); g.stroke(p); });
      g.fillStyle = '#211d18';
      g.fill(dome);
      fillLevel(grad(mixc(col, '#ffffff', 0.16), mixc(col, '#000000', 0.14)));
      if (share > 0 && share < 1) {
        g.save(); g.clip(dome);
        g.strokeStyle = CUTC + '.7)'; g.lineWidth = px(1.2);
        g.beginPath(); g.moveTo(0, fy); g.lineTo(100, fy); g.stroke();
        g.restore();
      }
      if (o.empty) chipHatch(g, dome, rgba(mixc(col, '#ffffff', 0.4), 0.85), px(1.1), 17);
      g.strokeStyle = light;
      g.lineWidth = px(1.9);
      g.stroke(dome);
      break;
    }
    case 'enamel': {
      g.save();
      g.translate(px(0.8), px(1.6));
      g.fillStyle = CUTC + '.55)';
      g.fill(dome);
      g.restore();
      g.strokeStyle = T.giltD;
      lines((p, lw) => { g.lineWidth = px(lw) + px(4.4); g.stroke(p); });
      g.lineWidth = px(casing);
      g.stroke(dome);
      g.strokeStyle = T.gilt;
      lines((p, lw) => { g.lineWidth = px(lw) + px(1.4); g.stroke(p); });
      g.lineWidth = px(3.2);
      g.stroke(dome);
      g.fillStyle = '#14110c';
      g.fill(dome);

      g.save();
      g.clip(dome);
      g.beginPath();
      g.rect(0, Math.max(fy, top), 100, (bottom - top) * 0.3);
      g.clip();
      fillLevel(lightOf(T, side));
      g.restore();
      if (share > 0 && share < 1) {
        g.save(); g.clip(dome);
        g.strokeStyle = T.gilt; g.lineWidth = px(1.3);
        g.beginPath(); g.moveTo(0, fy); g.lineTo(100, fy); g.stroke();
        g.restore();
      }
      if (o.empty) chipHatch(g, dome, rgba(T.gilt, 0.7), px(0.9), 19);

      g.lineWidth = px(1.5);
      g.stroke(dome);

    }
    case 'engraved': {
      g.strokeStyle = '#060504';
      lines((p, lw) => { g.lineWidth = px(lw * 0.55) + px(casing * 0.8); g.stroke(p); });
      g.lineWidth = px(casing * 0.9);
      g.stroke(dome);
      g.fillStyle = '#0e0c09';
      g.fill(dome);
      // no charge: hatched in the side's colour; a charge: solid

      g.clip(dome);
      g.beginPath();
      g.rect(0, 0, 100, fy);
      g.clip();
      g.strokeStyle = col;
      g.lineWidth = px(0.9);
      for (let d = -100; d < 200; d += px(2.6)) {
        g.beginPath();
        g.moveTo(d, 100);
        g.lineTo(d + 100, 0);
        g.stroke();

      g.restore();
      fillLevel(col);
      if (share > 0 && share < 1) {
        g.save(); g.clip(dome);
        g.strokeStyle = T.ink; g.lineWidth = px(1);
        g.beginPath(); g.moveTo(0, fy); g.lineTo(100, fy); g.stroke();
        g.restore();
      }
      g.strokeStyle = T.ink;
      lines((p, lw) => { g.lineWidth = px(lw * 0.55); g.stroke(p); });
      g.lineWidth = px(1.25);
      g.stroke(dome);

    }
    case 'relief': {
      g.save();
      g.translate(px(1.2), px(2.2));
      g.fillStyle = CUTC + '.6)';
      g.fill(dome);
      g.restore();
      g.strokeStyle = '#050403';
      lines((p, lw) => { g.lineWidth = px(lw) + px(casing); g.stroke(p); });
      g.lineWidth = px(casing);
      g.stroke(dome);
      g.strokeStyle = '#e9dfc8';
      lines((p, lw) => { g.lineWidth = px(lw); g.stroke(p); });

      sunk.addColorStop(1, '#2a241d');
      g.fillStyle = sunk;
      g.fill(dome);
      // the charge: raised and lit from the top left
      const gr = g.createLinearGradient(20, top, 80, bottom);
      gr.addColorStop(0, lightOf(T, side));
      gr.addColorStop(0.45, col);
      gr.addColorStop(1, darkOf(T, side));
      fillLevel(gr);
      if (share > 0) {
        g.save(); g.clip(dome); g.beginPath(); g.rect(0, fy, 100, 100); g.clip();
        g.strokeStyle = 'rgba(255,248,230,.55)'; g.lineWidth = px(1.4);
        g.beginPath(); g.moveTo(0, fy + px(0.7)); g.lineTo(100, fy + px(0.7)); g.stroke();
        g.restore();
      }
      if (o.empty) chipHatch(g, dome, 'rgba(236,228,209,.25)', px(0.9), 19);
      // the bevel: a lit inner edge at the upper left, a dark one at the lower right
      g.save();
      g.clip(dome);
      g.translate(px(1.4), px(1.8));
      g.strokeStyle = 'rgba(255,250,236,.7)';
      g.lineWidth = px(2.2);
      g.stroke(dome);
      g.translate(-px(2.8), -px(3.6));
      g.strokeStyle = 'rgba(0,0,0,.55)';
      g.stroke(dome);
      g.restore();
      g.strokeStyle = '#050403';
      g.lineWidth = px(1.2);
      g.stroke(dome);

    }
    case 'flat': {
      g.strokeStyle = T.cut;
      lines((p, lw) => { g.lineWidth = px(lw) + px(3.4); g.stroke(p); });

      g.stroke(dome);
      g.strokeStyle = T.ink;
      lines((p, lw) => { g.lineWidth = px(lw); g.stroke(p); });
      g.fillStyle = '#2c2720';
      g.fill(dome);
      fillLevel(col);
      if (share > 0 && share < 1) {
        g.save(); g.clip(dome);
        g.strokeStyle = T.cut; g.lineWidth = px(1.3);
        g.beginPath(); g.moveTo(0, fy); g.lineTo(100, fy); g.stroke();
        g.restore();
      }
      if (o.empty) chipHatch(g, dome, rgba(col, 0.9), px(1), 17);

      g.lineWidth = px(1.7);

// An enemy figure whose numbers are not seen, or a memory in the fog: the shape without a fill.
function unknownHelmet(g, T, side, dome, strap, band, s, col, o) {
  const px = (v) => v / s;
  const pale = mixc(col, '#ffffff', 0.3);
  switch (T.mat) {
    case 'current': {
      for (const l of [strap, band].filter(Boolean)) {
        g.strokeStyle = T.bg; g.lineWidth = px(4.6); g.stroke(l);
        g.strokeStyle = pale; g.lineWidth = px(2.2); g.stroke(l);
      }
      g.strokeStyle = T.bg; g.lineWidth = px(4.4); g.stroke(dome);
      g.fillStyle = rgba(T.plate, 0.72); g.fill(dome);
      g.setLineDash([px(5), px(3.5)]);
      g.strokeStyle = pale; g.lineWidth = px(2.2); g.stroke(dome);

    }
    case 'stone': {
      for (const l of [strap, band].filter(Boolean)) { g.strokeStyle = '#050403'; g.lineWidth = px(4.4); g.stroke(l); g.strokeStyle = pale; g.lineWidth = px(1.6); g.stroke(l); }
      g.strokeStyle = '#050403'; g.lineWidth = px(5); g.stroke(dome);
      g.fillStyle = 'rgba(29,26,21,.86)'; g.fill(dome);
      chipHatch(g, dome, rgba(col, 0.55), px(1), 15);
      g.strokeStyle = pale; g.lineWidth = px(1.5); g.stroke(dome);
      break;
    }
    case 'enamel': {
      for (const l of [strap, band].filter(Boolean)) { g.strokeStyle = T.giltD; g.lineWidth = px(3.8); g.stroke(l); g.strokeStyle = T.gilt; g.lineWidth = px(1.4); g.stroke(l); }
      g.strokeStyle = T.giltD; g.lineWidth = px(5); g.stroke(dome);
      g.fillStyle = 'rgba(20,17,12,.88)'; g.fill(dome);
      g.strokeStyle = col; g.lineWidth = px(2.6); g.stroke(dome);
      g.strokeStyle = T.gilt; g.lineWidth = px(1); g.stroke(dome);

    }

      tmp.setAttribute('d', HELMET[side].dome);

      g.restore();

      g.strokeStyle = 'rgba(236,228,209,.35)'; g.lineWidth = px(1); g.stroke(dome);

    }
    case 'flat': {
      for (const l of [strap, band].filter(Boolean)) { g.strokeStyle = T.cut; g.lineWidth = px(4); g.stroke(l); g.strokeStyle = pale; g.lineWidth = px(1.6); g.stroke(l); }
      g.strokeStyle = T.cut; g.lineWidth = px(4.4); g.stroke(dome);
      g.fillStyle = 'rgba(29,26,21,.9)'; g.fill(dome);
      g.strokeStyle = pale; g.lineWidth = px(1.8); g.stroke(dome);
      break;
    }
  }
}

// --- Badges: chevrons up (advantage) and down (disadvantage), section 45 ---------------------------
function chevrons(g, T, x, y, dir, count, size = 11) {
  const n = Math.min(count, 3);
  const col = dir === 'up' ? T.up : T.down;
  const hw = size * 0.42, hh = size * 0.24, step = size * 0.46;
  g.save();
  g.lineJoin = 'round';
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const cy = y + (dir === 'up' ? 1 : -1) * (i - (n - 1) / 2) * step;
    const d = dir === 'up' ? 1 : -1;
    const pts = [[x - hw, cy + hh * d], [x, cy - hh * d], [x + hw, cy + hh * d]];
    const stroke = () => { g.beginPath(); pts.forEach(([a, b], j) => (j ? g.lineTo(a, b) : g.moveTo(a, b))); g.stroke(); };
    g.strokeStyle = T.mat === 'enamel' ? T.giltD : T.mat === 'current' ? T.bg : '#050403';
    g.lineWidth = size * 0.24 + 2.6;
    stroke();
    if (T.mat === 'enamel') { g.strokeStyle = T.gilt; g.lineWidth = size * 0.24 + 1.4; stroke(); }
    g.strokeStyle = col;
    g.lineWidth = size * 0.24;
    stroke();
  }
  g.restore();
}

// --- Selection, hover, reach -------------------------------------------------------------------
function selectMark(g, T, x, y, r, hover = false) {
  g.save();
  const a = hover ? 0.75 : 1;
  g.globalAlpha *= a;
  g.lineCap = 'butt';
  const ring = (rr, lw, col) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.arc(x, y, rr, 0, 7); g.stroke(); };
  switch (T.mat) {
    case 'current':
      ring(r, hover ? 4 : 5.5, 'rgba(13,17,23,.75)');
      ring(r, hover ? 2 : 3, T.ink);
      break;
    case 'relief': {
      // a raised ivory ring: its shadow below, its light above
      ring(r + 0.6, 6, 'rgba(5,4,3,.6)');
      g.save(); g.translate(0.8, 1.6); ring(r, hover ? 3 : 4.4, 'rgba(5,4,3,.7)'); g.restore();

}
function drawPackets(g, T, Wd, t) {

    const { x0, y0, x1, y1, ux, uy } = roadSeg(a, b);

      if (q.ghost) text(g, T, q.ghost, x + 26, y - 20, T.mat === 'current' ? 11 : 12.5, { alpha: 0.8, italic: T.mat !== 'current', weight: 500 });
      continue;
    }
    const share = typeof q.charged === 'function' ? q.charged(t) / q.units : q.charged / q.units;
    const w = unitWidth(q.units) * (inside ? 0.92 : 1);
    if (q.order !== undefined) {

      orderLine(g, T, x + (dx / l) * (w * 0.45), y + (dy / l) * (w * 0.45), tx - (dx / l) * (ringR(q.order) + 4), ty - (dy / l) * (ringR(q.order) + 4), q.side);
    }

    if (q.badge) chevrons(g, T, x + w * 0.42, y - w * 0.36, q.badge[0], q.badge[1], 11);

// The shots of a fight round: [from side, from point, to point, delay, bonus].
function fightShots(F, ap, dp) {

  // tokens

  if (F.at !== undefined) fightRing(g, T, P.at[0], P.at[1], P.r + 6, t);
  const attW = unitWidth(st.own.units), defW = unitWidth(st.enemy.units) * (F.at !== undefined ? 0.92 : 1);

function roadFortAt(g, T, x, y, ang, side) {

}

    fog: 'Fog: the colour drops to 40 % (the terrain hues stay faintly), the land darkens; the border bevels show through at 50 %; no tint.',
    own: 'Territory: the own land is a raised plateau (a lit lip inside its border), the enemy\'s is sunk (the lit lip outside); the owner\'s rule inside.',
    code: [
      '`style.ts`: lapis and porphyry with their light and dark tones.',
      '`bakedShapes.ts`: a bevel in every spec (a light stroke at the upper left, a dark one at the lower right, baked once); on is raised, off is sunk: the helmet charge, ring segments, CP cells, the warehouse.',
      '`territory.ts`: the two bevel strokes; `fogView.ts`: partial desaturation.',
      'Effects: raised slivers and stone fragments; the flood front is a travelling bevel.',
      'HUD: raised buttons and sunk wells (CSS gradients and inset shadows), a bevelled radial.',
    ],
    perf: 'The bevels are baked into the sprites (no filter, no light at run time). No FPS cost. Risk: the light must come from one side for every piece, so the mirrored enemy helmet needs its bevel baked after the flip (the mockup mirrors it, a detail to fix in code); the shading adds detail at small sizes.',
    est: '7 days',
  },
  planar: {
    fog: 'Fog: the terrain keeps most of its hue (only 35 % less colour) under a flat veil, and the owner tint stays over the fog: the most is kept.',
    own: 'Territory: a flat tint and one owner rule (own a heavier rule, the enemy a rule and a row of small squares).',
    code: [
      '`style.ts`: flat tokens; no shading constants.',
      '`bakedShapes.ts`: the shapes as they are, flat fills and a 1 px ivory rule; gradients, rims and shadows removed (fewer draw calls per bake).',
      '`territory.ts`: one rule instead of the glow; `fogView.ts`: the veil, the owner tint drawn again over it.',
      'Effects: flat slivers and squares; the flood front a fine ivory rule.',
      'HUD: flat plates with cut corners (`clip-path`), no shadows.',
    ],
    perf: 'The cheapest: fewer layers in every bake, no glow cache. No FPS cost. Risk: the least "carved"; it relies on the map to carry the Lapis character.',
    est: '4 to 5 days',
  },
};

// =============================================================================================
// The mockup shell: variants, scenes, compare, zoom, grayscale, reduced motion, time.
// The state lives in the address: #s=front&v=lapidary&cmp=0&gray=0&rm=0&z=fit&t=1.5
// =============================================================================================
const ST = { s: 'front', v: 'lapidary', cmp: false, gray: false, rm: false, z: 'fit', t: null };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('s') && SBY[h.get('s')]) ST.s = h.get('s');
  if (h.get('v') && VBY[h.get('v')]) ST.v = h.get('v');
  ST.cmp = h.get('cmp') === '1';
  ST.gray = h.get('gray') === '1';
  ST.rm = h.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  ST.z = h.get('z') || 'fit';
  ST.t = h.has('t') ? parseFloat(h.get('t')) : null;
}
function writeHash() {
  const h = new URLSearchParams({ s: ST.s, v: ST.v, cmp: ST.cmp ? '1' : '0', gray: ST.gray ? '1' : '0', rm: ST.rm ? '1' : '0', z: ST.z });
  if (ST.t !== null) h.set('t', ST.t.toFixed(2));
  history.replaceState(null, '', '#' + h.toString());
}
const scene = () => SBY[ST.s];
const STILL = { overview: 0.6, front: 0.62, city: 0.5, group: 0.5, arena: 0.62, capture: 1.05, hud: 0.6, pieces: 0.62 };

// --- Chrome ---------------------------------------------------------------------------------------
function buildChrome() {
  const vars = document.getElementById('vars');
  vars.innerHTML = VARIANTS.map((v) => `<button type="button" data-v="${v.id}"><span class="vn">${v.n}</span>${esc(v.name)}</button>`).join('');
  vars.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    ST.v = b.dataset.v;
    ST.cmp = false;
    sync();
  });
  const list = document.getElementById('scenes');
  list.innerHTML = SCENES.map((s, i) => `<li><button type="button" data-s="${s.id}"><span class="sn">${i + 1}</span>${esc(s.name)}</button></li>`).join('');
  list.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    ST.s = b.dataset.s;
    ST.t = null;
    sync();
  });
  document.getElementById('cmp').addEventListener('change', (e) => { ST.cmp = e.target.checked; sync(); });
  document.getElementById('gray').addEventListener('change', (e) => { ST.gray = e.target.checked; sync(); });
  document.getElementById('rm').addEventListener('change', (e) => { ST.rm = e.target.checked; sync(); });
  document.getElementById('zoom').addEventListener('change', (e) => { ST.z = e.target.value; sync(); });
  document.getElementById('play').addEventListener('click', () => {
    if (ST.t === null) ST.t = clock();
    else { T0 = performance.now() / 1000 - ST.t; ST.t = null; }
    syncTransport();
    writeHash();
  });
  document.getElementById('scrub').addEventListener('input', (e) => { ST.t = parseFloat(e.target.value); syncTransport(); writeHash(); frame(); });
  addEventListener('resize', () => layout());
}
function syncTransport() {
  const p = scene().period;
  const sc = document.getElementById('scrub');
  sc.max = String(p);
  document.getElementById('play').textContent = ST.t === null && !ST.rm ? 'Pause' : 'Play';
  document.getElementById('play').disabled = ST.rm;
}
let BOARDS = [];
function sync() {
  document.querySelectorAll('#vars button').forEach((b) => b.setAttribute('aria-pressed', String(!ST.cmp && b.dataset.v === ST.v)));
  document.querySelectorAll('#scenes button').forEach((b) => (b.dataset.s === ST.s ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
  document.getElementById('cmp').checked = ST.cmp;
  document.getElementById('gray').checked = ST.gray;
  document.getElementById('rm').checked = ST.rm;
  document.getElementById('zoom').value = ST.z;
  document.body.classList.toggle('cmp', ST.cmp);
  document.body.classList.toggle('gray', ST.gray);
  buildBoards();
  notes();
  syncTransport();
  writeHash();
  frame();
}
function notes() {
  const v = VBY[ST.v], N = NOTES[v.id], S = scene();
  document.getElementById('notes').innerHTML = `<h2>Variant</h2><h3>${v.n} ${esc(v.name)}</h3><p>${esc(v.idea)}</p>
    <dl><dt>Fog and owner territory</dt><dd>${esc(N.fog)} ${esc(N.own)}</dd>
    <dt>What changes in code</dt><dd><ul>${N.code.map((c) => `<li>${esc(c).replace(/`([^`]+)`/g, '<code>$1</code>')}</li>`).join('')}</ul></dd>
    <dt>Performance</dt><dd>${esc(N.perf)}</dd>
    <dt>Estimate</dt><dd class="est">${esc(N.est)}</dd>
    <dt>Scene</dt><dd>${esc(S.note)}</dd></dl>`;
}

// --- Boards ---------------------------------------------------------------------------------------
function buildBoards() {
  const stage = document.getElementById('stage');
  const list = ST.cmp ? VARIANTS.map((v) => v.id) : [ST.v];
  stage.innerHTML = '';
  BOARDS = list.map((id) => {
    const v = VBY[id];
    const el = document.createElement('div');
    el.className = 'board';
    el.innerHTML = `<p class="bl"><b>${v.n} ${esc(v.name)}</b><span>${esc(scene().name)}</span></p><div class="clip"><div class="art v-${id}"><canvas class="mcv" aria-label="${esc(v.name)}: ${esc(scene().name)}"></canvas></div></div>`;
    stage.appendChild(el);
    const art = el.querySelector('.art');
    const S = scene();
    const C = S.cam ? S.cam() : null;
    art.insertAdjacentHTML('beforeend', S.html(v, C, 0));
    paintLegend(art, v);
    return { id, v, el, art, cv: art.querySelector('canvas'), Wd: S.world(), C, k: 1 };
  });
  if (ST.cmp) {
    const t = document.createElement('div');
    t.className = 'cmpnotes';
    t.innerHTML = `<table id="cmptable"><thead><tr><th>Variant</th><th>Fog and owner territory</th><th>Performance</th><th>Estimate</th></tr></thead><tbody>${VARIANTS.map((v) => `<tr><td>${v.n} ${esc(v.name)}</td><td>${esc(NOTES[v.id].fog)}</td><td>${esc(NOTES[v.id].perf)}</td><td>${esc(NOTES[v.id].est)}</td></tr>`).join('')}</tbody></table>`;
    stage.appendChild(t);
  }
  layout();
}
function layout() {
  const stage = document.getElementById('stage');
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - 32;
  let s;
  if (ST.cmp) {
    const cols = aw > 1500 ? 3 : 2;
    s = Math.min((aw - (cols - 1) * 16) / cols / W, 0.5);
  } else s = ST.z === 'fit' ? Math.min(aw / W, (ah - 24) / H, 1) : parseFloat(ST.z);
  stage.style.alignContent = ST.cmp || ST.z !== 'fit' ? 'flex-start' : 'center';
  stage.style.justifyContent = ST.z !== 'fit' && !ST.cmp ? 'flex-start' : 'center';
  const dpr = window.devicePixelRatio || 1;
  for (const b of BOARDS) {
    const clip = b.el.querySelector('.clip');
    clip.style.width = `${W * s}px`;
    clip.style.height = `${H * s}px`;
    b.art.style.transform = `scale(${s})`;
    const k = Math.max(1, Math.min(3, Math.round(dpr * s * 2) / 2));
    if (k !== b.k || b.cv.width !== W * k) {
      b.k = k;
      b.cv.width = W * k;
      b.cv.height = H * k;
    }
  }
  frame();
}

// --- Time and frames ----------------------------------------------------------------------------------
let T0 = performance.now() / 1000;
function clock() {
  const S = scene();
  if (ST.rm) return STILL[S.id] ?? 0.5;
  if (ST.t !== null) return ST.t;
  return (performance.now() / 1000 - T0) % S.period;
}
function renderBoard(b, t) {
  const S = scene(), T = b.v, k = b.k;
  if (S.specimen) { drawSpecimen(b.cv, T, k, t); return; }
  const C = b.C, Wd = b.Wd;
  const g = b.cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (S.capture) {
    const cap = S.capture;
    const before = base(T, Wd, C, k, S.id);
    const Wa = { ...Wd, owner: { ...Wd.owner, [cap.node]: cap.side === 'own' ? 0 : 1 }, forts: Wd.forts.filter((f) => f[0] !== cap.node) };
    const after = base(T, Wa, C, k, S.id);
    const age = t - cap.start;
    const p = age <= 0 ? 0 : eOutQ(age / 1.0);
    const settle = (age - 0.86) / 0.26;
    if (ST.rm && age > 0) blit(g, after);
    else composeCapture(g, T, before, after, C, k, cap.node, cap.side, age <= 0 ? 0 : Math.max(0.001, p), settle);
    if (!ST.rm && age > 0 && age < 1) {
      worldT(g, C, k);
      drawFloodFront(g, T, cap.node, cap.side, p);
    }
    // after the capture the scene's own pieces see the new owner
    S.dyn(g, T, age > 0 ? Wa : Wd, C, k, t);
  } else {
    blit(g, base(T, Wd, C, k, S.id));
    S.dyn(g, T, Wd, C, k, t);
  }
  // the toasts that appear at a time
  b.art.querySelectorAll('[data-t0]').forEach((el) => (el.style.visibility = t >= parseFloat(el.dataset.t0) ? 'visible' : 'hidden'));
}
function frame() {
  const t = clock();
  for (const b of BOARDS) renderBoard(b, t);
  document.getElementById('scrub').value = String(t);
  document.getElementById('clock').textContent = `${t.toFixed(2)} s of ${scene().period} s`;
}
function tick() {
  if (ST.t === null && !ST.rm) frame();
  requestAnimationFrame(tick);
}

// --- Start ----------------------------------------------------------------------------------------
async function init() {
  const tex = stoneTexture();
  TEX.stoneUrl = tex.slice(4, -1);
  document.documentElement.style.setProperty('--tex', tex);
  readHash();
  buildChrome();
  await Promise.all([loadMatch(), document.fonts.load("600 13px Cinzel"), document.fonts.load("500 16px 'EB Garamond'"), document.fonts.load("italic 500 16px 'EB Garamond'")]);
  document.body.classList.add('ready');
  sync();
  requestAnimationFrame(tick);
  document.body.dataset.ready = '1';
}
init();
</script>
</body>
