<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out-of-game style, round 2: Lapis</title>
<!-- Out-of-game style, round 2 (#826): the Lapis direction in depth (every screen outside the
     match, the opening scene) and the match map carried into Lapis in four variants plus the
     current look. Self-contained: no network. Fonts (SIL OFL) are in
     assets/out-of-game-style/fonts with their licences; the baked map backgrounds are in
     assets/out-of-game-style-r2. Built from parts; see the issue. -->
<style>
@font-face{font-family:'Cinzel';src:url(assets/out-of-game-style/fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond-italic.woff2) format('woff2');font-weight:400 800;font-style:italic;font-display:block}
/* The mockup's own chrome: quiet, neutral, out of the way. */
html, body { margin: 0; height: 100%; }
body {
  background: #2a2b2c; color: #e4e4e2; font: 13px/1.4 system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 196px 1fr; overflow: hidden;
}
body:not(.ready) { visibility: hidden; }
button, select { font: inherit; color: inherit; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid #3b3c3e; flex-wrap: wrap; }
header.top h1 { font: 600 12px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 8px 0 0; color: #b9b9b6; }
#secs { display: flex; gap: 2px; }
#secs button, #states button { background: none; border: 1px solid #47494c; padding: 5px 11px; cursor: pointer; }
#secs button[aria-selected='true'], #states button[aria-pressed='true'] { background: #e4e4e2; color: #1d1e1f; border-color: #e4e4e2; }
.opts { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.opts [hidden] { display: none; }
select { background: #1f2021; border: 1px solid #47494c; padding: 4px 6px; }
nav.side { overflow: auto; border-right: 1px solid #3b3c3e; padding: 10px 0; }
#screens { list-style: none; margin: 0; padding: 0; }
#screens button { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; cursor: pointer; color: #b9b9b6; }
#screens button[aria-current='page'] { color: #fff; background: #3a3b3d; box-shadow: inset 3px 0 0 #e4e4e2; }
#screens button[aria-pressed='true'] { color: #fff; background: #3a3b3d; box-shadow: inset 3px 0 0 #e4e4e2; }
#screens .vn { font-variant-numeric: tabular-nums; opacity: .6; min-width: 18px; }
#screens .hint { display: block; padding: 10px 16px 0; color: #8d8d8a; font-size: 12px; }
main.view { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
#states { display: flex; gap: 2px; padding: 10px 24px 0; flex-wrap: wrap; }
#stage { position: relative; display: flex; flex-wrap: wrap; gap: 14px 20px; justify-content: center; align-content: center; align-items: center; padding: 24px; min-height: 0; overflow: hidden; }
#stage.scroll { overflow: auto; justify-content: flex-start; align-content: flex-start; align-items: flex-start; flex-wrap: nowrap; }
.board { flex: none; }
.board .bl { margin: 0 0 6px; color: #9a9a97; font-size: 12px; }
.board .bl span { font-variant-numeric: tabular-nums; }
.board .clip { position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.35); }
footer#transport { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 8px 24px 12px; }
footer#transport[hidden] { display: none; }
footer#transport button { background: #e4e4e2; color: #1d1e1f; border: 0; padding: 5px 14px; cursor: pointer; min-width: 92px; }
footer#transport #again { background: none; color: #e4e4e2; border: 1px solid #47494c; min-width: 0; }
#scrub { flex: 1; accent-color: #e4e4e2; }
#clock { font-variant-numeric: tabular-nums; color: #b9b9b6; min-width: 110px; text-align: right; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ---------------------------------------------------------------------------------------------
   Screens: the shared skeleton. Every direction sets the tokens and its own layout on top.
   --------------------------------------------------------------------------------------------- */
.art {
  position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden;
  transform-origin: 0 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-text); font-size: var(--fs, 16px); line-height: 1.45;
  font-variant-numeric: lining-nums tabular-nums;
  --p: 1; --m: 1; --q: 1;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.art.gray { filter: grayscale(1); }
.art *, .art *::before, .art *::after { box-sizing: border-box; }
.art button, .art input { font: inherit; color: inherit; }
.art button { background: none; border: 0; padding: 0; cursor: pointer; }
.art p, .art h1, .art h2, .art h3, .art ol, .art ul, .art dl, .art dd { margin: 0; padding: 0; }
.art ol, .art ul { list-style: none; }
.art :focus-visible { outline: 2px solid var(--focus, var(--ink)); outline-offset: 3px; }
.art .num { font-family: var(--f-num, inherit); font-variant-numeric: lining-nums tabular-nums; }
.scr { position: absolute; inset: 0; }
canvas.stage, canvas.bgmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vig { position: absolute; inset: 0; pointer-events: none; }

/* Entry scene ---------------------------------------------------------------------------------- */
.entry .title {
  position: absolute; left: 0; right: 0; margin: 0; white-space: nowrap; pointer-events: none;
  top: calc(var(--y0) + (var(--y1) - var(--y0)) * var(--m));
  transform: scale(calc(1 - (1 - var(--s1)) * var(--m)));
  transform-origin: var(--to, 50% 0);
  text-align: var(--ta, center); font-weight: 400;
}
.entry .title.done { --m: 1; }
.entry .title .w { display: inline-block; }
.entry .title .l { display: inline-block; position: relative; opacity: var(--p); }
.entry .gate { position: absolute; }
.entry .gate [data-q] { opacity: var(--q); transform: translateY(calc((1 - var(--q)) * 10px)); }
.entry .skip {
  position: absolute; right: 40px; bottom: 32px; opacity: 0; pointer-events: none; transition: opacity .3s;
}
.entry .skip.shown { opacity: 1; pointer-events: auto; }
.entry.form .title { --m: 1; }
.field { display: grid; gap: 6px; }
.field .box { display: flex; align-items: stretch; }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; }
.field input::placeholder { color: var(--dim); opacity: .8; }
.field .msg, .notice { display: flex; align-items: center; gap: 8px; }
.sg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.sg .sgk { fill: none; stroke: var(--sg-k, var(--bg)); stroke-width: 1.8; stroke-linecap: round; }
.notice.info .sg, .toast.ok .sg, .ss.ok .sg { fill: none; }
.notice.info .sg .sgk, .toast.ok .sg .sgk, .ss.ok .sg .sgk, .steps .sg .sgk, .lead.center > .sg .sgk { stroke: currentColor; }
.gate .alt { display: flex; }
.busy { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
.busy i { width: 5px; height: 5px; background: currentColor; display: block; animation: busy 1.2s infinite ease-in-out; }
.busy i:nth-child(2) { animation-delay: .15s; }
.busy i:nth-child(3) { animation-delay: .3s; }
@keyframes busy { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* Helmets as SVG -------------------------------------------------------------------------------- */
.helm { flex: none; overflow: visible; }
.helm .cs { fill: none; stroke: var(--h-casing, transparent); stroke-width: var(--h-cw, 0); stroke-linejoin: round; stroke-linecap: round; }
.helm .em { fill: var(--h-empty); }
.helm.own .fi { fill: var(--own); }
.helm.enemy .fi { fill: var(--enemy); }
.helm .ed { fill: none; stroke: var(--h-edge, transparent); stroke-width: var(--h-ew, 0); stroke-linejoin: round; }
.helm .st { fill: none; stroke: var(--h-edge, var(--h-casing)); stroke-width: 6; stroke-linecap: round; }
.helm.empty .ghost { fill: none; stroke: var(--dim); stroke-width: 4; stroke-dasharray: 9 7; }

/* App screens ------------------------------------------------------------------------------------ */
.bar { position: absolute; left: 0; right: 0; top: 0; height: 72px; display: flex; align-items: center; z-index: 2; }
.bar .corner { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.tabs { display: flex; }
.tab { color: inherit; text-decoration: none; }
.tab[aria-disabled] { opacity: .45; }
.acct { display: flex; align-items: baseline; gap: 10px; }
.body { position: absolute; left: 0; right: 0; top: 72px; bottom: 0; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip .sg { width: 13px; height: 13px; }
.cta, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; white-space: nowrap; }
.cta[disabled], .btn[disabled], .mode[disabled] { opacity: .42; cursor: default; }
.lnk { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.modes .mode { display: grid; width: 100%; text-align: left; }
.acts { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.versus { display: flex; align-items: center; gap: 14px; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { display: grid; justify-items: start; gap: 2px; text-align: left; }
.thumb .tr { stroke: var(--t-road, var(--line)); stroke-width: 1; }
.thumb .tn { fill: var(--t-neutral, var(--dim)); }
.thumb .tn.own { fill: var(--own); }
.thumb .tn.enemy { fill: var(--enemy); }
.thumb .tn.tp { fill: var(--bg); stroke: var(--t-neutral, var(--dim)); stroke-width: .8; }
.thumb .tn.tp.own { stroke: var(--own); }
.thumb .tn.tp.enemy { stroke: var(--enemy); }
.thumb.rnd text { fill: var(--dim); font-size: 30px; }
.levels { display: grid; }
.level { display: grid; text-align: left; }
.level .ld { font-size: 14px; line-height: 1.35; }
.level .pips { margin-bottom: 4px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; display: block; border: 1.5px solid currentColor; }
.pips i.on { background: currentColor; }
.seats { display: flex; align-items: center; gap: 28px; }
.seat { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
.seat .helm, .seat > svg { grid-row: span 3; }
.ss { display: inline-flex; align-items: center; gap: 6px; }
.lobbylist li { display: grid; grid-template-columns: 1.4fr .6fr 1fr 1fr auto; align-items: center; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-weight: inherit; }
.tbl td.pl { white-space: nowrap; }
.tbl td.pl .helm { vertical-align: -4px; margin-right: 8px; }
.tbl td.pl .you { margin-left: 8px; }
.wbar { display: inline-block; width: 90px; height: 6px; vertical-align: middle; margin-right: 10px; }
.wbar i { display: block; height: 100%; }
.res .rm, .rm { width: 12px; height: 12px; fill: currentColor; margin-right: 8px; vertical-align: -1px; }
.res.win { color: var(--own); }
.res.loss { color: var(--enemy); }
.facts { display: flex; }
.cards { display: grid; }
.segs { display: inline-flex; }
.switch { display: inline-flex; align-items: center; gap: 10px; }
.switch i { width: 38px; height: 20px; position: relative; display: block; }
.switch i::after { content: ''; position: absolute; top: 3px; width: 14px; height: 14px; right: 3px; }
.range { display: inline-flex; align-items: center; gap: 12px; }
.range input { width: 220px; accent-color: var(--ink); }
kbd { font-family: var(--f-num); }
.scrim { position: absolute; inset: 0; z-index: 5; }
.dialog { position: absolute; z-index: 6; }
.dialog .field { margin-top: 14px; }
.warnline { display: flex; align-items: center; gap: 8px; color: var(--warn); }
.toasts { position: absolute; z-index: 6; display: grid; gap: 10px; }
.toast { display: flex; align-items: center; gap: 12px; }
.toast .x { margin-left: auto; font-size: 20px; line-height: 1; padding: 0 4px; }
.toast .cta.sm { margin-left: auto; }
.toast.ok { color: var(--ink); }
.toast.warn .sg { color: var(--warn); }
.toast.err .sg { color: var(--enemy); }
.score { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 14px; }
.tug { display: flex; height: 8px; }
.tug .tm { background: var(--own); display: block; }
.tug .te { background: var(--enemy); flex: 1; display: block; }
.nm.mine, .vp.mine { color: var(--own); }
.nm.enemy, .vp.enemy { color: var(--enemy); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.rate { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.rate .cells { display: inline-flex; gap: 4px; align-self: center; }
.rate .cells i { width: 18px; height: 8px; display: block; border: 1.5px solid currentColor; }
.rate .cells i.on { background: currentColor; }
.delta.up { color: var(--own); }
.steps { display: grid; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 12px; }
.steps li.done { color: var(--dim); }
.lead.center > .sg { width: 28px; height: 28px; color: var(--enemy); }
.dhead .chips { align-items: center; flex-wrap: wrap; }
.dhead .csub { margin-left: 8px; color: var(--dim); }
.maps .label .note { display: inline; margin: 0 0 0 14px; font-family: var(--f-text); text-transform: none; letter-spacing: 0; font-weight: 400; }
[data-dir='lapis'] .csub { font-style: italic; }
.scr.entry { color: var(--ink); }
.segs button { white-space: nowrap; }

/* =============================================================================================
   I · LAPIS: imperial epigraphy. Black stone, cut Roman capitals, ivory; the sides are lapis and
   minium (the red of painted inscriptions). Rules are incised: a dark cut over a lit lower lip.
   ============================================================================================= */
[data-dir='lapis'] {
  --bg: #16130f; --bg2: #1d1a15; --ink: #ece4d1; --dim: #ada38f; --line: #3d372d; --cut: #050403;
  --own: #7d9ce2; --enemy: #e0735a; --warn: #e6ab42; --focus: #ece4d1;
  --f-display: Cinzel, serif; --f-text: 'EB Garamond', serif; --f-num: 'EB Garamond', serif; --fs: 18px;
  --h-empty: #221e19; --h-casing: #050403; --h-cw: 9; --h-edge: #ece4d1; --h-ew: 3.4;
  --t-road: #5c5446; --t-neutral: #cfc4ab; --sg-k: #16130f;
  background: var(--tex) var(--bg);
}
[data-dir='lapis'] .cut-rule, [data-dir='lapis'] .bar, [data-dir='lapis'] .modes li, [data-dir='lapis'] .levels .level,
[data-dir='lapis'] .lobbylist li, [data-dir='lapis'] .sec::after, [data-dir='lapis'] .set, [data-dir='lapis'] .card,
[data-dir='lapis'] .stats, [data-dir='lapis'] .tbl thead th, [data-dir='lapis'] .field .box {
  border-color: var(--cut);
}
[data-dir='lapis'] .lab, [data-dir='lapis'] .kicker, [data-dir='lapis'] .label, [data-dir='lapis'] .tbl th,
[data-dir='lapis'] .facts dt, [data-dir='lapis'] .stats dt, [data-dir='lapis'] .sl, [data-dir='lapis'] .sec,
[data-dir='lapis'] .chip, [data-dir='lapis'] .hl, [data-dir='lapis'] .cd, [data-dir='lapis'] .sw, [data-dir='lapis'] .skip {
  font-family: Cinzel, serif; font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); font-weight: 500;
}
/* Entry */
[data-dir='lapis'] .entry { --y0: 318px; --y1: 152px; --s1: .6; }
[data-dir='lapis'] .entry .vig { background: var(--grain), radial-gradient(ellipse 70% 62% at 50% 46%, rgba(11,10,8,.15) 0%, rgba(11,10,8,.72) 70%, #0b0a08 100%); }
[data-dir='lapis'] .entry .title { font-family: Cinzel, serif; font-size: 112px; line-height: 1.1; letter-spacing: .15em; color: var(--ink); text-shadow: 0 -1px 0 #000, 0 2px 0 rgba(236,228,209,.12); }
/* The letters assemble as in Atlas (round 1): each rises a little and settles while it fades in. */
[data-dir='lapis'] .entry .title .l { transform: translateY(calc((1 - var(--p)) * .08em)) scale(calc(.94 + .06 * var(--p))); transform-origin: 50% 80%; }
/* The underline of Atlas: a rule that draws out from the middle under the title, cut into the stone. */
[data-dir='lapis'] .entry .title::after { content: ''; position: absolute; left: 50%; top: 100%; width: calc(var(--sp, 1) * 300px); margin-left: calc(var(--sp, 1) * -150px); margin-top: 6px; border-top: 1.5px solid var(--ink); box-shadow: 0 -1px 0 rgba(0,0,0,.85); opacity: calc(.35 + .65 * var(--sp, 1)); }
[data-dir='lapis'] .entry .title .sp { display: inline-block; width: .62em; position: relative; }
[data-dir='lapis'] .entry .title .sp::after { content: ''; position: absolute; left: 50%; top: -.5em; margin-left: -.07em; border-left: .07em solid transparent; border-right: .07em solid transparent; border-top: .12em solid var(--ink); opacity: var(--sp, 1); }
[data-dir='lapis'] .entry .gate { left: 50%; top: 318px; width: 470px; margin-left: -235px; }
[data-dir='lapis'] .entry .gate.sheet { top: 268px; width: 440px; margin-left: -220px; display: grid; gap: 18px; }
[data-dir='lapis'] .formh { font: 400 22px/1.2 Cinzel, serif; letter-spacing: .16em; text-align: center; padding-bottom: 6px; }
[data-dir='lapis'] .field .box { border-bottom: 1px solid var(--cut); box-shadow: 0 1px 0 var(--line); }
[data-dir='lapis'] .field input { font-size: 24px; padding: 8px 0 10px; letter-spacing: .02em; }
[data-dir='lapis'] .sheet .field input { font-size: 20px; }
[data-dir='lapis'] .field .msg { color: var(--warn); font-size: 16px; font-style: italic; }
[data-dir='lapis'] .field .hint { color: var(--dim); font-size: 15px; font-style: italic; }
[data-dir='lapis'] .go { align-self: center; height: 46px; padding: 0 26px; margin-left: 14px; background: var(--ink); color: var(--bg); font: 500 14px Cinzel, serif; letter-spacing: .24em; }
[data-dir='lapis'] .gate .alt { justify-content: center; margin-top: 26px; }
[data-dir='lapis'] .gate .small { font: 500 12px Cinzel, serif; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); padding: 6px 2px; }
[data-dir='lapis'] .gate .small:hover { color: var(--ink); }
[data-dir='lapis'] .gate .small + .small::before { content: '▾'; display: inline-block; margin: 0 18px; transform: scale(.55) translateY(-2px); color: var(--dim); }
[data-dir='lapis'] .invited { text-align: center; margin-bottom: 18px; }
[data-dir='lapis'] .chip { border: 1px solid var(--line); padding: 5px 10px 4px; color: var(--ink); }
[data-dir='lapis'] .chip.inv { border-color: var(--own); color: var(--own); }
[data-dir='lapis'] .chip.ban { color: var(--warn); border-color: currentColor; }
[data-dir='lapis'] .skip { letter-spacing: .3em; }
/* Buttons */
[data-dir='lapis'] .cta { height: 50px; padding: 0 28px; background: var(--ink); color: var(--bg); font: 500 14px Cinzel, serif; letter-spacing: .22em; text-transform: uppercase; }
[data-dir='lapis'] .cta:hover { background: #fff8e9; }
[data-dir='lapis'] .cta .helm { --h-empty: #d8cfba; --h-casing: #16130f; --h-cw: 8; --h-edge: #16130f; --h-ew: 0; }
[data-dir='lapis'] .btn { height: 46px; padding: 0 22px; border: 1px solid #6a6152; font: 500 13px Cinzel, serif; letter-spacing: .2em; text-transform: uppercase; }
[data-dir='lapis'] .btn.sm, [data-dir='lapis'] .cta.sm { height: 34px; padding: 0 14px; font-size: 11px; }
[data-dir='lapis'] .lnk { font-style: italic; color: var(--ink); }
[data-dir='lapis'] .danger { color: var(--enemy); border-color: currentColor; }
[data-dir='lapis'] .cta.danger { background: var(--enemy); color: #16130f; }
/* Bar */
[data-dir='lapis'] .bar { padding: 0 64px; border-bottom: 1px solid var(--cut); box-shadow: 0 1px 0 var(--line); background: rgba(22,19,15,.82); }
[data-dir='lapis'] .brand { font: 400 17px Cinzel, serif; letter-spacing: .34em; }
[data-dir='lapis'] .tabs { margin-left: 72px; gap: 40px; }
[data-dir='lapis'] .tab { font: 500 12.5px Cinzel, serif; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); position: relative; padding: 6px 0; }
[data-dir='lapis'] .tab[aria-current] { color: var(--ink); }
[data-dir='lapis'] .tab[aria-current]::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -4px; border: 4px solid transparent; border-top: 6px solid var(--ink); }
[data-dir='lapis'] .acct .nick { font: 500 13px Cinzel, serif; letter-spacing: .16em; }
[data-dir='lapis'] .acct .st { font-style: italic; color: var(--dim); font-size: 17px; }
[data-dir='lapis'] .acct .st2 { display: none; }
/* Map behind the play screens */
[data-dir='lapis'] [data-bg='map'] .bgmap { opacity: .75; }
[data-dir='lapis'] [data-bg='map']::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #16130f 0%, rgba(22,19,15,.94) 46%, rgba(22,19,15,.3) 74%, rgba(22,19,15,.62) 100%); }
[data-dir='lapis'] [data-bg='plain'] .bgmap { opacity: .13; }
/* Main */
[data-dir='lapis'] .play { padding: 70px 0 0 128px; }
[data-dir='lapis'] .play .lead .kicker { margin-bottom: 14px; }
[data-dir='lapis'] .cta.big { width: 430px; height: 96px; justify-content: flex-start; gap: 22px; padding: 0 30px; font-size: 32px; letter-spacing: .24em; }
[data-dir='lapis'] .sub { margin-top: 14px; font-style: italic; color: var(--dim); font-size: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
[data-dir='lapis'] .modes { margin-top: 52px; width: 540px; counter-reset: m; }

// The world: the start menu map (maps/menu/valley.json), drawn once per direction as a "plate".
// The helmets are the client's own outlines (apps/client/src/units/helmet.ts, HELMET_PATHS).
// ---------------------------------------------------------------------------------------------
const W = 1280, H = 800;
const HELMET = {
  own: {
    dome: 'M9 70 C5 36 22 12 49 12 C70 12 85 26 88 42 C89 47 91 50 95 53 C82 54 72 56 66 60 C60 64 56 70 46 70 Z',
    band: 'M7 77 C20 79 34 80 46 79 C56 78 62 71 67 67 C72 63 82 61 96 60',
    strap: 'M46 80 L54 96',
  },
  enemy: {
    dome: 'M8 54 C8 30 28 13 52 13 C74 13 90 30 92 46 L98 54 Q99 58 95 58 L74 58 C65 58 60 64 57 73 C56 77 52 78 46 77 C32 74 18 69 12 64 Q8 61 8 54 Z',
    band: null,
    strap: 'M38 75 L58 91 L64 68',
  },
};
const DOME_Y = { own: [12, 70], enemy: [13, 78] };

// Map (800 x 560) to the 1280 x 800 artboard: cover, centred.
const MS = Math.max(W / VALLEY.w, H / VALLEY.h);
const MOX = (W - VALLEY.w * MS) / 2, MOY = (H - VALLEY.h * MS) / 2;
const mx = (x) => MOX + x * MS, my = (y) => MOY + y * MS;

// A small deterministic random (mulberry32): the textures and the scatter are the same on every load.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// --- Terrain classes from the baked background (maps/menu/valley.bg.webp) ------------------------
// 0 land (plains), 1 water, 2 forest, 3 mountains, 4 snow. A coarse grid with a majority vote.
const CLS = { cols: 200, rows: 140, grid: null, masks: {} };
function loadTerrain() {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = canvas(VALLEY.w, VALLEY.h);
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      const px = g.getImageData(0, 0, c.width, c.height).data;
      const cw = VALLEY.w / CLS.cols, ch = VALLEY.h / CLS.rows;
      const grid = new Uint8Array(CLS.cols * CLS.rows);
      for (let r = 0; r < CLS.rows; r++) {
        for (let q = 0; q < CLS.cols; q++) {
          const votes = [0, 0, 0, 0, 0];
          for (let dy = 0; dy < ch; dy += 1) {
            for (let dx = 0; dx < cw; dx += 1) {
              const i = (Math.floor(r * ch + dy) * VALLEY.w + Math.floor(q * cw + dx)) * 4;
              const R = px[i], G = px[i + 1], B = px[i + 2];
              let k = 3;
              if (R > 196 && G > 196 && B > 196) k = 4;
              else if (B > R + 14 && B > G - 6) k = 1;
              else if (G > R + 18 && G > B + 12 && R + G + B < 360) k = 2;
              else if (G > R - 4 && G > B + 30) k = 0;
              votes[k]++;
            }
          }
          let best = 0;
          for (let k = 1; k < 5; k++) if (votes[k] > votes[best]) best = k;
          grid[r * CLS.cols + q] = best;
        }
      }
      CLS.grid = grid;
      CLS.img = img;
      resolve();
    };
    img.src = VALLEY_BG;
  });
}
const clsAt = (x, y) => {
  const q = Math.floor(x / (VALLEY.w / CLS.cols)), r = Math.floor(y / (VALLEY.h / CLS.rows));
  if (q < 0 || r < 0 || q >= CLS.cols || r >= CLS.rows) return 1;
  return CLS.grid[r * CLS.cols + q];
};
// A soft alpha mask of a set of classes at artboard size times k.
function mask(classes, k, blur = 1.2) {
  const key = classes.join() + '@' + k + '@' + blur;
  if (CLS.masks[key]) return CLS.masks[key];
  const small = canvas(CLS.cols, CLS.rows);
  const g = small.getContext('2d');
  const id = g.createImageData(CLS.cols, CLS.rows);
  for (let i = 0; i < CLS.grid.length; i++) if (classes.includes(CLS.grid[i])) id.data[i * 4 + 3] = 255;
  g.putImageData(id, 0, 0);
  const big = canvas(W * k, H * k);
  const b = big.getContext('2d');
  b.imageSmoothingEnabled = true;
  b.imageSmoothingQuality = 'high';
  b.filter = `blur(${blur * k}px)`;
  b.drawImage(small, MOX * k, MOY * k, VALLEY.w * MS * k, VALLEY.h * MS * k);
  CLS.masks[key] = big;
  return big;
}
// Paint `draw` (in artboard units) only where the classes are.
function layer(ctx, k, classes, draw, blur) {
  const c = canvas(W * k, H * k);
  const g = c.getContext('2d');
  g.scale(k, k);
  draw(g);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(mask(classes, k, blur), 0, 0);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(c, 0, 0);
  ctx.restore();
}
function noise(ctx, w, h, seed, alpha, light, dark, density = 0.5) {
  const r = rng(seed);
  const n = Math.floor(w * h * density / 40);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = r() < 0.5 ? light : dark;
    ctx.globalAlpha = alpha * (0.4 + r() * 0.6);
    const s = r() < 0.92 ? 1 : 2;
    ctx.fillRect(r() * w, r() * h, s, s);
  }
  ctx.globalAlpha = 1;
}
function poly(g, pts, close) {
  g.beginPath();
  for (let i = 0; i < pts.length; i += 2) {
    const x = mx(pts[i]), y = my(pts[i + 1]);
    if (i === 0) g.moveTo(x, y);
    else g.lineTo(x, y);
  }
  if (close) g.closePath();
}
// Chaikin smoothing of the stepped geography lines (they are on a 4-unit grid).
function smooth(pts, n = 2) {
  let p = pts;
  for (let it = 0; it < n; it++) {
    if (p.length < 6) return p;
    const q = [p[0], p[1]];
    for (let i = 0; i < p.length - 2; i += 2) {
      const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
      q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
    }
    q.push(p[p.length - 2], p[p.length - 1]);
    p = q;
  }
  return p;
}
function river(g, r, width, color) {
  const pts = smooth(r[0]);
  g.strokeStyle = color;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = 0; i < pts.length - 2; i += 2) {
    const hw = r[1][Math.min(r[1].length - 1, Math.floor(i / 2 / 4))] || 4;
    g.lineWidth = Math.max(0.6, hw * MS * width);
    g.beginPath();
    g.moveTo(mx(pts[i]), my(pts[i + 1]));
    g.lineTo(mx(pts[i + 2]), my(pts[i + 3]));
    g.stroke();
  }
}
const NODE = (i) => VALLEY.n[i];
function roads(g, fn) {

function scatter(step, seed, fn) {

    for (let x = -step; x < W + step; x += step) {

const SIDE = (o) => (o === 0 ? 'own' : o === 1 ? 'enemy' : 'neutral');

// --- Plates: the same world in each direction ----------------------------------------------------
// tone: 'dark' (the entry and the dark screens) or 'light' (the paper screens of Atlas and Raster).
const PLATES = {
  lapis(g, k, P) {
    g.fillStyle = '#100e0b';
    g.fillRect(0, 0, W, H);
    layer(g, k, [0, 2, 3, 4], (l) => {
      l.fillStyle = '#25211b';
      l.fillRect(0, 0, W, H);
      noise(l, W, H, 11, 0.16, '#4a4337', '#0c0b09', 0.9);
    });
    // Water: fine incised horizontals.
    layer(g, k, [1], (l) => {
      l.strokeStyle = '#1f1b16';
      l.lineWidth = 1;
      for (let y = 0; y < H; y += 5) {
        l.beginPath();
        l.moveTo(0, y + 0.5);
        l.lineTo(W, y + 0.5);
        l.stroke();

    });
    // Mountains: carved chevrons; forest: drilled points.
    scatter(15, 5, (x, y, c, r) => {
      if (c === 3 && r() < 0.85) {
        const s = 4 + r() * 2.5;
        g.strokeStyle = 'rgba(222,210,186,.16)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(x - s, y + s * 0.55);
        g.lineTo(x, y - s * 0.55);
        g.lineTo(x + s, y + s * 0.55);
        g.stroke();
      } else if (c === 2) {
        g.fillStyle = 'rgba(8,7,5,.55)';
        g.beginPath();
        g.arc(x, y, 1.6, 0, 7);
        g.fill();
        g.fillStyle = 'rgba(222,210,186,.10)';
        g.beginPath();
        g.arc(x + 0.6, y + 0.8, 1.2, 0, 7);
        g.fill();
      }
    });
    // The coast and the rivers as incised grooves: a dark cut with a lit lower lip.
    for (const c of VALLEY.geo.coast) {
      const p = smooth(c);
      g.lineJoin = 'round';
      g.strokeStyle = '#070605';
      g.lineWidth = 2.2;
      poly(g, p);
      g.stroke();
      g.save();
      g.translate(0.8, 1.2);
      g.strokeStyle = 'rgba(214,200,172,.22)';
      g.lineWidth = 0.9;
      poly(g, p);
      g.stroke();
      g.restore();
    }
    for (const r of VALLEY.geo.rivers) river(g, r, 0.42, '#090806');
    for (const r of VALLEY.geo.streams) river(g, r, 0.18, '#0d0b09');
    roads(g, (x1, y1, x2, y2) => {
      g.strokeStyle = 'rgba(232,222,200,.30)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
    });
    VALLEY.n.forEach((n) => {
      const x = mx(n[0]), y = my(n[1]);
      const big = n[2] === 'C' ? 7 : n[2] === 'p' ? 2.6 : n[2] === 'l' ? 5.5 : 4.4;
      const col = { own: '#6f8fd6', enemy: '#d0634a', neutral: '#d9cdb3' }[SIDE(n[3])];
      g.fillStyle = '#0a0907';
      g.fillRect(x - big - 1.5, y - big - 1.5, big * 2 + 3, big * 2 + 3);
      g.fillStyle = n[2] === 'p' ? 'rgba(217,205,179,.55)' : col;
      g.fillRect(x - big, y - big, big * 2, big * 2);
      if (P.names && n[2] !== 'p') {
        g.font = `500 ${n[2] === 'C' ? 12 : 10}px Cinzel`;
        g.fillStyle = 'rgba(233,224,204,.62)';
        g.textAlign = 'center';
        g.letterSpacing = '2px';
        g.fillText(n[5].toUpperCase(), x, y + big + 15);
      }
    });
  },

};

const PLATE_CACHE = new Map();
function plate(dir, k, P = {}) {
  const key = [dir, k, P.tone, P.names, P.grid].join('|');
  if (PLATE_CACHE.has(key)) return PLATE_CACHE.get(key);
  const c = canvas(W * k, H * k);
  const g = c.getContext('2d');
  g.scale(k, k);
  PLATES[dir](g, k, P);
  PLATE_CACHE.set(key, c);
  return c;
}

// --- Helmets ------------------------------------------------------------------------------------
// Per direction: how a unit is inked. fill: charged colour; empty: the uncharged inside;
// casing: the outer line; edge: an inner light line (null for none).
const HELMET_STYLE = {
  lapis: { own: '#6f8fd6', enemy: '#d0634a', empty: '#1a1713', casing: '#0a0907', edge: '#e9e0cc', cw: 7, ew: 2.4 },
};
const P2D = {};
function p2d(d) {
  if (!P2D[d]) P2D[d] = new Path2D(d);
  return P2D[d];
}
// Draw a helmet centred at (x, y), `w` wide, `share` of it charged, alpha a.
function drawHelmet(g, dir, kind, x, y, w, share, a = 1) {
  const S = HELMET_STYLE[dir], P = HELMET[kind];
  const s = w / 100;
  g.save();
  g.globalAlpha = a;
  g.translate(x, y);
  if (kind === 'enemy') g.scale(-1, 1);
  g.scale(s, s);
  g.translate(-50, -54);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  const dome = p2d(P.dome);
  if (S.casing) {
    g.strokeStyle = S.casing;
    g.lineWidth = S.cw / s / 3.4;
    g.stroke(dome);
    g.stroke(p2d(P.strap));
    if (P.band) g.stroke(p2d(P.band));
  }
  g.fillStyle = S.empty;
  g.fill(dome);
  const [top, bottom] = DOME_Y[kind];
  const fy = bottom - (bottom - top) * share;
  g.save();
  g.beginPath();
  g.rect(0, fy, 100, 100);
  g.clip();
  g.fillStyle = S[kind];
  g.fill(dome);
  g.restore();
  if (S.edge) {
    g.strokeStyle = S.edge;
    g.lineWidth = S.ew / s / 3.4;
    g.stroke(dome);
  }
  g.strokeStyle = S.edge || S.casing;
  g.lineWidth = Math.max(5.6, 2.2 / s);
  g.stroke(p2d(P.strap));
  if (P.band) g.stroke(p2d(P.band));
  g.restore();
}
// The same helmet as inline SVG for the screens (styled by the direction's CSS).
let svgId = 0;
function helmetSVG(kind, share = 1, size = 28, extra = '') {
  const P = HELMET[kind];
  const id = 'hc' + svgId++;
  const [top, bottom] = DOME_Y[kind];
  const fy = bottom - (bottom - top) * share;
  const flip = kind === 'enemy' ? ' transform="translate(100 0) scale(-1 1)"' : '';
  return `<svg class="helm ${kind} ${extra}" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true" focusable="false"><defs><clipPath id="${id}"><rect x="0" y="${fy}" width="100" height="100"/></clipPath></defs><g${flip}><path class="cs" d="${P.dome}"/><path class="cs" d="${P.strap}"/>${P.band ? `<path class="cs" d="${P.band}"/>` : ''}<path class="em" d="${P.dome}"/><path class="fi" d="${P.dome}" clip-path="url(#${id})"/><path class="ed" d="${P.dome}"/><path class="st" d="${P.strap}"/>${P.band ? `<path class="st" d="${P.band}"/>` : ''}</g></svg>`;
}

// --- Map thumbnails as SVG (pool and generated maps) ---------------------------------------------
function thumbSVG(name, w = 120, h = 74) {
  const m = THUMBS[name];
  const s = Math.min((w - 8) / m.w, (h - 8) / m.h);
  const ox = (w - m.w * s) / 2, oy = (h - m.h * s) / 2;
  const X = (x) => (ox + x * s).toFixed(1), Y = (y) => (oy + y * s).toFixed(1);
  let out = `<svg class="thumb" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" focusable="false">`;
  for (const [a, b] of m.e) out += `<line class="tr" x1="${X(m.n[a][0])}" y1="${Y(m.n[a][1])}" x2="${X(m.n[b][0])}" y2="${Y(m.n[b][1])}"/>`;
  for (const n of m.n) {
    const r = n[2] === 'C' ? 3.2 : n[2] === 'p' ? 1.3 : 2;
    const cls = 'tn ' + SIDE(n[3]) + (n[2] === 'p' ? ' tp' : '');
    out += n[2] === 'C'
      ? `<rect class="${cls}" x="${(X(n[0]) - r).toFixed(1)}" y="${(Y(n[1]) - r).toFixed(1)}" width="${r * 2}" height="${r * 2}"/>`
      : `<circle class="${cls}" cx="${X(n[0])}" cy="${Y(n[1])}" r="${r}"/>`;
  }

// ---------------------------------------------------------------------------------------------
// The opening scene: a pure function of time t (seconds), so play, pause and scrub are exact.
// Round 2 (owner, 2026-11-08): five fights light the edges of the map at staggered, irregular
// moments, each with its own rise, hold and fade (no rhythm), eased in and out in both size and
// strength; the letters of the title assemble as in Atlas and its rule draws out under them;
// the title moves up and the nick field comes in. About 6.6 s. Shown once a browser session,
// skipped by a click or a key, never after a match, off under reduced motion (a still frame).
// ---------------------------------------------------------------------------------------------
const TL = {
  end: 6.6,
  // at: onset (s); rise, hold, fade: their lengths; R: radius; sx: the light's width against its
  // height; shots: when the three shots leave, after the onset. Hand-set, deterministic.
  battles: [
    { e: [6, 0], at: 0.38, rise: 0.64, hold: 0.92, fade: 1.66, R: 152, sx: 1.1, win: 'own', dy: -10, shots: [0.36, 0.7, 1.12] },
    { e: [18, 24], at: 0.97, rise: 0.82, hold: 0.5, fade: 2.08, R: 188, sx: 0.92, win: 'enemy', dy: 8, shots: [0.44, 0.86, 1.04] },
    { e: [2, 7], at: 1.56, rise: 0.52, hold: 1.16, fade: 1.44, R: 134, sx: 1.16, win: 'enemy', dy: 0, shots: [0.29, 0.8, 1.33] },
    { e: [17, 22], at: 2.19, rise: 0.7, hold: 0.71, fade: 1.9, R: 168, sx: 0.98, win: 'own', dy: 0, shots: [0.38, 0.6, 0.98] },
    { e: [10, 5], at: 2.63, rise: 0.57, hold: 0.38, fade: 1.62, R: 116, sx: 1.22, win: 'enemy', dy: -6, shots: [0.31, 0.55, 0.83] },
  ],
  shotDur: 0.17,
  title: 2.95, per: 0.105, letter: 0.42,
  move: 4.75, moveDur: 0.7,
  menu: 5.2, menuPer: 0.14, menuDur: 0.42,
  ambient: [4.2, 5.8],
};
const ENTRY_LOOK = { dark: '#0b0a08', amb: 0.2, lit: 'brightness(2.7) contrast(1.12)' };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
// Smootherstep: zero slope at both ends, so a light neither pops in nor snaps off.
const eSoft = (p) => {
  const x = clamp(p);
  return x * x * x * (x * (x * 6 - 15) + 10);
};

function battlePos(b) {
  const A = NODE(b.e[0]), B = NODE(b.e[1]);
  return { x: mx((A[0] + B[0]) / 2), y: my((A[1] + B[1]) / 2) + b.dy };
}
// Light of a battle at t: radius (artboard px) and strength 0..1.
function light(b, t) {
  const u = t - b.at;
  if (u <= 0) return null;
  if (u < b.rise) {
    const s = eSoft(u / b.rise);
    return { r: b.R * (0.62 + 0.38 * s), a: s };
  }
  if (u < b.rise + b.hold) return { r: b.R, a: 1 };
  const p = eSoft((u - b.rise - b.hold) / b.fade);
  if (p >= 1) return null;
  return { r: b.R * (1 - 0.42 * p), a: 1 - p };
}

const LIT = new Map();
function litPlate(k, base) {
  if (!LIT.has(k)) {
    const c = canvas(base.width, base.height);
    const g = c.getContext('2d');
    g.filter = ENTRY_LOOK.lit;
    g.drawImage(base, 0, 0);
    LIT.set(k, c);
  }
  return LIT.get(k);
}
const STAGE = new WeakMap();
function stageBuffers(cv) {
  let s = STAGE.get(cv);
  if (!s || s.w !== cv.width || s.h !== cv.height) {
    s = { w: cv.width, h: cv.height, lit: canvas(cv.width, cv.height), m: canvas(cv.width, cv.height) };
    STAGE.set(cv, s);
  }
  return s;
}

function drawShot(g, from, to, p) {
  const x = from.x + (to.x - from.x) * p, y = from.y + (to.y - from.y) * p;
  const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  g.save();
  g.lineCap = 'butt';
  const gr = g.createLinearGradient(x - ux * 18, y - uy * 18, x, y);
  gr.addColorStop(0, 'rgba(233,224,204,0)');
  gr.addColorStop(1, 'rgba(233,224,204,1)');
  g.strokeStyle = gr;
  g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(x - ux * 18, y - uy * 18);
  g.lineTo(x, y);
  g.stroke();
  g.restore();
}
function drawHit(g, at, q) {
  // q 0..1 after the hit: four short cut marks open out and fade.
  if (q <= 0 || q >= 1) return;
  g.save();
  g.globalAlpha = 1 - eSoft(q);
  g.strokeStyle = '#e9e0cc';
  g.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    const a = i * 1.7 + 0.4, r0 = 4 + eOut(q) * 6, r1 = r0 + 4;
    g.beginPath();
    g.moveTo(at.x + Math.cos(a) * r0, at.y + Math.sin(a) * r0);
    g.lineTo(at.x + Math.cos(a) * r1, at.y + Math.sin(a) * r1);
    g.stroke();
  }
  g.restore();
}
function drawBattle(g, b, t, a) {
  const c = battlePos(b);
  const u = t - b.at;
  const own = { x: c.x - 30, y: c.y + 4 }, enemy = { x: c.x + 30, y: c.y - 4 };
  const winner = b.win, loser = winner === 'own' ? 'enemy' : 'own';
  const units = { [winner]: 3, [loser]: 2 };
  const charged = { [winner]: 3, [loser]: 2 };
  const order = [winner, loser, winner];
  const fx = [];
  b.shots.forEach((s, i) => {
    const shooter = order[i], target = shooter === 'own' ? 'enemy' : 'own';
    const from = shooter === 'own' ? own : enemy, to = target === 'own' ? own : enemy;
    const p = (u - s) / TL.shotDur;
    if (p >= 1) charged[target] = Math.max(0, charged[target] - 1);
    if (p >= 0 && p < 1) fx.push(() => drawShot(g, { x: from.x + (to.x > from.x ? 14 : -14), y: from.y - 2 }, to, eOut(p)));
    if (p >= 1) fx.push(() => drawHit(g, to, (u - s - TL.shotDur) / 0.38));
  });
  const end = u - b.shots[2] - TL.shotDur;
  const loserA = end > 0 ? 1 - eSoft(end / 0.7) * 0.65 : 1;
  const w = 38;
  drawHelmet(g, 'lapis', 'own', own.x, own.y, w, charged.own / units.own, a * (loser === 'own' ? loserA : 1));
  drawHelmet(g, 'lapis', 'enemy', enemy.x, enemy.y, w, charged.enemy / units.enemy, a * (loser === 'enemy' ? loserA : 1));
  g.save();
  g.globalAlpha = a;
  fx.forEach((f) => f());
  g.restore();
}

// Draw the stage at t. k: backing pixels per artboard pixel. still: the final frame, no lights.
function drawStage(cv, t, k, still) {
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = ENTRY_LOOK.dark;
  g.fillRect(0, 0, cv.width, cv.height);
  const base = plate('lapis', k, { tone: 'dark', names: true });
  const amb = still ? ENTRY_LOOK.amb : ENTRY_LOOK.amb * eInOut(clamp((t - TL.ambient[0]) / (TL.ambient[1] - TL.ambient[0])));
  if (amb > 0) {
    g.globalAlpha = amb;
    g.drawImage(base, 0, 0);
    g.globalAlpha = 1;
  }
  if (still) return;
  const S = stageBuffers(cv);
  const mg = S.m.getContext('2d');
  mg.setTransform(1, 0, 0, 1, 0, 0);
  mg.clearRect(0, 0, S.w, S.h);
  mg.scale(k, k);
  const lights = [];
  for (const b of TL.battles) {
    const l = light(b, t);
    if (!l) continue;
    const c = battlePos(b);
    lights.push({ b, l });
    // A soft elliptical pool: a long, even falloff (no hard rim), its own width per fight.
    mg.save();
    mg.translate(c.x, c.y);
    mg.scale(b.sx, 1);
    const gr = mg.createRadialGradient(0, 0, 0, 0, 0, l.r);
    gr.addColorStop(0, `rgba(0,0,0,${l.a})`);
    gr.addColorStop(0.3, `rgba(0,0,0,${l.a * 0.95})`);
    gr.addColorStop(0.55, `rgba(0,0,0,${l.a * 0.74})`);
    gr.addColorStop(0.78, `rgba(0,0,0,${l.a * 0.34})`);
    gr.addColorStop(0.92, `rgba(0,0,0,${l.a * 0.09})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    mg.fillStyle = gr;
    mg.fillRect(-l.r, -l.r, l.r * 2, l.r * 2);
    mg.restore();
  }
  if (!lights.length) return;
  const lg = S.lit.getContext('2d');
  lg.globalCompositeOperation = 'source-over';
  lg.clearRect(0, 0, S.w, S.h);
  lg.drawImage(litPlate(k, base), 0, 0);
  lg.globalCompositeOperation = 'destination-in';
  lg.drawImage(S.m, 0, 0);
  lg.globalCompositeOperation = 'source-over';
  g.drawImage(S.lit, 0, 0);
  g.save();
  g.scale(k, k);
  for (const { b, l } of lights) drawBattle(g, b, t, l.a);
  g.restore();
}

// Set the DOM side of the scene (title letters, its rule, its move, the menu) for t.
function setEntryDOM(root, t, still) {
  const letters = root.querySelectorAll('.title .l');
  letters.forEach((el, i) => {
    const p = still ? 1 : eOut(clamp((t - (TL.title + i * TL.per)) / TL.letter));
    el.style.setProperty('--p', p.toFixed(3));
  });
  const n = letters.length;
  const sp = still ? 1 : eInOut(clamp((t - (TL.title + 3 * TL.per)) / ((n - 4) * TL.per + TL.letter)));
  root.style.setProperty('--sp', sp.toFixed(3));
  const m = still ? 1 : eInOut(clamp((t - TL.move) / TL.moveDur));
  root.style.setProperty('--m', m.toFixed(3));
  root.querySelectorAll('.gate [data-q]').forEach((el) => {
    const j = +el.dataset.q;
    const q = still ? 1 : eOut(clamp((t - TL.menu - j * TL.menuPer) / TL.menuDur));
    el.style.setProperty('--q', q.toFixed(3));
    el.toggleAttribute('inert', q < 0.6);
  });
  root.classList.toggle('done', still || t >= TL.end);
  const skip = root.querySelector('.skip');
  if (skip) skip.classList.toggle('shown', !still && t > 0.6 && t < TL.menu);
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function titleMarkup(cls = 'title') {

  ({

const notice = (k, text, act = '') => `<p class="notice ${k}" role="${k === 'err' ? 'alert' : 'status'}">${sign(k === 'info' ? 'ok' : k)}<span>${text}</span>${act}</p>`;

// --- Entry, log in, create an account ---------------------------------------------------------
function gate(state) {
  const invited = state === 'invited';
  const err = state === 'short' ? 'At least 3 characters' : state === 'taken' ? 'Taken. Try another nick' : null;
  const busy = state === 'busy';
  const nick = state === 'short' ? 'Ma' : state === 'taken' ? 'Ember' : busy ? 'Marta' : state === 'typed' ? 'Marta' : '';
  return `<form class="gate" onsubmit="return false" data-q="0">
    ${invited ? `<p class="invited" data-q="0">${chip('Invited to a match', 'inv')}</p>` : ''}
    <div class="q" data-q="0">${field('Your nick', nick, {
      ph: 'Nick',
      err,
      cls: 'nickf',
      after: `<button type="submit" class="go" ${busy ? 'aria-busy="true"' : ''}>${busy ? spinner('Signing in') : invited ? 'Join' : 'Play'}</button>`,
    })}</div>
    <div class="alt q" data-q="1"><button type="button" class="small">Log in</button><button type="button" class="small">Create an account</button></div>
  </form>`;
}
function entry(state) {
  return `<div class="scr entry" data-bg="entry">

    <div class="vig" aria-hidden="true"></div>

}

// --- The main screen (the Play tab) -------------------------------------------------------------
function modes(dis = false, lobby = 3) {
  const m = [
    ['Play a bot', 'Four levels, any map. Unrated.'],
    ['Invite a friend', 'A private link for one opponent.'],
    ['Open matches', lobby ? `${lobby} waiting` : 'None yet'],
  ];
  return `<ol class="modes">${m
    .map(([t, d]) => `<li><button type="button" class="mode" ${dis ? 'disabled' : ''}><span class="mt">${t}</span><span class="md">${d}</span></button></li>`)
    .join('')}</ol>`;
}
function main(state) {
  const a = state === 'guest' ? ACCT.guest : state === 'ranked' || state === 'running' || state === 'locked' || state === 'net' ? ACCT.ranked : ACCT.cal;
  let lead;
  if (state === 'running') {
    lead = `<p class="kicker">Match in progress · 6:12 left</p><button type="button" class="cta big">${helmetSVG('own', 0.6, 40)}<span>Return</span></button>`;
  } else if (state === 'locked') {
    lead = `<p class="kicker">Ranked queue</p><button type="button" class="cta big" disabled>${helmetSVG('own', 1, 40)}<span>Play</span></button><p class="sub">${chip(`${sign('lock')}Queue locked 12:40`, 'ban')}</p>`;
  } else {
    const k = state === 'guest' ? 'Unrated as a guest' : state === 'ranked' || state === 'net' ? 'Ranked queue' : 'Calibration, match 4 of 5';
    lead = `<p class="kicker">${k}</p><button type="button" class="cta big">${helmetSVG('own', 1, 40)}<span>Play</span></button>`;
  }
  return `<div class="scr app" data-bg="map">${bar('play', a)}
    <main class="body play">
      ${state === 'net' ? notice('err', 'Could not reach the server.', '<button type="button" class="lnk">Try again</button>') : ''}
      <section class="lead">${lead}</section>
      ${modes(state === 'running')}

}

// --- Queue --------------------------------------------------------------------------------------
function queue(state) {
  let core;
  if (state === 'found') {
    core = `<p class="kicker">Opponent found</p>
      <div class="versus">${helmetSVG('own', 1, 46)}<span class="vs-n">Marta</span><span class="vs-x">against</span><span class="vs-n">Ember</span>${helmetSVG('enemy', 1, 46)}</div>

      <div class="acts"><button type="button" class="cta">Play</button><button type="button" class="btn">Decline</button></div>`;
  } else if (state === 'confirmed') {
    core = `<p class="kicker">Opponent found</p>
      <div class="versus">${helmetSVG('own', 1, 46)}<span class="vs-n">Marta</span><span class="vs-x">against</span><span class="vs-n">Ember</span>${helmetSVG('enemy', 1, 46)}</div>
      <p class="sub">${spinner('Waiting')} Waiting for Ember · 6 s</p>`;
  } else {

      <p class="clock num" role="timer" aria-label="Waiting: ${long ? '1:24' : '0:17'}">${long ? '1:24' : '0:17'}</p>

  return `<div class="scr app" data-bg="map">${bar('play', ACCT.ranked)}

// ---------------------------------------------------------------------------------------------
// The material of Lapis: a tiled stone texture and a fine grain. In the client these would be
// static files; here they are drawn once by code.
// ---------------------------------------------------------------------------------------------
const TEX = {};
// A fine grain laid over the dark gradients: it hides the 8-bit banding of a dark vignette.
function grain() {
  if (TEX.grain) return TEX.grain;
  const c = canvas(160, 160);
  const g = c.getContext('2d');
  const r = rng(7);
  const id = g.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = r() < 0.5 ? 0 : 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = Math.floor(r() * 7);
  }
  g.putImageData(id, 0, 0);
  TEX.grain = `url(${c.toDataURL()})`;
  return TEX.grain;
}
// Black stone: soft clouds of lighter and darker stone and a fine speckle, tiling seamlessly.
function texture() {
  if (TEX.lapis) return TEX.lapis;
  const c = canvas(240, 240);
  const g = c.getContext('2d');
  const r = rng(5 * 97);
  for (let i = 0; i < 26; i++) {
    const x = r() * 240, y = r() * 240, s = 12 + r() * 46;
    const gr = g.createRadialGradient(x, y, 0, x, y, s);
    const a = 0.025 + r() * 0.035;
    gr.addColorStop(0, r() < 0.5 ? `rgba(255,240,210,${a})` : `rgba(0,0,0,${a * 2})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    for (const dx of [-240, 0, 240]) {
      for (const dy of [-240, 0, 240]) {
        g.save();
        g.translate(dx, dy);
        g.fillRect(x - s, y - s, s * 2, s * 2);
        g.restore();
      }
    }
  }
  noise(g, 240, 240, 21, 0.22, '#5a5244', '#000000', 1.6);
  TEX.lapis = `url(${c.toDataURL()})`;
  return TEX.lapis;
}

function hex(c) {
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixc(a, b, t) {
  const A = hex(a), B = hex(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}
const rgba = (c, a) => `rgba(${hex(c).join(',')},${a})`;

// --- Loading: the cell grid (labels, biomes) and the backgrounds ---------------------------------
const MC = { cols: 0, rows: 0, lab: null, small: {}, img: {} };
function loadImage(src) {
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);
    im.src = src;
  });
}
async function loadMatch() {
  const cells = await loadImage(assetUrl('narrows-cells.png'));
  const c = canvas(cells.width, cells.height);
  const g = c.getContext('2d');
  g.drawImage(cells, 0, 0);
  const px = g.getImageData(0, 0, c.width, c.height).data;
  MC.cols = c.width;
  MC.rows = c.height;
  MC.lab = new Uint8Array(c.width * c.height);
  for (let i = 0; i < MC.lab.length; i++) MC.lab[i] = px[i * 4];
  const ims = await Promise.all(MV.map((v) => loadImage(assetUrl(v.bg))));
  MV.forEach((v, i) => (MC.img[v.id] = ims[i]));
  buildMasks();
}
const isNode = (l) => l < 199;
// Small alpha masks, one pixel per 4-unit cell: own and enemy territory, the fog. Water and
// rivers take the state of the nearest land (a breadth-first fill from the land).
function buildMasks() {
  const { cols, rows, lab } = MC;
  const fog = new Uint8Array(cols * rows);
  const seen = new Int8Array(cols * rows).fill(-1);
  const queue = [];
  for (let i = 0; i < lab.length; i++) {
    if (isNode(lab[i])) {
      seen[i] = VISIBLE.has(lab[i]) ? 1 : 0;
      queue.push(i);
    }
  }
  for (let h = 0; h < queue.length; h++) {
    const i = queue[h], x = i % cols, y = (i / cols) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const X = x + dx, Y = y + dy;
      if (X < 0 || Y < 0 || X >= cols || Y >= rows) continue;
      const j = Y * cols + X;
      if (seen[j] >= 0) continue;
      seen[j] = seen[i];
      queue.push(j);
    }
  }
  for (let i = 0; i < lab.length; i++) fog[i] = seen[i] === 0 ? 255 : 0;
  const mk = (test) => {
    const c = canvas(cols, rows);
    const g = c.getContext('2d');
    const id = g.createImageData(cols, rows);
    for (let i = 0; i < lab.length; i++) if (test(i)) id.data[i * 4 + 3] = 255;
    g.putImageData(id, 0, 0);
    return c;
  };
  MC.small.own = mk((i) => isNode(lab[i]) && OWNER[lab[i]] === 0);
  MC.small.enemy = mk((i) => isNode(lab[i]) && OWNER[lab[i]] === 1);
  MC.small.fog = mk((i) => fog[i] === 255);
}

// --- Camera ---------------------------------------------------------------------------------------
const MVIEWS = [
  ['whole', 'Whole map'],
  ['play', 'Play view, 100 %'],
  ['close', 'Close-up, 200 %'],
];
function camera(view) {
  if (view === 'play') return { z: 1, ox: W / 2 - 770, oy: HUD_H + (H - HUD_H) / 2 - 470 };
  if (view === 'close') return { z: 2, ox: W / 2 - 2 * 728, oy: HUD_H + (H - HUD_H) / 2 - 2 * 448 };
  const z = Math.min((W - 48) / MAPW, (H - HUD_H - 40) / MAPH);
  return { z, ox: (W - MAPW * z) / 2, oy: HUD_H + (H - HUD_H - MAPH * z) / 2 };
}
const worldT = (g, cam, k) => g.setTransform(k * cam.z, 0, 0, k * cam.z, k * cam.ox, k * cam.oy);

// A screen-sized layer holding a mask (world-placed), blurred by `blur` world units.
function maskLayer(k, cam, small, blur) {
  const L = canvas(W * k, H * k);
  const g = L.getContext('2d');
  worldT(g, cam, k);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  if (blur) g.filter = `blur(${(blur * cam.z * k).toFixed(2)}px)`;
  g.drawImage(small, 0, 0, MAPW, MAPH);
  return L;
}
function tinted(L, colour) {
  const g = L.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = 'none';
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = colour;
  g.fillRect(0, 0, L.width, L.height);
  g.globalCompositeOperation = 'source-over';
  return L;
}
function blit(g, L, alpha = 1, op = 'source-over') {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = alpha;

// --- Territory ------------------------------------------------------------------------------------
function drawTerritory(g, P, style, k, cam) {

// --- Roads ----------------------------------------------------------------------------------------
function drawRoads(g, P, style) {

        g.lineWidth = span;
        seg();
        g.stroke();

        g.lineWidth = vis ? span : span - 0.6;

        g.stroke();
        g.restore();

          g.strokeStyle = rgba(P.laneBuf, 0.75);
          g.lineCap = 'round';
        } else if (internal) {
          g.strokeStyle = rgba(P.lane, 0.95);
        } else {
          g.setLineDash([7, 5]);
          g.strokeStyle = rgba(P.laneBuf, 0.95);
        }

        seg();
        g.stroke();
        g.restore();
      }

}

function drawGroups(g, P, style) {

// --- Fight and scheduled orders -------------------------------------------------------------------
function fightChip(g, P, style, kind, x, y, state) {
  const w = 16;
  if (state === 'charged') {
    mapHelmet(g, P, style, kind, x, y, w, 1, {});
    return;
  }
  // discharged: the dark dome, hatched in the light tone of the side
  mapHelmet(g, P, style, kind, x, y, w, 0, {});
  const s = w / 100;
  g.save();
  g.translate(x, y);
  if (kind === 'enemy') g.scale(-1, 1);
  g.scale(s, s);
  g.translate(-50, -54);
  g.clip(p2d(HELMET[kind].dome));
  g.strokeStyle = rgba(mixc(kind === 'own' ? P.own : P.enemy, '#ffffff', 0.4), 0.85);
  g.lineWidth = 1.1 / s;
  for (let d = -80; d < 140; d += 17) {
    g.beginPath();
    g.moveTo(d, 100);
    g.lineTo(d + 90, 0);
    g.stroke();
  }
  g.restore();
}
function chevronUp(g, P, x, y, style) {

  g.strokeStyle = style === 'current' ? P.bg : '#050403';
  g.lineWidth = 2.6 + 2.2;
  g.beginPath();
  pts.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b)));

  g.strokeStyle = P.up;
  g.lineWidth = 2.4;
  g.stroke();
  g.restore();
}
function drawFight(g, P, style) {
  const [x, y] = MN(FIGHT.at);

  const dx = F[0] - x, dy = F[1] - y, l = Math.hypot(dx, dy);
  // the attacker at the edge of the city, toward where it came from

  mapHelmet(g, P, style, 'own', ax, ay, unitWidth(FIGHT.own.units), FIGHT.own.charged / FIGHT.own.units, { count: FIGHT.own.units });
  mapHelmet(g, P, style, 'enemy', x, y, unitWidth(FIGHT.enemy.units) * 0.92, FIGHT.enemy.charged / FIGHT.enemy.units, { inside: true, count: FIGHT.enemy.units });
  // the arena plate above the city

  g.save();
  if (style === 'current') {
    g.setLineDash([3, 3]);
    g.strokeStyle = 'rgba(240,246,252,.6)';
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(x, py + ph);
    g.lineTo(x, y - ringR(FIGHT.at) - 4);
    g.stroke();
    g.setLineDash([]);
    g.fillStyle = 'rgba(13,17,23,.92)';
    g.strokeStyle = 'rgba(240,246,252,.85)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.roundRect(px, py, pw, ph, 8);
    g.fill();
    g.stroke();
    g.setLineDash([2.5, 2.5]);
    g.strokeStyle = 'rgba(240,246,252,.45)';
    g.beginPath();
    g.moveTo(x, py + 8);
    g.lineTo(x, py + ph - 16);
    g.stroke();
    g.setLineDash([]);
  } else {
    // a fine cut line from the city to the tablet
    g.strokeStyle = 'rgba(5,4,3,.9)';
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(x, py + ph);
    g.lineTo(x, y - ringR(FIGHT.at) - 4);
    g.stroke();
    g.strokeStyle = 'rgba(236,228,209,.55)';
    g.lineWidth = 0.9;
    g.stroke();
    // the tablet: stone, square cut, a dark joint round it and a lit lip inside
    g.fillStyle = 'rgba(5,4,3,.55)';
    g.fillRect(px + 1.5, py + 2.5, pw, ph);
    const gr = g.createLinearGradient(0, py, 0, py + ph);
    gr.addColorStop(0, '#24201a');
    gr.addColorStop(1, '#181511');
    g.fillStyle = gr;
    g.fillRect(px, py, pw, ph);
    g.strokeStyle = '#050403';
    g.lineWidth = 2;
    g.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
    g.strokeStyle = 'rgba(236,228,209,.24)';
    g.lineWidth = 1;
    g.strokeRect(px + 3, py + 3, pw - 6, ph - 6);
    g.strokeStyle = '#050403';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(x, py + 9);
    g.lineTo(x, py + ph - 17);
    g.stroke();
    g.strokeStyle = 'rgba(236,228,209,.2)';
    g.lineWidth = 0.8;
    g.beginPath();

    g.lineTo(x + 1, py + ph - 17);

  const en = [...Array(FIGHT.enemy.charged).fill('charged'), ...Array(FIGHT.enemy.units - FIGHT.enemy.charged).fill('empty')];
  own.forEach((s, j) => fightChip(g, P, style, 'own', x - 15 - j * 17.5, cy, s));

    g.fillStyle = 'rgba(236,228,209,.16)';

// An arrow along a quadratic curve, as a closed outline: body of half width hw, a head.
function arrowShape(x0, y0, x1, y1, bend, hw, headL, headW) {
  const mx_ = (x0 + x1) / 2, my_ = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  const cx = mx_ - (dy / L) * bend * L, cy = my_ + (dx / L) * bend * L;
  const pt = (t) => [(1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1, (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1];
  const tan = (t) => {
    const tx = 2 * (1 - t) * (cx - x0) + 2 * t * (x1 - cx), ty = 2 * (1 - t) * (cy - y0) + 2 * t * (y1 - cy);
    const l = Math.hypot(tx, ty);
    return [tx / l, ty / l];
  };
  // find t where the head starts (arc length headL from the end)
  let tEnd = 1, acc = 0, prev = pt(1);
  for (let t = 1; t > 0; t -= 0.005) {
    const p = pt(t);
    acc += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
    prev = p;
    if (acc >= headL) {
      tEnd = t;
      break;
    }
  }
  const left = [], right = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * tEnd;
    const [px, py] = pt(t), [tx, ty] = tan(t);
    const w = hw * (0.82 + 0.18 * (i / N));
    left.push([px + ty * w, py - tx * w]);
    right.push([px - ty * w, py + tx * w]);
  }
  const [hx, hy] = pt(tEnd), [tx, ty] = tan(tEnd);
  const head = [
    [hx + ty * headW, hy - tx * headW],
    [x1, y1],
    [hx - ty * headW, hy + tx * headW],
  ];
  const poly = [...left, head[0], head[1], head[2], ...right.reverse()];
  return { poly, tail: pt(0), tailDir: tan(0) };
}
function drawIntents(g, P, style) {
  for (const it of INTENTS) {
    const A = MN(it.from), B = MN(it.to);
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const x0 = A[0] + ux * (ringR(it.from) + 4), y0 = A[1] + uy * (ringR(it.from) + 4);
    const x1 = B[0] - ux * (ringR(it.to) + 5), y1 = B[1] - uy * (ringR(it.to) + 5);
    const { poly, tail } = arrowShape(x0, y0, x1, y1, it.bend, 6.2, 22, 15);
    const col = it.side === 'own' ? P.own : P.enemy;
    const shape = () => {
      g.beginPath();
      poly.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b)));
      g.closePath();
    };
    g.save();
    g.lineJoin = 'round';
    if (style === 'lapis') {
      g.save();
      g.translate(1.2, 2);
      shape();
      g.fillStyle = 'rgba(5,4,3,.55)';
      g.fill();
      g.restore();
    }
    shape();
    g.strokeStyle = style === 'current' ? 'rgba(13,17,23,.75)' : '#050403';
    g.lineWidth = 5;
    g.stroke();
    const gr = g.createLinearGradient(x0, y0 - 10, x0, y0 + 10);
    gr.addColorStop(0, mixc(col, '#ffffff', 0.12));
    gr.addColorStop(1, mixc(col, '#000000', 0.12));
    g.fillStyle = it.side === 'own' ? gr : style === 'current' ? gr : mixc(col, '#000000', 0.08);
    g.fill();

      // the enemy's order is hatched: the side reads without its hue
      g.save();
      g.clip();
      g.strokeStyle = 'rgba(236,228,209,.5)';
      g.lineWidth = 1.3;
      for (let d = -400; d < 400; d += 6) {

        g.moveTo(x0 + d, y0 - 300);
        g.lineTo(x0 + d + 300, y0);

    g.arc(tail[0], tail[1], 3.2, 0, 7);

    g.fill();
    g.strokeStyle = P.paper;

    g.stroke();

      const t = `+${it.bonus}`;
      const w = g.measureText(t).width + 26;
      if (style === 'current') {
        g.fillStyle = rgba(P.plate, 0.95);
        g.strokeStyle = 'rgba(240,246,252,.85)';
        g.lineWidth = 1.4;
        g.beginPath();
        g.roundRect(bxp - w / 2, byp - 8, w, 16, 8);
        g.fill();
        g.stroke();
      } else {
        g.fillStyle = 'rgba(5,4,3,.6)';
        g.fillRect(bxp - w / 2 + 1, byp - 7, w, 16);
        g.fillStyle = P.plate;
        g.fillRect(bxp - w / 2, byp - 8, w, 16);
        g.strokeStyle = '#050403';
        g.lineWidth = 1.6;
        g.strokeRect(bxp - w / 2 + 0.8, byp - 7.2, w - 1.6, 14.4);
        g.strokeStyle = 'rgba(236,228,209,.3)';
        g.lineWidth = 0.8;
        g.strokeRect(bxp - w / 2 + 2.4, byp - 5.6, w - 4.8, 11.2);
      }
      chevronUp(g, P, bxp - w / 2 + 9.5, byp + 0.5, style);
      g.fillStyle = P.paper;
      g.textBaseline = 'middle';
      g.textAlign = 'left';
      g.fillText(t, bxp - w / 2 + 17, byp + 0.8);
      g.restore();
    }
  }
}

// --- The whole frame ------------------------------------------------------------------------------
function drawMatch(cv, v, piecesOpt, view, k) {
  const style = piecesOpt === 'auto' ? v.pieces : piecesOpt;
  const P = PAL[style];
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = style === 'current' ? '#0d1117' : '#100e0b';
  g.fillRect(0, 0, cv.width, cv.height);
  if (v.real) {
    g.imageSmoothingQuality = 'high';
    const im = MC.img.real;
    if (im) g.drawImage(im, 0, 0, cv.width, cv.height);
    return 'real';
  }
  const cam = camera(view);
  worldT(g, cam, k);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  if (style === 'lapis') {
    // the map sits in the stone: a dark cut round it and a lit lip
    g.fillStyle = 'rgba(5,4,3,.8)';
    g.fillRect(-4, -4, MAPW + 8, MAPH + 8);
    g.strokeStyle = 'rgba(236,228,209,.16)';
    g.lineWidth = 1.2 / cam.z;
    g.strokeRect(-4.6, -4.6, MAPW + 9.2, MAPH + 9.2);
  }
  const im = MC.img[v.id];
  if (im) g.drawImage(im, 0, 0, MAPW, MAPH);
  if (style === 'current') {
    g.fillStyle = 'rgba(13,17,23,.18)';
    g.fillRect(0, 0, MAPW, MAPH);
    g.strokeStyle = '#484f58';
    g.lineWidth = 2 / cam.z;
    g.strokeRect(-1, -1, MAPW + 2, MAPH + 2);
  }
  drawTerritory(g, P, style, k, cam);
  worldT(g, cam, k);
  drawRoads(g, P, style);
  NARROWS.n.forEach((_, i) => drawCity(g, P, style, i));
  drawNames(g, P, style);
  drawFog(g, P, style, k, cam);
  worldT(g, cam, k);
  drawGroups(g, P, style);
  drawIntents(g, P, style);
  drawFight(g, P, style);
  return style;
}

// ---------------------------------------------------------------------------------------------
// The mockup shell: two sections (the screens outside the match, the match map variants),
// compare, zoom, grayscale, reduced motion, time. State lives in the address, for example
// #sec=screens&s=entry&st=seq&t=3.2 or #sec=map&v=current,fresco,inlay,intaglio&view=play&cmp=1
// ---------------------------------------------------------------------------------------------
const ST = {
  sec: 'screens', s: 'entry', st: 'seq', st2: '', v: ['fresco'], view: 'whole', pieces: 'auto',
  t: 0, g: 0, rm: 0, z: 'fit', cmp: 0, playing: false,
};
const $ = (q, el = document) => el.querySelector(q);

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ['sec', 's', 'st', 'st2', 'view', 'pieces', 'z']) if (h.has(k)) ST[k] = h.get(k);
  for (const k of ['t', 'g', 'rm', 'cmp']) if (h.has(k)) ST[k] = +h.get(k);
  if (h.has('v')) ST.v = h.get('v').split(',').filter((id) => MV.some((m) => m.id === id));
  if (!ST.v.length) ST.v = ['fresco'];
  if (!ST.cmp) ST.v = ST.v.slice(0, 1);
  if (ST.sec !== 'map') ST.sec = 'screens';
  if (!MVIEWS.some((m) => m[0] === ST.view)) ST.view = 'whole';
  const sc = screen();
  if (!sc.states.some((s) => s[0] === ST.st)) ST.st = sc.states[0][0];
  if (!sc.states.some((s) => s[0] === ST.st2) || ST.st2 === ST.st || !ST.cmp) ST.st2 = '';
}
function writeHash() {
  const h = new URLSearchParams({ sec: ST.sec });
  if (ST.sec === 'screens') {
    h.set('s', ST.s);
    h.set('st', ST.st);
    if (ST.st2) h.set('st2', ST.st2);
    if (isSeq()) h.set('t', ST.t.toFixed(2));
  } else {
    h.set('v', ST.v.join(','));
    h.set('view', ST.view);
    if (ST.pieces !== 'auto') h.set('pieces', ST.pieces);
  }
  if (ST.cmp) h.set('cmp', '1');
  if (ST.g) h.set('g', '1');
  if (ST.rm) h.set('rm', '1');
  if (ST.z !== 'fit') h.set('z', ST.z);
  history.replaceState(null, '', '#' + h.toString());
}
const screen = () => SCREENS.find((s) => s.id === ST.s) || SCREENS[0];
// The opening scene plays only on its own state, and never under reduced motion (owner, round 2).
const isSeq = () => ST.sec === 'screens' && ST.s === 'entry' && ST.st === 'seq' && !ST.st2 && !ST.rm;
const tEnd = () => TL.end;

// --- Chrome ---------------------------------------------------------------------------------------
function buildChrome() {
  $('#secs').onclick = (e) => {
    const b = e.target.closest('[data-sec]');
    if (!b) return;
    ST.sec = b.dataset.sec;
    pause();
    render(true);
  };
  $('#screens').onclick = (e) => {
    const b = e.target.closest('[data-s], [data-v]');
    if (!b) return;
    if (b.dataset.s) {
      ST.s = b.dataset.s;
      ST.st = screen().states[0][0];
      ST.st2 = '';
    } else {
      const id = b.dataset.v;
      if (!ST.cmp) ST.v = [id];
      else if (ST.v.includes(id)) ST.v = ST.v.length > 1 ? ST.v.filter((x) => x !== id) : ST.v;
      else ST.v = [...ST.v, id].slice(-4);
    }
    render(true);
  };
  $('#states').onclick = (e) => {
    const b = e.target.closest('[data-st], [data-view]');
    if (!b) return;
    if (b.dataset.view) ST.view = b.dataset.view;
    else if (ST.cmp && b.dataset.st !== ST.st) ST.st2 = ST.st2 === b.dataset.st ? '' : b.dataset.st;
    else {
      ST.st = b.dataset.st;
      if (ST.st2 === ST.st) ST.st2 = '';
    }
    render(true);
  };
  $('#cmp').onchange = (e) => {
    ST.cmp = e.target.checked ? 1 : 0;
    if (ST.cmp && ST.sec === 'map' && ST.v.length === 1) ST.v = ['current', 'fresco', 'inlay', 'intaglio'];
    if (!ST.cmp) {
      ST.v = ST.v.slice(0, 1);
      ST.st2 = '';
    }
    render(true);
  };
  $('#pieces').onchange = (e) => {
    ST.pieces = e.target.value;
    render(true);
  };
  $('#gray').onchange = (e) => {
    ST.g = e.target.checked ? 1 : 0;
    render(false);
  };
  $('#rm').onchange = (e) => {
    ST.rm = e.target.checked ? 1 : 0;
    ST.t = 0;
    pause();
    render(true);
  };
  $('#zoom').onchange = (e) => {
    ST.z = e.target.value;
    render(false);
  };
  $('#play').onclick = () => (ST.playing ? pause() : play());
  $('#again').onclick = () => {
    ST.t = 0;
    play();
  };
  $('#scrub').oninput = (e) => {
    pause();
    ST.t = +e.target.value;
    frame();
  };
  window.addEventListener('resize', () => render(false));
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, select, textarea')) return;
    if (e.key === ' ' && isSeq()) {
      e.preventDefault();
      ST.playing ? pause() : play();
    } else if (isSeq() && ST.playing && !e.metaKey && !e.ctrlKey && e.key.length === 1) {
      skip();
    }
  });
}
function syncChrome() {
  document.querySelectorAll('#secs [data-sec]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.sec === ST.sec)));
  const map = ST.sec === 'map';
  if (map) {
    $('#screens').innerHTML =
      MV.map((m) => `<li><button type="button" data-v="${m.id}" aria-pressed="${ST.v.includes(m.id)}"><span class="vn">${m.n}</span>${m.name}</button></li>`).join('') +
      `<li><span class="hint">${ST.cmp ? 'Compare: pick up to four.' : 'Tick Compare to set up to four side by side.'}</span></li>`;
    $('#states').innerHTML = MVIEWS.map(([id, l]) => `<button type="button" data-view="${id}" aria-pressed="${id === ST.view}">${l}</button>`).join('');
  } else {
    $('#screens').innerHTML = SCREENS.map((s) => `<li><button type="button" data-s="${s.id}" aria-current="${s.id === ST.s ? 'page' : 'false'}">${s.label}</button></li>`).join('');
    $('#states').innerHTML = screen()
      .states.map(([id, l]) => `<button type="button" data-st="${id}" aria-pressed="${id === ST.st || id === ST.st2}">${l}</button>`)
      .join('');
  }
  $('#pieces').hidden = !map;
  $('#pieces').value = ST.pieces;
  $('#cmp').checked = !!ST.cmp;
  $('#gray').checked = !!ST.g;
  $('#rm').checked = !!ST.rm;
  $('#zoom').value = ST.z;
  $('#transport').hidden = !isSeq();
  $('#scrub').max = String(tEnd());
}

// --- Boards ---------------------------------------------------------------------------------------
let boards = [];
function boardList() {
  if (ST.sec === 'map') return ST.v.map((id) => ({ kind: 'map', id }));
  return [ST.st, ...(ST.st2 ? [ST.st2] : [])].map((st) => ({ kind: 'screen', st }));
}
const boardKey = (b) => (b.kind === 'map' ? `m:${b.id}:${ST.view}:${ST.pieces}` : `s:${ST.s}:${b.st}:${ST.rm}`);
function render(rebuild) {
  syncChrome();
  const stage = $('#stage');
  const list = boardList();
  const pad = 24, gap = 20, lab = 24;
  const aw = stage.clientWidth - pad * 2, ah = stage.clientHeight - pad * 2;
  const n = list.length;
  const cols = n <= 2 ? n : 2, rows = Math.ceil(n / cols);
  let scale;
  if (ST.z === 'fit') scale = Math.min((aw - gap * (cols - 1)) / cols / W, (ah - (gap + lab) * (rows - 1) - lab) / rows / H);
  else scale = +ST.z;
  scale = Math.max(0.15, scale);
  const k = Math.min(2.5, Math.max(1, Math.round(devicePixelRatio * scale * 4) / 4));
  stage.classList.toggle('scroll', ST.z !== 'fit');
  stage.style.width = '';
  const keys = list.map(boardKey);
  if (rebuild || boards.length !== n || boards.some((b, i) => b.key !== keys[i])) {
    stage.innerHTML = '';
    boards = list.map((item, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'board';
      let label, inner;
      if (item.kind === 'map') {
        const v = MV.find((m) => m.id === item.id);
        const style = ST.pieces === 'auto' ? v.pieces : ST.pieces;
        label = `<span>${v.n}</span> ${v.name}${v.real ? ' · the start of a dev match' : ` · ${style === 'lapis' ? 'Lapis' : 'current'} pieces`}`;
        inner = matchMarkup(style, v.real);
      } else {
        const st = screen().states.find((s) => s[0] === item.st);
        label = `${screen().label} · ${st[1]}`;
        inner = screen().render(item.st);
      }
      wrap.innerHTML = `<p class="bl">${label}</p><div class="clip"><div class="art" data-dir="lapis">${inner}</div></div>`;
      stage.appendChild(wrap);
      const art = $('.art', wrap);
      art.style.setProperty('--tex', texture());
      art.style.setProperty('--grain', grain());
      art.querySelectorAll('[data-w]').forEach((el) => (el.style.width = el.dataset.w + '%'));
      art.addEventListener('click', (e) => {
        if (isSeq() && (e.target.closest('.skip') || (ST.t < tEnd() && !e.target.closest('.gate')))) skip();
      });
      return { ...item, key: keys[i], wrap, art };
    });
  }
  for (const b of boards) {
    b.wrap.style.width = W * scale + 'px';
    $('.clip', b.wrap).style.width = W * scale + 'px';
    $('.clip', b.wrap).style.height = H * scale + 'px';
    b.art.style.transform = `scale(${scale})`;
    b.art.classList.toggle('gray', !!ST.g);
    if (b.k !== k || rebuild) {
      b.k = k;
      paintBackground(b);
    }
  }
  if (cols === 2) stage.style.width = '';
  frame();
  writeHash();
}
// Static backgrounds: the map plate behind a screen, or the match map, drawn once per board.
function paintBackground(b) {
  const scr = $('.scr', b.art);
  if (b.kind === 'map') {
    const cv = $('canvas.mcv', scr);
    cv.width = W * b.k;
    cv.height = H * b.k;
    drawMatch(cv, MV.find((m) => m.id === b.id), ST.pieces, ST.view, b.k);
    return;
  }
  const bg = scr.dataset.bg;
  let cv = $('canvas.stage', scr) || $('canvas.bgmap', scr);
  if (!cv && (bg === 'map' || bg === 'plain')) {
    cv = document.createElement('canvas');
    cv.className = 'bgmap';
    cv.setAttribute('aria-hidden', 'true');
    scr.prepend(cv);
  }
  if (!cv || bg === 'entry' || bg === 'entry-still') return;
  cv.width = W * b.k;
  cv.height = H * b.k;
  const g = cv.getContext('2d');
  const pl = plate('lapis', b.k, { tone: 'dark', names: true });
  if (bg === 'plain') {
    // The blurred stone of the windows (owner's pick, round 1): the map softened into the stone.
    g.filter = `blur(${(2.6 * b.k).toFixed(2)}px)`;
  }
  g.drawImage(pl, 0, 0);
  g.filter = 'none';
}
function frame() {
  const end = tEnd();
  ST.t = clamp(ST.t, 0, end);
  for (const b of boards) {
    if (b.kind !== 'screen') continue;
    const scr = $('.scr', b.art);
    const bg = scr.dataset.bg;
    if (bg !== 'entry' && bg !== 'entry-still') continue;
    const cv = $('canvas.stage', scr);
    const seq = b.st === 'seq' && isSeq();
    const t = seq ? ST.t : end;
    const still = !seq;
    if (cv.width !== W * b.k) {
      cv.width = W * b.k;
      cv.height = H * b.k;
    }
    drawStage(cv, t, b.k, still);
    setEntryDOM(scr, t, still);
  }
  $('#scrub').value = String(ST.t);
  $('#clock').textContent = `${ST.t.toFixed(2)} / ${end.toFixed(2)} s`;
  $('#play').textContent = ST.playing ? 'Pause' : ST.t >= end ? 'Play again' : 'Play';
}
let last = 0, raf = 0;
function tick(now) {
  if (!ST.playing) return;
  const dt = last ? (now - last) / 1000 : 0;
  last = now;
  ST.t += dt;
  if (ST.t >= tEnd()) {
    ST.t = tEnd();
    ST.playing = false;
    writeHash();
  }
  frame();
  if (ST.playing) raf = requestAnimationFrame(tick);
}
function play() {
  if (!isSeq()) return;
  if (ST.t >= tEnd()) ST.t = 0;
  ST.playing = true;
  last = 0;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
  frame();
}
function pause() {
  ST.playing = false;
  cancelAnimationFrame(raf);
  if (boards.length) frame();
  writeHash();
}
function skip() {
  ST.t = tEnd();
  pause();
}

document.fonts.ready.then(async () => {
  await Promise.all([...document.fonts].map((f) => f.load().catch(() => null)));
  await loadTerrain();
  await loadMatch();
  readHash();
  // The scene follows the system setting at first, like the client (off under reduced motion).
  if (!location.hash.includes('rm=') && matchMedia('(prefers-reduced-motion: reduce)').matches) ST.rm = 1;
  buildChrome();
  render(true);
  document.body.classList.add('ready');
  if (isSeq() && !location.hash.includes('t=')) play();
});

</script>
</body>
</html>
