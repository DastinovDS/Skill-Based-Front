// ---------------------------------------------------------------------------------------------
// The world: the start menu map (maps/menu/valley.json), drawn once per direction as a "plate".
// The helmets are the client's own outlines (apps/client/src/units/helmet.ts, HELMET_PATHS).
// ---------------------------------------------------------------------------------------------
const W = 1280, H = 800;
const HELMET = {
  own: {
    dome: 'M9 70 C5 36 22 12 49 12 C70 12 85 26 88 42 C89 47 91 50 95 53 C82 54 72 56 66 60 C60 64 56 70 46 70 Z',
    band: 'M7 77 C20 79 34 80 46 79 C56 78 62 71 67 67 C72 63 82 61 96 60',
    strap: 'M46 80 L54 96',
  },
  enemy: {
    dome: 'M8 54 C8 30 28 13 52 13 C74 13 90 30 92 46 L98 54 Q99 58 95 58 L74 58 C65 58 60 64 57 73 C56 77 52 78 46 77 C32 74 18 69 12 64 Q8 61 8 54 Z',
    band: null,
    strap: 'M38 75 L58 91 L64 68',
  },
};
const DOME_Y = { own: [12, 70], enemy: [13, 78] };

// Map (800 x 560) to the 1280 x 800 artboard: cover, centred.
const MS = Math.max(W / VALLEY.w, H / VALLEY.h);
const MOX = (W - VALLEY.w * MS) / 2, MOY = (H - VALLEY.h * MS) / 2;
const mx = (x) => MOX + x * MS, my = (y) => MOY + y * MS;

// A small deterministic random (mulberry32): the textures and the scatter are the same on every load.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function canvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// --- Terrain classes from the baked background (maps/menu/valley.bg.webp) ------------------------
// 0 land (plains), 1 water, 2 forest, 3 mountains, 4 snow. A coarse grid with a majority vote.
const CLS = { cols: 200, rows: 140, grid: null, masks: {} };
function loadTerrain() {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = canvas(VALLEY.w, VALLEY.h);
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      const px = g.getImageData(0, 0, c.width, c.height).data;
      const cw = VALLEY.w / CLS.cols, ch = VALLEY.h / CLS.rows;
      const grid = new Uint8Array(CLS.cols * CLS.rows);
      for (let r = 0; r < CLS.rows; r++) {
        for (let q = 0; q < CLS.cols; q++) {
          const votes = [0, 0, 0, 0, 0];
          for (let dy = 0; dy < ch; dy += 1) {
            for (let dx = 0; dx < cw; dx += 1) {
              const i = (Math.floor(r * ch + dy) * VALLEY.w + Math.floor(q * cw + dx)) * 4;
              const R = px[i], G = px[i + 1], B = px[i + 2];
              let k = 3;
              if (R > 196 && G > 196 && B > 196) k = 4;
              else if (B > R + 14 && B > G - 6) k = 1;
              else if (G > R + 18 && G > B + 12 && R + G + B < 360) k = 2;
              else if (G > R - 4 && G > B + 30) k = 0;
              votes[k]++;
            }
          }
          let best = 0;
          for (let k = 1; k < 5; k++) if (votes[k] > votes[best]) best = k;
          grid[r * CLS.cols + q] = best;
        }
      }
      CLS.grid = grid;
      CLS.img = img;
      resolve();
    };
    img.src = VALLEY_BG;
  });
}
const clsAt = (x, y) => {
  const q = Math.floor(x / (VALLEY.w / CLS.cols)), r = Math.floor(y / (VALLEY.h / CLS.rows));
  if (q < 0 || r < 0 || q >= CLS.cols || r >= CLS.rows) return 1;
  return CLS.grid[r * CLS.cols + q];
};
// A soft alpha mask of a set of classes at artboard size times k.
function mask(classes, k, blur = 1.2) {
  const key = classes.join() + '@' + k + '@' + blur;
  if (CLS.masks[key]) return CLS.masks[key];
  const small = canvas(CLS.cols, CLS.rows);
  const g = small.getContext('2d');
  const id = g.createImageData(CLS.cols, CLS.rows);
  for (let i = 0; i < CLS.grid.length; i++) if (classes.includes(CLS.grid[i])) id.data[i * 4 + 3] = 255;
  g.putImageData(id, 0, 0);
  const big = canvas(W * k, H * k);
  const b = big.getContext('2d');
  b.imageSmoothingEnabled = true;
  b.imageSmoothingQuality = 'high';
  b.filter = `blur(${blur * k}px)`;
  b.drawImage(small, MOX * k, MOY * k, VALLEY.w * MS * k, VALLEY.h * MS * k);
  CLS.masks[key] = big;
  return big;
}
// Paint `draw` (in artboard units) only where the classes are.
function layer(ctx, k, classes, draw, blur) {
  const c = canvas(W * k, H * k);
  const g = c.getContext('2d');
  g.scale(k, k);
  draw(g);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(mask(classes, k, blur), 0, 0);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(c, 0, 0);
  ctx.restore();
}
function noise(ctx, w, h, seed, alpha, light, dark, density = 0.5) {
  const r = rng(seed);
  const n = Math.floor(w * h * density / 40);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = r() < 0.5 ? light : dark;
    ctx.globalAlpha = alpha * (0.4 + r() * 0.6);
    const s = r() < 0.92 ? 1 : 2;
    ctx.fillRect(r() * w, r() * h, s, s);
  }
  ctx.globalAlpha = 1;
}
function poly(g, pts, close) {
  g.beginPath();
  for (let i = 0; i < pts.length; i += 2) {
    const x = mx(pts[i]), y = my(pts[i + 1]);
    if (i === 0) g.moveTo(x, y);
    else g.lineTo(x, y);
  }
  if (close) g.closePath();
}
// Chaikin smoothing of the stepped geography lines (they are on a 4-unit grid).
function smooth(pts, n = 2) {
  let p = pts;
  for (let it = 0; it < n; it++) {
    if (p.length < 6) return p;
    const q = [p[0], p[1]];
    for (let i = 0; i < p.length - 2; i += 2) {
      const x0 = p[i], y0 = p[i + 1], x1 = p[i + 2], y1 = p[i + 3];
      q.push(0.75 * x0 + 0.25 * x1, 0.75 * y0 + 0.25 * y1, 0.25 * x0 + 0.75 * x1, 0.25 * y0 + 0.75 * y1);
    }
    q.push(p[p.length - 2], p[p.length - 1]);
    p = q;
  }
  return p;
}
function river(g, r, width, color) {
  const pts = smooth(r[0]);
  g.strokeStyle = color;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = 0; i < pts.length - 2; i += 2) {
    const hw = r[1][Math.min(r[1].length - 1, Math.floor(i / 2 / 4))] || 4;
    g.lineWidth = Math.max(0.6, hw * MS * width);
    g.beginPath();
    g.moveTo(mx(pts[i]), my(pts[i + 1]));
    g.lineTo(mx(pts[i + 2]), my(pts[i + 3]));
    g.stroke();
  }
}
const NODE = (i) => VALLEY.n[i];
function roads(g, fn) {
  for (const [a, b] of VALLEY.e) fn(mx(NODE(a)[0]), my(NODE(a)[1]), mx(NODE(b)[0]), my(NODE(b)[1]));
}
function scatter(step, seed, fn) {
  const r = rng(seed);
  for (let y = -step; y < H + step; y += step) {
    for (let x = -step; x < W + step; x += step) {
      const jx = x + (r() - 0.5) * step * 0.9, jy = y + (r() - 0.5) * step * 0.9;
      const c = clsAt((jx - MOX) / MS, (jy - MOY) / MS);
      fn(jx, jy, c, r);
    }
  }
}
const SIDE = (o) => (o === 0 ? 'own' : o === 1 ? 'enemy' : 'neutral');

// --- Plates: the same world in each direction ----------------------------------------------------
// tone: 'dark' (the entry and the dark screens) or 'light' (the paper screens of Atlas and Raster).
const PLATES = {
  lapis(g, k, P) {
    g.fillStyle = '#100e0b';
    g.fillRect(0, 0, W, H);
    layer(g, k, [0, 2, 3, 4], (l) => {
      l.fillStyle = '#25211b';
      l.fillRect(0, 0, W, H);
      noise(l, W, H, 11, 0.16, '#4a4337', '#0c0b09', 0.9);
    });
    // Water: fine incised horizontals.
    layer(g, k, [1], (l) => {
      l.strokeStyle = '#1f1b16';
      l.lineWidth = 1;
      for (let y = 0; y < H; y += 5) {
        l.beginPath();
        l.moveTo(0, y + 0.5);
        l.lineTo(W, y + 0.5);
        l.stroke();
      }
    });
    // Mountains: carved chevrons; forest: drilled points.
    scatter(15, 5, (x, y, c, r) => {
      if (c === 3 && r() < 0.85) {
        const s = 4 + r() * 2.5;
        g.strokeStyle = 'rgba(222,210,186,.16)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(x - s, y + s * 0.55);
        g.lineTo(x, y - s * 0.55);
        g.lineTo(x + s, y + s * 0.55);
        g.stroke();
      } else if (c === 2) {
        g.fillStyle = 'rgba(8,7,5,.55)';
        g.beginPath();
        g.arc(x, y, 1.6, 0, 7);
        g.fill();
        g.fillStyle = 'rgba(222,210,186,.10)';
        g.beginPath();
        g.arc(x + 0.6, y + 0.8, 1.2, 0, 7);
        g.fill();
      }
    });
    // The coast and the rivers as incised grooves: a dark cut with a lit lower lip.
    for (const c of VALLEY.geo.coast) {
      const p = smooth(c);
      g.lineJoin = 'round';
      g.strokeStyle = '#070605';
      g.lineWidth = 2.2;
      poly(g, p);
      g.stroke();
      g.save();
      g.translate(0.8, 1.2);
      g.strokeStyle = 'rgba(214,200,172,.22)';
      g.lineWidth = 0.9;
      poly(g, p);
      g.stroke();
      g.restore();
    }
    for (const r of VALLEY.geo.rivers) river(g, r, 0.42, '#090806');
    for (const r of VALLEY.geo.streams) river(g, r, 0.18, '#0d0b09');
    roads(g, (x1, y1, x2, y2) => {
      g.strokeStyle = 'rgba(232,222,200,.30)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
    });
    VALLEY.n.forEach((n) => {
      const x = mx(n[0]), y = my(n[1]);
      const big = n[2] === 'C' ? 7 : n[2] === 'p' ? 2.6 : n[2] === 'l' ? 5.5 : 4.4;
      const col = { own: '#6f8fd6', enemy: '#d0634a', neutral: '#d9cdb3' }[SIDE(n[3])];
      g.fillStyle = '#0a0907';
      g.fillRect(x - big - 1.5, y - big - 1.5, big * 2 + 3, big * 2 + 3);
      g.fillStyle = n[2] === 'p' ? 'rgba(217,205,179,.55)' : col;
      g.fillRect(x - big, y - big, big * 2, big * 2);
      if (P.names && n[2] !== 'p') {
        g.font = `500 ${n[2] === 'C' ? 12 : 10}px Cinzel`;
        g.fillStyle = 'rgba(233,224,204,.62)';
        g.textAlign = 'center';
        g.letterSpacing = '2px';
        g.fillText(n[5].toUpperCase(), x, y + big + 15);
      }
    });
  },

  atlas(g, k, P) {
    const paper = P.tone === 'light' ? '#ece4d1' : '#e7dcc4';
    g.fillStyle = paper;
    g.fillRect(0, 0, W, H);
    noise(g, W, H, 3, 0.2, '#fffaf0', '#b9a98a', 1.4);
    // Water: a pale wash, then the engraver's water-lining along the coast.
    layer(g, k, [1], (l) => {
      l.fillStyle = '#cfd6cf';
      l.fillRect(0, 0, W, H);
      for (let i = 7; i >= 1; i--) {
        for (const c of VALLEY.geo.coast) {
          const p = smooth(c);
          l.lineJoin = 'round';
          l.strokeStyle = `rgba(52,74,92,${0.42 - i * 0.04})`;
          l.lineWidth = i * 7.5 + 1;
          poly(l, p);
          l.stroke();
          l.strokeStyle = '#cfd6cf';
          l.lineWidth = i * 7.5 - 0.2;
          poly(l, p);
          l.stroke();
        }
      }
    }, 0.6);
    // Mountains: hachures; forest: little tree crowns; plains: a few tufts.
    scatter(11, 7, (x, y, c, r) => {
      g.lineCap = 'round';
      if (c === 3 || c === 4) {
        if (r() < 0.25) return;
        const s = 3.5 + r() * 3;
        g.strokeStyle = c === 4 ? 'rgba(60,52,42,.30)' : 'rgba(60,50,38,.62)';
        g.lineWidth = 0.9;
        g.beginPath();
        g.moveTo(x - s, y + s * 0.6);
        g.quadraticCurveTo(x - s * 0.3, y - s * 0.2, x, y - s * 0.7);
        g.quadraticCurveTo(x + s * 0.35, y - s * 0.1, x + s, y + s * 0.6);
        g.stroke();
        g.strokeStyle = 'rgba(60,50,38,.35)';
        g.beginPath();
        g.moveTo(x + s * 0.1, y - s * 0.4);
        g.lineTo(x + s * 0.55, y + s * 0.5);
        g.stroke();
      } else if (c === 2) {
        g.strokeStyle = 'rgba(48,58,40,.70)';
        g.fillStyle = 'rgba(120,140,96,.28)';
        g.lineWidth = 0.8;
        g.beginPath();
        g.arc(x, y, 2.9 + r() * 0.9, 0, 7);
        g.fill();
        g.stroke();
        g.beginPath();
        g.moveTo(x, y + 3);
        g.lineTo(x, y + 5.2);
        g.stroke();
      } else if (c === 0 && r() < 0.16) {
        g.strokeStyle = 'rgba(70,72,50,.45)';
        g.lineWidth = 0.7;
        g.beginPath();
        g.moveTo(x - 2, y);
        g.lineTo(x - 1, y - 2.6);
        g.moveTo(x, y);
        g.lineTo(x, y - 3.2);
        g.moveTo(x + 2, y);
        g.lineTo(x + 1, y - 2.6);
        g.stroke();
      }
    });
    for (const c of VALLEY.geo.coast) {
      g.strokeStyle = '#2b2721';
      g.lineWidth = 1.3;
      poly(g, smooth(c));
      g.stroke();
    }
    for (const r of VALLEY.geo.rivers) {
      river(g, r, 0.5, '#2b2721');
      river(g, r, 0.34, '#bfcac6');
    }
    for (const r of VALLEY.geo.streams) river(g, r, 0.16, 'rgba(43,39,33,.8)');
    // Graticule.
    g.strokeStyle = 'rgba(43,39,33,.12)';
    g.lineWidth = 0.6;
    for (let x = 0; x <= VALLEY.w; x += 100) {
      g.beginPath();
      g.moveTo(mx(x), 0);
      g.lineTo(mx(x), H);
      g.stroke();
    }
    for (let y = 0; y <= VALLEY.h; y += 100) {
      g.beginPath();
      g.moveTo(0, my(y));
      g.lineTo(W, my(y));
      g.stroke();
    }
    // Roads: cased double lines.
    roads(g, (x1, y1, x2, y2) => {
      g.lineCap = 'round';
      g.strokeStyle = 'rgba(43,39,33,.72)';
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
      g.strokeStyle = paper;
      g.lineWidth = 1.5;
      g.stroke();
    });
    for (const b of VALLEY.geo.bridges) {
      g.strokeStyle = '#2b2721';
      g.lineWidth = 1;
      const x = mx(b[0]), y = my(b[1]);
      g.beginPath();
      g.moveTo(x - 5, y - 4);
      g.lineTo(x - 3, y - 2);
      g.moveTo(x + 5, y - 4);
      g.lineTo(x + 3, y - 2);
      g.moveTo(x - 5, y + 4);
      g.lineTo(x - 3, y + 2);
      g.moveTo(x + 5, y + 4);
      g.lineTo(x + 3, y + 2);
      g.stroke();
    }
    VALLEY.n.forEach((n) => {
      const x = mx(n[0]), y = my(n[1]);
      const side = SIDE(n[3]);
      const wash = { own: 'rgba(35,81,126,.55)', enemy: 'rgba(181,57,42,.55)', neutral: paper }[side];
      const r = n[2] === 'C' ? 7.5 : n[2] === 'p' ? 2.6 : n[2] === 'l' ? 5.6 : 4.6;
      g.fillStyle = n[2] === 'p' ? paper : wash;
      g.strokeStyle = '#2b2721';
      g.lineWidth = 1.2;
      g.beginPath();
      g.arc(x, y, r, 0, 7);
      g.fill();
      g.stroke();
      if (n[2] === 'C') {
        g.beginPath();
        g.arc(x, y, r + 3.2, 0, 7);
        g.stroke();
        g.fillStyle = '#2b2721';
        g.beginPath();
        g.arc(x, y, 1.8, 0, 7);
        g.fill();
      }
      if (P.names && n[2] !== 'p') {
        g.fillStyle = 'rgba(43,39,33,.88)';
        g.textAlign = 'left';
        if (n[2] === 'C') {
          g.font = '600 13px "Cormorant Garamond"';
          g.letterSpacing = '3px';
          g.textAlign = 'center';
          g.fillText(n[5].toUpperCase(), x, y + 26);
        } else {
          g.font = 'italic 500 14px "Cormorant Garamond"';
          g.letterSpacing = '0.3px';
          g.fillText(n[5], x + r + 5, y - r - 1);
        }
      }
    });
  },

  ordre(g, k, P) {
    g.fillStyle = '#1b1e1a';
    g.fillRect(0, 0, W, H);
    layer(g, k, [0, 2, 3, 4], (l) => {
      l.fillStyle = '#272b24';
      l.fillRect(0, 0, W, H);
    });
    layer(g, k, [2], (l) => {
      l.fillStyle = '#2b3a2b';
      l.fillRect(0, 0, W, H);
    });
    layer(g, k, [1], (l) => {
      l.fillStyle = '#1d2a31';
      l.fillRect(0, 0, W, H);
    });
    // Mountains: a dot screen in tan, like a printed relief tint.
    layer(g, k, [3, 4], (l) => {
      l.fillStyle = 'rgba(176,160,120,.30)';
      for (let y = 0; y < H; y += 5) for (let x = (y / 5) % 2 ? 2.5 : 0; x < W; x += 5) l.fillRect(x, y, 1.3, 1.3);
    });
    for (const c of VALLEY.geo.coast) {
      g.strokeStyle = '#5f7f8f';
      g.lineWidth = 1.2;
      poly(g, smooth(c));
      g.stroke();
    }
    for (const r of VALLEY.geo.rivers) river(g, r, 0.38, '#557585');
    for (const r of VALLEY.geo.streams) river(g, r, 0.14, '#4a6674');
    // The 1 km grid with its numbers.
    g.strokeStyle = 'rgba(220,214,196,.13)';
    g.lineWidth = 1;
    g.font = '500 10px "JetBrains Mono"';
    g.fillStyle = 'rgba(220,214,196,.46)';
    for (let i = 0, x = 40; x < W; x += 80, i++) {
      g.beginPath();
      g.moveTo(x + 0.5, 0);
      g.lineTo(x + 0.5, H);
      g.stroke();
      if (P.grid) g.fillText(String(31 + i).padStart(2, '0'), x + 3, 12);
    }
    for (let i = 0, y = 40; y < H; y += 80, i++) {
      g.beginPath();
      g.moveTo(0, y + 0.5);
      g.lineTo(W, y + 0.5);
      g.stroke();
      if (P.grid) g.fillText(String(68 - i).padStart(2, '0'), 3, y - 3);
    }
    roads(g, (x1, y1, x2, y2) => {
      g.strokeStyle = '#8f8463';
      g.lineWidth = 1.6;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
    });
    VALLEY.n.forEach((n) => {
      const x = mx(n[0]), y = my(n[1]);
      const side = SIDE(n[3]);
      const r = n[2] === 'C' ? 7 : n[2] === 'p' ? 3 : 5;
      g.fillStyle = { own: '#5d8fd6', enemy: '#d9533f', neutral: '#d8d3c4' }[side];
      g.strokeStyle = '#11130f';
      g.lineWidth = 2;
      if (n[2] === 'p') {
        g.beginPath();
        g.arc(x, y, r, 0, 7);
        g.stroke();
        g.fill();
      } else {
        g.strokeRect(x - r, y - r, r * 2, r * 2);
        g.fillRect(x - r, y - r, r * 2, r * 2);
        if (n[2] === 'C') {
          g.strokeStyle = '#d8d3c4';
          g.lineWidth = 1;
          g.strokeRect(x - r - 3.5, y - r - 3.5, r * 2 + 7, r * 2 + 7);
        }
      }
      if (P.names && n[2] !== 'p') {
        g.font = '600 10px "Barlow Semi Condensed"';
        g.letterSpacing = '1.2px';
        g.fillStyle = 'rgba(232,228,216,.78)';
        g.textAlign = 'left';
        g.fillText(n[5].toUpperCase(), x + r + 5, y + 3.5);
      }
    });
  },

  raster(g, k, P) {
    const dark = P.tone !== 'light';
    const ink = dark ? '#f2f1ed' : '#121212';
    const ground = dark ? '#0f0f0f' : '#f2f1ed';
    g.fillStyle = ground;
    g.fillRect(0, 0, W, H);
    // Water: a line screen; mountains: a dot screen; forest: a diagonal screen.
    layer(g, k, [1], (l) => {
      l.fillStyle = ink;
      l.globalAlpha = dark ? 0.2 : 0.28;
      for (let y = 0; y < H; y += 4) l.fillRect(0, y, W, 1);
    }, 0.5);
    layer(g, k, [3, 4], (l) => {
      l.fillStyle = ink;
      l.globalAlpha = dark ? 0.28 : 0.32;
      for (let y = 0; y < H; y += 6) for (let x = 0; x < W; x += 6) l.fillRect(x, y, 1.5, 1.5);
    }, 0.5);
    layer(g, k, [2], (l) => {
      l.strokeStyle = ink;
      l.globalAlpha = dark ? 0.2 : 0.24;
      l.lineWidth = 1;
      for (let x = -H; x < W; x += 6) {
        l.beginPath();
        l.moveTo(x, H);
        l.lineTo(x + H, 0);
        l.stroke();
      }
    }, 0.5);
    for (const c of VALLEY.geo.coast) {
      g.strokeStyle = ink;
      g.lineWidth = 1;
      poly(g, smooth(c, 1));
      g.stroke();
    }
    roads(g, (x1, y1, x2, y2) => {
      g.strokeStyle = ink;
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
    });
    VALLEY.n.forEach((n) => {
      const x = mx(n[0]), y = my(n[1]);
      const side = SIDE(n[3]);
      const r = n[2] === 'C' ? 9 : n[2] === 'p' ? 3.5 : n[2] === 'l' ? 7 : 5.5;
      const col = { own: '#2f5ff0', enemy: '#ea3323', neutral: ink }[side];
      g.fillStyle = n[2] === 'p' ? ground : col;
      g.strokeStyle = n[2] === 'p' ? ink : col;
      g.lineWidth = 1.5;
      if (n[2] === 'C') g.fillRect(x - r, y - r, r * 2, r * 2);
      else {
        g.beginPath();
        g.arc(x, y, r, 0, 7);
        g.fill();
        g.stroke();
      }
      if (P.names && n[2] !== 'p') {
        g.font = `${n[2] === 'C' ? 700 : 500} 11px Archivo`;
        g.fillStyle = ink;
        g.textAlign = 'left';
        g.fillText(n[5], x + r + 5, y + 4);
      }
    });
  },

  nocturne(g, k, P) {
    g.fillStyle = '#0d1013';
    g.fillRect(0, 0, W, H);
    g.save();
    g.filter = P.tone === 'lit' ? 'saturate(.7) brightness(.78)' : 'saturate(.42) brightness(.5) contrast(1.05)';
    g.drawImage(CLS.img, MOX, MOY, VALLEY.w * MS, VALLEY.h * MS);
    g.restore();
    roads(g, (x1, y1, x2, y2) => {
      g.strokeStyle = 'rgba(13,16,19,.7)';
      g.lineWidth = 3.2;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
      g.strokeStyle = 'rgba(230,225,214,.42)';
      g.lineWidth = 1;
      g.stroke();
    });
    VALLEY.n.forEach((n) => {
      const x = mx(n[0]), y = my(n[1]);
      const side = SIDE(n[3]);
      const r = n[2] === 'C' ? 8 : n[2] === 'p' ? 3.4 : 5.5;
      g.fillStyle = { own: '#5b9bff', enemy: '#e5484d', neutral: '#8b949e' }[side];
      g.strokeStyle = '#0d1013';
      g.lineWidth = 2.5;
      g.beginPath();
      g.arc(x, y, r, 0, 7);
      g.stroke();
      if (n[2] === 'p') {
        g.strokeStyle = g.fillStyle;
        g.lineWidth = 1.4;
        g.stroke();
      } else g.fill();
      if (n[2] === 'C') {
        g.strokeStyle = '#e6e1d6';
        g.lineWidth = 1.2;
        g.beginPath();
        g.arc(x, y, r + 3.5, 0, 7);
        g.stroke();
      }
      if (P.names && n[2] !== 'p') {
        g.font = '600 10px "Public Sans"';
        g.letterSpacing = '1.4px';
        g.fillStyle = 'rgba(230,225,214,.7)';
        g.textAlign = 'center';
        g.fillText(n[5].toUpperCase(), x, y + r + 15);
      }
    });
  },
};

const PLATE_CACHE = new Map();
function plate(dir, k, P = {}) {
  const key = [dir, k, P.tone, P.names, P.grid].join('|');
  if (PLATE_CACHE.has(key)) return PLATE_CACHE.get(key);
  const c = canvas(W * k, H * k);
  const g = c.getContext('2d');
  g.scale(k, k);
  PLATES[dir](g, k, P);
  PLATE_CACHE.set(key, c);
  return c;
}

// --- Helmets ------------------------------------------------------------------------------------
// Per direction: how a unit is inked. fill: charged colour; empty: the uncharged inside;
// casing: the outer line; edge: an inner light line (null for none).
const HELMET_STYLE = {
  lapis: { own: '#6f8fd6', enemy: '#d0634a', empty: '#1a1713', casing: '#0a0907', edge: '#e9e0cc', cw: 7, ew: 2.4 },
  atlas: { own: '#35628f', enemy: '#b5392a', empty: '#efe6d2', casing: '#2b2721', edge: null, cw: 5, ew: 0 },
  ordre: { own: '#5d8fd6', enemy: '#d9533f', empty: '#232720', casing: '#0f110d', edge: '#e8e4d8', cw: 7, ew: 2 },
  raster: { own: '#2f5ff0', enemy: '#ea3323', empty: '#0f0f0f', casing: null, edge: '#f2f1ed', cw: 0, ew: 3.2 },
  rasterLight: { own: '#1f4fe0', enemy: '#c41c13', empty: '#f2f1ed', casing: null, edge: '#111111', cw: 0, ew: 3.6 },
  nocturne: { own: '#5b9bff', enemy: '#e5484d', empty: '#1b2229', casing: '#0d1013', edge: '#f0f6fc', cw: 6.4, ew: 2.1 },
};
const P2D = {};
function p2d(d) {
  if (!P2D[d]) P2D[d] = new Path2D(d);
  return P2D[d];
}
// Draw a helmet centred at (x, y), `w` wide, `share` of it charged, alpha a.
function drawHelmet(g, dir, kind, x, y, w, share, a = 1) {
  const S = HELMET_STYLE[dir], P = HELMET[kind];
  const s = w / 100;
  g.save();
  g.globalAlpha = a;
  g.translate(x, y);
  if (kind === 'enemy') g.scale(-1, 1);
  g.scale(s, s);
  g.translate(-50, -54);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  const dome = p2d(P.dome);
  if (S.casing) {
    g.strokeStyle = S.casing;
    g.lineWidth = S.cw / s / 3.4;
    g.stroke(dome);
    g.stroke(p2d(P.strap));
    if (P.band) g.stroke(p2d(P.band));
  }
  g.fillStyle = S.empty;
  g.fill(dome);
  const [top, bottom] = DOME_Y[kind];
  const fy = bottom - (bottom - top) * share;
  g.save();
  g.beginPath();
  g.rect(0, fy, 100, 100);
  g.clip();
  g.fillStyle = S[kind];
  g.fill(dome);
  g.restore();
  if (S.edge) {
    g.strokeStyle = S.edge;
    g.lineWidth = S.ew / s / 3.4;
    g.stroke(dome);
  }
  g.strokeStyle = S.edge || S.casing;
  g.lineWidth = Math.max(5.6, 2.2 / s);
  g.stroke(p2d(P.strap));
  if (P.band) g.stroke(p2d(P.band));
  g.restore();
}
// The same helmet as inline SVG for the screens (styled by the direction's CSS).
let svgId = 0;
function helmetSVG(kind, share = 1, size = 28, extra = '') {
  const P = HELMET[kind];
  const id = 'hc' + svgId++;
  const [top, bottom] = DOME_Y[kind];
  const fy = bottom - (bottom - top) * share;
  const flip = kind === 'enemy' ? ' transform="translate(100 0) scale(-1 1)"' : '';
  return `<svg class="helm ${kind} ${extra}" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true" focusable="false"><defs><clipPath id="${id}"><rect x="0" y="${fy}" width="100" height="100"/></clipPath></defs><g${flip}><path class="cs" d="${P.dome}"/><path class="cs" d="${P.strap}"/>${P.band ? `<path class="cs" d="${P.band}"/>` : ''}<path class="em" d="${P.dome}"/><path class="fi" d="${P.dome}" clip-path="url(#${id})"/><path class="ed" d="${P.dome}"/><path class="st" d="${P.strap}"/>${P.band ? `<path class="st" d="${P.band}"/>` : ''}</g></svg>`;
}

// --- Map thumbnails as SVG (pool and generated maps) ---------------------------------------------
function thumbSVG(name, w = 120, h = 74) {
  const m = THUMBS[name];
  const s = Math.min((w - 8) / m.w, (h - 8) / m.h);
  const ox = (w - m.w * s) / 2, oy = (h - m.h * s) / 2;
  const X = (x) => (ox + x * s).toFixed(1), Y = (y) => (oy + y * s).toFixed(1);
  let out = `<svg class="thumb" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" focusable="false">`;
  for (const [a, b] of m.e) out += `<line class="tr" x1="${X(m.n[a][0])}" y1="${Y(m.n[a][1])}" x2="${X(m.n[b][0])}" y2="${Y(m.n[b][1])}"/>`;
  for (const n of m.n) {
    const r = n[2] === 'C' ? 3.2 : n[2] === 'p' ? 1.3 : 2;
    const cls = 'tn ' + SIDE(n[3]) + (n[2] === 'p' ? ' tp' : '');
    out += n[2] === 'C'
      ? `<rect class="${cls}" x="${(X(n[0]) - r).toFixed(1)}" y="${(Y(n[1]) - r).toFixed(1)}" width="${r * 2}" height="${r * 2}"/>`
      : `<circle class="${cls}" cx="${X(n[0])}" cy="${Y(n[1])}" r="${r}"/>`;
  }
  return out + '</svg>';
}

// ---------------------------------------------------------------------------------------------
// The opening scene: a pure function of time t (seconds), so play, pause and scrub are exact.
// 0.0 dark · 0.7-2.45 four fights flash up at the left and right edges, each lights the map,
// then its light shrinks from the edge to the centre · 2.95 the letters of the title, one by one
// · 4.75 the title moves up · 5.2 the menu · 6.6 done. Reduced motion: one still, a 0.5 s fade.
// ---------------------------------------------------------------------------------------------
const TL = {
  end: 6.6,
  battles: [
    { e: [6, 0], at: 0.7, win: 'own', dy: -10 },
    { e: [18, 24], at: 1.25, win: 'enemy', dy: 8 },
    { e: [2, 7], at: 1.9, win: 'enemy', dy: 0 },
    { e: [17, 22], at: 2.45, win: 'own', dy: 0 },
  ],
  rise: 0.22, hold: 1.35, fade: 1.7, R: 170,
  shots: [0.3, 0.64, 0.98], shotDur: 0.16,
  title: 2.95, per: 0.105, letter: 0.34,
  move: 4.75, moveDur: 0.7,
  menu: 5.2, menuPer: 0.14, menuDur: 0.42,
  ambient: [4.2, 5.8],
  rmEnd: 0.5,
};
// The darkness, the light's core alpha and the resting map behind the menu, per direction.
const ENTRY_LOOK = {
  lapis: { dark: '#0b0a08', amb: 0.2, tone: 'dark', lit: 'brightness(2.7) contrast(1.12)' },
  atlas: { dark: '#14110d', amb: 0.17, tone: 'light', lit: 'none' },
  ordre: { dark: '#11130f', amb: 0.24, tone: 'dark', lit: 'brightness(1.75) contrast(1.05)' },
  raster: { dark: '#0b0b0b', amb: 0.2, tone: 'dark', lit: 'none' },
  nocturne: { dark: '#07090b', amb: 0.34, tone: 'dark', lit: 'brightness(1.75) saturate(1.35)' },
};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

function battlePos(b) {
  const A = NODE(b.e[0]), B = NODE(b.e[1]);
  return { x: mx((A[0] + B[0]) / 2), y: my((A[1] + B[1]) / 2) + b.dy };
}
// Light of a battle at t: radius (artboard px) and presence 0..1.
function light(b, t) {
  const u = t - b.at;
  if (u < 0) return null;
  if (u < TL.rise) return { r: TL.R * (0.55 + 0.45 * eOut(u / TL.rise)), a: eOut(u / TL.rise) };
  if (u < TL.hold) return { r: TL.R, a: 1 };
  const p = (u - TL.hold) / TL.fade;
  if (p >= 1) return null;
  return { r: TL.R * (1 - eInOut(p)), a: 1 };
}

const LIT = new Map();
function litPlate(dir, k, base) {
  const f = ENTRY_LOOK[dir].lit;
  if (dir === 'raster') return plate('raster', k, { tone: 'light', names: true, grid: true });
  if (f === 'none') return base;
  const key = dir + k;
  if (!LIT.has(key)) {
    const c = canvas(base.width, base.height);
    const g = c.getContext('2d');
    g.filter = f;
    g.drawImage(base, 0, 0);
    LIT.set(key, c);
  }
  return LIT.get(key);
}
const STAGE = new WeakMap();
function stageBuffers(cv) {
  let s = STAGE.get(cv);
  if (!s || s.w !== cv.width || s.h !== cv.height) {
    s = { w: cv.width, h: cv.height, lit: canvas(cv.width, cv.height), m: canvas(cv.width, cv.height) };
    STAGE.set(cv, s);
  }
  return s;
}

function drawShot(g, dir, from, to, p, side) {
  const col = HELMET_STYLE[dir][side];
  const x = from.x + (to.x - from.x) * p, y = from.y + (to.y - from.y) * p;
  const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  g.save();
  g.lineCap = 'butt';
  if (dir === 'lapis') {
    g.strokeStyle = '#e9e0cc';
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(x - ux * 16, y - uy * 16);
    g.lineTo(x, y);
    g.stroke();
  } else if (dir === 'atlas') {
    g.strokeStyle = '#2b2721';
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(from.x, from.y);
    g.lineTo(x, y);
    g.stroke();
    g.fillStyle = col;
    g.beginPath();
    g.arc(x, y, 2.4, 0, 7);
    g.fill();
  } else if (dir === 'ordre') {
    g.strokeStyle = '#e8e4d8';
    g.fillStyle = '#e8e4d8';
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(x - ux * 22, y - uy * 22);
    g.lineTo(x - ux * 5, y - uy * 5);
    g.stroke();
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x - ux * 7 - uy * 3.5, y - uy * 7 + ux * 3.5);
    g.lineTo(x - ux * 7 + uy * 3.5, y - uy * 7 - ux * 3.5);
    g.fill();
  } else if (dir === 'raster') {
    g.fillStyle = HELMET_STYLE.rasterLight[side];
    g.translate(x, y);
    g.rotate(Math.atan2(uy, ux));
    g.fillRect(-18, -2, 18, 4);
  } else {
    const gr = g.createLinearGradient(x - ux * 26, y - uy * 26, x, y);
    gr.addColorStop(0, 'rgba(240,246,252,0)');
    gr.addColorStop(1, col);
    g.strokeStyle = gr;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x - ux * 26, y - uy * 26);
    g.lineTo(x, y);
    g.stroke();
  }
  g.restore();
}
function drawHit(g, dir, at, q) {
  // q 0..1 after the hit: a short mark in the language of the direction.
  if (q <= 0 || q >= 1) return;
  g.save();
  g.globalAlpha = 1 - q;
  if (dir === 'lapis') {
    g.strokeStyle = '#e9e0cc';
    g.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const a = i * 1.7 + 0.4, r0 = 4 + q * 6, r1 = r0 + 4;
      g.beginPath();
      g.moveTo(at.x + Math.cos(a) * r0, at.y + Math.sin(a) * r0);
      g.lineTo(at.x + Math.cos(a) * r1, at.y + Math.sin(a) * r1);
      g.stroke();
    }
  } else if (dir === 'atlas') {
    g.strokeStyle = '#2b2721';
    g.lineWidth = 1.4;
    const s = 5;
    g.beginPath();
    g.moveTo(at.x - s, at.y - s);
    g.lineTo(at.x + s, at.y + s);
    g.moveTo(at.x + s, at.y - s);
    g.lineTo(at.x - s, at.y + s);
    g.stroke();
  } else if (dir === 'raster') {
    g.fillStyle = '#111111';
    g.fillRect(at.x - 5, at.y - 5, 10, 10);
  } else {
    g.strokeStyle = dir === 'ordre' ? '#e8e4d8' : '#f0f6fc';
    g.lineWidth = 1.4;
    g.beginPath();
    g.arc(at.x, at.y, 4 + q * 10, 0, 7);
    g.stroke();
  }
  g.restore();
}
function drawBattle(g, dir, b, t, a) {
  const c = battlePos(b);
  const u = t - b.at;
  const own = { x: c.x - 30, y: c.y + 4 }, enemy = { x: c.x + 30, y: c.y - 4 };
  const winner = b.win, loser = winner === 'own' ? 'enemy' : 'own';
  const units = { [winner]: 3, [loser]: 2 };
  const charged = { [winner]: 3, [loser]: 2 };
  const order = [winner, loser, winner];
  let fx = [];
  TL.shots.forEach((s, i) => {
    const shooter = order[i], target = shooter === 'own' ? 'enemy' : 'own';
    const from = shooter === 'own' ? own : enemy, to = target === 'own' ? own : enemy;
    const p = (u - s) / TL.shotDur;
    if (p >= 1) charged[target] = Math.max(0, charged[target] - 1);
    if (p >= 0 && p < 1) fx.push(() => drawShot(g, dir, { x: from.x + (to.x > from.x ? 14 : -14), y: from.y - 2 }, to, eOut(p), shooter));
    if (p >= 1) fx.push(() => drawHit(g, dir, to, (u - s - TL.shotDur) / 0.35));
  });
  const end = u - TL.shots[2] - TL.shotDur;
  const loserA = end > 0 ? 1 - clamp(end / 0.6) * 0.65 : 1;
  const w = 38;
  const hs = dir === 'raster' ? 'rasterLight' : dir;
  drawHelmet(g, hs, 'own', own.x, own.y, w, charged.own / units.own, a * (loser === 'own' ? loserA : 1));
  drawHelmet(g, hs, 'enemy', enemy.x, enemy.y, w, charged.enemy / units.enemy, a * (loser === 'enemy' ? loserA : 1));
  g.save();
  g.globalAlpha = a;
  fx.forEach((f) => f());
  g.restore();
}

// Draw the stage at t. k: backing pixels per artboard pixel.
function drawStage(cv, dir, t, k, rm) {
  const L = ENTRY_LOOK[dir];
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = L.dark;
  g.fillRect(0, 0, cv.width, cv.height);
  const base = plate(dir, k, { tone: L.tone, names: true, grid: true });
  const amb = rm ? L.amb : L.amb * eInOut(clamp((t - TL.ambient[0]) / (TL.ambient[1] - TL.ambient[0])));
  if (amb > 0) {
    g.globalAlpha = amb;
    g.drawImage(base, 0, 0);
    g.globalAlpha = 1;
  }
  if (!rm) {
    const S = stageBuffers(cv);
    const mg = S.m.getContext('2d');
    mg.setTransform(1, 0, 0, 1, 0, 0);
    mg.clearRect(0, 0, S.w, S.h);
    mg.scale(k, k);
    const lights = [];
    for (const b of TL.battles) {
      const l = light(b, t);
      if (!l) continue;
      const c = battlePos(b);
      lights.push({ b, l, c });
      const gr = mg.createRadialGradient(c.x, c.y, 0, c.x, c.y, l.r);
      if (dir === 'raster') {
        gr.addColorStop(0, `rgba(0,0,0,${l.a})`);
        gr.addColorStop(0.97, `rgba(0,0,0,${l.a})`);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
      } else {
        gr.addColorStop(0, `rgba(0,0,0,${l.a})`);
        gr.addColorStop(0.5, `rgba(0,0,0,${l.a * 0.92})`);
        gr.addColorStop(0.8, `rgba(0,0,0,${l.a * 0.4})`);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
      }
      mg.fillStyle = gr;
      mg.fillRect(c.x - l.r, c.y - l.r, l.r * 2, l.r * 2);
    }
    if (lights.length) {
      const lg = S.lit.getContext('2d');
      lg.globalCompositeOperation = 'source-over';
      lg.clearRect(0, 0, S.w, S.h);
      lg.drawImage(litPlate(dir, k, base), 0, 0);
      lg.globalCompositeOperation = 'destination-in';
      lg.drawImage(S.m, 0, 0);
      lg.globalCompositeOperation = 'source-over';
      g.drawImage(S.lit, 0, 0);
      g.save();
      g.scale(k, k);
      for (const { b, l } of lights) {
        const u = t - b.at;
        const a = u < TL.hold ? clamp(u / 0.12) : clamp(l.r / TL.R / 0.45);
        drawBattle(g, dir, b, t, a);
      }
      g.restore();
    }
  }
}

// Set the DOM side of the scene (title letters, its move, the menu) for t.
function setEntryDOM(root, t, rm) {
  const letters = root.querySelectorAll('.title .l');
  letters.forEach((el, i) => {
    const p = rm ? 1 : clamp((t - (TL.title + i * TL.per)) / TL.letter);
    el.style.setProperty('--p', p.toFixed(3));
    el.classList.toggle('in', p > 0);
    el.classList.toggle('cut', p > 0 && p < 1);
    el.style.setProperty('--i', String(i));
  });
  const sp = letters[5] ? +letters[5].style.getPropertyValue('--p') : 1;
  root.style.setProperty('--sp', String(sp));
  const m = rm ? 1 : eInOut(clamp((t - TL.move) / TL.moveDur));
  root.style.setProperty('--m', m.toFixed(3));
  root.querySelectorAll('.gate [data-q]').forEach((el) => {
    const j = +el.dataset.q;
    const q = rm ? clamp(t / TL.rmEnd) : eOut(clamp((t - TL.menu - j * TL.menuPer) / TL.menuDur));
    el.style.setProperty('--q', q.toFixed(3));
    el.toggleAttribute('inert', q < 0.6);
  });
  const done = rm ? t >= TL.rmEnd : t >= TL.end;
  root.classList.toggle('done', done);
  const skip = root.querySelector('.skip');
  if (skip) skip.classList.toggle('shown', !rm && t > 0.6 && t < TL.menu);
}

// ---------------------------------------------------------------------------------------------
// Every screen outside the match, one markup for all directions: the direction's CSS sets the
// grid, the type, the rules and the numbering. Strings are the client's (apps/client/src/i18n/en.ts)
// unless the screen is new (settings, profile, the result stats being wired now).
// ---------------------------------------------------------------------------------------------
const ACCT = {
  guest: { nick: 'Marta', st: 'Guest', rating: null },
  cal: { nick: 'Marta', st: 'Calibration 3/5', rating: null },
  ranked: { nick: 'Marta', st: 'Ranked', rating: 1532 },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const TITLE = 'Fines Imperii';

function titleMarkup(cls = 'title') {
  let i = 0;
  const words = TITLE.split(' ').map((w) => `<span class="w">${[...w].map((ch) => `<span class="l" data-i="${i++}">${ch}</span>`).join('')}</span>`);
  return `<h1 class="${cls}" aria-label="${TITLE}"><span class="tt" aria-hidden="true">${words.join('<span class="sp"> </span>')}</span></h1>`;
}
function wordmark() {
  return `<div class="brand" aria-label="${TITLE}"><span aria-hidden="true">${TITLE}</span></div>`;
}
function tabs(cur, locked = false) {
  const t = [['play', 'Play'], ['replays', 'Replays'], ['board', 'Leaderboard'], ['howto', 'How to play']];
  return `<nav class="tabs" aria-label="Main menu">${t
    .map(([id, l], i) => `<a href="#" class="tab" data-n="${i + 1}" ${id === cur ? 'aria-current="page"' : ''} ${locked && id !== cur ? 'aria-disabled="true"' : ''}>${l}</a>`)
    .join('')}</nav>`;
}
function acct(a = ACCT.cal) {
  return `<button type="button" class="acct" aria-haspopup="menu"><span class="nick">${a.nick}</span><span class="st">${a.rating ?? a.st}</span>${a.rating ? '<span class="st2">Ranked</span>' : ''}</button>`;
}
function bar(cur, a, extra = '') {
  return `<header class="bar">${wordmark()}${tabs(cur)}<div class="corner">${extra}${acct(a)}</div></header>`;
}
const chip = (t, cls = '') => `<span class="chip ${cls}">${t}</span>`;
const sign = (k) =>
  ({
    warn: '<svg class="sg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z"/><path class="sgk" d="M8 6v4M8 11.6v.6"/></svg>',
    lock: '<svg class="sg" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5"/><path class="sgk" d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>',
    ok: '<svg class="sg" viewBox="0 0 16 16" aria-hidden="true"><path class="sgk" d="M2.5 8.5 6.5 12 13.5 4"/></svg>',
    err: '<svg class="sg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 15 8 8 15 1 8z"/><path class="sgk" d="M8 5v4M8 10.6v.6"/></svg>',
  })[k];
const notice = (k, text, act = '') => `<p class="notice ${k}" role="${k === 'err' ? 'alert' : 'status'}">${sign(k === 'info' ? 'ok' : k)}<span>${text}</span>${act}</p>`;
const field = (label, value, opts = {}) =>
  `<label class="field ${opts.err ? 'bad' : ''} ${opts.cls || ''}"><span class="lab">${label}</span><span class="box"><input ${opts.type ? `type="${opts.type}"` : ''} value="${esc(value)}" placeholder="${opts.ph || ''}" ${opts.err ? 'aria-invalid="true"' : ''} autocomplete="off" spellcheck="false">${opts.after || ''}</span>${opts.err ? `<span class="msg">${sign('warn')}${opts.err}</span>` : opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</label>`;
const spinner = (label) => `<span class="busy" role="status" aria-label="${label}"><i></i><i></i><i></i></span>`;

// --- Entry, log in, create an account ---------------------------------------------------------
function gate(state) {
  const invited = state === 'invited';
  const err = state === 'short' ? 'At least 3 characters' : state === 'taken' ? 'Taken. Try another nick' : null;
  const busy = state === 'busy';
  const nick = state === 'short' ? 'Ma' : state === 'taken' ? 'Ember' : busy ? 'Marta' : state === 'typed' ? 'Marta' : '';
  return `<form class="gate" onsubmit="return false" data-q="0">
    ${invited ? `<p class="invited" data-q="0">${chip('Invited to a match', 'inv')}</p>` : ''}
    <div class="q" data-q="0">${field('Your nick', nick, {
      ph: 'Nick',
      err,
      cls: 'nickf',
      after: `<button type="submit" class="go" ${busy ? 'aria-busy="true"' : ''}>${busy ? spinner('Signing in') : invited ? 'Join' : 'Play'}</button>`,
    })}</div>
    <div class="alt q" data-q="1"><button type="button" class="small">Log in</button><button type="button" class="small">Create an account</button></div>
  </form>`;
}
function entry(state) {
  return `<div class="scr entry" data-bg="entry">
    <canvas class="stage" aria-hidden="true"></canvas>
    <div class="vig" aria-hidden="true"></div>
    ${titleMarkup()}
    ${gate(state)}
    <button type="button" class="skip">Skip</button>
  </div>`;
}
function login(state) {
  const err = state === 'wrong' ? notice('err', 'Wrong nick or password.') : state === 'limited' ? notice('err', 'Too many attempts. Try again in 4 min.') : '';
  return `<div class="scr entry form" data-bg="entry-still">
    <canvas class="stage" aria-hidden="true"></canvas><div class="vig" aria-hidden="true"></div>
    ${titleMarkup('title done')}
    <form class="gate sheet" onsubmit="return false">
      <h2 class="formh">Log in</h2>
      ${err}
      ${field('Nick', 'Marta')}
      ${field('Password', state === 'empty' ? '' : 'password12', { type: 'password' })}
      <button type="submit" class="cta">Log in</button>
      <div class="alt"><button type="button" class="small">Play as a guest</button><button type="button" class="small">Create an account</button></div>
    </form>
  </div>`;
}
function register(state) {
  return `<div class="scr entry form" data-bg="entry-still">
    <canvas class="stage" aria-hidden="true"></canvas><div class="vig" aria-hidden="true"></div>
    ${titleMarkup('title done')}
    <form class="gate sheet" onsubmit="return false">
      <h2 class="formh">Create an account</h2>
      ${field('Nick', 'Marta')}
      ${field('Password', 'password12', { type: 'password', hint: '10 to 128 characters' })}
      ${field('Repeat the password', state === 'mismatch' ? 'password13' : 'password12', { type: 'password', err: state === 'mismatch' ? 'The passwords do not match.' : null })}
      <button type="submit" class="cta">Create the account and play</button>
      <div class="alt"><button type="button" class="small">Play as a guest</button><button type="button" class="small">Log in</button></div>
    </form>
  </div>`;
}

// --- The main screen (the Play tab) -------------------------------------------------------------
function modes(dis = false, lobby = 3) {
  const m = [
    ['Play a bot', 'Four levels, any map. Unrated.'],
    ['Invite a friend', 'A private link for one opponent.'],
    ['Open matches', lobby ? `${lobby} waiting` : 'None yet'],
  ];
  return `<ol class="modes">${m
    .map(([t, d]) => `<li><button type="button" class="mode" ${dis ? 'disabled' : ''}><span class="mt">${t}</span><span class="md">${d}</span></button></li>`)
    .join('')}</ol>`;
}
function main(state) {
  const a = state === 'guest' ? ACCT.guest : state === 'ranked' || state === 'running' || state === 'locked' || state === 'net' ? ACCT.ranked : ACCT.cal;
  let lead;
  if (state === 'running') {
    lead = `<p class="kicker">Match in progress</p><button type="button" class="cta big">${helmetSVG('own', 0.6, 40)}<span>Return</span></button><p class="sub">Against Ember on crossroads, 6:12 left</p>`;
  } else if (state === 'locked') {
    lead = `<p class="kicker">Ranked queue</p><button type="button" class="cta big" disabled>${helmetSVG('own', 1, 40)}<span>Play</span></button><p class="sub">${chip(`${sign('lock')}Queue locked 12:40`, 'ban')} The queue is locked. Bots, friends and the lobby stay open.</p>`;
  } else {
    const k = state === 'guest' ? 'Unrated as a guest' : state === 'ranked' || state === 'net' ? 'Ranked queue' : 'Calibration, match 4 of 5';
    lead = `<p class="kicker">${k}</p><button type="button" class="cta big">${helmetSVG('own', 1, 40)}<span>Play</span></button><p class="sub">${state === 'guest' ? '<button type="button" class="lnk">Set a password to play ranked</button>' : 'One opponent, 10 to 15 minutes'}</p>`;
  }
  return `<div class="scr app" data-bg="map">${bar('play', a)}
    <main class="body play">
      ${state === 'net' ? notice('err', 'Could not reach the server.', '<button type="button" class="lnk">Try again</button>') : ''}
      <section class="lead">${lead}</section>
      ${modes(state === 'running')}
      <p class="tagline">The capital produces charges, roads carry them, a unit without a charge is defenseless.</p>
    </main></div>`;
}

// --- Queue --------------------------------------------------------------------------------------
function queue(state) {
  let core;
  if (state === 'found') {
    core = `<p class="kicker">Opponent found</p>
      <div class="versus">${helmetSVG('own', 1, 46)}<span class="vs-n">Marta</span><span class="vs-x">against</span><span class="vs-n">Ember</span>${helmetSVG('enemy', 1, 46)}</div>
      <p class="sub">Confirm within <b class="num">8 s</b>, or you leave the queue.</p>
      <div class="acts"><button type="button" class="cta">Play</button><button type="button" class="btn">Decline</button></div>`;
  } else if (state === 'confirmed') {
    core = `<p class="kicker">Opponent found</p>
      <div class="versus">${helmetSVG('own', 1, 46)}<span class="vs-n">Marta</span><span class="vs-x">against</span><span class="vs-n">Ember</span>${helmetSVG('enemy', 1, 46)}</div>
      <p class="sub">${spinner('Waiting')} Waiting for Ember · 6 s</p>`;
  } else {
    const long = state === 'long';
    core = `<p class="kicker">Finding an opponent</p>
      <p class="clock num" role="timer" aria-label="Waiting: ${long ? '1:24' : '0:17'}">${long ? '1:24' : '0:17'}</p>
      <p class="sub">${spinner('Searching')} Searching</p>
      <div class="acts"><button type="button" class="btn">Stop</button></div>
      ${long ? `<div class="offer"><button type="button" class="cta">Play a bot instead</button>${chip('Unrated')}</div><p class="hint">Keep this tab open</p>` : ''}`;
  }
  return `<div class="scr app" data-bg="map">${bar('play', ACCT.ranked)}
    <main class="body queue"><section class="lead center">${core}</section></main></div>`;
}

// --- Play a bot, invite a friend, maps ------------------------------------------------------------
function mapPicker(chosen = 'random') {
  const pool = ['crossroads', 'highway', 'narrows', 'ridge'];
  const gen = ['gen1-5', 'gen1-25', 'gen1-36'];
  const tile = (id, label, sub, svg) =>
    `<button type="button" class="tile" role="radio" aria-checked="${chosen === id}" tabindex="${chosen === id ? 0 : -1}">${svg}<span class="tl">${label}</span>${sub ? `<span class="ts">${sub}</span>` : ''}</button>`;
  const rnd = (gen) => `<svg class="thumb rnd" viewBox="0 0 96 58" width="96" height="58" aria-hidden="true"><text x="48" y="39" text-anchor="middle">?</text></svg>`;
  return `<div class="maps"><p class="label">Map</p>
    <div class="tiles" role="radiogroup" aria-label="Map">${tile('random', 'Random map', 'The server picks', rnd())}${pool
      .map((m) => tile(m, m, `${THUMBS[m].n.length} nodes`, thumbSVG(m, 96, 58)))
      .join('')}</div>

function ingame(state) {
  const sectors = [['Recruit', '1 CP'], ['Factory', '4●'], ['Bunker', '3●'], ['Fortify', '2 CP']];
  const cx = 300, cy = 300, R1 = 74, R2 = 150;
  const arcs = sectors
    .map((s, i) => {
      const a0 = -Math.PI / 2 - Math.PI / 4 + (i * Math.PI) / 2 + 0.035, a1 = a0 + Math.PI / 2 - 0.07;
      const p = (r, a) => `${(cx + r * Math.cos(a)).toFixed(1)} ${(cy + r * Math.sin(a)).toFixed(1)}`;
      const am = (a0 + a1) / 2;
      return `<path class="sec ${i === 0 ? 'on' : ''}" d="M${p(R1, a0)} A${R1} ${R1} 0 0 1 ${p(R1, a1)} L${p(R2, a1)} A${R2} ${R2} 0 0 0 ${p(R2, a0)} Z"/><text class="st" x="${(cx + 112 * Math.cos(am)).toFixed(1)}" y="${(cy + 112 * Math.sin(am) - 2).toFixed(1)}" text-anchor="middle">${s[0]}</text><text class="sc" x="${(cx + 112 * Math.cos(am)).toFixed(1)}" y="${(cy + 112 * Math.sin(am) + 16).toFixed(1)}" text-anchor="middle">${s[1]}</text>`;
    })
    .join('');
  const cells = Array.from({ length: 10 }, (_, i) => `<i class="${i < 6 ? 'on' : ''}"></i>`).join('');
  return `<div class="scr game" data-bg="game">
    <canvas class="stage" aria-hidden="true"></canvas>
    <header class="hud"><div class="hb cp"><span class="hl">CP</span><span class="cells">${cells}</span><span class="num hv">6<span class="of">/10</span></span></div>
      <div class="hb vp"><span class="hn mine">Marta</span><span class="num hv mine">7</span><span class="hl">VP</span><span class="num hv enemy">5</span><span class="hn enemy">Ember</span></div>
      <div class="hb tm"><span class="hl">Time left</span><span class="num hv">6:12</span></div>
      <div class="hb btns"><button type="button" class="hbtn">Help</button><button type="button" class="hbtn">Exit</button></div></header>
    <svg class="radial" viewBox="142 142 316 316" aria-label="City menu of Mossgate" role="menu">${arcs}<circle class="hub" cx="${cx}" cy="${cy}" r="${R1 - 12}"/><text class="hubt" x="${cx}" y="${cy - 4}" text-anchor="middle">Mossgate</text><text class="hubs" x="${cx}" y="${cy + 16}" text-anchor="middle">4 of 6 ●</text></svg>
    <div class="selcard"><p class="kicker">Group</p><div class="sc-h">${helmetSVG('own', 0.66, 34)}<b class="num">6</b><span>4 of 6 charged</span></div><div class="acts"><button type="button" class="btn sm">Split</button><button type="button" class="btn sm">Defense</button></div></div>
  </div>`;
}

const SCREENS = [
  { id: 'entry', label: 'Entry', states: [['seq', 'Opening scene'], ['return', 'Back from a match'], ['typed', 'Nick typed'], ['short', 'Nick too short'], ['taken', 'Nick taken'], ['invited', 'Invited'], ['busy', 'Signing in']], render: entry },
  { id: 'login', label: 'Log in', states: [['empty', 'Empty'], ['filled', 'Filled'], ['wrong', 'Wrong password'], ['limited', 'Too many tries']], render: login },
  { id: 'register', label: 'Create an account', states: [['ok', 'Filled'], ['mismatch', 'Passwords differ']], render: register },
  { id: 'main', label: 'Main', states: [['cal', 'Calibration'], ['guest', 'Guest'], ['ranked', 'Ranked'], ['running', 'Match running'], ['locked', 'Queue locked'], ['net', 'Server down']], render: main },
  { id: 'queue', label: 'Queue', states: [['search', 'Searching'], ['long', 'Long wait'], ['found', 'Found'], ['confirmed', 'Confirmed']], render: queue },
  { id: 'bot', label: 'Play a bot', states: [['pool', 'Pool map'], ['gen', 'Generated map'], ['busy', 'Starting']], render: bot },
  { id: 'invite', label: 'Invite a friend', states: [['new', 'New match']], render: invite },
  { id: 'room', label: 'Waiting room', states: [['wait', 'Waiting'], ['joined', 'Joined'], ['ready', 'Both ready'], ['copied', 'Link copied']], render: room },
  { id: 'lobby', label: 'Open matches', states: [['list', 'List'], ['joining', 'Joining'], ['empty', 'Empty'], ['net', 'Server down']], render: lobby },
  { id: 'board', label: 'Leaderboard', states: [['list', 'Table'], ['loading', 'Loading'], ['empty', 'Empty'], ['error', 'Error']], render: board },
  { id: 'profile', label: 'Profile', states: [['own', 'Own profile']], render: profile },
  { id: 'replays', label: 'Replays', states: [['list', 'Cards'], ['empty', 'Empty']], render: replays },
  { id: 'settings', label: 'Settings', states: [['all', 'All']], render: settings },
  { id: 'help', label: 'How to play', states: [['all', 'Overview']], render: help },
  { id: 'dialogs', label: 'Dialogs', states: [['logout', 'Log out'], ['password', 'Set a password'], ['forfeit', 'Forfeit']], render: dialogs },
  { id: 'toasts', label: 'Toasts', states: [['all', 'All kinds']], render: toasts },
  { id: 'result', label: 'Result', states: [['win', 'Victory, ranked'], ['loss', 'Defeat, calibration'], ['draw', 'Draw, unrated']], render: result },
  { id: 'loading', label: 'Loading, errors', states: [['join', 'Joining'], ['reconnect', 'Reconnecting'], ['crash', 'Crash']], render: loading },
  { id: 'ingame', label: 'In-game carry-over', states: [['hud', 'HUD, radial, city']], render: ingame },
];

// ---------------------------------------------------------------------------------------------
// Material and furniture per direction: a tiled texture (stone, paper, cloth) and the small
// pieces of a page that are not content (the atlas neatline and inset map, the order's header).
// In the client these would be static files and markup; here they are drawn once by code.
// ---------------------------------------------------------------------------------------------
const TEX = {};
// A fine grain laid over the dark gradients: it hides the 8-bit banding of a dark vignette.
function grain() {
  if (TEX.grain) return TEX.grain;
  const c = canvas(160, 160);
  const g = c.getContext('2d');
  const r = rng(7);
  const id = g.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = r() < 0.5 ? 0 : 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = Math.floor(r() * 7);
  }
  g.putImageData(id, 0, 0);
  TEX.grain = `url(${c.toDataURL()})`;
  return TEX.grain;
}
function texture(dir) {
  if (TEX[dir] !== undefined) return TEX[dir];
  const c = canvas(240, 240);
  const g = c.getContext('2d');
  const r = rng(dir.length * 97);
  if (dir === 'lapis') {
    for (let i = 0; i < 26; i++) {
      const x = r() * 240, y = r() * 240, s = 12 + r() * 46;
      const gr = g.createRadialGradient(x, y, 0, x, y, s);
      const a = 0.025 + r() * 0.035;
      gr.addColorStop(0, r() < 0.5 ? `rgba(255,240,210,${a})` : `rgba(0,0,0,${a * 2})`);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      for (const dx of [-240, 0, 240]) for (const dy of [-240, 0, 240]) {
        g.save();
        g.translate(dx, dy);
        g.fillRect(x - s, y - s, s * 2, s * 2);
        g.restore();
      }
    }
    noise(g, 240, 240, 21, 0.22, '#5a5244', '#000000', 1.6);
  } else if (dir === 'atlas') {
    noise(g, 240, 240, 31, 0.16, '#fffaf0', '#8f7f62', 1.8);
    g.lineCap = 'round';
    for (let i = 0; i < 70; i++) {
      const x = r() * 240, y = r() * 240, a = r() * Math.PI, l = 3 + r() * 9;
      g.strokeStyle = `rgba(120,100,70,${0.05 + r() * 0.06})`;
      g.lineWidth = 0.6;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + r() * 2, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
      g.stroke();
    }
  } else if (dir === 'ordre') {
    g.fillStyle = 'rgba(255,255,240,.018)';
    for (let y = 0; y < 240; y += 3) g.fillRect(0, y, 240, 1);
    noise(g, 240, 240, 41, 0.12, '#cfcab8', '#000000', 0.8);
  } else {
    TEX[dir] = 'none';
    return 'none';
  }
  TEX[dir] = `url(${c.toDataURL()})`;
  return TEX[dir];
}

const svgCompass = `<svg class="rose" viewBox="-40 -40 80 80" width="74" height="74" aria-hidden="true"><circle r="27" class="r1"/><circle r="23" class="r2"/><path class="n" d="M0 -36 L5 -4 L0 0 L-5 -4 Z"/><path class="s" d="M0 36 L5 4 L0 0 L-5 4 Z"/><path class="s" d="M-36 0 L-4 -5 L0 0 L-4 5 Z M36 0 L4 -5 L0 0 L4 5 Z"/><text y="-30" class="nl" text-anchor="middle">N</text></svg>`;

function decorate(dir, scr, id) {
  const app = scr.classList.contains('app');
  const isMap = scr.dataset.bg === 'map';
  let html = '';
  if (dir === 'atlas' && app) {
    const cols = 'ABCDEFGH', ticks = [];
    for (let i = 0; i < 8; i++) ticks.push(`<span class="gx" data-x="${i}">${cols[i]}</span>`);
    for (let i = 0; i < 5; i++) ticks.push(`<span class="gy" data-y="${i}">${i + 1}</span>`);
    html += `<div class="neat" aria-hidden="true">${ticks.join('')}</div>`;
    if (isMap && !scr.classList.contains('result'))
      html += `<div class="inset" aria-hidden="true"><p class="cap"><span>Plate I</span><i>The valley</i></p>${svgCompass}<div class="scale"><i></i><i></i><i></i><i></i><span>0</span><span>5 leagues</span></div></div>`;
  }
  if (dir === 'ordre' && app) {
    const n = SCREENS.findIndex((s) => s.id === id) + 1;
    html += `<div class="meta" aria-hidden="true"><span>Fines Imperii</span><span>Sheet ${String(n).padStart(2, '0')} of ${SCREENS.length}</span><span class="grow"></span><span>Season 1</span><span>081840Z NOV 26</span></div>`;
    if (isMap && !scr.classList.contains('result')) html += `<div class="crop" aria-hidden="true"><i></i><i></i><i></i><i></i><span>Valley · 1:50 000 · grid 1 km</span></div>`;
  }
  if (dir === 'raster' && app && isMap && !scr.classList.contains('result')) {
    html += `<div class="mapcap" aria-hidden="true"><b>Valley</b><span>25 nodes, 44 roads</span><span>Blue holds the west, red the east</span></div>`;
  }
  if (html) scr.insertAdjacentHTML('beforeend', html);
  scr.querySelectorAll('.neat .gx').forEach((el) => (el.style.left = `calc(${((+el.dataset.x + 0.5) / 8) * 100}%)`));
  scr.querySelectorAll('.neat .gy').forEach((el) => (el.style.top = `calc(${((+el.dataset.y + 0.5) / 5) * 100}%)`));
}

// ---------------------------------------------------------------------------------------------
// The mockup shell: directions, screens, states, compare, zoom, grayscale, reduced motion, time.
// State lives in the address: #d=lapis&c=atlas&s=entry&st=seq&t=3.2&g=1&rm=1&z=fit
// ---------------------------------------------------------------------------------------------
const DIRS = [
  ['lapis', 'I', 'Lapis'],
  ['atlas', 'II', 'Atlas'],
  ['ordre', 'III', 'Ordre'],
  ['raster', 'IV', 'Raster'],
  ['nocturne', 'V', 'Nocturne'],
];
const ST = { d: 'lapis', c: '', s: 'entry', st: 'seq', t: 0, g: 0, rm: 0, z: 'fit', playing: false };
const $ = (q, el = document) => el.querySelector(q);

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ['d', 'c', 's', 'st', 'z']) if (h.has(k)) ST[k] = h.get(k);
  for (const k of ['t', 'g', 'rm']) if (h.has(k)) ST[k] = +h.get(k);
  if (!DIRS.some((d) => d[0] === ST.d)) ST.d = 'lapis';
  if (ST.c && !DIRS.some((d) => d[0] === ST.c)) ST.c = '';
  const sc = screen();
  if (!sc.states.some((s) => s[0] === ST.st)) ST.st = sc.states[0][0];
}
function writeHash() {
  const h = new URLSearchParams({ d: ST.d, s: ST.s, st: ST.st });
  if (ST.c) h.set('c', ST.c);
  if (isSeq()) h.set('t', ST.t.toFixed(2));
  if (ST.g) h.set('g', '1');
  if (ST.rm) h.set('rm', '1');
  if (ST.z !== 'fit') h.set('z', ST.z);
  history.replaceState(null, '', '#' + h.toString());
}
const screen = () => SCREENS.find((s) => s.id === ST.s) || SCREENS[0];
const isSeq = () => ST.s === 'entry' && ST.st === 'seq';
const tEnd = () => (ST.rm ? TL.rmEnd : TL.end);

// --- Chrome ---------------------------------------------------------------------------------------
function buildChrome() {
  $('#dirs').innerHTML = DIRS.map(
    ([id, n, name]) => `<button type="button" data-d="${id}"><span class="dn">${n}</span>${name}</button>`,
  ).join('');
  $('#cmp').innerHTML = `<option value="">Compare: off</option>` + DIRS.map(([id, n, name]) => `<option value="${id}">${n} ${name}</option>`).join('');
  $('#screens').innerHTML = SCREENS.map((s) => `<li><button type="button" data-s="${s.id}">${s.label}</button></li>`).join('');
  $('#dirs').onclick = (e) => {
    const b = e.target.closest('[data-d]');
    if (b) {
      ST.d = b.dataset.d;
      if (ST.c === ST.d) ST.c = '';
      render(true);
    }
  };
  $('#cmp').onchange = (e) => {
    ST.c = e.target.value === ST.d ? '' : e.target.value;
    render(true);
  };
  $('#screens').onclick = (e) => {
    const b = e.target.closest('[data-s]');
    if (b) {
      ST.s = b.dataset.s;
      ST.st = screen().states[0][0];
      render(true);
    }
  };
  $('#states').onclick = (e) => {
    const b = e.target.closest('[data-st]');
    if (b) {
      ST.st = b.dataset.st;
      render(true);
    }
  };
  $('#gray').onchange = (e) => {
    ST.g = e.target.checked ? 1 : 0;
    render(false);
  };
  $('#rm').onchange = (e) => {
    ST.rm = e.target.checked ? 1 : 0;
    ST.t = 0;
    render(true);
  };
  $('#zoom').onchange = (e) => {
    ST.z = e.target.value;
    render(false);
  };
  $('#play').onclick = () => (ST.playing ? pause() : play());
  $('#again').onclick = () => {
    ST.t = 0;
    play();
  };
  $('#scrub').oninput = (e) => {
    pause();
    ST.t = +e.target.value;
    frame();
  };
  window.addEventListener('resize', () => render(false));
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('input, select, textarea')) return;
    if (e.key === ' ' && isSeq()) {
      e.preventDefault();
      ST.playing ? pause() : play();
    } else if (isSeq() && ST.playing && !e.metaKey && !e.ctrlKey && e.key.length === 1) {
      skip();
    }
  });
}
function syncChrome() {
  document.querySelectorAll('#dirs [data-d]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.d === ST.d)));
  document.querySelectorAll('#screens [data-s]').forEach((b) => b.setAttribute('aria-current', b.dataset.s === ST.s ? 'page' : 'false'));
  $('#states').innerHTML = screen()
    .states.map(([id, l]) => `<button type="button" data-st="${id}" aria-pressed="${id === ST.st}">${l}</button>`)
    .join('');
  $('#cmp').value = ST.c;
  $('#gray').checked = !!ST.g;
  $('#rm').checked = !!ST.rm;
  $('#zoom').value = ST.z;
  $('#transport').hidden = !isSeq();
  $('#scrub').max = String(tEnd());
}

// --- Boards ---------------------------------------------------------------------------------------
let boards = [];
function render(rebuild) {
  syncChrome();
  const stage = $('#stage');
  const dirs = [ST.d, ...(ST.c ? [ST.c] : [])];
  const pad = 24;
  const aw = stage.clientWidth - pad * 2, ah = stage.clientHeight - pad * 2;
  const n = dirs.length;
  const gap = 20;
  let scale;
  if (ST.z === 'fit') scale = Math.min((aw - gap * (n - 1)) / n / W, ah / H);
  else scale = +ST.z;
  scale = Math.max(0.2, scale);
  const k = Math.min(2.5, Math.max(1, Math.round(devicePixelRatio * scale * 4) / 4));
  stage.classList.toggle('scroll', ST.z !== 'fit');
  if (rebuild || boards.length !== n || boards.some((b, i) => b.dir !== dirs[i])) {
    stage.innerHTML = '';
    boards = dirs.map((dir) => {
      const wrap = document.createElement('div');
      wrap.className = 'board';
      wrap.innerHTML = `<p class="bl"><span>${DIRS.find((d) => d[0] === dir)[1]}</span> ${DIRS.find((d) => d[0] === dir)[2]}</p><div class="clip"><div class="art" data-dir="${dir}">${screen().render(ST.st)}</div></div>`;
      stage.appendChild(wrap);
      const art = $('.art', wrap);
      art.style.setProperty('--tex', texture(dir));
      art.style.setProperty('--grain', grain());
      decorate(dir, $('.scr', art), ST.s);
      art.querySelectorAll('[data-w]').forEach((el) => (el.style.width = el.dataset.w + '%'));
      art.addEventListener('click', (e) => {
        if (isSeq() && (e.target.closest('.skip') || (ST.t < tEnd() && !e.target.closest('.gate')))) skip();
      });
      return { dir, wrap, art };
    });
  }
  for (const b of boards) {
    b.wrap.style.width = W * scale + 'px';
    $('.clip', b.wrap).style.width = W * scale + 'px';
    $('.clip', b.wrap).style.height = H * scale + 'px';
    b.art.style.transform = `scale(${scale})`;
    b.art.classList.toggle('gray', !!ST.g);
    b.k = k;
    paintBackground(b);
  }
  frame();
  writeHash();
}
// Static backgrounds: the map plate behind a screen, drawn once per board.
function paintBackground(b) {
  const scr = $('.scr', b.art);
  const bg = scr.dataset.bg;
  let cv = $('canvas.stage', scr) || $('canvas.bgmap', scr);
  if (!cv && (bg === 'map' || bg === 'plain')) {
    cv = document.createElement('canvas');
    cv.className = 'bgmap';
    cv.setAttribute('aria-hidden', 'true');
    scr.prepend(cv);
  }
  if (!cv) return;
  cv.width = W * b.k;
  cv.height = H * b.k;
  const g = cv.getContext('2d');
  const light = b.dir === 'atlas' || b.dir === 'raster';
  if (bg === 'map' || bg === 'plain') {
    g.drawImage(plate(b.dir, b.k, { tone: light ? 'light' : 'dark', names: true, grid: b.dir === 'ordre' }), 0, 0);
  } else if (bg === 'game') {
    g.drawImage(plate(b.dir, b.k, { tone: light ? 'light' : b.dir === 'nocturne' ? 'lit' : 'dark', names: true, grid: b.dir === 'ordre' }), 0, 0);
    g.save();
    g.scale(b.k, b.k);
    const hs = b.dir === 'raster' ? 'rasterLight' : b.dir;
    const near = (i, dx, dy, kind, share, w = 40) => drawHelmet(g, hs, kind, mx(NODE(i)[0]) + dx, my(NODE(i)[1]) + dy, w, share);
    near(1, 0, -26, 'own', 1);
    near(8, -4, -26, 'enemy', 0.5);
    near(12, 2, -26, 'enemy', 1);
    g.restore();
  }
}
function frame() {
  const end = tEnd();
  ST.t = clamp(ST.t, 0, end);
  for (const b of boards) {
    const scr = $('.scr', b.art);
    const bg = scr.dataset.bg;
    if (bg !== 'entry' && bg !== 'entry-still') continue;
    const cv = $('canvas.stage', scr);
    const t = bg === 'entry-still' || ST.st === 'return' || !isSeq() ? end : ST.t;
    if (cv.width !== W * b.k) {
      cv.width = W * b.k;
      cv.height = H * b.k;
    }
    drawStage(cv, b.dir, t, b.k, !!ST.rm || ST.st === 'return' || bg === 'entry-still');
    setEntryDOM(scr, t, !!ST.rm || ST.st === 'return' || bg === 'entry-still' || !isSeq());
  }
  $('#scrub').value = String(ST.t);
  $('#clock').textContent = `${ST.t.toFixed(2)} / ${end.toFixed(2)} s`;
  $('#play').textContent = ST.playing ? 'Pause' : ST.t >= end ? 'Play again' : 'Play';
}
let last = 0, raf = 0;
function tick(now) {
  if (!ST.playing) return;
  const dt = last ? (now - last) / 1000 : 0;
  last = now;
  ST.t += dt;
  if (ST.t >= tEnd()) {
    ST.t = tEnd();
    ST.playing = false;
    writeHash();
  }
  frame();
  if (ST.playing) raf = requestAnimationFrame(tick);
}
function play() {
  if (ST.t >= tEnd()) ST.t = 0;
  ST.playing = true;
  last = 0;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
  frame();
}
function pause() {
  ST.playing = false;
  cancelAnimationFrame(raf);
  frame();
  writeHash();
}
function skip() {
  ST.t = tEnd();
  pause();
}

document.fonts.ready.then(async () => {
  await Promise.all([...document.fonts].map((f) => f.load().catch(() => null)));
  await loadTerrain();
  readHash();
  buildChrome();
  render(true);
  document.body.classList.add('ready');
  if (isSeq() && !location.hash.includes('t=')) play();
});

</script>
