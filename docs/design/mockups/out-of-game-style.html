<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out-of-game style, round 1</title>
<!-- Out-of-game style directions (round 1): five complete directions for every screen outside the
     match, the opening scene and an in-game carry-over. Self-contained: no network. Fonts (SIL OFL)
     are in assets/out-of-game-style/fonts with their licences. Built from parts; see the issue. -->
<style>
@font-face{font-family:'Cinzel';src:url(assets/out-of-game-style/fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond-italic.woff2) format('woff2');font-weight:400 800;font-style:italic;font-display:block}
@font-face{font-family:'Cormorant Garamond';src:url(assets/out-of-game-style/fonts/cormorant.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:block}
@font-face{font-family:'Cormorant Garamond';src:url(assets/out-of-game-style/fonts/cormorant-italic.woff2) format('woff2');font-weight:300 700;font-style:italic;font-display:block}
@font-face{font-family:'Alegreya';src:url(assets/out-of-game-style/fonts/alegreya.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
@font-face{font-family:'Alegreya';src:url(assets/out-of-game-style/fonts/alegreya-italic.woff2) format('woff2');font-weight:400 900;font-style:italic;font-display:block}
@font-face{font-family:'Alegreya SC';src:url(assets/out-of-game-style/fonts/alegreyasc-500.woff2) format('woff2');font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:'Big Shoulders Stencil';src:url(assets/out-of-game-style/fonts/bigshoulders-stencil.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:'Barlow Semi Condensed';src:url(assets/out-of-game-style/fonts/barlowsc-400.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Barlow Semi Condensed';src:url(assets/out-of-game-style/fonts/barlowsc-500.woff2) format('woff2');font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:'Barlow Semi Condensed';src:url(assets/out-of-game-style/fonts/barlowsc-600.woff2) format('woff2');font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url(assets/out-of-game-style/fonts/jbmono.woff2) format('woff2');font-weight:100 800;font-style:normal;font-display:block}
@font-face{font-family:'Archivo';src:url(assets/out-of-game-style/fonts/archivo.woff2) format('woff2');font-weight:100 900;font-style:normal;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Bodoni Moda';src:url(assets/out-of-game-style/fonts/bodonimoda.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
@font-face{font-family:'Bodoni Moda';src:url(assets/out-of-game-style/fonts/bodonimoda-italic.woff2) format('woff2');font-weight:400 900;font-style:italic;font-display:block}
@font-face{font-family:'Public Sans';src:url(assets/out-of-game-style/fonts/publicsans.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:block}
/* The mockup's own chrome: quiet, neutral, out of the way. */
html, body { margin: 0; height: 100%; }
body {
  background: #2a2b2c; color: #e4e4e2; font: 13px/1.4 'Public Sans', system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 196px 1fr; overflow: hidden;
}
body:not(.ready) { visibility: hidden; }
button, select { font: inherit; color: inherit; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid #3b3c3e; flex-wrap: wrap; }
header.top h1 { font: 600 12px 'Public Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 8px 0 0; color: #b9b9b6; }
#dirs { display: flex; gap: 2px; }
#dirs button, #states button { background: none; border: 1px solid #47494c; padding: 5px 11px; cursor: pointer; }
#dirs button[aria-pressed='true'], #states button[aria-pressed='true'] { background: #e4e4e2; color: #1d1e1f; border-color: #e4e4e2; }
#dirs .dn { font-variant-numeric: tabular-nums; opacity: .6; margin-right: 6px; }
.opts { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
select { background: #1f2021; border: 1px solid #47494c; padding: 4px 6px; }
nav.side { overflow: auto; border-right: 1px solid #3b3c3e; padding: 10px 0; }
#screens { list-style: none; margin: 0; padding: 0; }
#screens button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; cursor: pointer; color: #b9b9b6; }
#screens button[aria-current='page'] { color: #fff; background: #3a3b3d; box-shadow: inset 3px 0 0 #e4e4e2; }
main.view { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
#states { display: flex; gap: 2px; padding: 10px 24px 0; flex-wrap: wrap; }
#stage { position: relative; display: flex; gap: 20px; justify-content: center; align-items: center; padding: 24px; min-height: 0; overflow: hidden; }
#stage.scroll { overflow: auto; justify-content: flex-start; align-items: flex-start; }
.board { flex: none; }
.board .bl { margin: 0 0 6px; color: #9a9a97; font-size: 12px; }
.board .bl span { font-variant-numeric: tabular-nums; }
.board .clip { position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.35); }
footer#transport { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 8px 24px 12px; }
footer#transport[hidden] { display: none; }
footer#transport button { background: #e4e4e2; color: #1d1e1f; border: 0; padding: 5px 14px; cursor: pointer; min-width: 92px; }
footer#transport #again { background: none; color: #e4e4e2; border: 1px solid #47494c; min-width: 0; }
#scrub { flex: 1; accent-color: #e4e4e2; }
#clock { font-variant-numeric: tabular-nums; color: #b9b9b6; min-width: 110px; text-align: right; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ---------------------------------------------------------------------------------------------
   Screens: the shared skeleton. Every direction sets the tokens and its own layout on top.
   --------------------------------------------------------------------------------------------- */
.art {
  position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden;
  transform-origin: 0 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-text); font-size: var(--fs, 16px); line-height: 1.45;
  font-variant-numeric: lining-nums tabular-nums;
  --p: 1; --m: 1; --q: 1;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.art.gray { filter: grayscale(1); }
.art *, .art *::before, .art *::after { box-sizing: border-box; }
.art button, .art input { font: inherit; color: inherit; }
.art button { background: none; border: 0; padding: 0; cursor: pointer; }
.art p, .art h1, .art h2, .art h3, .art ol, .art ul, .art dl, .art dd { margin: 0; padding: 0; }
.art ol, .art ul { list-style: none; }
.art :focus-visible { outline: 2px solid var(--focus, var(--ink)); outline-offset: 3px; }
.art .num { font-family: var(--f-num, inherit); font-variant-numeric: lining-nums tabular-nums; }
.scr { position: absolute; inset: 0; }
canvas.stage, canvas.bgmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vig { position: absolute; inset: 0; pointer-events: none; }

/* Entry scene ---------------------------------------------------------------------------------- */
.entry .title {
  position: absolute; left: 0; right: 0; margin: 0; white-space: nowrap; pointer-events: none;
  top: calc(var(--y0) + (var(--y1) - var(--y0)) * var(--m));
  transform: scale(calc(1 - (1 - var(--s1)) * var(--m)));
  transform-origin: var(--to, 50% 0);
  text-align: var(--ta, center); font-weight: 400;
}
.entry .title.done { --m: 1; }
.entry .title .w { display: inline-block; }
.entry .title .l { display: inline-block; position: relative; opacity: var(--p); }
.entry .gate { position: absolute; }
.entry .gate [data-q] { opacity: var(--q); transform: translateY(calc((1 - var(--q)) * 10px)); }
.entry .skip {
  position: absolute; right: 40px; bottom: 32px; opacity: 0; pointer-events: none; transition: opacity .3s;
}
.entry .skip.shown { opacity: 1; pointer-events: auto; }
.entry.form .title { --m: 1; }
.field { display: grid; gap: 6px; }
.field .box { display: flex; align-items: stretch; }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; }
.field input::placeholder { color: var(--dim); opacity: .8; }
.field .msg, .notice { display: flex; align-items: center; gap: 8px; }
.sg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.sg .sgk { fill: none; stroke: var(--sg-k, var(--bg)); stroke-width: 1.8; stroke-linecap: round; }
.notice.info .sg, .toast.ok .sg, .ss.ok .sg { fill: none; }
.notice.info .sg .sgk, .toast.ok .sg .sgk, .ss.ok .sg .sgk, .steps .sg .sgk, .lead.center > .sg .sgk { stroke: currentColor; }
.gate .alt { display: flex; }
.busy { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
.busy i { width: 5px; height: 5px; background: currentColor; display: block; animation: busy 1.2s infinite ease-in-out; }
.busy i:nth-child(2) { animation-delay: .15s; }
.busy i:nth-child(3) { animation-delay: .3s; }
@keyframes busy { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* Helmets as SVG -------------------------------------------------------------------------------- */
.helm { flex: none; overflow: visible; }
.helm .cs { fill: none; stroke: var(--h-casing, transparent); stroke-width: var(--h-cw, 0); stroke-linejoin: round; stroke-linecap: round; }
.helm .em { fill: var(--h-empty); }
.helm.own .fi { fill: var(--own); }
.helm.enemy .fi { fill: var(--enemy); }
.helm .ed { fill: none; stroke: var(--h-edge, transparent); stroke-width: var(--h-ew, 0); stroke-linejoin: round; }
.helm .st { fill: none; stroke: var(--h-edge, var(--h-casing)); stroke-width: 6; stroke-linecap: round; }
.helm.empty .ghost { fill: none; stroke: var(--dim); stroke-width: 4; }

/* App screens ------------------------------------------------------------------------------------ */
.bar { position: absolute; left: 0; right: 0; top: 0; height: 72px; display: flex; align-items: center; z-index: 2; }
.bar .corner { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.tabs { display: flex; }
.tab { color: inherit; text-decoration: none; }
.tab[aria-disabled] { opacity: .45; }
.acct { display: flex; align-items: baseline; gap: 10px; }
.body { position: absolute; left: 0; right: 0; top: 72px; bottom: 0; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip .sg { width: 13px; height: 13px; }
.cta, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; white-space: nowrap; }
.cta[disabled], .btn[disabled], .mode[disabled] { opacity: .42; cursor: default; }
.lnk { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.modes .mode { display: grid; width: 100%; text-align: left; }
.acts { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.versus { display: flex; align-items: center; gap: 14px; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile { display: grid; justify-items: start; gap: 2px; text-align: left; }
.thumb .tr { stroke: var(--t-road, var(--line)); stroke-width: 1; }
.thumb .tn { fill: var(--t-neutral, var(--dim)); }
.thumb .tn.own { fill: var(--own); }
.thumb .tn.enemy { fill: var(--enemy); }
.thumb .tn.tp { fill: var(--bg); stroke: var(--t-neutral, var(--dim)); stroke-width: .8; }
.thumb .tn.tp.own { stroke: var(--own); }
.thumb .tn.tp.enemy { stroke: var(--enemy); }
.thumb.rnd text { fill: var(--dim); font-size: 30px; }
.levels { display: grid; }
.level { display: grid; text-align: left; }
.level .ld { font-size: 14px; line-height: 1.35; }
.level .pips { margin-bottom: 4px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; display: block; border: 1.5px solid currentColor; }
.pips i.on { background: currentColor; }
.seats { display: flex; align-items: center; gap: 28px; }
.seat { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
.seat .helm, .seat > svg { grid-row: span 3; }
.ss { display: inline-flex; align-items: center; gap: 6px; }
.lobbylist li { display: grid; grid-template-columns: 1.4fr .6fr 1fr 1fr auto; align-items: center; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-weight: inherit; }
.tbl td.pl { white-space: nowrap; }
.tbl td.pl .helm { vertical-align: -4px; margin-right: 8px; }
.tbl td.pl .you { margin-left: 8px; }
.wbar { display: inline-block; width: 90px; height: 6px; vertical-align: middle; margin-right: 10px; }
.wbar i { display: block; height: 100%; }
.res .rm, .rm { width: 12px; height: 12px; fill: currentColor; margin-right: 8px; vertical-align: -1px; }
.res.win { color: var(--own); }
.res.loss { color: var(--enemy); }
.facts { display: flex; }
.cards { display: grid; }
.segs { display: inline-flex; }
.switch { display: inline-flex; align-items: center; gap: 10px; }
.switch i { width: 38px; height: 20px; position: relative; display: block; }
.switch i::after { content: ''; position: absolute; top: 3px; width: 14px; height: 14px; right: 3px; }
.range { display: inline-flex; align-items: center; gap: 12px; }
.range input { width: 220px; accent-color: var(--ink); }
kbd { font-family: var(--f-num); }
.scrim { position: absolute; inset: 0; z-index: 5; }
.dialog { position: absolute; z-index: 6; }
.dialog .field { margin-top: 14px; }
.warnline { display: flex; align-items: center; gap: 8px; color: var(--warn); }
.toasts { position: absolute; z-index: 6; display: grid; gap: 10px; }
.toast { display: flex; align-items: center; gap: 12px; }
.toast .x { margin-left: auto; font-size: 20px; line-height: 1; padding: 0 4px; }
.toast .cta.sm { margin-left: auto; }
.toast.ok { color: var(--ink); }
.toast.warn .sg { color: var(--warn); }
.toast.err .sg { color: var(--enemy); }
.score { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 14px; }
.tug { display: flex; height: 8px; }
.tug .tm { background: var(--own); display: block; }
.tug .te { background: var(--enemy); flex: 1; display: block; }
.nm.mine, .vp.mine { color: var(--own); }
.nm.enemy, .vp.enemy { color: var(--enemy); }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); }
.rate { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.rate .cells { display: inline-flex; gap: 4px; align-self: center; }
.rate .cells i { width: 18px; height: 8px; display: block; border: 1.5px solid currentColor; }
.rate .cells i.on { background: currentColor; }
.delta.up { color: var(--own); }
.steps { display: grid; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 12px; }
.steps li.done { color: var(--dim); }
.lead.center > .sg { width: 28px; height: 28px; color: var(--enemy); }
/* In-game carry-over */
.game .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: stretch; z-index: 2; }
.game .hb { display: flex; align-items: center; gap: 10px; }
.game .hb.btns { margin-left: auto; }
.game .cells { display: inline-flex; gap: 3px; }
.game .cells i { width: 10px; height: 14px; display: block; border: 1.5px solid currentColor; }
.game .cells i.on { background: var(--own); border-color: var(--own); }
.game .radial { position: absolute; width: 340px; height: 340px; left: 166px; top: 230px; z-index: 2; overflow: visible; }
.dhead .chips { align-items: center; flex-wrap: wrap; }
.dhead .csub { margin-left: 8px; color: var(--dim); }
.maps .label .note { display: inline; margin: 0 0 0 14px; font-family: var(--f-text); text-transform: none; letter-spacing: 0; font-weight: 400; }
.game .radial .st { font-size: 15px; }
.game .radial .sc { font-size: 13px; }
.game .selcard { position: absolute; z-index: 2; }
.game .sc-h { display: flex; align-items: center; gap: 10px; }
[data-dir='lapis'] .csub, [data-dir='atlas'] .csub { font-style: italic; }
[data-dir='ordre'] .csub, [data-dir='nocturne'] .csub { font-size: 14px; }
.scr.entry { color: var(--ink); }
.segs button { white-space: nowrap; }

/* =============================================================================================
   I · LAPIS: imperial epigraphy. Black stone, cut Roman capitals, ivory; the sides are lapis and
   minium (the red of painted inscriptions). Rules are incised: a dark cut over a lit lower lip.
   ============================================================================================= */
[data-dir='lapis'] {
  --bg: #16130f; --bg2: #1d1a15; --ink: #ece4d1; --dim: #ada38f; --line: #3d372d; --cut: #050403;
  --own: #7d9ce2; --enemy: #e0735a; --warn: #e6ab42; --focus: #ece4d1;
  --f-display: Cinzel, serif; --f-text: 'EB Garamond', serif; --f-num: 'EB Garamond', serif; --fs: 18px;
  --h-empty: #221e19; --h-casing: #050403; --h-cw: 9; --h-edge: #ece4d1; --h-ew: 3.4;
  --t-road: #5c5446; --t-neutral: #cfc4ab; --sg-k: #16130f;
  background: var(--tex) var(--bg);
}
[data-dir='lapis'] .cut-rule, [data-dir='lapis'] .bar, [data-dir='lapis'] .modes li, [data-dir='lapis'] .levels .level,
[data-dir='lapis'] .lobbylist li, [data-dir='lapis'] .sec::after, [data-dir='lapis'] .set, [data-dir='lapis'] .card,
[data-dir='lapis'] .stats, [data-dir='lapis'] .tbl thead th, [data-dir='lapis'] .field .box {
  border-color: var(--cut);
}
[data-dir='lapis'] .lab, [data-dir='lapis'] .kicker, [data-dir='lapis'] .label, [data-dir='lapis'] .tbl th,
[data-dir='lapis'] .facts dt, [data-dir='lapis'] .stats dt, [data-dir='lapis'] .sl, [data-dir='lapis'] .sec,
[data-dir='lapis'] .chip, [data-dir='lapis'] .hl, [data-dir='lapis'] .cd, [data-dir='lapis'] .sw, [data-dir='lapis'] .skip {
  font-family: Cinzel, serif; font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); font-weight: 500;
}
/* Entry */
[data-dir='lapis'] .entry { --y0: 318px; --y1: 152px; --s1: .6; }
[data-dir='lapis'] .entry .vig { background: var(--grain), radial-gradient(ellipse 70% 62% at 50% 46%, rgba(11,10,8,.15) 0%, rgba(11,10,8,.72) 70%, #0b0a08 100%); }
[data-dir='lapis'] .entry .title { font-family: Cinzel, serif; font-size: 112px; line-height: 1.1; letter-spacing: .15em; color: var(--ink); text-shadow: 0 -1px 0 #000, 0 2px 0 rgba(236,228,209,.12); }
[data-dir='lapis'] .entry .title .l { clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); opacity: 1; }
[data-dir='lapis'] .entry .title .l.cut::after { content: ''; position: absolute; top: 14%; bottom: 14%; width: 2px; left: calc(var(--p) * 100%); background: #fff7e6; }
[data-dir='lapis'] .entry .title .sp { display: inline-block; width: .62em; position: relative; }
[data-dir='lapis'] .entry .title .sp::after { content: ''; position: absolute; left: 50%; top: -.5em; margin-left: -.07em; border-left: .07em solid transparent; border-right: .07em solid transparent; border-top: .12em solid var(--ink); opacity: var(--sp, 1); }
[data-dir='lapis'] .entry .gate { left: 50%; top: 318px; width: 470px; margin-left: -235px; }
[data-dir='lapis'] .entry .gate.sheet { top: 268px; width: 440px; margin-left: -220px; display: grid; gap: 18px; }
[data-dir='lapis'] .formh { font: 400 22px/1.2 Cinzel, serif; letter-spacing: .16em; text-align: center; padding-bottom: 6px; }
[data-dir='lapis'] .field .box { border-bottom: 1px solid var(--cut); box-shadow: 0 1px 0 var(--line); }
[data-dir='lapis'] .field input { font-size: 24px; padding: 8px 0 10px; letter-spacing: .02em; }
[data-dir='lapis'] .sheet .field input { font-size: 20px; }
[data-dir='lapis'] .field .msg { color: var(--warn); font-size: 16px; font-style: italic; }
[data-dir='lapis'] .field .hint { color: var(--dim); font-size: 15px; font-style: italic; }
[data-dir='lapis'] .go { align-self: center; height: 46px; padding: 0 26px; margin-left: 14px; background: var(--ink); color: var(--bg); font: 500 14px Cinzel, serif; letter-spacing: .24em; }
[data-dir='lapis'] .gate .alt { justify-content: center; margin-top: 26px; }
[data-dir='lapis'] .gate .small { font: 500 12px Cinzel, serif; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); padding: 6px 2px; }
[data-dir='lapis'] .gate .small:hover { color: var(--ink); }
[data-dir='lapis'] .gate .small + .small::before { content: '▾'; display: inline-block; margin: 0 18px; transform: scale(.55) translateY(-2px); color: var(--dim); }
[data-dir='lapis'] .invited { text-align: center; margin-bottom: 18px; }
[data-dir='lapis'] .chip { border: 1px solid var(--line); padding: 5px 10px 4px; color: var(--ink); }
[data-dir='lapis'] .chip.inv { border-color: var(--own); color: var(--own); }
[data-dir='lapis'] .chip.ban { color: var(--warn); border-color: currentColor; }
[data-dir='lapis'] .skip { letter-spacing: .3em; }
/* Buttons */
[data-dir='lapis'] .cta { height: 50px; padding: 0 28px; background: var(--ink); color: var(--bg); font: 500 14px Cinzel, serif; letter-spacing: .22em; text-transform: uppercase; }
[data-dir='lapis'] .cta:hover { background: #fff8e9; }

/* =============================================================================================
   II · ATLAS: a cartographic atlas. Paper and iron-gall ink, Prussian blue and vermilion washes.
   Each screen is a plate: a neatline with grid letters, a caption, an inset map with a compass.
   The opening scene is the atlas at night: fights light the paper like a lamp.
   ============================================================================================= */
[data-dir='atlas'] {
  --bg: #ece4d1; --ink: #2b2721; --dim: #5d5547; --line: rgba(43,39,33,.28); --own: #23517e; --enemy: #a9372a;
  --warn: #8a4f00; --focus: #23517e; --paper: #ece4d1;
  --f-display: 'Cormorant Garamond', serif; --f-text: Alegreya, serif; --f-num: Alegreya, serif; --fs: 17px;
  --h-empty: #f3ecdc; --h-casing: #2b2721; --h-cw: 7; --h-edge: transparent; --h-ew: 0;
  --t-road: #8d826c; --t-neutral: #5d5547; --sg-k: #ece4d1;
  background: var(--tex) var(--bg);
}
[data-dir='atlas'] .helm .st { stroke: #2b2721; }
[data-dir='atlas'] .kicker, [data-dir='atlas'] .label, [data-dir='atlas'] .lab, [data-dir='atlas'] .tbl th, [data-dir='atlas'] .facts dt,
[data-dir='atlas'] .stats dt, [data-dir='atlas'] .sl, [data-dir='atlas'] .sec, [data-dir='atlas'] .hl, [data-dir='atlas'] .cd, [data-dir='atlas'] .sw {
  font-family: 'Alegreya SC', serif; font-weight: 500; font-size: 14px; letter-spacing: .06em; color: var(--dim);
}
[data-dir='atlas'] .chip { font: italic 400 15px Alegreya, serif; padding: 2px 10px 3px; border: 1px solid var(--ink); border-radius: 0; }
[data-dir='atlas'] .chip.ban { color: var(--warn); border-color: currentColor; }
[data-dir='atlas'] .chip.inv { color: #e8dcc0; border-color: currentColor; }
/* Entry: the atlas at night */
[data-dir='atlas'] .entry { --bg: #14110d; --ink: #efe6d2; --dim: #b8ad94; --focus: #efe6d2; --sg-k: #14110d; --y0: 316px; --y1: 150px; --s1: .62; background: #14110d; }
[data-dir='atlas'] .entry .vig { background: var(--grain), radial-gradient(ellipse 68% 60% at 50% 45%, rgba(20,17,13,0) 0%, rgba(20,17,13,.55) 72%, #14110d 100%); }
[data-dir='atlas'] .entry .title { font: 500 104px/1.1 'Cormorant Garamond', serif; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }

/* =============================================================================================
   III · ORDRE: a staff briefing. Field grey, paper-white type, a stencil for the title and the
   headings, a monospace for every number, code and time. Screens are numbered sheets of an order:
   paragraphs 1, 2.1, 2.2; boxed form cells; stamps instead of chips; the map on the table, gridded.
   ============================================================================================= */
[data-dir='ordre'] {
  --bg: #1c1f1a; --bg2: #24281f; --ink: #e9e5d8; --dim: #a9ac9c; --line: #3d4238; --own: #6c9de3; --enemy: #e5674f;
  --warn: #e8b032; --focus: #e8b032;
  --f-display: 'Big Shoulders Stencil', sans-serif; --f-text: 'Barlow Semi Condensed', sans-serif; --f-num: 'JetBrains Mono', monospace; --fs: 17px;
  --h-empty: #2a2e26; --h-casing: #0d0f0b; --h-cw: 9; --h-edge: #e9e5d8; --h-ew: 3;
  --t-road: #6f6a55; --t-neutral: #c9c4b4; --sg-k: #1c1f1a;
  background: var(--tex) var(--bg);
}
[data-dir='ordre'] .kicker, [data-dir='ordre'] .label, [data-dir='ordre'] .lab, [data-dir='ordre'] .tbl th, [data-dir='ordre'] .facts dt,
[data-dir='ordre'] .stats dt, [data-dir='ordre'] .sl, [data-dir='ordre'] .sec, [data-dir='ordre'] .hl, [data-dir='ordre'] .cd, [data-dir='ordre'] .sw,
[data-dir='ordre'] .skip, [data-dir='ordre'] .ts {
  font: 500 11.5px 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
}
[data-dir='ordre'] .chip { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid currentColor; padding: 3px 7px 2px; color: var(--ink); }
[data-dir='ordre'] .chip.ban { color: var(--warn); }
[data-dir='ordre'] .chip.inv { color: var(--own); }
/* Entry */
[data-dir='ordre'] .entry { --y0: 268px; --y1: 108px; --s1: .56; }
[data-dir='ordre'] .entry .vig { background: var(--grain), radial-gradient(ellipse 70% 64% at 50% 46%, rgba(17,19,15,.1) 0%, rgba(17,19,15,.6) 72%, #11130f 100%); }
[data-dir='ordre'] .entry .title { font: 800 168px/1 'Big Shoulders Stencil', sans-serif; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); }
[data-dir='ordre'] .entry .title .l { opacity: min(1, calc(var(--p) * 5)); transform: scale(calc(1 + (1 - var(--p)) * .16)); transform-origin: 50% 60%; }
[data-dir='ordre'] .entry .title .sp { display: inline-block; width: .32em; }
[data-dir='ordre'] .entry .gate { left: 50%; top: 318px; width: 500px; margin-left: -250px; }
[data-dir='ordre'] .entry .gate.sheet { top: 250px; display: grid; gap: 12px; padding: 22px 24px 24px; background: rgba(28,31,26,.94); border: 1px solid var(--line); }

[data-dir='ordre'] .field .hint { color: var(--dim); }
[data-dir='ordre'] .go { align-self: stretch; margin: -1px -1px -1px 0; padding: 0 26px; background: var(--ink); color: var(--bg); font: 800 22px 'Big Shoulders Stencil', sans-serif; letter-spacing: .06em; text-transform: uppercase; }

/* Sheet furniture: the header strip */

[data-dir='ordre'] .crop span { position: absolute; left: 0; top: -22px; font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
/* Main: numbered paragraphs */
[data-dir='ordre'] .play { padding: 34px 0 0 104px; width: 640px; }

/* =============================================================================================
   IV · RASTER: the Swiss grid. One grotesque (Archivo) in two weights, a 12-column grid with
   56 px margins and 24 px gutters, flush left, rules instead of boxes, numbers as structure.
   Paper, black, the two sides' blue and red, nothing else. The opening scene is the black cover.
   ============================================================================================= */
[data-dir='raster'] {
  --bg: #f2f1ed; --ink: #111111; --dim: #595957; --line: #111111; --own: #1f4fe0; --enemy: #c41c13;
  --warn: #9c5a00; --focus: #1f4fe0;
  --f-display: Archivo, sans-serif; --f-text: Archivo, sans-serif; --f-num: Archivo, sans-serif; --fs: 16px;
  --h-empty: #f2f1ed; --h-casing: transparent; --h-cw: 0; --h-edge: #111; --h-ew: 4;
  --t-road: #111; --t-neutral: #111; --sg-k: #f2f1ed;
  --col: 75.33px; --gut: 24px;
  letter-spacing: -.005em;
}
[data-dir='raster'] .kicker, [data-dir='raster'] .label, [data-dir='raster'] .lab, [data-dir='raster'] .tbl th, [data-dir='raster'] .facts dt,
[data-dir='raster'] .stats dt, [data-dir='raster'] .sl, [data-dir='raster'] .sec, [data-dir='raster'] .hl, [data-dir='raster'] .cd, [data-dir='raster'] .sw,
[data-dir='raster'] .ts {
  font: 600 13px Archivo, sans-serif; letter-spacing: 0; color: var(--dim);
}
[data-dir='raster'] .chip { font: 600 12px Archivo, sans-serif; background: var(--ink); color: var(--bg); padding: 3px 7px; }
[data-dir='raster'] .chip.ban { background: var(--warn); }
[data-dir='raster'] .chip.inv { background: var(--own); color: #fff; }
/* Entry: the black cover */
[data-dir='raster'] .entry { --bg: #0b0b0b; --ink: #f2f1ed; --dim: #a6a6a2; --focus: #f2f1ed; --sg-k: #0b0b0b; --y0: 300px; --y1: 70px; --s1: .5; --ta: left; --to: 0 0; background: #0b0b0b; }
[data-dir='raster'] .entry .vig { background: var(--grain), linear-gradient(90deg, rgba(11,11,11,.92) 0%, rgba(11,11,11,.55) 44%, rgba(11,11,11,0) 70%); opacity: var(--m); }
[data-dir='raster'] .entry .title { left: 50px; right: auto; font: 800 172px/1 Archivo, sans-serif; letter-spacing: -.05em; color: var(--ink); }
[data-dir='raster'] .entry .title .l { opacity: clamp(0, calc((var(--p) - .4) * 1000), 1); }
[data-dir='raster'] .entry .title .l.cut::after { content: ''; position: absolute; left: 0; right: 0; top: .2em; bottom: .14em; background: var(--ink); opacity: clamp(0, calc((.4 - var(--p)) * 1000), 1); }
[data-dir='raster'] .entry .title .sp { display: inline-block; width: .24em; }
[data-dir='raster'] .entry .gate { left: 56px; top: 236px; width: 472px; }
[data-dir='raster'] .entry .gate.sheet { top: 220px; display: grid; gap: 18px; }
[data-dir='raster'] .formh { font: 800 40px/1 Archivo, sans-serif; letter-spacing: -.03em; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
[data-dir='raster'] .lab { color: var(--dim); }
[data-dir='raster'] .field .box { border-bottom: 2px solid var(--ink); }
[data-dir='raster'] .field input { font: 500 34px Archivo, sans-serif; letter-spacing: -.02em; padding: 4px 0 8px; }
[data-dir='raster'] .sheet .field input { font-size: 24px; }
[data-dir='raster'] .field .msg { color: var(--warn); font-weight: 600; font-size: 14px; }
[data-dir='raster'] .entry .field .msg { color: #f0a63a; }
[data-dir='raster'] .field .hint { color: var(--dim); font-size: 14px; }
[data-dir='raster'] .go { align-self: end; height: 52px; padding: 0 22px; margin: 0 0 6px 16px; background: var(--ink); color: var(--bg); font: 700 18px Archivo, sans-serif; }
[data-dir='raster'] .go::after { content: '→'; margin-left: 12px; }
[data-dir='raster'] .gate .alt { gap: 28px; margin-top: 22px; }
[data-dir='raster'] .gate .small { font: 600 15px Archivo, sans-serif; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
[data-dir='raster'] .invited { margin-bottom: 18px; }
[data-dir='raster'] .skip { font: 600 13px Archivo, sans-serif; color: var(--dim); right: 56px; bottom: 40px; }
/* Buttons */
[data-dir='raster'] .cta { height: 48px; padding: 0 20px; background: var(--ink); color: var(--bg); font: 700 16px Archivo, sans-serif; justify-content: space-between; }

[data-dir='raster'] .cta:hover { background: var(--own); }
[data-dir='raster'] .cta .helm { --h-empty: #111; --h-edge: #f2f1ed; }
[data-dir='raster'] .btn { height: 44px; padding: 0 16px; box-shadow: inset 0 0 0 2px var(--ink); font: 600 15px Archivo, sans-serif; }
[data-dir='raster'] .btn.sm, [data-dir='raster'] .cta.sm { height: 30px; padding: 0 10px; font-size: 13px; }
[data-dir='raster'] .lnk { font-weight: 600; text-decoration-thickness: 2px; }
[data-dir='raster'] .danger { color: var(--enemy); box-shadow: inset 0 0 0 2px currentColor; }
[data-dir='raster'] .lnk.danger { box-shadow: none; }
[data-dir='raster'] .cta.danger { background: var(--enemy); color: #fff; box-shadow: none; }
/* Bar */

[data-dir='raster'] .brand { font: 800 21px Archivo, sans-serif; letter-spacing: -.03em; width: calc(3 * var(--col) + 2 * var(--gut)); }
[data-dir='raster'] .tabs { margin-left: var(--gut); gap: 0; align-self: stretch; }
[data-dir='raster'] .tab { display: flex; align-items: center; width: calc(var(--col) * 1.5 + var(--gut)); font: 500 16px Archivo, sans-serif; position: relative; }

[data-dir='raster'] .acct { gap: 10px; }
[data-dir='raster'] .acct .nick { font: 700 16px Archivo, sans-serif; }

[data-dir='raster'] .acct .st2 { display: none; }
/* The map as a diagram in columns 7-12 */
[data-dir='raster'] [data-bg='map'] .bgmap { clip-path: inset(120px 56px 56px 652px); }

[data-dir='raster'] .result .bgmap { display: none; }

[data-dir='raster'] .scr:has(.dock)::after, [data-dir='raster'] .result::after { display: none; }
[data-dir='raster'] .mapcap { position: absolute; left: 652px; top: 130px; display: grid; font-size: 13px; z-index: 2; background: var(--bg); padding: 0 12px 8px 0; }
[data-dir='raster'] .mapcap b { font-weight: 800; font-size: 15px; }
[data-dir='raster'] .mapcap span { color: var(--dim); }
/* Main */
[data-dir='raster'] .play { padding: 48px 0 0 56px; width: calc(56px + 5 * var(--col) + 4 * var(--gut)); }

[data-dir='raster'] .cta.big { width: calc(5 * var(--col) + 4 * var(--gut)); height: 128px; align-items: flex-end; padding: 0 22px 16px; gap: 18px; font: 800 84px/1 Archivo, sans-serif; letter-spacing: -.05em; justify-content: flex-start; }
[data-dir='raster'] .cta.big .helm { align-self: flex-start; margin-top: 16px; }
[data-dir='raster'] .cta.big::after { margin-left: auto; font-size: 44px; font-weight: 500; margin-bottom: 10px; }
[data-dir='raster'] .sub { margin-top: 10px; color: var(--dim); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
[data-dir='raster'] .modes { margin-top: 44px; counter-reset: m; border-bottom: 1px solid var(--ink); }
[data-dir='raster'] .modes li { counter-increment: m; border-top: 1px solid var(--ink); }
[data-dir='raster'] .modes li:first-child { border-top-width: 2px; }
[data-dir='raster'] .modes .mode { grid-template-columns: calc(var(--col) + var(--gut)) 1fr; padding: 12px 0 14px; }
[data-dir='raster'] .modes .mode::before { content: counter(m, decimal-leading-zero); grid-row: span 2; font: 600 13px Archivo, sans-serif; padding-top: 6px; }
[data-dir='raster'] .modes .mt { font: 700 26px/1.2 Archivo, sans-serif; letter-spacing: -.02em; }
[data-dir='raster'] .modes .md { color: var(--dim); font-size: 15px; }
[data-dir='raster'] .modes .mode:hover .mt { color: var(--own); }
[data-dir='raster'] .tagline { position: absolute; left: 56px; bottom: 56px; width: calc(5 * var(--col) + 4 * var(--gut)); font: 500 15px Archivo, sans-serif; color: var(--dim); }
[data-dir='raster'] .play > .notice { margin-bottom: 18px; }
[data-dir='raster'] .notice { font-weight: 600; }
[data-dir='raster'] .notice.err .sg { color: var(--enemy); }
[data-dir='raster'] .hint { color: var(--dim); font-size: 14px; }
/* Queue, loading */
[data-dir='raster'] .queue, [data-dir='raster'] .body.center { padding: 48px 0 0 56px; }
[data-dir='raster'] .lead.center { display: grid; justify-items: start; gap: 10px; width: calc(5 * var(--col) + 4 * var(--gut)); }
[data-dir='raster'] .lead.center h2 { font: 800 64px/1 Archivo, sans-serif; letter-spacing: -.04em; }
[data-dir='raster'] .clock { font: 800 230px/.85 Archivo, sans-serif; letter-spacing: -.06em; margin-left: -10px; }
[data-dir='raster'] .lead.center .sub { margin-top: 0; }
[data-dir='raster'] .offer { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 2px solid var(--ink); width: 100%; }
[data-dir='raster'] .versus { font: 700 26px Archivo, sans-serif; letter-spacing: -.02em; margin: 6px 0; }
[data-dir='raster'] .vs-x { font-weight: 500; font-size: 15px; color: var(--dim); }
/* Dock: columns 1-3 and 4-12 */
[data-dir='raster'] .dock { display: grid; grid-template-columns: calc(3 * var(--col) + 2 * var(--gut)) 1fr; column-gap: var(--gut); padding: 40px 56px 0; }
[data-dir='raster'] .rail .cta.big { width: 100%; height: 64px; font-size: 34px; padding: 0 14px 10px; gap: 12px; background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }

[data-dir='raster'] .rail .cta.big .helm { --h-empty: #f2f1ed; --h-edge: #111; margin-top: 10px; }
[data-dir='raster'] .rail .modes { margin-top: 28px; }
[data-dir='raster'] .rail .modes .mode { grid-template-columns: 44px 1fr; padding: 10px 0 11px; }
[data-dir='raster'] .rail .modes .mode::before { grid-row: auto; padding-top: 4px; }
[data-dir='raster'] .rail .modes .mt { font-size: 19px; color: var(--dim); }
[data-dir='raster'] .rail .mode[aria-current] .mt { color: var(--ink); font-weight: 800; }
[data-dir='raster'] .panel { border-top: 2px solid var(--ink); padding-top: 14px; }
[data-dir='raster'] .dhead { display: grid; grid-template-columns: 1fr auto; align-items: end; }
[data-dir='raster'] .dhead .kicker { grid-column: 1 / -1; }
[data-dir='raster'] .dhead h2 { font: 800 52px/1 Archivo, sans-serif; letter-spacing: -.04em; margin-top: 6px; }
[data-dir='raster'] .dhead .chips { display: flex; gap: 6px; margin-bottom: 6px; }
[data-dir='raster'] .dhead .sub { grid-column: 1 / -1; margin-top: 6px; }
[data-dir='raster'] .levels { margin-top: 18px; grid-template-columns: repeat(4, 1fr); column-gap: var(--gut); }

[data-dir='raster'] .maps .label { margin: 16px 0 8px; }

[data-dir='raster'] .tile[aria-checked='true'] .thumb { box-shadow: inset 0 0 0 3px var(--ink); }
[data-dir='raster'] .tile .tl { font: 700 14px Archivo, sans-serif; margin-top: 5px; }
[data-dir='raster'] .tile .ts { font-weight: 500; font-size: 12px; }
[data-dir='raster'] .note { color: var(--dim); font-size: 13px; }
[data-dir='raster'] .panel .acts { margin-top: 20px; }
[data-dir='raster'] .link { margin-top: 26px; width: 100%; }
[data-dir='raster'] .link input { font-size: 22px; }
[data-dir='raster'] .link .btn { margin: 0 0 6px 16px; }
[data-dir='raster'] .seats { margin: 30px 0 16px; gap: var(--gut); }
[data-dir='raster'] .seat { border-top: 2px solid var(--ink); padding-top: 12px; min-width: 300px; }

/* In-game */

[data-dir='raster'] .selcard { right: 56px; bottom: 56px; width: 300px; padding: 12px 16px 16px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--ink); }

/* =============================================================================================
   V · NOCTURNE: restrained dark strategy, the nearest to the game today. The real map in its own
   colours, quietened, fills the screen; the interface is solid graphite panels with hairlines.
   A high-contrast Didone (Bodoni Moda) for the title, verdicts and big numbers; Public Sans for
   everything else. No glass, no glow: panels are opaque.
   ============================================================================================= */
[data-dir='nocturne'] {
  --bg: #0f1215; --bg2: #151a1f; --ink: #ebe6db; --dim: #a1a8af; --line: #2a3139; --own: #5b9bff; --enemy: #ef5b5f;
  --warn: #ffb020; --focus: #ebe6db;
  --f-display: 'Bodoni Moda', serif; --f-text: 'Public Sans', sans-serif; --f-num: 'Public Sans', sans-serif; --fs: 15.5px;
  --h-empty: #1b2229; --h-casing: #0b0e11; --h-cw: 9; --h-edge: #f0f6fc; --h-ew: 3;
  --t-road: #4a535c; --t-neutral: #8b949e; --sg-k: #0f1215;
}
[data-dir='nocturne'] .kicker, [data-dir='nocturne'] .label, [data-dir='nocturne'] .lab, [data-dir='nocturne'] .tbl th, [data-dir='nocturne'] .facts dt,
[data-dir='nocturne'] .stats dt, [data-dir='nocturne'] .sl, [data-dir='nocturne'] .sec, [data-dir='nocturne'] .hl, [data-dir='nocturne'] .cd, [data-dir='nocturne'] .sw,
[data-dir='nocturne'] .skip, [data-dir='nocturne'] .ts {
  font: 600 11px 'Public Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
[data-dir='nocturne'] .chip { font: 600 10.5px 'Public Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; background: #222a32; color: var(--ink); }
[data-dir='nocturne'] .chip.ban { color: var(--warn); background: rgba(255,176,32,.12); }
[data-dir='nocturne'] .chip.inv { color: var(--own); background: rgba(91,155,255,.14); }
/* Entry */
[data-dir='nocturne'] .entry { --y0: 300px; --y1: 140px; --s1: .62; }
[data-dir='nocturne'] .entry .vig { background: var(--grain), radial-gradient(ellipse 66% 58% at 50% 44%, rgba(7,9,11,.35) 0%, rgba(7,9,11,.72) 68%, #07090b 100%); }
[data-dir='nocturne'] .entry .title { font: 500 124px/1.1 'Bodoni Moda', serif; letter-spacing: .005em; color: var(--ink); }
[data-dir='nocturne'] .entry .title .w + .sp + .w { font-style: italic; }
[data-dir='nocturne'] .entry .title .l { transform: translateX(calc((var(--i, 6) - 6) * (1 - var(--p)) * 7px)); }
[data-dir='nocturne'] .entry .title .sp { display: inline-block; width: .26em; }
[data-dir='nocturne'] .entry .gate { left: 50%; top: 318px; width: 440px; margin-left: -220px; }
[data-dir='nocturne'] .entry .gate.sheet { top: 270px; display: grid; gap: 16px; padding: 28px 30px 30px; background: var(--bg2); border: 1px solid var(--line); }

[data-dir='nocturne'] .field .box { border-bottom: 1px solid #56606a; }

[data-dir='nocturne'] .field input { font: 400 22px 'Public Sans', sans-serif; padding: 6px 0 10px; }

/* Buttons */

/* Bar */

[data-dir='nocturne'] .body { top: 64px; }

[data-dir='nocturne'] .notice.err .sg { color: var(--enemy); }
[data-dir='nocturne'] .hint { color: var(--dim); font-size: 13px; }
/* Queue, loading: a panel centred over the map */
[data-dir='nocturne'] .queue, [data-dir='nocturne'] .body.center { display: grid; place-items: center; }
[data-dir='nocturne'] .lead.center { display: grid; justify-items: center; text-align: center; gap: 12px; width: 520px; padding: 40px 48px 42px; background: var(--bg); border: 1px solid var(--line); }
