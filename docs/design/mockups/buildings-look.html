<title>Barracks and factory look</title>
<!-- Barracks and factory look, design stage 1 (#1065, Refs #1055). The owner split the work into three
     stages (2026-11-15): (1) the look of the barracks and the factory on the map, (2) the build
     animation, (3) recruiting in the barracks. This page is stage 1, the look alone: no build
     progress and no recruit queue; the only motion is the hover and the selection.
     The ground is the real client: frames of the dev scene `provinces` on the pool map `crossroads`
     (near 2.2, normal 1.0 and far 0.52 css px per world unit, 1280 x 760 css px at device pixel
     ratio 2). Each frame was taken twice: with the client's buildings gated off (`?gate=`), the
     ground every variant is drawn on, and with them on, which is T0 as the client draws it today.
     Every mark of a variant is drawn among the client's own unchanged cities, roads, names, VP
     lozenges and store rows, own and the opponent's, with the client's numbers (render/style.ts,
     theme/cutIcons.ts: the city radial menu's own barracks and factory). What a variant shows comes
     from the view only: has_barracks and factory of own cities, and of an opponent's city joined by
     a road to an own node (DEC-31). Self-contained: EB Garamond (SIL OFL) from
     assets/in-match-cp-vp/fonts/, the frames from assets/buildings-look/. State in the address
     (#v=A&z=normal&blind=0). -->
<style>
@font-face{font-family:'EB Garamond';src:url(assets/in-match-cp-vp/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
:root{--stone:#16130f;--panel:#1d1a15;--ink:#ece4d1;--ink-soft:#cfc4ab;--ink-dim:#ada38f;--rule:#7d7363;--line:#3d372d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--stone);color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--stone);padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font:600 20px/1 'EB Garamond',Georgia,serif;letter-spacing:.04em;margin:0 8px 0 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:9px}
.bar:first-child{margin-top:0}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lab{font:600 12px/1 'EB Garamond',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-right:3px}
button.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:6px 10px;font:500 13px/1 system-ui,sans-serif;cursor:pointer;border-radius:0;min-height:30px}
button.chip:hover{border-color:var(--rule);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:#16130f;border-color:var(--ink);font-weight:650}
button.chip .k{opacity:.7;margin-right:5px;font-weight:700}
button.chip.var{padding:7px 11px;font-size:14px}
button.chip.ref{border-style:dashed}
button.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#more{margin-left:auto}
.moreBar{display:none;padding-top:9px;margin-top:9px;border-top:1px solid var(--line)}
.moreBar.open{display:flex}
main{padding:10px 16px 24px}
#cap{margin:0 0 8px;font:500 16px/1.35 'EB Garamond',Georgia,serif;color:var(--ink-soft);max-width:1180px;min-height:2.7em}
#cap b{color:var(--ink);font-weight:650;margin-right:8px}
#cap .st{display:block;color:var(--ink-dim);font-size:15px}
.wrap{position:relative;background:#0b0a08;border:1px solid var(--line);overflow:hidden;max-width:1280px}
canvas{display:block;width:100%}
#view:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
#view{cursor:default}
.gray .wrap,.gray #sheet{filter:grayscale(1)}
#sheet{display:none;max-width:1280px}
.blind #sheet{display:grid;grid-template-columns:repeat(auto-fill,242px);gap:10px}
.blind #rWrap{display:none}
.tile{position:relative;border:1px solid var(--line);background:#0b0a08}
.tile canvas{width:240px;height:180px}
.tile .no{position:absolute;left:6px;top:5px;font:700 15px/1 'EB Garamond',Georgia,serif;color:var(--ink);background:#0e0c09d9;padding:3px 6px;border:1px solid var(--line)}
.tile .key{display:none;position:absolute;right:6px;bottom:5px;font:500 13px/1 system-ui,sans-serif;color:var(--ink);background:#0e0c09e6;padding:3px 6px;border:1px solid var(--line)}
.showkey .tile .key{display:block}
#keyBtn{display:none}
.blind #keyBtn{display:inline-block}
</style>

let GA = 1, PXW = 1, LS = 1;

function stroke(ctx, w, color, alpha = 1, cap = 'round', join = 'round') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha * GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(); ctx.globalAlpha = GA; }
function fill(ctx, color, alpha = 1) { ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, alpha * GA); ctx.fill(); ctx.globalAlpha = GA; }
function strokeP(ctx, p, w, color, alpha = 1, cap = 'square', join = 'miter') { ctx.lineWidth = w; ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, alpha * GA); ctx.lineCap = cap; ctx.lineJoin = join; ctx.stroke(p); ctx.globalAlpha = GA; }

    ctx.beginPath(); ctx.moveTo(cx + sx * arm, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + sy * arm);
    stroke(ctx, TICKS.casing / s, C.casing, 0.95 * grow, 'square', 'miter');
    ctx.beginPath(); ctx.moveTo(cx + sx * arm, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + sy * arm);
    stroke(ctx, hair(TICKS.ink * 0.85 / s), C.ivory, 0.9 * grow, 'butt', 'miter');
  }
}
/** The map tip (Leader, ui-style 63): an ink leader with a lozenge foot, a plate in a double rule. */
function leaderTip(ctx, px, py, text, W, H) {
  ctx.font = "600 15px 'EB Garamond', Georgia, serif";
  const w = Math.ceil(ctx.measureText(text).width) + 22, h = 26, x = Math.min(W - w - 6, px + 22), y = Math.max(6, py - 44);
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y + h); stroke(ctx, 3, C.casing, 0.9, 'butt'); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y + h); stroke(ctx, 1, C.ink, 1, 'butt');
  lozPath(ctx, px, py, 6); fill(ctx, C.casing); lozPath(ctx, px, py, 3.6); fill(ctx, C.ink);
  ctx.beginPath(); ctx.rect(x - 1.5, y - 1.5, w + 3, h + 3); fill(ctx, C.casing, 0.9); ctx.beginPath(); ctx.rect(x, y, w, h); fill(ctx, C.plate, 0.96);
  ctx.beginPath(); ctx.rect(x + 0.5, y + 0.5, w - 1, h - 1); stroke(ctx, 1, C.ink, 0.85, 'butt', 'miter');
  ctx.beginPath(); ctx.rect(x + 3.5, y + 3.5, w - 7, h - 7); stroke(ctx, 1, C.ink, 0.25, 'butt', 'miter');
  ctx.fillStyle = C.ivory; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + 11, y + h / 2 + 1);
}

// =============================================================================================
// State, frames, drawing.
// =============================================================================================
const P = { v: 'A', z: 'normal', blind: false, key: false, labels: false, gray: false, still: false, sel: null, hover: null, hoverAt: 0 };
const IMG = {};
const SRC = { near: 'assets/buildings-look/near.webp', normal: 'assets/buildings-look/normal.webp', far: 'assets/buildings-look/far.webp', 'near-t0': 'assets/buildings-look/near-t0.webp', 'normal-t0': 'assets/buildings-look/normal-t0.webp', 'far-t0': 'assets/buildings-look/far-t0.webp' };
const W = 1280, H = 760, DPR = 2;
const view = document.getElementById('view');
view.width = W * DPR; view.height = H * DPR;
let HITS = [];

function toScreen(z, p) { const [cx, cy, s] = MAP.cams[z]; return { x: (p.x - cx) * s + W / 2, y: (p.y - cy) * s + H / 2 }; }
function toWorld(z, p) { const [cx, cy, s] = MAP.cams[z]; return { x: (p.x - W / 2) / s + cx, y: (p.y - H / 2) / s + cy }; }
function worldTransform(ctx, z, dpr, ox = 0, oy = 0) { const [cx, cy, s] = MAP.cams[z]; ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (W / 2 - cx * s - ox), dpr * (H / 2 - cy * s - oy)); PXW = dpr * s; LS = 1; }

/** Draws the buildings of city `c` (its `kinds`) in variant `v` at zoom `z`; returns the hit boxes. */
function drawCity(ctx, v, c, kinds, z, o = {}) {
  const V = VARIANTS[v], s = MAP.cams[z][2], hits = [];
  if (!V.seats) return hits;
  const all = ['barracks', 'factory'], seat = V.seats(c, o.seats ? all : kinds, s);
  if (o.seats) for (const kind of all) if (!kinds.includes(kind) && seat.at[kind]) drawIcon(ctx, kind, seat.at[kind].x, seat.at[kind].y, seat.sz, { look: 'seat', casing: V.look.casing });
  if (v === 'E') {
    const sites = kinds.map((k) => seat.at[k]).filter(Boolean);
    if (sites.length) footpath(ctx, c, { x: sites.reduce((a, p) => a + p.x, 0) / sites.length, y: sites.reduce((a, p) => a + p.y, 0) / sites.length }, sites.length > 1 ? seat.sz * 0.5 : seat.sz);
  }
  for (const kind of kinds) {
    const p = seat.at[kind]; if (!p) continue;
    drawIcon(ctx, kind, p.x, p.y, seat.sz, { ...V.look, side: c.side, color: c.color });
    hits.push({ id: c.id, kind, box: iconBox(kind, p.x, p.y, seat.sz) });
  }
  return hits;
}

function draw() {
  const ctx = view.getContext('2d'), z = P.z, v = P.v, s = MAP.cams[z][2];
  ctx.setTransform(1, 0, 0, 1, 0, 0); GA = 1; ctx.globalAlpha = 1;
  const img = IMG[v === 'T0' ? z + '-t0' : z];
  ctx.drawImage(img, 0, 0, W * DPR, H * DPR);
  HITS = [];
  if (v !== 'T0') {
    worldTransform(ctx, z, DPR);
    if (P.sel !== null) { const c = city(P.sel); selectRings(ctx, c); redrawMarks(ctx, c); }
    for (const id of SUBJECTS) {
      const c = city(id), kinds = BUILT[id] || [];
      HITS.push(...drawCity(ctx, v, c, kinds, z, { seats: P.sel === id }));
    }
    if (P.hover) {
      const h = HITS.find((x) => x.id === P.hover.id && x.kind === P.hover.kind);
      if (h) hoverTicks(ctx, h.box, s, P.still ? 1 : easeEngrave((performance.now() - P.hoverAt) / 180));
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); PXW = DPR; LS = 1;
  if (P.labels) for (const id of SUBJECTS) {
    const c = city(id), p = toScreen(z, { x: c.x, y: c.y - c.R - 16 / s }), t = LABEL[id];
    if (!t || p.x < 0 || p.x > W || p.y < 0 || p.y > H) continue;
    ctx.font = '600 12px system-ui, sans-serif'; const w = ctx.measureText(t).width + 10;
    ctx.beginPath(); ctx.rect(p.x - w / 2, p.y - 18, w, 16); fill(ctx, '#ece4d1', 0.92);
    ctx.fillStyle = '#16130f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, p.x, p.y - 10);
  }
  if (P.hover && v !== 'T0') {
    const h = HITS.find((x) => x.id === P.hover.id && x.kind === P.hover.kind);
    if (h) { const p = toScreen(z, { x: (h.box.x0 + h.box.x1) / 2, y: h.box.y0 }); leaderTip(ctx, p.x, p.y - 3, h.kind === 'barracks' ? 'Barracks' : 'Factory', W, H); }
  }
  view.setAttribute('aria-label', `${VARIANTS[v].label} at the ${z} zoom: own cities Nexus (the capital, both), Lindenwood (a factory), Freehold (a barracks), Middle Court (both, five roads), White Spring and Lodge (none); the opponent's Fairgate (both, seen under DEC-31) and Sentinel (not known).`);
  if (P.hover && !P.still && performance.now() - P.hoverAt < 200) requestAnimationFrame(draw);
}

// ----- The blind check: one city per tile at the normal zoom, true size, unlabelled, shuffled. -----
const CASES = [
  { id: 16, kinds: ['barracks', 'factory'], key: 'opponent: both' },
  { id: 1, kinds: ['factory'], key: 'own: factory' },
  { id: 7, kinds: ['barracks'], key: 'own: barracks (five roads)' },
  { id: 10, kinds: [], key: 'own: none' },
  { id: 6, kinds: ['barracks'], key: 'own: barracks' },
  { id: 16, kinds: ['factory'], key: 'opponent: factory' },
  { id: 7, kinds: ['barracks', 'factory'], key: 'own: both (five roads)' },
  { id: 10, kinds: ['factory'], key: 'own: factory' },
  { id: 16, kinds: ['barracks'], key: 'opponent: barracks' },
  { id: 0, kinds: ['barracks', 'factory'], key: 'own capital: both' },
  { id: 6, kinds: [], key: 'own: none' },
  { id: 1, kinds: ['barracks', 'factory'], key: 'own: both' },
];
// T0 is the client's own frame: only the cases the frame shows.
const T0_CASES = [CASES[0], CASES[1], CASES[3], CASES[4], CASES[6], CASES[9]];
const TW = 240, TH = 180;
function buildSheet() {
  const sheet = document.getElementById('sheet'); sheet.textContent = '';
  const v = P.v, base = v === 'T0' ? T0_CASES : CASES, list = base.slice();
  // A fixed shuffle per variant, so one sheet does not give away another.
  let seed = [...(v + '2')].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7);
  for (let i = list.length - 1; i > 0; i--) { seed = (seed * 1103515245 + 12345) % 2147483648; const j = seed % (i + 1); [list[i], list[j]] = [list[j], list[i]]; }
  list.forEach((cs, i) => {
    const t = document.createElement('div'); t.className = 'tile'; t.setAttribute('role', 'listitem');
    const cv = document.createElement('canvas'); cv.width = TW * DPR; cv.height = TH * DPR; cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', `Tile ${i + 1}`);
    const no = document.createElement('span'); no.className = 'no'; no.textContent = String(i + 1);
    const key = document.createElement('span'); key.className = 'key'; key.textContent = cs.key;
    t.append(cv, no, key); sheet.append(t);
    const c = city(cs.id), sp = toScreen('normal', { x: c.x, y: c.y + 14 }), ox = Math.round(sp.x - TW / 2), oy = Math.round(sp.y - TH / 2);
    const ctx = cv.getContext('2d'); GA = 1;
    ctx.drawImage(IMG[v === 'T0' ? 'normal-t0' : 'normal'], ox * DPR, oy * DPR, TW * DPR, TH * DPR, 0, 0, TW * DPR, TH * DPR);
    if (v !== 'T0') {
      // Only the subject city carries buildings here; its neighbours show none.
      const [cx, cy, s] = MAP.cams.normal;
      ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cx * s - ox), DPR * (H / 2 - cy * s - oy)); PXW = DPR * s; LS = 1;
      drawCity(ctx, v, c, cs.kinds, 'normal');
    }
  });
}

// ----- Controls -----
function caption() {
  const V = VARIANTS[P.v], cap = document.getElementById('cap');
  cap.textContent = '';
  const b = document.createElement('b'); b.textContent = V.label; cap.append(b, document.createTextNode(V.blurb));
  const st = document.createElement('span'); st.className = 'st';
  st.textContent = P.blind ? 'Blind check: which buildings does each city have, and whose is it? Answer before Show answers.' : (P.v === 'T0' ? V.stages : V.stages + ' Click an own city (or Enter on the map) to see where its missing buildings would stand.');
  cap.append(st);
}
function sync() {
  document.querySelectorAll('#vars button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === P.v)));
  document.querySelectorAll('[data-z]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.z === P.z)));
  for (const [id, on] of [['blind', P.blind], ['keyBtn', P.key], ['labels', P.labels], ['gray', P.gray], ['still', P.still]]) document.getElementById(id).setAttribute('aria-pressed', String(on));
  document.body.classList.toggle('blind', P.blind); document.body.classList.toggle('showkey', P.key); document.body.classList.toggle('gray', P.gray);
  history.replaceState(null, '', `#v=${P.v}&z=${P.z}&blind=${P.blind ? 1 : 0}${P.key ? '&key=1' : ''}${P.labels ? '&labels=1' : ''}${P.gray ? '&gray=1' : ''}${P.sel !== null ? '&sel=' + P.sel : ''}`);
  caption();
  if (P.blind) buildSheet(); else draw();
}
const vars = document.getElementById('vars');
for (const id of ORDER) {
  const b = document.createElement('button'); b.className = 'chip var' + (VARIANTS[id].ref ? ' ref' : ''); b.dataset.v = id;
  const k = document.createElement('span'); k.className = 'k'; k.textContent = id; b.append(k, document.createTextNode(VARIANTS[id].label.replace(/^\S+\s/, '')));
  b.addEventListener('click', () => { P.v = id; P.hover = null; sync(); }); vars.append(b);
}
document.querySelectorAll('[data-z]').forEach((b) => b.addEventListener('click', () => { P.z = b.dataset.z; P.hover = null; sync(); }));
document.getElementById('blind').addEventListener('click', () => { P.blind = !P.blind; P.key = false; sync(); });
document.getElementById('keyBtn').addEventListener('click', () => { P.key = !P.key; sync(); });
document.getElementById('labels').addEventListener('click', () => { P.labels = !P.labels; sync(); });
document.getElementById('gray').addEventListener('click', () => { P.gray = !P.gray; sync(); });
document.getElementById('still').addEventListener('click', () => { P.still = !P.still; sync(); });
document.getElementById('more').addEventListener('click', (e) => { const bar = document.getElementById('moreBar'), open = !bar.classList.contains('open'); bar.classList.toggle('open', open); e.currentTarget.setAttribute('aria-expanded', String(open)); });
function local(e) { const r = view.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
view.addEventListener('mousemove', (e) => {
  if (P.v === 'T0') return;
  const w = toWorld(P.z, local(e)), h = HITS.find((x) => w.x >= x.box.x0 && w.x <= x.box.x1 && w.y >= x.box.y0 && w.y <= x.box.y1) || null;
  const same = (h && P.hover && h.id === P.hover.id && h.kind === P.hover.kind) || (!h && !P.hover);
  view.style.cursor = h ? 'pointer' : 'default';
  if (!same) { P.hover = h ? { id: h.id, kind: h.kind } : null; P.hoverAt = performance.now(); draw(); }
});
// Keyboard: Enter selects the next own city (the selection shows where the missing buildings would
// stand), Escape clears it.
view.addEventListener('keydown', (e) => {
  if (P.v === 'T0') return;
  const own = SUBJECTS.filter((id) => { const q = toScreen(P.z, NODES.get(id)); return OWNED.has(id) && q.x > 20 && q.x < W - 20 && q.y > 20 && q.y < H - 40; });
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const i = own.indexOf(P.sel); P.sel = own[(i + 1) % own.length]; sync(); }
  else if (e.key === 'Escape' && P.sel !== null) { P.sel = null; sync(); }
});
view.addEventListener('mouseleave', () => { if (P.hover) { P.hover = null; draw(); } });
view.addEventListener('click', (e) => {
  if (P.v === 'T0') return;
  const w = toWorld(P.z, local(e));
  let pick = null; for (const id of SUBJECTS) { const c = city(id); if (c.side === 'own' && Math.hypot(w.x - c.x, w.y - c.y) < c.R + 6) pick = id; }
  P.sel = pick === P.sel ? null : pick; sync();
});
matchMedia('(prefers-reduced-motion: reduce)').matches && (P.still = true);
const q = new URLSearchParams(location.hash.slice(1));
if (VARIANTS[q.get('v')]) P.v = q.get('v');
if (['near', 'normal', 'far'].includes(q.get('z'))) P.z = q.get('z');
P.blind = q.get('blind') === '1'; P.key = q.get('key') === '1'; P.labels = q.get('labels') === '1'; P.gray = q.get('gray') === '1';
if (q.get('sel') !== null && OWNED.has(Number(q.get('sel')))) P.sel = Number(q.get('sel'));
Promise.all([...Object.entries(SRC).map(([k, src]) => new Promise((ok, no) => { const i = new Image(); i.onload = () => { IMG[k] = i; ok(); }; i.onerror = no; i.src = src; })), document.fonts.load("600 15px 'EB Garamond'")])
  .then(() => { sync(); document.body.dataset.ready = '1'; });
</script>
</body>
</html>
