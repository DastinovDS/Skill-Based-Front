<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Приказы, бой на карте и арена в новом стиле карты</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;--text:#e6edf3;--dim:#9da7b3;--you:#5b9bff;--enemy:#e5484d;--warn:#ffb020;--ok:#3fb950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
header{position:sticky;top:0;z-index:5;padding:8px 16px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
.row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.row+.row{margin-top:8px}
h1{font-size:16px;margin:0 6px 0 0}
.blk{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid transparent;border-radius:10px}
.blk.act{border-color:var(--you);background:#0f1b2e}
.blk>b{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg label{position:relative;padding:5px 10px;cursor:pointer;background:var(--surface2);border-right:1px solid var(--border);white-space:nowrap;font-size:13px}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:#0d1117;background:var(--you);margin:-5px -10px;padding:5px 10px;display:block}
.seg input:focus-visible+span{outline:2px solid #f0f6fc;outline-offset:-2px}
.tabs .seg label{font-size:14px;padding:6px 12px}
.tabs .seg input:checked+span{margin:-6px -12px;padding:6px 12px;background:var(--ok)}
.opt{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
.opt select,.opt input[type=range]{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
.opt input[type=range]{padding:0;width:260px;accent-color:var(--you)}
button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--you)}
.cmp{font-size:12px;color:var(--dim);display:flex;gap:4px;align-items:center;white-space:nowrap}
main{max-width:1800px;margin:0 auto;padding:16px}
#stage{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
figure{margin:0;border:1px solid var(--border);border-radius:8px;overflow:auto;background:#000;max-width:100%}
.fig{position:relative}
.fig svg{display:block;position:absolute;left:0;top:0}
.fig svg.base{position:relative}
figcaption{width:0;min-width:100%;padding:6px 10px;background:var(--surface);color:var(--dim);font-size:13px}
.gray .fig{filter:grayscale(1)}
h2.sec{font-size:15px;margin:22px 0 4px}
.note{color:var(--dim);margin:4px 0 10px;font-size:13px;max-width:1150px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-top:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.card h3{font-size:15px;margin:0 0 6px}
.card dl{margin:0}.card dt{color:var(--dim);font-size:12px;margin-top:8px;text-transform:uppercase;letter-spacing:.04em}.card dd{margin:2px 0 0;font-size:13.5px}
.card.rec{border-color:var(--ok)}
.badge{display:inline-block;font-size:11px;border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:0 7px;margin-left:6px;vertical-align:1px}
.badge.warn{border-color:var(--warn);color:var(--warn)}
code{background:var(--surface2);padding:0 4px;border-radius:4px;font-size:12.5px}
table.t{border-collapse:collapse;font-size:13px;margin:6px 0}
table.t th,table.t td{border:1px solid var(--border);padding:4px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--surface);color:var(--dim);font-weight:600}
table.t td.ok{color:var(--ok)}table.t td.bad{color:var(--enemy)}
.pick{margin-top:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0}
.panel .row{gap:8px 14px}
.panel input[type=number]{width:52px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
.panel label{font-size:13px;color:var(--dim)}
.chk{margin:6px 0;font-size:13px}
.chk.bad{color:var(--enemy)}.chk.good{color:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Приказы, бой, арена: новый стиль (#339)</h1>
    <label class="opt"><input type="checkbox" id="gray"> серая шкала</label>
    <label class="opt"><input type="checkbox" id="rm"> меньше движения (приказы)</label>
    <label class="opt">масштаб карты <select id="sc"><option value="60">60%</option><option value="100" selected>100%</option><option value="200">200%</option></select></label>
    <button id="play" title="пауза и пуск">⏸</button><button id="restart" title="сначала">⏮</button>
    <label class="opt">скорость <select id="speed"><option value="0.25">0,25</option><option value="0.5">0,5</option><option value="1" selected>1</option><option value="2">2</option></select></label>
    <label class="opt"><span id="tlab">0,0 с</span><input type="range" id="scrub" min="0" max="100" step="1" value="0" aria-label="время сцены"></label>
  </div>
  <div class="row tabs" id="tabs"></div>
  <div class="row" id="axes"></div>
</header>
<main>
  <p class="note" id="intro"></p>
  <div id="stage"></div>
  <p class="note" id="stagenote"></p>
  <div id="extra"></div>
  <div class="cards" id="cards"></div>
  <div class="pick" id="pick"></div>
</main>

  let axis = ribbonAxis([origin, target], radiusOf(o.nodes[0]) + RIB.startGap, o.endGap || 0, bend);

// ======================================================================================================
// The shell: scene tabs, axes with variants ("side by side"), the clock, state in the address
// ======================================================================================================
const $ = (s) => document.querySelector(s);
const SCENE_ORDER = { ord: 1, plan: 2, cross: 3, fight: 4, enemy: 5, arena: 6 };
SCENES.sort((a, b) => SCENE_ORDER[a.id] - SCENE_ORDER[b.id]);
const st = { scene: SCENES[0].id, sel: {}, scn: {}, act: '', cmp: '', gray: 0, rm: 0, sc: 100, t: 0, play: 1, speed: 1 };
for (const sc of SCENES) { for (const a of sc.axes) st.sel[a.id] = 0; st.scn[sc.id] = sc.scenarios[0].id; }
const sceneOf = (id) => SCENES.find((s) => s.id === id) || SCENES[0];
const curScene = () => sceneOf(st.scene);
const axisIds = () => SCENES.flatMap((s) => s.axes.map((a) => a.id));

function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  st.scene = sceneOf(q.get('s')).id;
  for (const sc of SCENES) {
    for (const a of sc.axes) st.sel[a.id] = Math.min(a.v.length - 1, Math.max(0, +q.get(a.id) || 0));
    const g = q.get('scn_' + sc.id); st.scn[sc.id] = sc.scenarios.some((x) => x.id === g) ? g : sc.scenarios[0].id;
  }
  const cs = curScene();
  st.act = cs.axes.some((a) => a.id === q.get('act')) ? q.get('act') : cs.axes[0].id;
  st.cmp = cs.axes.some((a) => a.id === q.get('cmp')) ? q.get('cmp') : '';
  for (const k of ['gray', 'rm']) st[k] = q.get(k) === '1' ? 1 : 0;
  st.sc = [60, 100, 200].includes(+q.get('sc')) ? +q.get('sc') : 100;
  st.t = q.has('t') ? Math.max(0, +q.get('t') || 0) : 0;
  st.play = q.get('p') === '1' ? 0 : 1;
  st.speed = [0.25, 0.5, 1, 2].includes(+q.get('v')) ? +q.get('v') : 1;
}
function toHash() {
  const q = new URLSearchParams();
  q.set('s', st.scene);
  for (const sc of SCENES) { for (const a of sc.axes) if (st.sel[a.id]) q.set(a.id, st.sel[a.id]); if (st.scn[sc.id] !== sc.scenarios[0].id) q.set('scn_' + sc.id, st.scn[sc.id]); }
  q.set('act', st.act);
  if (st.cmp) q.set('cmp', st.cmp);
  for (const k of ['gray', 'rm']) if (st[k]) q.set(k, 1);
  if (st.sc !== 100) q.set('sc', st.sc);
  if (!st.play) { q.set('p', 1); q.set('t', f1(st.t)); }
  if (st.speed !== 1) q.set('v', st.speed);
  history.replaceState(null, '', '#' + q);
  return q.toString();
}

let figs = [];
function buildHeader() {
  $('#tabs').innerHTML = `<div class="seg" role="tablist" aria-label="Элемент">${SCENES.map((s) => `<label><input type="radio" name="scene" value="${s.id}"><span>${s.name}</span></label>`).join('')}</div>`;
  $('#tabs').addEventListener('change', (ev) => { if (ev.target.name === 'scene') { st.scene = ev.target.value; const cs = curScene(); st.act = cs.axes[0].id; st.cmp = ''; st.t = 0; render(); } });
  $('#axes').addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.dataset.cmp) { st.cmp = el.checked ? el.dataset.cmp : ''; st.act = el.dataset.cmp; }
    else if (el.name === 'scn') { st.scn[st.scene] = el.value; st.t = 0; }
    else { st.sel[el.name] = +el.value; st.act = el.name; }
    render();
  });
  for (const id of ['gray', 'rm']) $('#' + id).addEventListener('change', (ev) => { st[id] = ev.target.checked ? 1 : 0; render(); });
  $('#sc').addEventListener('change', (ev) => { st.sc = +ev.target.value; render(); });
  $('#speed').addEventListener('change', (ev) => { st.speed = +ev.target.value; toHash(); });
  $('#play').addEventListener('click', () => { st.play = st.play ? 0 : 1; clock.last = null; syncPlay(); toHash(); });
  $('#restart').addEventListener('click', () => { st.t = 0; clock.last = null; frame(); });
  $('#scrub').addEventListener('input', (ev) => { st.t = (+ev.target.value / 100) * curT(); st.play = 0; syncPlay(); frame(); toHash(); });
}
const curT = () => { const sc = curScene(); return typeof sc.T === 'function' ? sc.T(st.scn[sc.id]) : sc.T || 12; };
function syncPlay() { $('#play').textContent = st.play ? '⏸' : '▶'; }

function figHtml(uid, sc, label, o) {
  const I = (s) => s + '_' + uid, zoom = sc.zoom || 1, cr = typeof sc.crop === 'function' ? sc.crop(st.scn[sc.id]) : sc.crop, w = Math.round(cr.w * o.scale * zoom), h = Math.round(cr.h * o.scale * zoom), vb = `${cr.x} ${cr.y} ${cr.w} ${cr.h}`;
  const b = baseLayers(I);
  const svg = (cls, inner) => `<svg class="${cls}" viewBox="${vb}" width="${w}" height="${h}" fill="none" role="img" aria-label="${label}">${inner}</svg>`;
  return `<figure><div class="fig" style="width:${w}px;height:${h}px">${svg('base', `<defs>${b.defs}</defs>${b.body}`)}${svg('du', `<g class="dyn"></g>`)}${svg('fogl', `<defs>${b.fdefs}</defs>${b.fog}${sc.fogOver ? sc.fogOver(I) : ''}`)}${svg('do', `<g class="dyn"></g>`)}</div><figcaption>${label}</figcaption></figure>`;
}
function render() {
  const sc = curScene(), cs = sc.axes;
  if (!cs.some((a) => a.id === st.act)) st.act = cs[0].id;
  $('#tabs').querySelectorAll('input').forEach((r) => (r.checked = r.value === st.scene));
  $('#axes').innerHTML = cs.map((a) => `<div class="blk${st.act === a.id ? ' act' : ''}"><b>${a.title}</b><div class="seg" role="radiogroup" aria-label="${a.title}">${a.v.map((n, i) => `<label><input type="radio" name="${a.id}" value="${i}" ${st.sel[a.id] === i ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div><label class="cmp"><input type="checkbox" data-cmp="${a.id}" ${st.cmp === a.id ? 'checked' : ''}> рядом</label></div>`).join('')
    + `<div class="blk"><b>Сценарий</b><div class="seg" role="radiogroup" aria-label="Сценарий">${sc.scenarios.map((x) => `<label><input type="radio" name="scn" value="${x.id}" ${st.scn[sc.id] === x.id ? 'checked' : ''}><span>${x.name}</span></label>`).join('')}</div></div>`;
  for (const id of ['gray', 'rm']) $('#' + id).checked = !!st[id];
  $('#sc').value = st.sc; $('#speed').value = String(st.speed);
  const ax = st.cmp ? cs.find((a) => a.id === st.cmp) : null;
  const variants = ax ? ax.v.map((_, i) => ({ ...st.sel, [ax.id]: i })) : [{ ...st.sel }];
  $('#stage').className = st.gray ? 'gray' : '';
  $('#intro').innerHTML = sc.intro;
  $('#stage').innerHTML = variants.map((v, i) => figHtml('f' + i, sc, cs.map((a) => `${a.title}: ${a.v[v[a.id]]}`).join(' · '), { scale: st.sc / 100 })).join('');
  figs = [...document.querySelectorAll('#stage figure')].map((f, i) => ({ el: f, uid: 'f' + i, sel: variants[i], u: f.querySelector('.du .dyn'), o: f.querySelector('.do .dyn') }));
  $('#stagenote').innerHTML = sc.note ? sc.note(st) : '';
  $('#extra').innerHTML = sc.panel ? sc.panel(st) : '';
  if (sc.afterRender) sc.afterRender(st);
  const act = cs.find((a) => a.id === st.act), info = (INFO[st.act] || []);
  $('#cards').innerHTML = info.map((c, i) => `<div class="card${act && act.rec === i ? ' rec' : ''}"><h3>${c.h}${act && act.rec === i ? '<span class="badge">рекомендация</span>' : ''}${c.need ? `<span class="badge warn">${c.need}</span>` : ''}</h3><dl>${c.l.filter(([, b]) => b).map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`).join('');
  const hash = toHash();
  $('#pick').innerHTML = `Адрес кадра: <code>orders-style.html#${hash}</code>. Выбор владельца пишется в issue #339 (поле решения): ${SCENES.map((s) => s.axes.map((a) => `${a.title} <b>${a.v[st.sel[a.id]]}</b>`).join(', ')).join('; ')}.`;
  clock.last = null; syncPlay(); frame();
}
const clock = { last: null };
function frame(ts) {
  const T = curT();
  if (ts !== undefined && st.play) {
    if (clock.last !== null) st.t += ((ts - clock.last) / 1000) * st.speed;
    clock.last = ts;
  }
  if (st.t >= T) st.t = st.t % T;
  const sc = curScene(), scn = st.scn[sc.id];
  for (const f of figs) {
    const r = sc.draw({ t: st.t, I: (s) => s + '_' + f.uid, sel: f.sel, scn, rm: !!st.rm, scale: st.sc / 100, uid: f.uid });
    f.u.innerHTML = r.under || ''; f.o.innerHTML = r.over || '';
  }
  $('#tlab').textContent = f1(st.t).toString().replace('.', ',') + ' с';
  $('#scrub').value = String(Math.round((st.t / T) * 100));
}
function loop(ts) { frame(ts); requestAnimationFrame(loop); }
window.addEventListener('load', () => { buildHeader(); fromHash(); render(); requestAnimationFrame(loop); });
window.addEventListener('hashchange', () => { fromHash(); render(); });
