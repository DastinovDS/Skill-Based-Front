<!doctype html>
<!--
  Design round (#629): the nick entry, the main menu, Replays, Leaderboard and the queue (owner's review 2026-10-30).
  Self-contained: no network, everything drawn by code. Opens by double click.
  State in the address: #el=queue&v=Q3&cmp=Now,Q1,Q3&st=search&t=42&c=9&gray=1&focus=1
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menus and entry</title>
<style>
:root {
  --bg: #0d1117; --surface: rgb(22 27 34 / 94%); --surface-2: #21262d; --border: #30363d; --text: #e6edf3;
  --text-dim: #9da7b3; --paper: #f0f6fc; --you: #5b9bff; --enemy: #e5484d; --neutral: #8b949e; --warn: #ffb020; --vp: #e3b341;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #07090d; color: var(--text); font: 14px/1.4 var(--font); }
.bar { position: sticky; top: 0; z-index: 5; background: #07090dee; border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; }
.bar button[aria-pressed='true'] { background: #1d4e91; border-color: var(--you); color: #fff; }
.bar button.cmpsel { box-shadow: inset 0 -3px 0 var(--vp); }
.bar button:focus-visible, .bar input:focus-visible, .bar select:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.bar label { display: inline-flex; gap: 4px; align-items: center; color: var(--text-dim); }
.bar select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font: inherit; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.lbl { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
.rec { color: var(--vp); }
#stage { padding: 12px; display: grid; gap: 12px; }
#stage.c1 { grid-template-columns: 1fr; max-width: 1280px; margin: 0 auto; }
#stage.c2 { grid-template-columns: 1fr 1fr; }
#stage.c3 { grid-template-columns: 1fr 1fr 1fr; }
#stage.c4 { grid-template-columns: 1fr 1fr; }
.cell { min-width: 0; }
.cap { font-size: 13px; color: var(--text-dim); padding: 3px 2px; }
.cap b { color: var(--text); }
.box { position: relative; width: 100%; aspect-ratio: 1280 / 800; overflow: hidden; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.fr { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--text); font: 16px/1.35 var(--font); }
body.gray .fr { filter: grayscale(1); }
.fr * { box-sizing: border-box; }
.fr .map { position: absolute; inset: 0; }
.fr .ab { position: absolute; }
.fr .logo { position: absolute; left: 56px; top: 30px; display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 18px; }
.fr .legal { position: absolute; right: 16px; bottom: 6px; font-size: 12px; color: var(--text-dim); text-decoration: underline; display: flex; gap: 14px; }
.fr .eb { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
.fr .dim { color: var(--text-dim); }
.fr .warn { color: var(--warn); }
.fr .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 14px; font-size: 15px; }
.fr .btn.pri { background: var(--you); border-color: var(--you); color: #06101f; font-weight: 700; }
.fr .btn.ghost { background: transparent; }
.fr .lnk { color: var(--text); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; }
.fr .field { background: #111a27; border: 1px solid var(--border); border-bottom: 2px solid var(--you); height: 52px; display: flex; align-items: center; padding: 0 14px; font-size: 20px; }
.fr .field.err { border-bottom-color: var(--warn); }
.fr .caret { display: inline-block; width: 2px; height: 24px; background: var(--paper); margin-left: 1px; animation: blink 1s steps(1) infinite; }
.fr .ph { color: #8b949e; }
@keyframes blink { 50% { opacity: 0; } }
body.still .fr * { animation: none !important; transition: none !important; }
.fr .rows > div { display: flex; align-items: center; gap: 14px; height: 49px; border-bottom: 1px solid var(--border); font-size: 20px; }
.fr .rows > div.cur { background: linear-gradient(90deg, #1d2d48, transparent); border-bottom-color: var(--you); }
.fr .panel { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.fr .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--text-dim); }
.fr .chip.you { border-color: var(--you); color: var(--text); }
.fr .chip.am { border: 1px dashed var(--warn); color: var(--warn); }
.fr table { border-collapse: collapse; width: 100%; font-size: 15px; }
.fr td, .fr th { padding: 0 8px; height: 38px; border-bottom: 1px solid var(--border); text-align: left; }
.fr th { font-size: 12px; letter-spacing: .1em; color: var(--text-dim); font-weight: 500; text-transform: uppercase; height: 28px; }
.fr td.r, .fr th.r { text-align: right; }
.fr tr.me td { background: #1a2740; }
.fr tr.me td:first-child { box-shadow: inset 3px 0 0 var(--you); }
.fr .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.fr .pf { outline: none; }
body.focus .fr .pf { outline: 3px solid var(--paper); outline-offset: 3px; }
.fr .acct { position: absolute; right: 44px; top: 28px; border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; display: flex; gap: 10px; align-items: center; background: #0d1117cc; font-size: 15px; }
.fr .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.fr .spin { animation: spin 2.4s linear infinite; transform-origin: center; transform-box: fill-box; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 900px) { #stage.c2, #stage.c3, #stage.c4 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <div class="row" id="els"></div>
  <div class="row" id="vars"></div>
  <div class="row" id="states"></div>
  <div class="row">
    <label><input type="checkbox" id="cmp" /> compare</label><span class="dim" id="cmphint" style="color:var(--text-dim);font-size:12px"></span>
    <span class="sep"></span>
    <label><input type="checkbox" id="gray" /> grayscale</label>
    <label><input type="checkbox" id="focus" /> focus ring</label>
    <label><input type="checkbox" id="still" /> reduced motion</label>
    <span class="sep"></span>
    <span id="needs" style="font-size:13px;color:var(--text-dim)"></span>
    <span class="sep"></span><span style="font-size:12px;color:var(--text-dim)"><span class="rec">★</span> recommended · ◇ changes the look · <span style="color:var(--warn)">⚙</span> needs server or client plumbing</span>
  </div>
</div>
<div id="stage" class="c1"></div>

<script>
'use strict';
// ---------- icons and signs ----------
const IC = {
  bot: '<rect x="4" y="8" width="16" height="11" rx="2"/><circle cx="9" cy="13" r="1.3"/><circle cx="15" cy="13" r="1.3"/><path d="M12 4v4"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/>',
  hist: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/>',
  cup: '<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2"/><circle cx="15" cy="15" r="1.2"/><circle cx="15" cy="9" r="1.2"/><circle cx="9" cy="15" r="1.2"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
};
const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
// own: blue, single outline; enemy: red, double outline (ui-style 5.3)
function tri(side = 'you', s = 40, cls = '') {
  const c = side === 'you' ? 'var(--you)' : side === 'enemy' ? 'var(--enemy)' : 'none';
  const dbl = side === 'enemy' ? `<path d="M3 4h34L20 35z" fill="none" stroke="var(--bg)" stroke-width="3"/><path d="M0 2h40L20 39z" fill="none" stroke="var(--paper)" stroke-width="1.6"/>` : '';
  const empty = side === 'none' ? ' stroke-dasharray="4 3"' : '';
  return `<svg class="${cls}" width="${s}" height="${s}" viewBox="-2 -1 44 42" aria-hidden="true"><path d="M3 4h34L20 35z" fill="${c}" stroke="var(--paper)" stroke-width="2"${empty}/>${dbl}${side === 'none' ? '<text x="20" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text-dim)">?</text>' : ''}</svg>`;
}
const logo = () => `<div class="logo">${tri('you', 22)}<span class="dim" style="letter-spacing:2px">··</span>${tri('enemy', 22)}<span>Skill-Based Front</span></div>`;
const legal = () => `<div class="legal"><span>Impressum</span> <span>Privacy policy</span></div>`;
function resMark(r) {
  const d = r === 'win' ? '<circle cx="8" cy="8" r="7" fill="var(--you)"/>' : r === 'loss' ? '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--paper)" stroke-width="2"/>' : '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--paper)" stroke-width="2"/><path d="M8 2a6 6 0 0 1 0 12z" fill="var(--you)"/>';
  return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
}
const RW = { win: 'Win', loss: 'Loss', draw: 'Draw' };
function rep(m, big) {
  if (m.rep === 'ready') return `<span class="btn ${big ? 'pri' : ''}" style="padding:5px 12px">${ic('eye', 18)}Watch</span>`;
  if (m.rep === 'prep') return `<span class="chip" style="border-style:dashed">${ic('clock', 14)}Preparing</span>`;
  if (m.rep === 'exp') return `<span class="chip" style="border-style:dotted">Expired</span>`;
  return `<span class="chip" style="border-style:dotted">No replay</span>`;
}

// ---------- data ----------
const TOP = [['Alina', 1712, 41], ['Tomas', 1655, 38], ['Vega', 1590, 52], ['Kolya', 1561, 29], ['Mira', 1522, 33], ['Danya', 1480, 21], ['Lena', 1441, 18], ['Sasha', 1398, 25], ['Nikita', 1366, 14], ['Oleg', 1342, 19], ['Anya', 1310, 11], ['Max', 1287, 9]];
const REC = { Alina: [28, 12, 1], Tomas: [24, 13, 1], Vega: [30, 21, 1], Kolya: [16, 12, 1], Mira: [18, 14, 1], Danya: [12, 8, 1], Lena: [9, 9, 0], Sasha: [12, 13, 0], Nikita: [7, 7, 0], Oleg: [8, 11, 0], Anya: [5, 6, 0], Max: [3, 6, 0] };
const MATCHES = [
  { r: 'win', o: 'Vega', k: 'Ranked', map: 'crossroads', len: '12:04', when: '2 h ago', day: 'Today', d: '+14', rep: 'ready' },
  { r: 'loss', o: 'Kolya', k: 'Ranked', map: 'ridge', len: '8:41', when: '5 h ago', day: 'Today', d: '−9', rep: 'ready' },
  { r: 'draw', o: 'Hard', k: 'Bot', bot: 1, map: 'highway', len: '15:00', when: 'yesterday', day: 'Yesterday', d: '', rep: 'exp' },
  { r: 'win', o: 'Mira', k: 'Friend', map: 'crossroads', len: '10:27', when: 'yesterday', day: 'Yesterday', d: '', rep: 'ready' },
  { r: 'loss', o: 'Pavel', k: 'Unrated', map: 'ridge', len: '6:52', when: '2 days ago', day: 'Oct 28', d: '', rep: 'none' },
  { r: 'win', o: 'Tomas', k: 'Ranked', map: 'highway', len: '13:15', when: '2 days ago', day: 'Oct 28', d: '+14', rep: 'ready' },
  { r: 'win', o: 'Normal', k: 'Bot', bot: 1, map: 'ridge', len: '9:03', when: '3 days ago', day: 'Oct 27', d: '', rep: 'prep' },
  { r: 'loss', o: 'Alina', k: 'Ranked', map: 'crossroads', len: '11:48', when: '3 days ago', day: 'Oct 27', d: '−11', rep: 'ready' },
];

// ---------- the map backdrop (the menu valley, simplified) ----------
const NODES = { own: [[520, 405, 1], [558, 244], [605, 291], [690, 211], [681, 405], [600, 524], [543, 615], [652, 624]], mid: [[795, 196], [767, 306], [900, 301], [828, 405], [757, 510], [890, 505], [738, 605], [861, 614], [918, 206]], foe: [[976, 405], [966, 600], [1004, 186], [1056, 287], [1113, 196], [1051, 519]] };
const OWN_E = [[0, 1], [0, 2], [1, 2], [2, 3], [0, 4], [2, 4], [0, 5], [4, 5], [0, 6], [5, 7], [5, 6]];
const MID_E = [[3, 0], [3, 1], [1, 2], [1, 3], [4, 3], [3, 5], [5, 4], [4, 6], [6, 7], [7, 5], [0, 8], [8, 2]];
function mapSvg(o = {}) {
  const dim = o.dim ?? 1, dx = o.dx ?? 0, sc = o.sc ?? 1, blur = o.blur ?? 0;
  const own = NODES.own, mid = NODES.mid, foe = NODES.foe;
  let s = `<svg class="map" viewBox="0 0 1280 800" aria-hidden="true" style="opacity:${dim};${blur ? `filter:blur(${blur}px);` : ''}"><defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#0d1117"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1b222c" stroke-width="5"/></pattern><radialGradient id="glow"><stop offset="0" stop-color="#5b9bff" stop-opacity=".28"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></radialGradient><radialGradient id="tg"><stop offset="0" stop-color="#3a4630" stop-opacity=".55"/><stop offset="1" stop-color="#3a4630" stop-opacity="0"/></radialGradient></defs><g transform="translate(${dx} 0) translate(640 400) scale(${sc}) translate(-640 -400)">`;
  s += `<rect x="930" y="60" width="400" height="700" fill="url(#hatch)" opacity=".9"/>`;
  for (const [x, y] of mid) s += `<circle cx="${x}" cy="${y}" r="60" fill="url(#tg)"/>`;
  for (const [x, y] of own) s += `<circle cx="${x}" cy="${y}" r="44" fill="#5b9bff" opacity=".12"/>`;
  for (const [x, y] of foe) s += `<circle cx="${x}" cy="${y}" r="40" fill="#e5484d" opacity=".10"/>`;
  for (const [a, b] of MID_E) { const p = a === 3 && b === 0 ? own[3] : a === 3 && b === 1 ? own[3] : null; }
  const dash = (a, b) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="6 5" opacity=".75"/>`;
  s += dash(own[3], mid[0]) + dash(own[2], mid[1]) + dash(own[4], mid[3]) + dash(own[5], mid[4]) + dash(own[7], mid[6]);
  s += dash(mid[0], mid[8]) + dash(mid[1], mid[2]) + dash(mid[1], mid[3]) + dash(mid[3], mid[5]) + dash(mid[4], mid[5]) + dash(mid[4], mid[6]) + dash(mid[6], mid[7]) + dash(mid[7], mid[5]) + dash(mid[2], mid[8]) + dash(mid[0], mid[1]);
  s += dash(mid[3], foe[0]) + dash(mid[5], foe[0]) + dash(mid[7], foe[1]) + dash(mid[8], foe[2]) + dash(mid[2], foe[3]);
  for (const [a, b] of OWN_E) { const A = own[a], B = own[b]; s += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#a9c8ff" stroke-width="7" opacity=".55"/><line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#dce8ff" stroke-width="1.4"/>`; }
  for (const [x, y] of mid) s += `<circle cx="${x}" cy="${y}" r="8" fill="#2b3139" stroke="#8b949e" stroke-width="2"/>`;
  for (const [x, y] of foe) s += `<circle cx="${x}" cy="${y}" r="7" fill="#5a2025" stroke="#e5484d" stroke-width="1.5" opacity=".7"/>`;
  own.forEach(([x, y, cap], i) => { s += cap ? `<circle cx="${x}" cy="${y}" r="70" fill="url(#glow)"/><circle cx="${x}" cy="${y}" r="20" fill="#3b5f99" stroke="#dce8ff" stroke-width="2.5" stroke-dasharray="7 4"/><circle cx="${x}" cy="${y}" r="12" fill="#5b9bff" stroke="#f0f6fc" stroke-width="1.5"/><path d="M${x} ${y - 6}l1.8 4h4.2l-3.4 2.6 1.3 4.2-3.9-2.6-3.9 2.6 1.3-4.2-3.4-2.6h4.2z" fill="#0d1117"/>` : `<circle cx="${x}" cy="${y}" r="${i % 3 ? 6 : 9}" fill="#9cc0ff" stroke="#f0f6fc" stroke-width="1.5"/>`; });
  if (o.enemy) s += `<circle cx="1137" cy="405" r="22" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-dasharray="7 4"/><circle cx="1137" cy="405" r="13" fill="#e5484d" stroke="#f0f6fc" stroke-width="1.5"/><rect x="1088" y="437" width="98" height="26" rx="13" fill="#0d1117" stroke="#e5484d" stroke-width="2"/><text x="1137" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#f0f6fc" font-family="system-ui">${o.enemy}</text>`;
  else if (!o.noq) s += `<circle cx="1137" cy="405" r="15" fill="none" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="5 4"/><text x="1137" y="411" text-anchor="middle" font-size="17" font-weight="700" fill="#e5484d" font-family="system-ui">?</text>`;
  if (o.scout) s += `<circle cx="916" cy="405" r="58" fill="none" stroke="#8b949e" stroke-dasharray="3 4" opacity=".7" class="spin"/><path d="M908 398h16l-8 13z" fill="#5b9bff" stroke="#f0f6fc" stroke-width="1.5"/>`;
  if (o.stack) s += `<path d="M685 384h16l-8 13z" fill="#5b9bff" stroke="#f0f6fc" stroke-width="1.5"/><text x="705" y="396" font-size="11" font-weight="700" fill="#f0f6fc" font-family="system-ui">×${o.stack}</text>`;
  if (o.labels) for (const [x, y, t, cur] of o.labels) s += `<rect x="${x + 16}" y="${y - 14}" width="${t.length * 9 + 24}" height="28" rx="14" fill="#0d1117e6" stroke="${cur ? '#f0f6fc' : '#30363d'}" stroke-width="${cur ? 2 : 1}"/><text x="${x + 28}" y="${y + 5}" font-size="15" fill="#e6edf3" font-family="system-ui">${t}</text>`;
  return s + '</g></svg>';
}
const SHADE = (w = 620) => `<div class="ab" style="left:0;top:0;bottom:0;width:${w}px;background:linear-gradient(90deg,#0d1117 0,#0d1117e6 55%,transparent)"></div>`;

// ---------- account chip ----------
function acct(a) {
  if (a === 'guest') return `<div class="acct">${ic('user', 18)}<b>Danya</b><span class="chip">Guest</span></div>`;
  if (a === 'calib') return `<div class="acct"><b>Danya</b><span class="chip">${cells(2)} 2/5</span></div>`;
  return `<div class="acct"><b>Danya</b><span class="num" style="font-size:20px">1480</span><span class="dim" style="font-size:11px;letter-spacing:.1em">RATING</span></div>`;
}
function cells(n, of = 5) { let s = '<span style="display:inline-flex;gap:2px">'; for (let i = 0; i < of; i++) s += `<span style="width:8px;height:12px;border:1.5px solid var(--paper);border-radius:2px;${i < n ? 'background:var(--you)' : ''}"></span>`; return s + '</span>'; }

// =====================================================================
// 1. NICK ENTRY
// =====================================================================
const NICK_ST = { empty: 'empty', typing: 'typing', short: 'too short', chars: 'bad character', taken: 'taken', session: 'signed out', invited: 'invited' };
function nk(st) {
  const v = { empty: '', typing: 'Danya', short: 'Da', chars: 'Dan ya!', taken: 'Vega', session: '', invited: '' }[st];
  const err = { short: 'At least 3 characters', chars: 'Only letters, digits, _ and -', taken: 'Taken. Try another nick', session: 'Signed out. Pick a nick or log in' }[st] || '';
  const ok = st === 'typing';
  return { v, err, ok, inv: st === 'invited', cta: st === 'invited' ? 'Join' : 'Play', dis: !ok && st !== 'invited' };
}

const ELS = {
  nick: { n: '1 Nick', V: NICK, ST: NICK_ST, rec: 'N2' },
  menu: { n: '2 Menu', V: MENU, ST: MENU_ST, rec: 'M1' },
  replays: { n: '3 Replays', V: REPLAYS, ST: REP_ST, rec: 'R5' },
  board: { n: '4 Leaderboard', V: BOARD, ST: BOARD_ST, rec: 'L4' },
  queue: { n: '5 Queue', V: QUEUE, ST: Q_ST, rec: 'Q1' },
};
const S = { el: 'nick', v: 'Now', cmp: false, sel: ['Now'], st: {}, t: 42, c: 9, hid: false, gray: false, focus: false, still: false };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (ELS[h.get('el')]) S.el = h.get('el');
  const E = ELS[S.el];
  if (E.V[h.get('v')]) S.v = h.get('v');
  if (h.get('cmp')) { S.cmp = true; S.sel = h.get('cmp').split(',').filter((k) => E.V[k]).slice(0, 4); }
  if (h.get('st') && E.ST[h.get('st')]) S.st[S.el] = h.get('st');
  if (h.get('t')) S.t = +h.get('t');
  if (h.get('c')) S.c = +h.get('c');
  S.hid = h.get('hid') === '1'; S.gray = h.get('gray') === '1'; S.focus = h.get('focus') === '1'; S.still = h.get('still') === '1';
}
function writeHash() {
  const p = new URLSearchParams({ el: S.el, v: S.v });
  if (S.cmp) p.set('cmp', S.sel.join(','));
  p.set('st', curSt());
  if (S.el === 'queue') { p.set('t', S.t); p.set('c', S.c); if (S.hid) p.set('hid', '1'); }
  for (const k of ['gray', 'focus', 'still']) if (S[k]) p.set(k, '1');
  history.replaceState(null, '', '#' + p.toString());
}
const curSt = () => S.st[S.el] ?? Object.keys(ELS[S.el].ST)[0];
function btn(label, on, fn, extra = '') { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = label; b.setAttribute('aria-pressed', String(!!on)); if (extra) b.className = extra; b.onclick = fn; return b; }
function renderBar() {
  const E = ELS[S.el];
  const els = document.getElementById('els'); els.innerHTML = '<span class="lbl">Screen</span>';
  for (const k in ELS) els.append(btn(ELS[k].n, k === S.el, () => { S.el = k; S.v = 'Now'; S.sel = ['Now', ELS[k].rec]; draw(); }));
  const vars = document.getElementById('vars'); vars.innerHTML = '<span class="lbl">Variant</span>';
  for (const k in E.V) {
    const v = E.V[k]; const lab = k === 'Now' ? 'Now' : `${k} ${v.n}${v.x ? ' ◇' : ''}${v.needs ? ' <span style="color:var(--warn)">⚙</span>' : ''}${k === E.rec ? ' <span class="rec">★</span>' : ''}`;
    const on = S.cmp ? S.sel.includes(k) : k === S.v;
    const b = btn(lab, on, () => { if (S.cmp) { if (S.sel.includes(k)) S.sel = S.sel.filter((x) => x !== k); else { S.sel.push(k); if (S.sel.length > 4) S.sel.shift(); } } else S.v = k; draw(); });
    b.title = v.idea || 'the current look'; vars.append(b);
  }
  const sts = document.getElementById('states'); sts.innerHTML = '<span class="lbl">State</span>';
  for (const k in E.ST) sts.append(btn(E.ST[k], k === curSt(), () => { S.st[S.el] = k; draw(); }));
  if (S.el === 'queue') {
    const st = curSt();
    const mk = (lab, key, max, show) => { if (!show) return; const l = document.createElement('label'); l.innerHTML = `${lab} <input type="range" min="0" max="${max}" value="${S[key]}" style="width:160px"> <b class="num">${key === 't' ? clock(S[key]) : S[key] + ' s'}</b>`; l.querySelector('input').oninput = (e) => { S[key] = +e.target.value; draw(); }; sts.append(l); };
    sts.append(Object.assign(document.createElement('span'), { className: 'sep' }));
    mk('waited', 't', 240, st === 'search'); mk('left to confirm', 'c', 15, st === 'found' || st === 'confirmed');
    const run = btn(S.timer ? '❚❚' : '▶', !!S.timer, () => { if (S.timer) { clearInterval(S.timer); S.timer = null; } else S.timer = setInterval(() => { if (curSt() === 'search') S.t = (S.t + 1) % 241; else S.c = S.c > 0 ? S.c - 1 : 15; draw(); }, 1000); draw(); });
    run.title = 'run the clock'; sts.append(run);
    const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" ${S.hid ? 'checked' : ''}> tab was hidden`; l.querySelector('input').onchange = (e) => { S.hid = e.target.checked; draw(); }; sts.append(l);
  }
  document.getElementById('cmphint').textContent = S.cmp ? '2 to 4: click variants to add or remove' : '';
  const ids = S.cmp ? S.sel : [S.v];
  document.getElementById('needs').innerHTML = ids.filter((k) => E.V[k].needs).map((k) => `<b style="color:var(--warn)">${k}</b> needs ${E.V[k].needs}`).join(' · ') || 'client only';
}
function draw() {
  renderBar(); writeHash();
  document.getElementById('cmp').checked = S.cmp;
  for (const k of ['gray', 'focus', 'still']) { document.body.classList.toggle(k, S[k]); document.getElementById(k).checked = S[k]; }
  const E = ELS[S.el]; const ids = S.cmp ? (S.sel.length ? S.sel : ['Now']) : [S.v];
  const stage = document.getElementById('stage'); stage.className = 'c' + ids.length;
  stage.innerHTML = ids.map((k) => { const v = E.V[k]; return `<div class="cell"><div class="cap"><b>${k === 'Now' ? 'Now' : k + ' ' + v.n}</b>${k === E.rec ? ' <span class="rec">★ recommended</span>' : ''}${v.x ? ' ◇ changes the look' : ''}${v.idea ? ' · ' + v.idea : ''}</div><div class="box"><div class="fr">${v.f(curSt())}</div></div></div>`; }).join('');
  fit();
}
function fit() { for (const b of document.querySelectorAll('.box')) b.firstElementChild.style.transform = `scale(${b.clientWidth / 1280})`; }
addEventListener('resize', fit);
document.getElementById('cmp').onchange = (e) => { S.cmp = e.target.checked; if (S.cmp && S.sel.length < 2) S.sel = ['Now', ELS[S.el].rec]; draw(); };
for (const k of ['gray', 'focus', 'still']) document.getElementById(k).onchange = (e) => { S[k] = e.target.checked; draw(); };
addEventListener('hashchange', () => { readHash(); draw(); });
readHash(); if (S.cmp && S.sel.length === 0) S.sel = ['Now', ELS[S.el].rec];
draw();
</script>
</body>
</html>
