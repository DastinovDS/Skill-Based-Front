<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-game style, round 5: Engraved</title>
<!-- In-game style, round 5 (#829): the last refinements before implementation. Locked after round 4: forts Set back,
     two masonries; city highlight Fine rings; everything locked in round 4's Combined view. Open, each with its round 4
     look first where one exists: a CP (the same design, slower and smoother), k builds (the progress on an arc and the
     tower filling continuously), l the fort icon (Wall on the road, drawn per size), r the reveal of hover details
     (left to right), u charges as simple marks (the warehouse and the radial price; the unit card keeps its helmets).
     Built on the round 4 page (its pieces are kept; the round 5 pieces and the shell are new). Only the mechanics of
     rulesets/mvp-5.toml; the fight is drawn only from the fields of the `fight_round` event (see simFight).
     Self-contained, no network. Fonts (SIL OFL) and the baked Intaglio background are the round 2 assets of #826:
     assets/out-of-game-style/fonts and assets/out-of-game-style-r2. -->
<style>
@font-face{font-family:'Cinzel';src:url(assets/out-of-game-style/fonts/cinzel.woff2) format('woff2');font-weight:400 900;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:'EB Garamond';src:url(assets/out-of-game-style/fonts/ebgaramond-italic.woff2) format('woff2');font-weight:400 800;font-style:italic;font-display:block}

/* ---------------------------------------------------------------------------------------------
   The mockup's own chrome: neutral grey, out of the way of the artboards.
   --------------------------------------------------------------------------------------------- */
html, body { margin: 0; height: 100%; }
body {
  background: #2a2b2c; color: #e4e4e2; font: 13px/1.4 system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 210px 1fr; overflow: hidden;
}
body:not(.ready) { visibility: hidden; }
button, select { font: inherit; color: inherit; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid #3b3c3e; flex-wrap: wrap; }
header.top h1 { font: 600 12px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 4px 0 0; color: #b9b9b6; white-space: nowrap; }
#topics { display: flex; gap: 2px; flex-wrap: wrap; }
#topics button { background: none; border: 1px solid #47494c; padding: 4px 9px; cursor: pointer; white-space: nowrap; color: #c9c9c6; }
#topics button .tk { opacity: .6; margin-right: 5px; font-variant-numeric: tabular-nums; }
#topics button[aria-pressed='true'] { background: #e4e4e2; color: #1d1e1f; border-color: #e4e4e2; }
.opts { margin-left: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
select { background: #1f2021; border: 1px solid #47494c; padding: 3px 6px; }
nav.side { overflow: auto; border-right: 1px solid #3b3c3e; padding: 8px 0; }
nav.side h2 { font: 600 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8d8d8a; margin: 6px 16px 8px; }
#vlist { list-style: none; margin: 0; padding: 0; }
#vlist button { display: grid; grid-template-columns: 22px 1fr; gap: 2px 6px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 14px; cursor: pointer; color: #b9b9b6; }
#vlist button .vn { font-variant-numeric: tabular-nums; opacity: .6; }
#vlist button small { grid-column: 2; color: #8d8d8a; font-size: 11.5px; line-height: 1.3; }
#vlist button[aria-current='true'] { color: #fff; background: #3a3b3d; box-shadow: inset 3px 0 0 #e4e4e2; }
#vlist button .pick { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #1d1e1f; background: #c9c9c6; padding: 0 4px; margin-left: 6px; }
main.view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; display: flex; flex-wrap: wrap; gap: 14px 16px; justify-content: center; align-content: center; padding: 14px; overflow: auto; }
.board { flex: none; }
.board .bl { margin: 0 0 5px; color: #9a9a97; font-size: 12px; display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
.board .bl b { color: #e4e4e2; font-weight: 600; }
.board .clip { position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,.35); }
body.gray .board .clip { filter: grayscale(1); }
footer#transport { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 7px 18px 9px; border-top: 1px solid #3b3c3e; }
footer#transport button { background: #e4e4e2; color: #1d1e1f; border: 0; padding: 4px 14px; cursor: pointer; min-width: 76px; }
footer#transport button:disabled { opacity: .45; cursor: default; }
.scrubwrap { flex: 1; position: relative; padding-bottom: 14px; }
#scrub { width: 100%; accent-color: #e4e4e2; margin: 0; }
#marks { position: absolute; left: 7px; right: 7px; bottom: 0; height: 13px; font-size: 10.5px; color: #8d8d8a; }
#marks span { position: absolute; transform: translateX(-2px); white-space: nowrap; border-left: 1px solid #5a5b5d; padding-left: 3px; line-height: 13px; }
#clock { font-variant-numeric: tabular-nums; color: #b9b9b6; min-width: 92px; text-align: right; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ---------------------------------------------------------------------------------------------
   The artboard: a 1280 x 800 game window. The canvas draws the map (as PixiJS does); the HUD,
   the menus and the alerts are HTML over it (as the Svelte HUD is).
   --------------------------------------------------------------------------------------------- */
.art { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden; transform-origin: 0 0; }
.art canvas.mcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art canvas.ov2 { position: absolute; z-index: 8; pointer-events: none; }
.art .ov { position: absolute; z-index: 3; }
.art svg.radial { position: absolute; overflow: visible; z-index: 4; }
.art .rl { position: absolute; z-index: 5; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; pointer-events: none; }
.art .hub { position: absolute; z-index: 5; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; pointer-events: none; }

.v-eng, .v-cur { --ink: #ece4d1; --dim: #b3a88f; --own: #86a6ea; --en: #e5785e; --warn: #e6ab42; --up: #8cc79a; --cas: #060504; background: #0e0c09; }
.v-cur { --ink: #e6edf3; --dim: #8b949e; --own: #5b9bff; --en: #e5484d; --warn: #ffb020; background: #0d1117; }

/* HUD skeleton. */
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; z-index: 6; height: 52px; box-sizing: border-box; }
.hud .hg { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.hud .hg.mid { justify-content: center; flex: none; }
.hud .hg.end { justify-content: flex-end; }
.hud canvas.cpw { display: block; }
.hud .tug { display: flex; position: relative; }
.hud .tug .tm { display: block; }
.hud .tug .te { display: block; flex: 1; }
.hud .fac { display: inline-flex; align-items: center; gap: 5px; }
.hud .ic { display: inline-grid; place-items: center; }

/* Engraved HUD: a dark strip under a double rule, numbers in EB Garamond, no words where a sign says it. */
.v-eng .hud { padding: 0 18px; background: rgba(14,12,9,.96); border-bottom: 1px solid rgba(236,228,209,.55); box-shadow: 0 3px 0 rgba(14,12,9,.96), 0 4px 0 rgba(236,228,209,.22); font: 18px/1 'EB Garamond', serif; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.v-eng .hud .chip, .v-eng .hud .btn { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 9px; box-sizing: border-box; background: none; color: var(--ink); border: 1px solid rgba(236,228,209,.6); box-shadow: inset 0 0 0 2px #0e0c09, inset 0 0 0 3px rgba(236,228,209,.22); font: 500 11px Cinzel, serif; letter-spacing: .12em; }
.v-eng .hud .btn { width: 30px; padding: 0; justify-content: center; }
.v-eng .hud kbd { font: 500 10px Cinzel, serif; letter-spacing: .06em; color: var(--dim); padding: 0 4px; border: 1px solid rgba(236,228,209,.4); }
.v-eng .hud .fac { font-size: 19px; }
.v-eng .hud .fac.full { outline: 1px dashed rgba(236,228,209,.5); outline-offset: 3px; }
.v-eng .hud .nk { font: 600 11px Cinzel, serif; letter-spacing: .16em; text-transform: uppercase; }
.v-eng .hud .nk.own, .v-eng .hud .vpn.own { color: var(--own); }
.v-eng .hud .nk.en, .v-eng .hud .vpn.en { color: var(--en); }
.v-eng .hud .vpn { font-size: 27px; font-weight: 500; }
.v-eng .hud .tug { width: 190px; height: 8px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 1px 0; }
.v-eng .hud .tug .tm { width: 41%; background: var(--own); }
.v-eng .hud .tug .te { background: repeating-linear-gradient(45deg, var(--en) 0 1.2px, transparent 1.2px 3.4px); }
.v-eng .hud .tug::after { content: ''; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 1px; background: var(--ink); opacity: .55; }
.v-eng .hud .clockv { font-size: 27px; margin: 0 8px 0 2px; }
.v-eng .hud .cap { position: relative; display: inline-block; width: 12px; height: 16px; border: 1px solid var(--ink); box-shadow: 0 0 0 2px #0e0c09; }
.v-eng .hud .cap i { position: absolute; left: 1px; right: 1px; bottom: 1px; background: repeating-linear-gradient(0deg, var(--own) 0 1px, transparent 1px 2.5px); }

/* Current HUD (variant 0 references). */
.v-cur .hud { padding: 0 12px; background: rgba(13,17,23,.97); border-bottom: 1px solid #30363d; font: 15px/1 system-ui, sans-serif; color: var(--ink); }
.v-cur .hud .chip, .v-cur .hud .fac, .v-cur .hud .btn { border: 1px solid #30363d; border-radius: 6px; padding: 5px 9px; background: #161b22; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); font: 600 14px system-ui, sans-serif; }
.v-cur .hud kbd { font: 11px system-ui, sans-serif; color: var(--dim); border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; }
.v-cur .hud .vpn { font-size: 17px; font-weight: 700; }
.v-cur .hud .vpn.own, .v-cur .hud .nk.own { color: var(--own); } .v-cur .hud .vpn.en, .v-cur .hud .nk.en { color: var(--en); }
.v-cur .hud .tug { width: 180px; height: 10px; border-radius: 2px; overflow: hidden; }
.v-cur .hud .tug .tm { background: var(--own); width: 41%; } .v-cur .hud .tug .te { background: var(--en); }
.v-cur .hud .clockv { font-size: 19px; margin-right: 6px; }

/* Alerts: a sign, the place, and what comes (no sentence). */
.alerts { position: absolute; left: 50%; transform: translateX(-50%); top: 64px; z-index: 6; display: grid; justify-items: center; gap: 6px; }
.alert { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.v-eng .alert, .v-eng .edge { background: rgba(14,12,9,.94); border: 1px solid rgba(236,228,209,.6); box-shadow: inset 0 0 0 3px rgba(14,12,9,.94), inset 0 0 0 4px rgba(236,228,209,.25); font: 500 12px Cinzel, serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); padding: 7px 13px 7px 10px; }
.alert .sg, .edge .sg { width: 15px; height: 15px; flex: none; }
.sg .d { fill: var(--warn); } .sg .k { fill: none; stroke: #16130f; stroke-width: 1.8; stroke-linecap: round; }
.alert .inc { display: inline-flex; align-items: center; gap: 4px; font: 500 17px 'EB Garamond', serif; letter-spacing: 0; }
.edge { position: absolute; z-index: 6; display: flex; align-items: center; gap: 8px; }
.edge .ar { color: var(--warn); }
.v-eng .tip { position: absolute; z-index: 7; background: rgba(14,12,9,.94); border: 1px solid rgba(236,228,209,.6); box-shadow: inset 0 0 0 3px rgba(14,12,9,.94), inset 0 0 0 4px rgba(236,228,209,.25); font: 17px/1.2 'EB Garamond', serif; color: var(--ink); padding: 6px 10px; font-variant-numeric: lining-nums; display: flex; gap: 8px; align-items: center; }

/* Radial menus (Engraved): a ring of sectors, icons and numbers only; the hovered item's name in the hub. */
.v-eng .rl { color: var(--ink); font: 500 16px/1 'EB Garamond', serif; font-variant-numeric: lining-nums; }
.v-eng .rl .num { display: inline-flex; align-items: center; gap: 3px; margin-top: 3px; }
.v-eng .rl kbd { display: inline-block; margin-top: 4px; font: 500 9.5px Cinzel, serif; letter-spacing: .06em; color: var(--dim); padding: 0 4px; border: 1px solid rgba(236,228,209,.4); }
.v-eng .hub { font: 600 10.5px Cinzel, serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); background: rgba(14,12,9,.92); padding: 4px 9px 3px; border-top: 1px solid rgba(236,228,209,.45); border-bottom: 1px solid rgba(236,228,209,.45); }
.v-cur .rl { font: 600 14px/1.25 system-ui, sans-serif; color: var(--ink); }
.v-cur .rl small { display: block; font: 500 12px system-ui, sans-serif; color: #c9d1d9; }
.v-cur .rl kbd { display: inline-block; margin-top: 4px; font: 10px system-ui, sans-serif; color: var(--dim); border: 1px solid #484f58; border-radius: 3px; padding: 0 4px; }
.v-cur .rcap { position: absolute; z-index: 5; transform: translateX(-50%); font: 12px/1.4 system-ui, sans-serif; color: #c9d1d9; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; }
.v-cur .alert, .v-cur .edge, .v-cur .tip { background: #161b22; border: 1px solid #30363d; border-radius: 6px; font: 14px system-ui, sans-serif; color: var(--ink); padding: 7px 12px; }
.v-cur .alert { border-left: 3px solid var(--warn); }
.v-cur .tip { position: absolute; z-index: 7; }
/* The leaf shift of the Supply layer, bottom left. */
.lsp { position: absolute; left: 16px; bottom: 16px; z-index: 6; display: flex; align-items: center; gap: 9px; padding: 6px 12px; }
.v-eng .lsp { background: rgba(14,12,9,.94); border: 1px solid rgba(236,228,209,.6); box-shadow: inset 0 0 0 3px rgba(14,12,9,.94), inset 0 0 0 4px rgba(236,228,209,.25); font: 500 20px 'EB Garamond', serif; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.v-eng .lsp kbd { font: 500 10px Cinzel, serif; letter-spacing: .06em; color: var(--dim); padding: 0 4px; border: 1px solid rgba(236,228,209,.4); }
.v-eng .lsp .st { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid rgba(236,228,209,.6); box-shadow: inset 0 0 0 2px #0e0c09, inset 0 0 0 3px rgba(236,228,209,.22); font-size: 18px; line-height: 1; }
.v-eng .lsp .val { min-width: 22px; text-align: center; }
.lsp.cur { background: rgba(22,27,34,.96); border: 1px solid #30363d; border-radius: 20px; font: 600 14px system-ui, sans-serif; color: var(--ink); }
.lsp.cur kbd { font: 11px system-ui, sans-serif; color: var(--dim); border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; }
.lsp.cur .st { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid #30363d; border-radius: 6px; }
/* The specimen strip of the menu icons (topic g): a mockup device, not a game element. */
.istrip { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; gap: 26px; padding: 10px 22px; background: rgba(14,12,9,.94); border: 1px solid rgba(236,228,209,.45); color: var(--ink); }
.istrip span { display: flex; gap: 14px; align-items: center; }
.istrip span + span { border-left: 1px solid rgba(236,228,209,.25); padding-left: 26px; }
.istrip i { display: grid; place-items: center; }
.istrip.cur { background: rgba(22,27,34,.96); border-color: #30363d; border-radius: 8px; }
.helm { display: block; overflow: visible; }
/* Round 3: tips and alerts (topic q). Q0 the cartouche of round 2; Q1 ribbons; Q2 leaders and strips. */
.v-eng .tip.q0, .v-eng .rib, .v-eng .lead, .v-eng .strip { position: absolute; z-index: 7; display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--ink); font: 500 12px Cinzel, serif; letter-spacing: .14em; text-transform: uppercase; }
.v-eng .tip.q0 { padding: 6px 10px; }
.v-eng .alert .inc, .v-eng .rib .inc, .v-eng .strip .inc { display: inline-flex; align-items: center; gap: 4px; font: 500 17px 'EB Garamond', serif; letter-spacing: 0; }
.v-eng .rib { background: rgba(14,12,9,.95); padding: 5px 22px; border-top: 1px solid rgba(236,228,209,.7); border-bottom: 1px solid rgba(236,228,209,.7);
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%); }
.v-eng .alerts .rib { position: relative; }
.v-eng .rib.tipq { transform: translateX(-50%); padding: 4px 18px; }
.v-eng .rib.edgeq { padding: 5px 22px; }
.v-eng .rib .sg, .v-eng .strip .sg, .v-eng .tip.q0 .sg { width: 15px; height: 15px; flex: none; }
.v-eng .lead { background: rgba(14,12,9,.95); border: 1px solid rgba(236,228,209,.65); padding: 5px 9px; }
.v-eng .ldr { position: absolute; z-index: 6; pointer-events: none; }
.v-eng .strip { left: 50%; top: 56px; transform: translateX(-50%); background: rgba(14,12,9,.95); padding: 4px 14px 5px; border: 1px solid rgba(236,228,209,.55); border-top: 0; }
.v-eng .strip.side { left: auto; top: auto; transform: none; border: 1px solid rgba(236,228,209,.55); border-right: 0; }
.v-eng .strip .ar, .v-eng .rib .ar, .v-eng .edge .ar { color: var(--warn); }
.chips { display: inline-flex; gap: 2px; }
.chips .helm.off path:first-of-type { fill: #0e0c09; }
.wh { display: inline-flex; gap: 2px; padding: 2px; background: #060504; }
.wh i { display: block; width: 7px; height: 6px; box-sizing: border-box; border: 1px solid rgba(236,228,209,.5); }
.wh i.on { background: var(--own); border-color: var(--own); }
.vp { position: relative; display: inline-grid; place-items: center; width: 20px; height: 20px; color: #cfab62; font: 700 12px 'EB Garamond', serif; letter-spacing: 0; }
.vp::before { content: ''; position: absolute; inset: 3px; border: 1px solid #cfab62; transform: rotate(45deg); }
.wh i { width: 8px; height: 7px; }
.ib { display: inline-grid; place-items: center; }
/* Round 4: prices in the radial (topic u). */
.v-eng .rl .num.cst { gap: 4px; }
.v-eng .rl .num.cst svg { display: block; overflow: visible; }
.v-eng .rl .num.arc { flex-direction: column; gap: 1px; }
.v-eng .rl .num.fr .fq { display: inline-grid; justify-items: center; font-size: 14px; line-height: 1.05; margin-left: 2px; }
.v-eng .rl .num.fr .fq b { color: var(--own); font-weight: 600; border-bottom: 1px solid var(--ink); padding: 0 2px; }
.v-eng .rl .num.fr .fq i { font-style: normal; color: var(--dim); }
#topics button .tk { min-width: 9px; display: inline-block; }
/* Round 5: the price as marks (topic u) and the magnified fort icon (topic l). */
.v-eng .rl .num.mk { margin-top: 5px; }
.v-eng .rl .num.mk svg { display: block; overflow: visible; }
.istrip.i5 .mag { gap: 18px; }
.istrip.i5 .mag canvas { display: block; outline: 1px solid rgba(236,228,209,.18); outline-offset: 2px; }
</style>
</head>
<body>
<header class="top">
  <h1>In-game style · round 5 · Engraved</h1>
  <div id="topics" role="group" aria-label="Topic"></div>
  <div class="opts">
    <label><input type="checkbox" id="cmp">Compare</label>
    <label>Map zoom <select id="mz" aria-label="Map zoom"><option value="0.5">50 %</option><option value="0.75">75 %</option><option value="1" selected>100 %</option><option value="1.6">160 %</option><option value="2.5">250 %</option></select></label>
    <label>View <select id="zoom" aria-label="View size"><option value="fit">Fit</option><option value="1">100 %</option><option value="2">200 %</option></select></label>
    <label><input type="checkbox" id="gray">Grayscale</label>
    <label><input type="checkbox" id="rm">Reduced motion</label>
    <label><input type="checkbox" id="slow">Slow ×5</label>
  </div>
</header>
<nav class="side" aria-label="Variants"><h2 id="vhead">Variants</h2><ul id="vlist"></ul></nav>
<main class="view"><div id="stage"></div></main>
<footer id="transport">
  <button type="button" id="play">Pause</button>
  <div class="scrubwrap"><input type="range" id="scrub" min="0" max="6" step="0.01" value="0" aria-label="Time"><div id="marks" aria-hidden="true"></div></div>
  <span id="clock"></span>

function hex(c) {
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixc(a, b, t) {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const rgba = (c, a) => `rgba(${hex(c).join(',')},${a})`;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const eOutQ = (p) => 1 - (1 - clamp(p)) * (1 - clamp(p));
const eInOut = (p) => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Loading: the label grid of the cells (4 map units each) and the Intaglio background.

const MC = { cols: 0, rows: 0, cell: 4, lab: null, img: null };

  const { cols, rows, lab } = MC;

  for (let i = 0; i < lab.length; i++) if (lab[i] < 199) { near[i] = lab[i]; queue.push(i); }
  for (let h = 0; h < queue.length; h++) {

const AREA = new Map();

    let far = 8;

// --- Fog --------------------------------------------------------------------------------------
// What each variant keeps of the hidden land (the open point of round 2):
const FOG = {
  current: { desat: 0, veil: 0.66, veilCol: '#252d38', blur: 9, tint: 0, borders: 0 },
  stone: { desat: 1, veil: 0.4, veilCol: '#0b0a08', blur: 6, tint: 0, borders: 0.6, hatch: [45, 7] },
  enamel: { desat: 0.5, veil: 0.44, veilCol: '#0b0a08', blur: 6, tint: 0.13, borders: 0.55 },
  engraved: { desat: 0.75, veil: 0.4, veilCol: '#0b0a08', blur: 5, tint: 0.7, borders: 0.7, rule: [45, 4] },
  relief: { desat: 0.6, veil: 0.46, veilCol: '#0b0a08', blur: 6, tint: 0, borders: 0.5 },
  flat: { desat: 0.35, veil: 0.42, veilCol: '#0d0b08', blur: 3, tint: 0.2, borders: 0.75 },

function drawFog(g, T, Wd, C, k) {
  if (T.mat === 'engraved' && FOGV !== '0') { drawFog3(g, T, Wd, C, k); return; }
  const F = FOG[T.mat];
  const small = fogMask(Wd.visible);
  const M = () => maskLayer(k, C, small, F.blur);
  if (F.desat) blit(g, tinted(M(), '#808080'), F.desat, 'saturation');
  blit(g, tinted(M(), F.veilCol), F.veil);
  if (F.hatch || F.rule) {
    const L = canvas(W * k, H * k);
    const lg = L.getContext('2d');
    worldT(lg, C, k);
    if (F.hatch) {
      lg.fillStyle = hatch(lg, '#050403', F.hatch[0], F.hatch[1], 1, 0.55);
      lg.fillRect(0, 0, MAPW, MAPH);
      lg.fillStyle = hatch(lg, '#ece4d1', F.hatch[0], F.hatch[1], 0.6, 0.06);
      lg.translate(0.9, 0);
      lg.fillRect(0, 0, MAPW, MAPH);
    } else {
      lg.fillStyle = hatch(lg, '#050403', F.rule[0], F.rule[1], 1, 0.4);
      lg.fillRect(0, 0, MAPW, MAPH);
      lg.fillStyle = hatch(lg, '#050403', -F.rule[0], F.rule[1], 1, 0.4);
      lg.fillRect(0, 0, MAPW, MAPH);
    }
    blit(g, keepIn(L, M()), 0.9);
  }
  // owner tint and borders kept over the fog (variants that keep them)
  if (F.tint) {
    for (const o of [0, 1]) {
      const L = sideFill(T, Wd, o, C, k);
      keepIn(L, M());
      blit(g, L, T.mat === 'engraved' ? F.tint : F.tint);
    }
  }
  if (F.borders) {
    const L = canvas(W * k, H * k);
    const lg = L.getContext('2d');
    worldT(lg, C, k);
    drawBorderLines(lg, T, Wd, 0);
    drawBorderLines(lg, T, Wd, 1);
    keepIn(L, M());
    blit(g, L, F.borders);
  }
}

const unitWidth = (n) => (n <= 2 ? 24 : n <= 5 ? 30 : n <= 9 ? 36 : 42) * 1.34;

// A helmet centred at (x, y), `w` wide (in the current units), `share` of it charged.
// o: inside (in a city), count, alpha, unknown, empty (an arena chip with no charge).
function helmet(g, T, side, x, y, w, share, o = {}) {
  const col = sideCol(T, side);

// --- Badges: chevrons up (advantage) and down (disadvantage), section 45 ---------------------------
function chevrons(g, T, x, y, dir, count, size = 11) {
  const n = Math.min(count, 3);
  const col = dir === 'up' ? T.up : T.down;
  const hw = size * 0.42, hh = size * 0.24, step = size * 0.46;
  g.save();
  g.lineJoin = 'round';
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const cy = y + (dir === 'up' ? 1 : -1) * (i - (n - 1) / 2) * step;
    const d = dir === 'up' ? 1 : -1;
    const pts = [[x - hw, cy + hh * d], [x, cy - hh * d], [x + hw, cy + hh * d]];
    const stroke = () => { g.beginPath(); pts.forEach(([a, b], j) => (j ? g.lineTo(a, b) : g.moveTo(a, b))); g.stroke(); };

    if (T.mat === 'enamel') { g.strokeStyle = T.gilt; g.lineWidth = size * 0.24 + 1.4; stroke(); }
    g.strokeStyle = col;
    g.lineWidth = size * 0.24;
    stroke();
  }
  g.restore();
}

// --- Selection, hover, reach -------------------------------------------------------------------

const BASES = new Map();

// --- Dynamic pieces --------------------------------------------------------------------------------
function groupPos(Wd, q, t) {

    const w = unitWidth(q.units) * (inside ? 0.92 : 1);

// 3: a tower on the ring: a small block straddling the capacity ring, the owner's hatch inside; the barracks

// The recruit queue and the city builds by variant (dynamic: their progress runs).

// --- i. The path of a hovered target ----------------------------------------------------------------------
// The group in Granite Hold is selected; the pointer goes to Mid Fork, to Brackenway, then with Shift to
// Torchester. Each route is the server's `ReachNode.path` (the reach answer), the time its `ticks`.
const PATH_STEPS = [
  { t0: 0, t1: 3, to: 11, path: [0, 1, 7, 11], eta: '0:19' },
  { t0: 3, t1: 6, to: 6, path: [0, 2, 6], eta: '0:15' },
  { t0: 6, t1: 9.5, to: 10, path: [0, 4, 7, 10], eta: '0:23', shift: true },
];
const REACH = [1, 2, 4, 6, 7, 11, 10, 8, 3];
const HOVERW = new Map();
function hoverWash(g, T, C, k, i) {
  const id = `${T.id}|${i}|${k}|${C.z.toFixed(3)}|${C.ox.toFixed(1)}|${C.oy.toFixed(1)}`;
  if (!HOVERW.has(id)) {
    const L = tinted(maskLayer(k, C, nodeMask(i), 1.2), T.mat === 'current' ? '#ffffff' : T.ink);
    if (HOVERW.size > 40) HOVERW.delete(HOVERW.keys().next().value);

}
function pathTopic(g, T, Wd, C, k, t, V) {
  const st = PATH_STEPS.find((s) => t >= s.t0 && t < s.t1) || PATH_STEPS[2];
  const age = t - st.t0;
  hoverWash(g, T, C, k, st.to);
  worldT(g, C, k);
  drawPackets(g, T, Wd, t);
  drawIntents(g, T, Wd, t);
  drawGroups(g, T, Wd, t);
  // the selection and the reachable nodes
  selectMark(g, T, ...XY(0), unitWidth(6) * 0.92 * 0.62);
  for (const i of REACH) {
    const [x, y] = XY(i), r = ringR(i) + 9;
    g.save();
    if (V === '0') { g.strokeStyle = rgba(T.own, 0.9); g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); }
    else {
      for (let j = 0; j < 12; j++) {
        const a0 = (j / 12) * Math.PI * 2 - Math.PI / 2 + 0.06, a1 = a0 + (Math.PI * 2) / 12 - 0.24;
        g.strokeStyle = CAS; g.lineWidth = 3.4; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke();
        g.strokeStyle = rgba(T.ink, i === st.to ? 1 : 0.75); g.lineWidth = hair(i === st.to ? 1.3 : 0.9); g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke();
      }
    }
    g.restore();
  }

  const L = plen(pts);
  const grow = ST.rm ? 1 : eOut(clamp(age / 0.35));
  if (st.shift) {
    // the planned order it would make: its preview along the path, the bonus over the target
    orderArrow(g, T, pslice(pts, 0, L * grow), { ghost: true, alpha: 0.9, t });
    const [x, y] = XY(st.to);
    const r = ringR(st.to);
    if (V === '0') tag(g, CUR, '+1  gathers 3 s', x, y - r - 26, {});
    else tag(g, T, '+1', x, y - r - 24, { lead: (lx, ly) => chevrons(g, T, lx, ly + 1, 'up', 1, 9), leadW: 11 });
  } else if (V === '0') {
    g.save(); g.strokeStyle = 'rgba(240,246,252,.45)'; g.lineWidth = 1.4; pline(g, pslice(pts, 0, L * grow)); g.stroke();
    const c = ((t * 140) % (L + 60)) - 30;

    g.restore();

    // beads running along the route towards the target, larger as they come; none inside a ring
    g.save();
    for (let d = (t * 34) % 9; d < L * grow; d += 9) {
      const [x, y] = pat(pts, d), r = lerp(1, 2.4, d / L);
      if (st.path.some((i) => Math.hypot(x - XY(i)[0], y - XY(i)[1]) < ringR(i) + 3)) continue;
      g.fillStyle = CAS; g.beginPath(); g.arc(x, y, r + 1.2, 0, 7); g.fill();
      g.fillStyle = T.ink; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    g.restore();
  } else {
    // the order it would make, as a shadow
    orderArrow(g, T, pslice(pts, 0, L * grow), { ghost: true, alpha: 0.75, t });
  }
  // the travel time at the target (a number is the information)
  const [x, y] = XY(st.to);
  if (!st.shift) {
    if (V === '0') {
      const [mx, my] = pat(pts, L * 0.62);
      g.fillStyle = '#161b22'; g.strokeStyle = '#30363d'; g.lineWidth = 1; g.beginPath(); g.arc(mx + 16, my - 14, 9, 0, 7); g.fill(); g.stroke();
      text(g, CUR, '⧗', mx + 16, my - 14, 10, { halo: false });
      tag(g, CUR, `${parseInt(st.eta.slice(2), 10)} s`, mx + 42, my - 14, {});
    } else tag(g, T, st.eta, x + ringR(st.to) + 30, y - 2, {});
  }
}
// The ruled route of a path of nodes (the i pick): a piece per road between the rings, chevrons to the target.
function ruledRoute(g, T, path, grow = 1) {
  const segs = [];
  for (let j = 1; j < path.length; j++) {
    const a = path[j - 1], b = path[j];
    const [ax, ay] = XY(a), [bx, by] = XY(b);
    const l = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / l, uy = (by - ay) / l;
    const ra = j === 1 ? unitWidth(6) * 0.5 : ringR(a) + 5, rb = ringR(b) + 5;
    segs.push([[ax + ux * ra, ay + uy * ra], [bx - ux * rb, by - uy * rb]]);
  }
  const total = segs.reduce((s2, q) => s2 + plen(q), 0);
  let left = total * grow;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const sg of segs) {
    if (left <= 0) break;
    const part = pslice(sg, 0, Math.min(plen(sg), left));
    left -= plen(sg);
    g.strokeStyle = CAS; g.lineWidth = 9; g.globalAlpha = 0.55; pline(g, part); g.stroke();
    g.globalAlpha = 1;
    g.strokeStyle = T.ink; g.lineWidth = hair(0.9);
    pline(g, poff(part, 3.4)); g.stroke(); pline(g, poff(part, -3.4)); g.stroke();
    for (let d = 8; d < plen(part) - 4; d += 13) {
      const [x, y, ux, uy] = pat(part, d), nx = -uy, ny = ux;
      g.beginPath(); g.moveTo(x - ux * 2.2 + nx * 2.4, y - uy * 2.2 + ny * 2.4); g.lineTo(x + ux * 1.4, y + uy * 1.4); g.lineTo(x - ux * 2.2 - nx * 2.4, y - uy * 2.2 - ny * 2.4); g.stroke();
    }
  }
  g.restore();
}

// topics (d fight, f supply, h arrows, i path, j capture, k builds, l fort icon, m bounce, n fog, o map,

// events (AGENTS.md 7.1, 7.3).

// The looks of the base layers, set by the board before it draws (part of the base cache key).
let FOGV = '0', MAPV = '0', FORTICON = '1';

// --- a. CP: the rule and needle of round 2, without the overflow; full, the whole bar is set off ---------
// The next quantum is ruled in only up to the cap (nothing runs past the scale, a quantum burnt at the cap
// shows nothing). At the cap: R1 an engraved double frame closes round the bar with lozenge serifs at its ends;
// R2 the bar turns to paper with the own colour as a hairline in it. No glow either way.
function cpRule3(g, x, y, s, T, short, V) {
  const w = 150, n = s.cap, u = w / n;
  const base = y + 4;
  const full = s.v >= s.cap - 1e-6;
  g.save();
  g.strokeStyle = CAS; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 1, base); g.lineTo(x + w + 1, base); g.stroke();
  g.strokeStyle = T.ink; g.lineWidth = 1; g.beginPath(); g.moveTo(x, base + 0.5); g.lineTo(x + w, base + 0.5); g.stroke();
  for (let j = 0; j <= n * 2; j++) {
    const xx = Math.round(x + (j * u) / 2) + 0.5, big = j % 2 === 0;
    g.beginPath(); g.moveTo(xx, base); g.lineTo(xx, base + (big ? 7 : 4)); g.stroke();
  }
  g.fillStyle = CAS; g.fillRect(x - 1, base - 9, w + 2, 8);
  if (full) {
    if (V === 'R1') {
      g.fillStyle = T.own; g.fillRect(x, base - 8, w, 6);
      // the double frame: an outer rule and an inner hairline, cased, closed by two lozenge serifs
      g.strokeStyle = CAS; g.lineWidth = 3; g.strokeRect(x - 3.5, base - 11.5, w + 7, 12);
      g.strokeStyle = T.ink; g.lineWidth = 1; g.strokeRect(x - 3.5, base - 11.5, w + 7, 12);
      g.lineWidth = 0.7; g.strokeRect(x - 1.5, base - 9.5, w + 3, 8);
      for (const xx of [x - 3.5, x + w + 3.5]) {
        g.save(); g.translate(xx, base - 5.5); g.rotate(Math.PI / 4);
        g.fillStyle = T.ink; g.fillRect(-2.8, -2.8, 5.6, 5.6); g.strokeStyle = CAS; g.lineWidth = 1; g.strokeRect(-2.8, -2.8, 5.6, 5.6);
        g.restore();
      }
    } else {
      g.fillStyle = T.ink; g.fillRect(x, base - 8, w, 6);
      g.fillStyle = T.own; g.fillRect(x, base - 5.6, w, 1.2);
      g.strokeStyle = T.ink; g.lineWidth = 1; g.beginPath(); g.moveTo(x, base - 11); g.lineTo(x + w, base - 11); g.stroke();
    }
  } else {
    g.fillStyle = short ? T.enemy : T.own; g.fillRect(x, base - 8, u * s.v, 6);
    const b = Math.min(n, s.v + s.p);
    g.fillStyle = hatch(g, T.own, 90, 2.4, 1, 0.95);
    g.fillRect(x + u * s.v, base - 8, u * (b - s.v), 6);
    const cxp = x + u * b;
    polyPath(g, [[cxp, base - 10], [cxp - 4, base - 16], [cxp + 4, base - 16]]);
    g.fillStyle = '#0e0c09'; g.fill(); g.strokeStyle = T.ink; g.lineWidth = 1; g.stroke();
  }
  if (s.spend && s.spend.age < 0.5) { g.globalAlpha = 1 - s.spend.age / 0.5; g.fillStyle = hatch(g, T.own, 45, 2.6, 1, 1); g.fillRect(x + u * s.v, base - 8, u * (s.spend.from - s.v), 6); g.globalAlpha = 1; }
  const vx = x + u * s.v;
  polyPath(g, [[vx, base - 1], [vx - 4.5, base + 7], [vx + 4.5, base + 7]]);
  g.fillStyle = T.ink; g.fill(); g.strokeStyle = CAS; g.lineWidth = 1; g.stroke();
  if (s.price !== null) {
    const xa = x + u * (short ? s.v : s.v - s.price), xb = Math.max(x + u * (short ? s.price : s.v), xa + 6);
    const yb = base + 11;
    g.strokeStyle = CAS; g.lineWidth = 3.4; g.beginPath(); g.moveTo(xa, yb - 3); g.lineTo(xa, yb); g.lineTo(xb, yb); g.lineTo(xb, yb - 3); g.stroke();
    g.strokeStyle = short ? T.enemy : T.ink; g.lineWidth = 1.2; g.stroke();
    if (short) chevrons(g, ENG, xb + 8, yb - 1, 'down', 1, 9);
  }
  g.restore();
  return w + 14;
}

// --- h. Arrows: Burin, made to read on every ground ------------------------------------------------------
// B0 the round 2 burin. B1 cased: a paper casing outside the dark one (the arrow reads on dark forest and on
// pale plains alike) and the owner's colour laid between the hairlines. B2 as B1 with a burin point running to
// the head (the moving element). B3 heavy: a broad owner core on the casing, one ink hairline down its middle,
// chevrons cut out of the core and running. P0..P3: the same as the path shadow (outline only, see topic i).
function burinArrow(g, T, pts, o) {
  const V = o.V;
  const side = o.side || 'own';
  const col = sideCol(T, side);
  const L = plen(pts);
  if (L < 4) return;
  const t = o.t || 0;
  const ghost = o.ghost || V[0] === 'P';
  const style = V[0] === 'P' ? { P0: 'B0', P1: 'B1', P2: 'B2', P3: 'B1' }[V] : V;
  g.save();
  g.globalAlpha *= o.alpha ?? 1;
  g.lineJoin = 'round';
  g.lineCap = 'round';
  const [hx, hy, ux, uy] = pat(pts, L);
  const headL = style === 'B3' ? 13 : 12;
  const body = pslice(pts, 0, Math.max(0, L - (o.noHead ? 0 : headL - 2)));
  if (o.walked && o.walked.length > 1) walkedPart(g, T, o.walked, '1', col);
  const hw = style === 'B0' ? 1.25 : style === 'B3' ? 2.2 : 1.9;
  if (style === 'B0') {
    if (!ghost) { g.strokeStyle = CAS; g.lineWidth = 4.4; pline(g, body); g.stroke(); }
    else for (const s2 of [hw, -hw]) { g.strokeStyle = rgba(CAS, 0.7); g.lineWidth = 2.6; pline(g, poff(body, s2)); g.stroke(); }
    g.strokeStyle = T.ink; g.lineWidth = hair(0.9);
    pline(g, poff(body, hw)); g.stroke(); pline(g, poff(body, -hw)); g.stroke();
  } else {
    // the paper casing (outside), then the dark casing, then the body
    const wide = hw * 2 + 4.6;
    g.strokeStyle = rgba(PAPER, ghost ? 0.22 : 0.34); g.lineWidth = wide + 2.4; pline(g, body); g.stroke();
    g.strokeStyle = CAS; g.lineWidth = wide; pline(g, body); g.stroke();
    if (style === 'B3' && !ghost) {
      g.strokeStyle = col; g.lineWidth = hw * 2; pline(g, body); g.stroke();
      g.strokeStyle = T.ink; g.lineWidth = hair(0.8); pline(g, body); g.stroke();
      // chevrons cut out of the core, running to the head
      const lb = plen(body);
      for (let d = (t * 22) % 16 + 6; d < lb - 6; d += 16) {
        const [cx, cy, tx, ty] = pat(body, d), nx = -ty, ny = tx;
        g.strokeStyle = CAS; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(cx - tx * 2.4 + nx * hw, cy - ty * 2.4 + ny * hw); g.lineTo(cx + tx * 0.8, cy + ty * 0.8); g.lineTo(cx - tx * 2.4 - nx * hw, cy - ty * 2.4 - ny * hw); g.stroke();
      }
    } else {
      if (!ghost) { g.strokeStyle = col; g.lineWidth = hw * 2 - 0.6; pline(g, body); g.stroke(); }
      else { g.strokeStyle = hatch(g, col, Math.atan2(uy, ux) * 57.3 + 90, 2.6, 0.9, 0.9); g.lineWidth = hw * 2 - 0.6; pline(g, body); g.stroke(); }
      g.strokeStyle = T.ink; g.lineWidth = hair(0.9);
      pline(g, poff(body, hw)); g.stroke(); pline(g, poff(body, -hw)); g.stroke();
      if (style === 'B2') {
        // the burin point: a small ink lozenge on a dark casing running towards the head, one per 46 units
        const lb = plen(body);
        for (let d = (t * 30) % 46; d < lb - 4; d += 46) {
          if (d < 4) continue;
          const [cx, cy, tx, ty] = pat(body, d);
          const fade = Math.min(1, d / 14, (lb - d) / 14);

  const pick = t < 2.5;

  drawFortLine(g, T, 10, 'own', st, PICK.c, t);
  const [x, y] = XY(10);
  if (!pick && t < 7.5) cityPlate(g, T, x, y - ringR(10) - 14, [{ kind: 'build', glyph: 'fort', share: clamp((t - 2.5) / 5) }]);

}

// --- n. Fog of war ---------------------------------------------------------------------------------------------
// N1 Ruled veil: a single run of fine horizontal rules over a greyed land, the owner hatch and borders kept, the
// edge of the sight a double hairline with ticks into the fog. N2 Stipple veil: dots instead of rules, the owner's
// borders kept, the edge a row of beads. The memory of what was last seen keeps the stippled outline and its age.
const FOG3 = {
  '1': { desat: 0.9, veil: 0.3, tint: 0.85, borders: 0.9, rules: [0, 3.4, 0.5] },
  '2': { desat: 0.8, veil: 0.36, tint: 0.55, borders: 0.85, dots: [4.2, 0.55] },
};
const DOTPAT = new Map();
function dotPattern(g, pitch, alpha) {
  const key = `${pitch}|${alpha}|${ZC.toFixed(2)}`;
  if (!DOTPAT.has(key)) {
    const S = 8, c = canvas(pitch * S, pitch * S), h = c.getContext('2d');
    h.fillStyle = rgba('#050403', alpha);
    const r = Math.max(0.55, 0.75 / Math.max(0.5, ZC)) * S;
    h.beginPath(); h.arc(pitch * S * 0.25, pitch * S * 0.25, r, 0, 7); h.arc(pitch * S * 0.75, pitch * S * 0.75, r, 0, 7); h.fill();
    DOTPAT.set(key, c);
  }
  const p = g.createPattern(DOTPAT.get(key), 'repeat');
  p.setTransform(new DOMMatrix().scale(1 / 8));
  return p;
}
function fogEdges(vis) {
  const out = [];
  for (const [l, r, flat] of NARROWS.chains) {
    if (!isNode(l) || !isNode(r)) continue;
    const vl = vis.has(l), vr = vis.has(r);
    if (vl === vr) continue;
    out.push({ p: chaikin(flat, 3), s: vl ? -1 : 1 });
  }
  return out;
}
function drawFog3(g, T, Wd, C, k) {
  const F = FOG3[FOGV];
  const small = fogMask(Wd.visible);
  const M = () => maskLayer(k, C, small, 4);
  blit(g, tinted(M(), '#808080'), F.desat, 'saturation');
  blit(g, tinted(M(), '#0b0a08'), F.veil);
  const L = canvas(W * k, H * k);
  const lg = L.getContext('2d');
  worldT(lg, C, k);
  if (F.rules) { lg.fillStyle = hatch(lg, '#050403', F.rules[0], F.rules[1], 1, F.rules[2]); lg.fillRect(0, 0, MAPW, MAPH); }
  else { lg.fillStyle = dotPattern(lg, F.dots[0], F.dots[1]); lg.fillRect(0, 0, MAPW, MAPH); }
  blit(g, keepIn(L, M()), 1);
  for (const o of [0, 1]) { const S = sideFill(T, Wd, o, C, k); keepIn(S, M()); blit(g, S, F.tint); }
  const B = canvas(W * k, H * k), bg = B.getContext('2d');
  worldT(bg, C, k);
  drawBorderLines(bg, T, Wd, 0); drawBorderLines(bg, T, Wd, 1);
  keepIn(B, M());
  blit(g, B, F.borders);
  // the edge of the sight
  worldT(g, C, k);
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const e of fogEdges(Wd.visible)) {
    if (FOGV === '1') {
      g.strokeStyle = CAS; g.lineWidth = 3.2; path(g, e.p); g.stroke();
      g.strokeStyle = rgba(T.ink, 0.7); g.lineWidth = hair(0.7);
      path(g, offsetLine(e.p, 1)); g.stroke(); path(g, offsetLine(e.p, -1)); g.stroke();
      for (const [px, py, nx, ny] of along(e.p, 7)) { g.beginPath(); g.moveTo(px + nx * e.s * 1.4, py + ny * e.s * 1.4); g.lineTo(px + nx * e.s * 4.4, py + ny * e.s * 4.4); g.stroke(); }
    } else {
      g.fillStyle = rgba(T.ink, 0.75);
      for (const [px, py] of along(e.p, 4.5)) { g.beginPath(); g.arc(px, py, 0.95, 0, 7); g.fill(); }
    }
  }
  g.restore();
}
function fogTopic3(g, T, Wd, C, k, t, V) {
  worldT(g, C, k);
  drawPackets(g, T, Wd, t);
  drawIntents(g, T, Wd, t);
  drawGroups(g, T, Wd, t);
  for (const F of FIGHTS3) drawFight3(g, T, Wd, F, C, k, t, PICK.d, { noArena: true, noFeed: true });
}

// --- o. Map treatment on the Intaglio base -------------------------------------------------------------------
// O1 Border band: no hatch inside the land, a narrower and stronger band along the land borders, so the terrain
// reads clean in the middle of each land. O2 Even hatch: one light hatch over all of the land, no band; the border
// lines carry the ownership.
function sideFill3(T, Wd, o, C, k, col, m) {
  const L = canvas(W * k, H * k);
  const lg = L.getContext('2d');
  worldT(lg, C, k);
  const ang = o === 0 ? 0 : -45;
  if (MAPV === '1') {
    lg.strokeStyle = hatch(lg, col, ang, 3.2, 0.85, 0.85);
    lg.lineWidth = 26; lg.lineJoin = 'round'; lg.lineCap = 'round';
    for (const b of borders(Wd.owner).filter((q) => q.owner === o && q.nodes.every((l) => l >= 0 && l < 199))) { path(lg, b.p); lg.stroke(); }
  } else {
    lg.fillStyle = hatch(lg, col, ang, 4.2, 0.75, 0.3);
    lg.fillRect(0, 0, MAPW, MAPH);
  }
  return keepIn(L, maskLayer(k, C, m, 1.4));
}

// --- f. The Supply view: Streams of even width -----------------------------------------------------------------
// Only the own flow (DEC-43 item E). Every downhill road carries a channel of one width from ring to ring (no
// taper); the amount is the packets themselves (each a solid square riding the channel, from the snapshot's
// packets), and a road that carried one in this dispatch runs its marks. S1 Canal: two ink rails, the owner's
// hachures across, drifting downhill. S2 Chain: a row of open lozenges, linked, drifting downhill. S3 Pulse: a
// solid owner core with V notches cut out of it, running downhill; an idle road shows its core hatched.
function streamRoad(g, T, V, a, b, busy, t) {
  const { x0, y0, x1, y1, ux, uy } = roadSeg(a, b);
  const pts = [[x0, y0], [x1, y1]];
  const L = Math.hypot(x1 - x0, y1 - y0);
  const nx = -uy, ny = ux, hw = 2.8;
  const run = busy ? t * 11 : 0;
  g.save();
  g.lineCap = 'butt'; g.lineJoin = 'round';
  g.strokeStyle = CAS; g.lineWidth = hw * 2 + 3.2; pline(g, pts); g.stroke();
  if (V === 'S1') {
    g.strokeStyle = busy ? T.own : rgba(T.own, 0.38); g.lineWidth = hair(1.1);
    for (let d = (run % 3.4) + 1; d < L - 1; d += 3.4) {
      const x = x0 + ux * d, y = y0 + uy * d;
      g.beginPath(); g.moveTo(x + nx * hw - ux * 1.2, y + ny * hw - uy * 1.2); g.lineTo(x - nx * hw - ux * 1.2, y - ny * hw - uy * 1.2); g.stroke();
    }
    g.strokeStyle = T.ink; g.lineWidth = hair(0.8);
    for (const s of [hw, -hw]) { g.beginPath(); g.moveTo(x0 + nx * s, y0 + ny * s); g.lineTo(x1 + nx * s, y1 + ny * s); g.stroke(); }
  } else if (V === 'S2') {
    g.strokeStyle = rgba(T.ink, 0.55); g.lineWidth = hair(0.7); pline(g, pts); g.stroke();
    for (let d = (run % 8) + 4; d < L - 3; d += 8) {
      const x = x0 + ux * d, y = y0 + uy * d;
      g.save(); g.translate(x, y); g.rotate(Math.atan2(uy, ux));
      polyPath(g, [[3.4, 0], [0, -hw], [-3.4, 0], [0, hw]]);
      g.fillStyle = busy ? hatch(g, T.own, 90, 1.6, 0.8, 1) : '#0e0c09'; g.fill();
      g.strokeStyle = busy ? T.own : rgba(T.own, 0.5); g.lineWidth = hair(1); g.stroke();
      g.restore();
    }
  } else {
    g.strokeStyle = busy ? T.own : hatch(g, T.own, Math.atan2(uy, ux) * 57.3 + 90, 2.2, 0.8, 0.8); g.lineWidth = hw * 2; pline(g, pts); g.stroke();
    if (busy) for (let d = (run % 12) + 5; d < L - 4; d += 12) {
      const x = x0 + ux * d, y = y0 + uy * d;
      g.strokeStyle = CAS; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x - ux * 2.6 + nx * hw, y - uy * 2.6 + ny * hw); g.lineTo(x + ux * 0.6, y + uy * 0.6); g.lineTo(x - ux * 2.6 - nx * hw, y - uy * 2.6 - ny * hw); g.stroke();
    }
    g.strokeStyle = T.ink; g.lineWidth = hair(0.7);
    for (const s of [hw + 0.4, -hw - 0.4]) { g.beginPath(); g.moveTo(x0 + nx * s, y0 + ny * s); g.lineTo(x1 + nx * s, y1 + ny * s); g.stroke(); }
  }
  // the head of the channel at the receiving ring: a small cut V pointing downhill
  const hx = x1 - ux * 1, hy = y1 - uy * 1;
  g.strokeStyle = CAS; g.lineWidth = 3.4; g.lineJoin = 'miter';
  g.beginPath(); g.moveTo(hx - ux * 5 + nx * (hw + 2), hy - uy * 5 + ny * (hw + 2)); g.lineTo(hx, hy); g.lineTo(hx - ux * 5 - nx * (hw + 2), hy - uy * 5 - ny * (hw + 2)); g.stroke();
  g.strokeStyle = T.ink; g.lineWidth = hair(1.2); g.stroke();
  g.restore();
}

// --- p. City highlights -----------------------------------------------------------------------------------------
// Eight states on cities of the front: selected, hovered, a valid target, under attack (an enemy order is on its
// way), a fight that may take it, the own capital, cut off from the factories (starving, DEC-19), and two at once.
// H0 round 2: rings, cut ticks and a separate sign. H1 Rings: everything a ring round the capacity ring, each state
// its own stroke (double, single, cut, an amber notch towards the enemy, wedges, crenels, a broken ring).
// H2 Corners: the states as corner marks of a square round the city (brackets, notches, a crown, broken corners).
const HL_CELLS = [
  { label: 'selected', node: 1, c: [300, 470], st: ['sel'] },
  { label: 'hovered', node: 2, c: [190, 300], st: ['hov'] },
  { label: 'valid target', node: 6, c: [420, 310], st: ['tgt'] },
  { label: 'under attack', node: 11, c: [520, 470], st: ['att'], from: 14 },
  { label: 'fight in the city', node: 10, c: [640, 700], st: ['fgt'], from: 19 },
  { label: 'own capital', node: 0, c: [110, 465], st: ['cap'] },
  { label: 'cut off', node: 12, c: [640, 840], st: ['cut'] },
  { label: 'selected · under attack', node: 10, c: [640, 700], st: ['sel', 'att'], from: 19 },
];
function cornerMarks(g, x, y, r, len, col, w, which = [0, 1, 2, 3]) {
  for (const j of which) {
    const sx = j === 0 || j === 3 ? -1 : 1, sy = j < 2 ? -1 : 1;
    const cx = x + sx * r, cy = y + sy * r;
    const pts = [[cx, cy - sy * len], [cx, cy], [cx - sx * len, cy]];
    g.strokeStyle = CAS; g.lineWidth = w + 2.6; g.lineJoin = 'miter'; g.lineCap = 'butt'; pline(g, pts); g.stroke();
    g.strokeStyle = col; g.lineWidth = hair(w); pline(g, pts); g.stroke();
  }
}
function highlight(g, T, V, i, st, t, from) {
  const [x, y] = XY(i), R = ringR(i);
  const pulse = ST.rm ? 0.5 : (Math.sin(t * Math.PI * 2 / 1.4) + 1) / 2;
  const toward = from !== undefined ? Math.atan2(XY(from)[1] - y, XY(from)[0] - x) : 0;
  g.save();
  for (const s of st) {
    if (V === 'H0') {
      if (s === 'sel') selectMark(g, T, x, y, R + 2);
      if (s === 'hov') selectMark(g, T, x, y, R + 2, true);
      if (s === 'tgt') reachAt(g, T, x, y, R + 9, '0:15');
      if (s === 'att') warnSign(g, T, x + R + 8, y - R - 6);
      if (s === 'fgt') fightRing(g, T, x, y, R + 6, t);
      // the capital: its star is in the city body (hidden while a group stands there)
      if (s === 'cut') warnSign(g, T, x + R + 8, y - R - 6);
      continue;
    }
    if (V === 'H1') {
      const ring = (rr, w, col, a0 = 0, a1 = Math.PI * 2) => { g.strokeStyle = CAS; g.lineWidth = w + 2.8; g.beginPath(); g.arc(x, y, rr, a0, a1); g.stroke(); g.strokeStyle = col; g.lineWidth = hair(w); g.beginPath(); g.arc(x, y, rr, a0, a1); g.stroke(); };
      if (s === 'sel') { ring(R + 4, 1, T.ink); ring(R + 7, 1.6, T.ink); }
      if (s === 'hov') ring(R + 5, 0.9, rgba(T.ink, 0.85));
      if (s === 'tgt') reachAt(g, T, x, y, R + 9, '0:15');
      if (s === 'att') {
        // an amber notch on the side the enemy comes from, ticks pointing in, breathing
        ring(R + 6, 2, T.warn, toward - 0.7, toward + 0.7);
        for (let j = -2; j <= 2; j++) { const a = toward + j * 0.3; g.strokeStyle = T.warn; g.lineWidth = hair(1.2); g.beginPath(); g.moveTo(x + Math.cos(a) * (R + 13 + pulse * 3), y + Math.sin(a) * (R + 13 + pulse * 3)); g.lineTo(x + Math.cos(a) * (R + 8.5), y + Math.sin(a) * (R + 8.5)); g.stroke(); }
      }
      if (s === 'fgt') fightRing(g, T, x, y, R + 6, t);
      if (s === 'cap') {
        // crenels on a ring round the capital: always there
        const rr = R + 6;
        g.strokeStyle = CAS; g.lineWidth = 3.4; g.beginPath(); g.arc(x, y, rr, 0, 7); g.stroke();
        g.strokeStyle = T.ink; g.lineWidth = hair(0.9); g.beginPath(); g.arc(x, y, rr, 0, 7); g.stroke();
        for (let j = 0; j < 10; j++) { const a = (j / 10) * Math.PI * 2; g.save(); g.translate(x + Math.cos(a) * (rr + 1.6), y + Math.sin(a) * (rr + 1.6)); g.rotate(a); g.fillStyle = CAS; g.fillRect(-1.6, -2.4, 3.6, 4.8); g.fillStyle = T.ink; g.fillRect(-0.9, -1.6, 2.4, 3.2); g.restore(); }
      }
      if (s === 'cut') {
        for (let j = 0; j < 8; j++) { const a = (j / 8) * Math.PI * 2 + 0.1; ring(R + 6, 1.2, T.warn, a, a + Math.PI / 8); }
      }
      continue;
    }
    // H2 corners
    const r = R + 6;
    if (s === 'sel') cornerMarks(g, x, y, r, 7, T.ink, 1.6);
    if (s === 'hov') cornerMarks(g, x, y, r, 5, rgba(T.ink, 0.85), 1, [0, 2]);
    if (s === 'tgt') { for (let j = 0; j < 4; j++) { const a = Math.PI / 4 + (j * Math.PI) / 2; g.save(); g.translate(x + Math.cos(a) * (r + 3), y + Math.sin(a) * (r + 3)); g.rotate(a + Math.PI); polyPath(g, [[0, 0], [4.6, -3], [4.6, 3]]); g.strokeStyle = CAS; g.lineWidth = 2.4; g.stroke(); g.fillStyle = T.ink; g.fill(); g.restore(); } tag(g, T, '0:15', x, y - r - 14, { size: 12 }); }
    if (s === 'att') {
      const j = Math.cos(toward) > 0 ? (Math.sin(toward) > 0 ? 2 : 1) : Math.sin(toward) > 0 ? 3 : 0;
      cornerMarks(g, x, y, r + 1 + pulse * 2, 9, T.warn, 2, [j]);
    }
    if (s === 'fgt') { cornerMarks(g, x, y, r, 6, T.warn, 1.6); fightRing(g, T, x, y, R + 6, t); }
    if (s === 'cap') {
      g.save(); g.translate(x, y - R - 12);
      polyPath(g, [[-7, 3], [-7, -3], [-3.5, 0], [0, -4.5], [3.5, 0], [7, -3], [7, 3]]);
      g.strokeStyle = CAS; g.lineWidth = 3; g.lineJoin = 'miter'; g.stroke(); g.fillStyle = T.vp; g.fill(); g.strokeStyle = T.ink; g.lineWidth = hair(0.8); g.stroke();
      g.restore();
    }
    if (s === 'cut') { cornerMarks(g, x, y, r, 4, T.warn, 1.4); g.save(); g.translate(x + r + 6, y - r - 6); g.rotate(Math.PI / 4); g.fillStyle = CAS; g.fillRect(-5, -5, 10, 10); g.fillStyle = T.warn; g.fillRect(-3.6, -3.6, 7.2, 7.2); g.restore(); g.strokeStyle = '#16130f'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x + r + 6, y - r - 8.6); g.lineTo(x + r + 6, y - r - 5.6); g.moveTo(x + r + 6, y - r - 3.8); g.lineTo(x + r + 6, y - r - 3.6); g.stroke(); }
  }
  g.restore();
}
function highlightTopic3(g, T, Wd, C, k, t, V) {
  const cw = 312, ch = 380, gx = 8, gy = 14;
  HL_CELLS.forEach((cell, j) => {
    const col = j % 4, row = Math.floor(j / 4);
    const rect = { x: gx + col * (cw + 8), y: gy + row * (ch + 8), w: cw, h: ch };
    inset(g, T, Wd, k, rect, cell.c, 2.1 * ST.mz, `hl${j}`, () => {
      drawGroups(g, T, { ...Wd, groups: Wd.groups.filter((q) => q.at === cell.node || q.at === undefined) }, t);
      if (cell.st.includes('att') && cell.from !== undefined) {

        ribbonAt(g, T, { side: 'enemy', from: cell.from, to: cell.node, bend: 0.18 }, ...pts[0], ...pts.at(-1), plen(pts));
      }
      if (cell.st.includes('fgt')) {

      }
      highlight(g, T, V, cell.node, cell.st, t, cell.from);
    });
    inScreen(g, k, () => {

      g.fillStyle = '#b3a88f'; g.textBaseline = 'middle'; g.fillText(lab, rect.x + 7, rect.y + 10.5);
      g.letterSpacing = '0px';
    });
  });
}

// --- e. Plan fill: Eased steps, the bonus as slots ---------------------------------------------------------------
// The pill shows the asked bonus as chevron slots (gathered solid, still asked hollow): no "+1/3" to read.
function slotPill(g, T, x, y, asked, gathered) {
  const n = Math.min(asked, 5), w = 10 + n * 11, h = 17;
  panel(g, T, x - w / 2, y - h / 2, w, h, { weight: 'thin' });
  for (let j = 0; j < n; j++) {
    const cx = x - w / 2 + 10.5 + j * 11;
    if (j < gathered) chevrons(g, T, cx, y + 0.5, 'up', 1, 10);
    else hollowChevron(g, T, cx, y + 0.5, 10);
  }
}

//    the ink pass follows (140 to 420 ms) and sets the plate dark and the content solid behind its own soft edge.

function panelFrame(lg, box) {

  lg.fillStyle = '#0e0c09'; for (const [cx, cy] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) lg.fillRect(cx - 2, cy - 2, 4, 4);

function revealPanel5(g, T, V, box, anchor, R, mk, k) {
  if (!R) return;

  const above = anchor ? anchor[1] > y + h / 2 : false;
  const foot = anchor ? [clamp(anchor[0], x + 10, x + w - 10), above ? y + h : y] : [x + w / 2, y];
  const a = R.a, b = R.b;
  const rm = ST.rm || R.rm;
  // out: a fade (the scroll rolls back), the leader last
  let fade = 1, leader = 1;
  if (b >= 0) {
    const D = rm ? REV5_RM.out : REV[V].out;
    fade = 1 - sine(b / (V === 'RS' && !rm ? D * 0.75 : D));
    leader = 1 - sine((b - D * 0.5) / (D * 0.5));

  const body = mk(lg);

  const span = w + 8;
  if (V === 'RB') {
    const q = b >= 0 ? 1 : sine((a - 0.06) / 0.32);
    const X = x - 2 + span * q;
    // the plate and the content, inked in behind the burin
    panelFull(lg, T, box, body, { frame: false });
    // the soft edge trails the burin by 40 px and closes up as the cut ends, so the finished card is fully inked
    const fe = Math.min(40, w * 0.3);
    wipeMask(lg, box, X - 4 + (fe + 4) * q, fe);
    blitLayer(g);
    // the frame cut by the burin: hard up to its point
    if (q > 0) {
      const lg2 = panelLayer(k);
      panelFrame(lg2, box);
      wipeMask(lg2, box, X, 0);
      blitLayer(g);
      if (q < 1) {
        g.save();
        for (const yy of [y + 0.5, y + h - 0.5]) {
          g.translate(X, yy); g.rotate(Math.PI / 4);
          g.fillStyle = CAS; g.fillRect(-3.2, -3.2, 6.4, 6.4); g.fillStyle = T.ink; g.fillRect(-2, -2, 4, 4);

    }

    blitLayer(g);

    lg.restore();
    panelFrame(lg, box);
    wipeMask(lg, box, x - 2 + span * q1, 0);
    blitLayer(g);
    if (q2 > 0) {
      const lg2 = panelLayer(k);
      panelFull(lg2, T, box, mk(lg2));
      wipeMask(lg2, box, x - 2 + (span + 24) * q2, 24);

    }

    const q = b >= 0 ? 1 - sine(b / 0.18) : sine((a - 0.04) / 0.32);
    if (q <= 0) return;
    const X = x + w * q;
    panelFull(lg, T, box, body);
    wipeMask(lg, box, X, 0);
    blitLayer(g);
    if (q < 1) {

      g.save();
      g.fillStyle = CAS; g.fillRect(X - 2, y - 2, 7, h + 4);
      g.fillStyle = '#1a1712'; g.fillRect(X - 1, y - 1, 5, h + 2);
      g.fillStyle = 'rgba(236,228,209,.8)'; g.fillRect(X - 1, y - 1, 1, h + 2); g.fillRect(X + 3, y - 1, 1, h + 2);
      g.restore();

}

// The owner picked Wall on the road (round 4, I4). Polished, it is drawn on its own pixel grid at 16, 24 and 32 px
// instead of one 24-unit path scaled: every edge is axis-aligned, so it renders with crisp edges. The wall runs across,
// the road runs through a gate between two square towers that stand proud of it; the merlons face the enemy side.
// 32: two merlons each side, the towers 5 px wide, the gate 6 px, the road 2 px.
// 24: one merlon each side, the towers 4 px, the gate 4 px, the road 2 px.
// 16: one crenel a pixel deep cut into a 3 px wall, the towers 3 px proud of it, the gate 2 px, the road 1 px through it.
// Cut style: a ruled fill (1 px lines on a 2 px pitch at 16 and 24, 2.5 px at 32) inside the casing and the ink line;
// line style: the casing and the ink line only.
const FORT_PX = {
  32: { half: 'M1.5 21 V10.5 H4.5 V13 H7 V10.5 H9.5 V7.5 H13 V24.5 H9.5 V21 Z', road: 'M16 1 V31', rw: 2, ink: 1.5, cas: 3.6, pitch: 2.5 },
  24: { half: 'M1 16 V8 H3.5 V10 H6 V5.5 H10 V18.5 H6 V16 Z', road: 'M12 1 V23', rw: 2, ink: 1.25, cas: 3.2, pitch: 2 },
  16: { half: 'M0.5 10.5 V6.5 H1.5 V7.5 H2.5 V6.5 H3.5 V3.5 H7 V12.5 H3.5 V10.5 Z', road: 'M8 0.5 V15.5', rw: 1, ink: 1, cas: 2.4, pitch: 2 },

    body += `<path d="${d}" fill="url(#${sid})"/>`;

const R5TBY = Object.fromEntries(R5T.map((tp) => [tp.id, tp]));
const OPEN5_IDS = R5T.map((tp) => tp.id);

// --- The combined scenes: every locked pick together with my round 5 picks (Compare: round 4 as drawn) -------------
const R5S = R4S.map((S) => {
  if (S.id === 'hover') return { ...S, dyn(g, T, Wd, C, k, t) { revealTopic5(g, T, Wd, C, k, t, PICK.r); } };
  if (S.id === 'menu') return { ...S, name: 'City menu open: prices and the fort icon', world: chargeWorld5 };
  if (S.id === 'city') return { ...S, name: 'Cities building and recruiting' };
  return S;
});
const R5SBY = Object.fromEntries(R5S.map((s) => [s.id, s]));

// =============================================================================================
// The mockup shell. The state lives in the address: #tp=s&v=F2&s=front&cmp=0&gray=0&rm=0&slow=0&z=fit&mz=1&t=1.5
// =============================================================================================
const ST = { tp: 's', v: 'KA', s: 'whole', cmp: false, gray: false, rm: false, slow: false, z: 'fit', mz: 1, t: null };
const isScenes = () => ST.tp === 's';
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('tp') && (R5TBY[h.get('tp')] || h.get('tp') === 's')) ST.tp = h.get('tp');
  if (!isScenes()) ST.v = PICK5[ST.tp];
  if (h.get('v')) ST.v = h.get('v');
  if (h.get('s') && R5SBY[h.get('s')]) ST.s = h.get('s');
  ST.cmp = h.get('cmp') === '1';
  ST.gray = h.get('gray') === '1';
  ST.slow = h.get('slow') === '1';
  ST.rm = h.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  ST.z = h.get('z') || 'fit';
  ST.mz = parseFloat(h.get('mz') || '1') || 1;
  ST.t = h.has('t') ? parseFloat(h.get('t')) : null;
  ST.fc = h.get('fc') ? h.get('fc').split(',').map(Number) : null;
}
function writeHash() {
  const h = new URLSearchParams({ tp: ST.tp, v: ST.v, s: ST.s, cmp: ST.cmp ? '1' : '0', gray: ST.gray ? '1' : '0', rm: ST.rm ? '1' : '0', slow: ST.slow ? '1' : '0', z: ST.z, mz: String(ST.mz) });
  if (ST.t !== null) h.set('t', ST.t.toFixed(2));
  if (ST.fc) h.set('fc', ST.fc.join(','));
  history.replaceState(null, '', '#' + h.toString());
}
const cur = () => (isScenes() ? R5SBY[ST.s] : R5TBY[ST.tp]);
const STILL = { a: 2.45, k: 5.6, c: 6.2, l: 4.5, p: 1, r: 1.6, u: 1, whole: 2.85, front: 2.85, capture: 2.2, supply: 6.2, city: 4.2, menu: 1, hover: 3.6, group: 0.5 };

function buildChrome() {
  const tb = document.getElementById('topics');
  tb.innerHTML = '<button type="button" data-tp="s"><span class="tk">∑</span>Combined</button>' + R5T.map((tp) => `<button type="button" data-tp="${tp.id}" title="${esc(tp.title)}"><span class="tk">${tp.locked ? '■' : tp.id}</span>${esc(tp.name)}</button>`).join('');
  tb.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    ST.tp = b.dataset.tp;
    if (!isScenes()) ST.v = PICK5[ST.tp];
    ST.t = null; ST.fc = null;
    sync();
  });
  document.getElementById('vlist').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (isScenes()) ST.s = b.dataset.id; else { ST.v = b.dataset.id; ST.cmp = false; }
    ST.t = null;
    sync();
  });
  document.getElementById('cmp').addEventListener('change', (e) => { ST.cmp = e.target.checked; sync(); });
  document.getElementById('gray').addEventListener('change', (e) => { ST.gray = e.target.checked; sync(); });
  document.getElementById('rm').addEventListener('change', (e) => { ST.rm = e.target.checked; sync(); });
  document.getElementById('slow').addEventListener('change', (e) => { const t = clock(); ST.slow = e.target.checked; if (ST.t === null) T0 = performance.now() / 1000 - t * (ST.slow ? 5 : 1); sync(); });
  document.getElementById('zoom').addEventListener('change', (e) => { ST.z = e.target.value; sync(); });
  document.getElementById('mz').addEventListener('change', (e) => { ST.mz = parseFloat(e.target.value); sync(); });
  document.getElementById('play').addEventListener('click', () => {
    if (ST.t === null) ST.t = clock();
    else { T0 = performance.now() / 1000 - ST.t * (ST.slow ? 5 : 1); ST.t = null; }
    syncTransport();
    writeHash();
  });
  document.getElementById('scrub').addEventListener('input', (e) => { ST.t = parseFloat(e.target.value); syncTransport(); writeHash(); frame(); });
  addEventListener('resize', () => layout());
}
function syncTransport() {
  const p = cur().period;
  document.getElementById('scrub').max = String(p);
  document.getElementById('play').textContent = ST.t === null && !ST.rm ? 'Pause' : 'Play';
  document.getElementById('play').disabled = ST.rm;
  const marks = (!isScenes() && cur().marks) || [];
  document.getElementById('marks').innerHTML = marks.map(([tt, l]) => `<span style="left:${((tt / p) * 100).toFixed(2)}%">${esc(l)}</span>`).join('');
}
let BOARDS = [];
function sync() {
  document.querySelectorAll('#topics button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tp === ST.tp)));
  const vl = document.getElementById('vlist');
  if (isScenes()) {
    document.getElementById('vhead').textContent = 'Combined · the locked set with my round 5 picks';
    vl.innerHTML = R5S.map((s, i) => `<li><button type="button" data-id="${s.id}" aria-current="${s.id === ST.s}"><span class="vn">${i + 1}</span><span>${esc(s.name)}</span></button></li>`).join('');
  } else {
    const tp = R5TBY[ST.tp];
    document.getElementById('vhead').textContent = `${tp.locked ? 'Locked' : 'Open'} · ${tp.title}`;
    vl.innerHTML = tp.variants.map(([id, name, idea], i) => `<li><button type="button" data-id="${id}" aria-current="${!ST.cmp && id === ST.v}"><span class="vn">${i}</span><span>${esc(name)}${PICK5[tp.id] === id ? `<span class="pick">${tp.locked ? 'locked' : 'pick'}</span>` : ''}</span><small>${esc(idea)}</small></button></li>`).join('');
  }
  document.getElementById('cmp').checked = ST.cmp;
  document.getElementById('gray').checked = ST.gray;
  document.getElementById('rm').checked = ST.rm;
  document.getElementById('slow').checked = ST.slow;
  document.getElementById('zoom').value = ST.z;
  document.getElementById('mz').value = String(ST.mz);
  document.body.classList.toggle('gray', ST.gray);
  buildBoards();
  syncTransport();
  writeHash();
  frame();
}
function boardList() {
  if (isScenes()) {
    return ST.cmp ? [{ id: 'o4', v: ENG, label: 'Round 4 as drawn (battery, Engrave, Pips then Courses, Gatehouse)' }, { id: 'o5', v: ENG, label: 'Round 5: the locked set with my picks' }] : [{ id: 'o5', v: ENG, label: 'Locked set · round 5 picks' }];
  }
  const tp = R5TBY[ST.tp];
  const ids = ST.cmp ? tp.variants.map(([id]) => id) : [ST.v];
  return ids.map((id) => { const j = Math.max(0, tp.variants.findIndex(([x]) => x === id)); const vr = tp.variants[j]; return { id: vr[0], v: ENG, label: `${j} ${vr[1]}` }; });
}
function buildBoards() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const S = cur();
  BOARDS = boardList().map((bd) => {
    const el = document.createElement('div');
    el.className = 'board';
    el.innerHTML = `<p class="bl"><b>${esc(bd.label)}</b><span>${esc(isScenes() ? S.name : S.title)}</span></p><div class="clip"><div class="art v-eng"><canvas class="mcv" aria-label="${esc(bd.label)}: ${esc(isScenes() ? S.name : S.title)}"></canvas></div></div>`;
    stage.appendChild(el);
    const art = el.querySelector('.art');
    let C = null;
    if (S.cam) { C = ST.fc ? cam(...ST.fc) : S.cam(); if (ST.mz !== 1) C = cam((W / 2 - C.ox) / C.z, (HUD_H + (H - HUD_H) / 2 - C.oy) / C.z, C.z * ST.mz); }
    boardLooks(bd.id);
    art.insertAdjacentHTML('beforeend', S.html(bd.v, C, bd.id));
    if (S.post) S.post(art);
    return { id: bd.id, v: bd.v, el, art, cv: art.querySelector('canvas.mcv'), cpw: art.querySelector('canvas.cpw'), capi: art.querySelector('.capi'), ptr: art.querySelector('.ptr'), lsp: art.querySelector('.lsp .val'), Wd: S.world(), C, k: 1 };
  });
  layout();
}
function layout() {
  const stage = document.getElementById('stage');
  const aw = stage.clientWidth - 28, ah = stage.clientHeight - 28;
  let s;
  if (BOARDS.length > 1) {
    const cols = BOARDS.length > 2 && aw > 1500 ? Math.min(3, BOARDS.length) : 2;
    const rows = Math.ceil(BOARDS.length / cols);
    s = Math.min((aw - (cols - 1) * 16) / cols / W, (ah - rows * 24 - (rows - 1) * 14) / rows / H, 0.6);
  } else s = ST.z === 'fit' ? Math.min(aw / W, (ah - 22) / H, 1) : parseFloat(ST.z);
  stage.style.alignContent = BOARDS.length > 1 || ST.z !== 'fit' ? 'flex-start' : 'center';
  const dpr = window.devicePixelRatio || 1;
  for (const b of BOARDS) {
    const clip = b.el.querySelector('.clip');
    clip.style.width = `${W * s}px`;
    clip.style.height = `${H * s}px`;
    b.art.style.transform = `scale(${s})`;
    const k = Math.max(1, Math.min(3, Math.round(dpr * s * 2) / 2));
    if (k !== b.k || b.cv.width !== W * k) { b.k = k; b.cv.width = W * k; b.cv.height = H * k; }
    if (b.cpw) { const kk = Math.max(1, Math.round(dpr * s * 2) / 2); b.cpw.width = 300 * kk; b.cpw.height = 40 * kk; b.cpk = kk; }
  }
  frame();
}
let T0 = performance.now() / 1000;
function clock() {
  const S = cur();
  if (ST.rm) return STILL[S.id] ?? 0.5;
  if (ST.t !== null) return ST.t;
  return ((performance.now() / 1000 - T0) / (ST.slow ? 5 : 1)) % S.period;
}
// The looks of a board: the scenes show the open topics as in round 3 ('o3') or in my picks ('o4'); a topic board
// shows its own variant with every other topic in the round 4 set.
function boardLooks(id) {
  if (isScenes()) { setLooks(id === 'o4' ? OPEN_R4B : OPEN_R5); return; }
  setLooks({ ...OPEN_R5, [ST.tp]: id });
}
function renderBoard(b, t) {
  const S = cur(), T = b.v, k = b.k;
  boardLooks(b.id);
  const V = b.id;
  BLD = '4';
  SNAP = true;
  const C = b.C, Wd = b.Wd;
  ZC = C.z; ZK = C.z * k;
  const g = b.cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  const key = `${isScenes() ? S.id : ST.tp}|${BLD}|${b.id}`;
  if (S.capture) {
    const cap = S.capture;
    const before = base(T, Wd, C, k, key);
    const Wa = { ...Wd, owner: { ...Wd.owner, [cap.node]: cap.side === 'own' ? 0 : 1 }, forts: Wd.forts.filter((f) => f[0] !== cap.node), stock: Object.fromEntries(Object.entries(Wd.stock).filter(([i]) => Number(i) !== cap.node)), build: Object.fromEntries(Object.entries(Wd.build).filter(([i]) => Number(i) !== cap.node)) };
    const after = base(T, Wa, C, k, key);
    const age = t - (typeof cap.start === 'function' ? cap.start(V) : cap.start);
    const p = age <= 0 ? 0 : eOutQ(age / 1.0);
    const settle = (age - 0.86) / 0.26;
    if (ST.rm && age > 0) blit(g, after);
    else composeCapture(g, T, before, after, C, k, cap.node, cap.side, age <= 0 ? 0 : Math.max(0.001, p), settle);
    if (!ST.rm && age > 0 && age < 1) { worldT(g, C, k); drawFloodFront(g, T, cap.node, cap.side, p); }
    S.dyn(g, T, age > 0 ? { ...Wa, groups: Wd.groups, fights: Wd.fights, intents: Wd.intents, packets: Wd.packets } : Wd, C, k, t, V);
  } else {
    blit(g, base(T, Wd, C, k, key));
    S.dyn(g, T, Wd, C, k, t, V);
  }
  if (b.cpw) {
    const cg = b.cpw.getContext('2d');
    cg.setTransform(1, 0, 0, 1, 0, 0);
    cg.clearRect(0, 0, b.cpw.width, b.cpw.height);
    cg.setTransform(b.cpk, 0, 0, b.cpk, 0, 0);
    const onTopic = ST.tp === 'a' && !isScenes();
    paintCP(cg, onTopic ? V : PICK.a, 2, 20, onTopic ? cpState(t) : cpScene(t), ENG);
  }
  if (b.capi) b.capi.style.height = `${Math.round(((t % 8) / 8) * 100)}%`;
  if (b.lsp && S.leaf) b.lsp.textContent = S.leaf(t) ? `−${S.leaf(t)}` : '0';
  if (b.ptr) {
    const p = S.ptr ? S.ptr(C, t) : true;
    if (S.ptr) { b.ptr.style.display = p ? '' : 'none'; if (p) { b.ptr.style.left = `${p[0] - 1}px`; b.ptr.style.top = `${p[1] - 1}px`; } }
  }
}
function frame() {
  const t = clock();
  for (const b of BOARDS) renderBoard(b, t);
  document.getElementById('scrub').value = String(t);
  document.getElementById('clock').textContent = `${t.toFixed(2)} s of ${cur().period} s${ST.slow ? ' · slow ×5' : ''}`;
}
function tick() {
  if (ST.t === null && !ST.rm) frame();
  requestAnimationFrame(tick);
}
async function init() {
  readHash();
  buildChrome();
  await Promise.all([loadMatch(), document.fonts.load('600 13px Cinzel'), document.fonts.load("500 16px 'EB Garamond'"), document.fonts.load("italic 500 16px 'EB Garamond'")]);
  document.body.classList.add('ready');
  sync();
  requestAnimationFrame(tick);
  document.body.dataset.ready = '1';
}
init();
</script>
</body>
