# Ruleset dec07: pinned numbers for the table tests of the fight (DEC-07, DEC-24; SIM-09, #25).
# Balance iterations change rulesets/mvp-*.toml, not this file: the fight numbers here match the
# params in packages/protocol/vectors/combat.json (test_combat.py checks this). The rest is a full
# ruleset of the current format (#894); its economy numbers matter to no test that loads it.
#
# Units (AGENTS.md, section 4.1): durations in ticks (10 ticks = 1 second), CP in hundredths.

