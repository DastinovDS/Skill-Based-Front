# Рулсет dec07: закреплённая копия mvp-0 для табличных тестов боя DEC-07 (SIM-09, #25).
# Итерации баланса меняют rulesets/mvp-0.toml, а не этот файл: числа боя здесь совпадают с
# params в packages/protocol/vectors/combat.json (это проверяет test_combat.py).
#
# Источник правил: docs/design/mechanics.md (решения DEC, раздел 21).
# Значения и имена ключей: SIM-01 (#17), таблица «Значения и примечания».
# Загрузчик: gow_sim.ruleset.load_ruleset(). Неизвестный или отсутствующий ключ, дробное число
# и значение вне диапазона: ошибка загрузки с именем ключа. Хэш рулсета (ruleset_hash) считается
# по значениям, а не по тексту: комментарии и порядок ключей на него не влияют.
#
# Единицы (AGENTS.md, §4.1):
# - все длительности: целое число тиков, 10 тиков = 1 секунда;
# - CP: в сотых долях (100 = 1 CP);
# - только целые числа, никаких float.
#
# Числа меняются только через этот файл и балансировку (BAL-02, #40), а не в коде систем.

# Часы и длина партии (DEC-03, #9; mechanics.md, разделы 1 и 11).
tick_hz = 10 # тиков в секунду
match_ticks = 7200 # партия 12 минут

[cp]
# Командные очки (DEC-02, #8; mechanics.md, разделы 6 и 14). Плоский реген, не растёт от территории.
start = 300 # стартовый запас: 3 CP (SIM-01, #17)
cap = 500 # потолок: 5 CP; на потолке излишек CP сгорает (DEC-02)
per_period = 100 # квант регена: 1 CP ...
period_ticks = 50 # ... раз в 50 тиков (5 с); квант делится по стойке (DEC-02)

[economy]
# Модель экономики и стойка CP (DEC-02, #8; mechanics.md, разделы 6 и 7).
# Плоская экономика: снабжение производит только столица.
# Раз в cp.period_ticks квант cp.per_period делится по стойке: доля в заряды
# (value * pct // 100, округление вниз) копится в аккумуляторе в сотых долях заряда
# по курсу charges_per_cp и превращается в целые заряды; остальное идёт в CP.
# Доля стойки в заряды начисляется всегда, даже на потолке CP.
charges_per_cp = 2 # курс: 1 CP -> 2 заряда
# Стойка обоих игроков в начале партии: economy | balance | war.
# TODO(#104): DEC-02 не задаёт стартовую стойку; до решения действует значение по умолчанию из #104.
start_stance = "balance"

[economy.stance_to_charges_pct]
# Доля кванта регена CP, уходящая в заряды, в процентах (mechanics.md, раздел 6).
economy = 75 # «Экономия»
balance = 50 # «Баланс»
war = 25 # «Война»

[orders]
# Режимы и запланированные приказы (DEC-08, #12; mechanics.md, раздел 5).
# Запланированный приказ: намерение видно всем сразу, группа стоит в исходном узле
# planned_delay_ticks, затем выступает с бонусом на первый бой: planned_bonus_per_edge
# за каждое ребро пути приказа, не больше заряженных юнитов группы в тик выступления
# (DEC-29, #291; mechanics.md, раздел 5).
# «Защита»: включение видно всем как намерение, бонус defense_bonus активен через
# defense_delay_ticks и расходуется в первом бою; держится, пока группа стоит;
# приказ на движение снимает её без доплаты.
# Как бонусы входят в пул боя: DEC-07, правило 1 (mechanics.md, раздел 4).
planned_delay_ticks = 30 # 3 с
defense_delay_ticks = 30 # 3 с
# 2 за ребро: приказ на соседний узел даёт +2, как в строках таблиц DEC-07 и DEC-24
# (потолок: заряженные юниты, DEC-29).
planned_bonus_per_edge = 2
defense_bonus = 2 # виртуальных зарядов на первый бой
stance_cooldown_ticks = 100 # смена стойки не чаще раза в 100 тиков (DEC-02, #8)

[orders.cost]
# Стоимость команд в сотых CP (100 = 1 CP). Полная таблица: SIM-01 (#17), DEC-08 (#12).
move = 100 # обычный приказ на движение
planned_move = 200 # запланированный приказ: 2 CP вместо 1 (DEC-08)
cancel = 0 # CancelOrder: отмена любого приказа бесплатна, на ребре разворот (DEC-20)
split = 0 # деление группы бесплатно (DEC-20)
merge = 0 # слияние групп бесплатно, группы сливаются и сами (DEC-20)
attack = 0 # режим «Атака»: обычное состояние, переключение бесплатно (DEC-08)
defense = 200 # режим «Защита»; повторное включение стоит снова (DEC-08)
build = 0 # UpgradeRoad(edge): плата CP за уровень дороги (DEC-28, п. 7); в этом тестовом рулсете 0
recruit = 100 # Recruit(node): 1 CP за юнита в очереди, при постановке (DEC-25, #262; mechanics.md, раздел 3)
stance = 0 # смена стойки бесплатна (DEC-02, #8)
front = 0 # SetFront(marker, node): перенос маркера фронта бесплатен (DEC-28, п. 2)
rear_min = 0 # SetRearMin(n): смена минимума тыла бесплатна (DEC-28, п. 3)
transfer = 0 # Transfer(from, to, n): разовая перевозка зарядов бесплатна (DEC-18, #230)
barracks = 300 # BuildBarracks(node): 3 CP, только при city_upgrades.enabled (DEC-26, #265)
warehouse = 200 # UpgradeWarehouse(node): 2 CP за уровень, только при city_upgrades.enabled (DEC-26)

[terrain.defense_mod]
# Модификатор пула защитника узла по рельефу, в зарядах (DEC-07, #11, правило 1; mechanics.md, раздел 4).
# Действует только на защитника узла и только если у него есть хотя бы один стреляющий заряд;
# в бою на ребре и при одновременном прибытии в нейтральный узел рельефа нет.
mountains = 1
forest = 0
plains = -1

[terrain.speed_pct]
# Скорость движения в зоне узла по его рельефу, в процентах (mechanics.md, раздел 4, «Скорость по
# рельефу по зонам», #253). Ребро делится точкой границы: участок у узла A идёт со скоростью
# рельефа A, участок у узла B со скоростью рельефа B. Ребро в одном рельефе p проходится за
# travel_ticks * 100 // p тиков (округление вниз).
plains = 125 # быстрее
forest = 100 # обычная
mountains = 70 # медленнее

[combat]
# Бой во времени (DEC-24, #261; mechanics.md, раздел 4, «Бой во времени»). Бой начинается в тике
# контакта t и идёт раундами в тиках t + k * round_ticks (k = 1, 2, ...): в раунде каждая сторона
# делает min(запас, shots_per_round) выстрелов, сначала виртуальные (бонусы, горы). Победитель
# боя на ребре продолжает приказ через regroup_ticks после конца боя (перестроение).
round_ticks = 10 # раунд: 1 с
shots_per_round = 1 # выстрелов стороны за раунд
regroup_ticks = 10 # перестроение победителя на ребре: 1 с

[capacity]
# Ёмкость узла (DEC-22, #234; mechanics.md, раздел 8): одно число, которое отдельно ограничивает
# число стоящих в узле юнитов и отдельно запас склада. Фиксирована видом узла из карты
# (capacity.by_kind), не зависит от дорог, владельца и снабжения.
attrition_ticks = 30 # гарнизон сверх ёмкости дольше 30 тиков подряд теряет одного юнита
grace_ticks = 50 # отсрочка истощения после захвата города

[capacity.by_kind]
# Ёмкость по виду узла `kind` из карты (DEC-22, п. 1; DEC-23, п. 1).
capital = 10 # столица
city_large = 8 # большой город
city_medium = 6 # средний город
city_small = 4 # малый город
province = 3 # провинция (узел без города, DEC-23)

[starvation]
# Голод в окружении (DEC-19, #231; mechanics.md, раздел 7). Свой город, отрезанный от своей
# столицы (нет пути по своим узлам), тратит заряды гарнизона: на тиках
# cut_since + grace_ticks + k * period_ticks гарнизон теряет charges * ceil(U / per_units) зарядов,
# U: стоящие в городе юниты владельца. Сначала склад, потом заряды юнитов. Юниты не гибнут.
# Провинции и нейтральные узлы не голодают.
grace_ticks = 100 # отсрочка после отрезания: 10 с
period_ticks = 100 # потребление раз в 10 с
charges = 1 # зарядов ...
per_units = 3 # ... на каждые начатые 3 юнита

[supply]
# Снабжение: пакеты по внутренним дорогам от столицы (mechanics.md, разделы 7 и 8; SIM-08, #24).
# Скорость пакета зависит от уровня дороги (DEC-22, п. 4; типов дорог нет, DEC-26, п. 7): время в
# пути travel_ticks * 100 // speed_pct (округление вниз, не меньше 1); за период отправки по ребру
# идёт не больше amount_by_level[уровень] зарядов (DEC-28, п. 7).
dispatch_ticks = 10 # период расчёта и отправки пакетов
rear_min_default = 1 # минимум тыла на старте: города без маркера фронта держат столько зарядов (DEC-28, п. 3)
rear_min_max = 8 # наибольший минимум тыла SetRearMin(n), n в 0..8 (DEC-28, п. 3)
recharge_per_tick = 1 # перезарядка стоящих юнитов со склада: не быстрее 1 заряда за тик
base_speed_pct = 100 # скорость пакета на дороге уровня 1
front_markers = 2 # маркеров фронта у игрока (DEC-28, п. 2)

[supply.fast_speed_pct]
# Скорость пакета на быстрой дороге, в процентах. Ключ: уровень дороги, 2..3.
2 = 150
3 = 200

[supply.amount_by_level]
# Пропускная способность дороги по уровню (DEC-28, п. 7).
1 = 1
2 = 2
3 = 3

[road.speed_pct]
# Скорость юнитов на улучшенной дороге, в процентах (DEC-28, п. 7); уровень 1: 100.
2 = 115
3 = 130

[build]
# Улучшение своей внутренней дороги за CP (DEC-28, п. 7; mechanics.md, раздел 8).
ticks_per_level = 150 # 15 с на уровень

[recruit]
# Очередь найма (DEC-25, #262; mechanics.md, раздел 3). Recruit(node) ставит одного юнита в
# очередь своего города, CP (orders.cost.recruit) списываются при постановке. Город делает одного
# юнита за раз: unit_ticks тиков прогресса, пока в городе нет боя (DEC-24). Готовый юнит появляется
# разряженным новой группой и сливается с группой города (DEC-20); заряд он берёт обычной
# перезарядкой со склада. CancelRecruit(node) снимает последний юнит очереди: не начатый
# возвращает CP полностью, юнит в производстве: refund_started_pct процентов (округление вниз).
unit_ticks = 30 # 3 с на юнита
queue_max = 3 # юнитов в очереди города, включая текущий; иначе отказ QUEUE_FULL
refund_started_pct = 50 # возврат за отменённый юнит в производстве: половина
location = "any_city" # any_city | capital: где разрешён рекрут

[victory]
# Условие победы (DEC-03, #9; mechanics.md, раздел 11).
# VP начисляются раз в vp_period_ticks за каждый свой город: значение `vp` из карты,
# для столицы умноженное на capital_multiplier.
# Правила без чисел (заданы DEC-03, флагов нет): захват вражеской столицы — мгновенная победа;
# по таймеру побеждает тот, у кого больше VP; при равенстве — больше городов; иначе ничья.
vp_period_ticks = 50
capital_multiplier = 3

[city_upgrades]
# Развитие города (DEC-26, #265; mechanics.md, разделы 3 и 8): казарма и склад отдельно от ёмкости
# юнитов. enabled = false: рекрутирует каждый свой город (recruit.location), склад равен ёмкости
# узла (capacity.by_kind), BuildBarracks и UpgradeWarehouse дают FEATURE_DISABLED; остальные ключи
# этой секции и секция [warehouse] тогда не действуют. enabled = true: рекрутирует столица и города
# с казармой (NO_BARRACKS), recruit.location не действует; склад города по [warehouse]; дорога,
# казарма и склад занимают одну стройку города (CITY_BUSY).
enabled = false
barracks_ticks = 100 # BuildBarracks: казарма через 10 с, оплата orders.cost.barracks при старте
warehouse_ticks = 100 # UpgradeWarehouse: уровень склада через 10 с, оплата orders.cost.warehouse

[warehouse]
# Ёмкость склада города при city_upgrades.enabled = true (DEC-26, п. 2):
# start_by_kind[kind] + level * gain_per_level, level 0..max_level. У провинции склада нет.
# Склад на старте: min(start_stock карты, ёмкость склада), излишек отбрасывается (п. 5).
gain_per_level = 1 # +1 заряд за уровень
max_level = 2 # два улучшения

[warehouse.start_by_kind]
# Ёмкость склада уровня 0 по виду города.
capital = 6
city_large = 2
city_medium = 2
city_small = 1
