# Alembic CLI config. Run from the repository root:
#   uv run alembic -c apps/server/alembic.ini upgrade head
# The database comes from GOW_DATABASE_URL (default sqlite:///data/gow.db); the server itself
# also applies migrations at startup (gow_server.db.upgrade_to_head).
# Logging is configured in env.py (JSON lines, as the server).

[alembic]
script_location = %(here)s/src/gow_server/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
