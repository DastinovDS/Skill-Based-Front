[project]
name = "gow-server"
version = "0.1.0"
description = "FastAPI server: HTTP (lobby, rating) and WebSocket (matches)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "gow-sim",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
gow-server = "gow_server.cli:main"

[tool.uv.sources]
gow-sim = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
