# Thresholds of the map validator (MAP-02, #14). These are requirements on the map design, not numbers of the game rules:
# the simulation does not read them. A description of the checks: docs/design/map-format.md, section "Validator".

# At most 5 roads at a city (mechanics.md, section 14: the node degree limit is 4 or 5).
max_degree = 5

# From each capital to each city with vp >= disjoint_paths_min_vp there lead at least
# min_disjoint_paths paths with no common roads: such a city cannot be cut off with a single cut.
disjoint_paths_min_vp = 2
min_disjoint_paths = 2

# Neutral space (mechanics.md, section 11): at least min_neutral_pct percent of the nodes
# with no starting owner, whose distances to the two capitals (in roads) differ
# by at most neutral_max_distance_diff.
min_neutral_pct = 20
neutral_max_distance_diff = 1

# A road's travel_ticks is consistent with the drawn length (DEC-27, item 4): the expected value is
# length * travel_ticks_per_100_units / 100 ticks (100 world units = 3 seconds), the tolerance is
# travel_tolerance_pct percent, at least 1 tick.
travel_ticks_per_100_units = 30
travel_tolerance_pct = 15

# Map size (DEC-27, item 5): from min_nodes to max_nodes nodes. The check is off by default
# (size_check = false) so that the earlier maps pass; it is switched on by its own thresholds file (--config).
size_check = false
min_nodes = 45
max_nodes = 55

# DEC-36, check geography (only for a map with an authored geography maps/src/<id>.geo.json): every node is at
# least water_clearance world units from a water cell (a sea or a lake), so a city never stands on a shore.
water_clearance = 60
